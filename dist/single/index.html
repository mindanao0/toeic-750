C Part 5 ออกเรื่องนี้ประมาณ 2-4 ข้อทุกครั้ง และยังแอบอยู่ใน Part 6 กับ Part 7 อีก วันนี้แม่นแล้วคือเก็บคะแนนฟรีตลอดชีวิตการสอบ"},{"type":"text","th":"ก่อนอื่นจำกฎเหล็กข้อเดียวให้ได้ก่อน หลังคำบุพบทต้องเป็น noun (คำนาม) เสมอ จะเป็นคำนามธรรมดาอย่าง the meeting, สรรพนามอย่าง him, หรือ gerund (คำกริยาเติม -ing ที่ทำหน้าที่เป็นคำนาม) อย่าง leaving ก็ได้ แต่ห้ามตามด้วยกริยารูปพื้นฐานเด็ดขาด พูดว่า after leave ไม่ได้ ต้องเป็น after leaving เท่านั้น กฎข้อนี้ข้อเดียวช่วยตัดตัวเลือกในข้อสอบได้เยอะมาก"},{"type":"tip","th":"ภาพจำสามชั้นของ in / on / at ที่ใช้ได้ทั้งเวลาและสถานที่ ให้นึกว่า in คือของอยู่ในกล่อง (มีขอบเขตหุ้มรอบ) on คือสติกเกอร์แปะติดพื้นผิว (แตะกันอยู่) at คือหมุดปักแผนที่ (จุดเดียวเป๊ะๆ) ขนาดใหญ่ไปเล็กเรียงว่า in > on > at เสมอ"},{"type":"table","head":["คำบุพบท","ใช้กับเวลาแบบไหน","ตัวอย่าง","วิธีจำ"],"rows":[["at","เวลานาฬิกา และจุดเวลาแคบๆ","at 9:30, at noon, at midnight, at lunchtime","เข็มนาฬิกาชี้จุดเดียว"],["on","วัน วันที่ และวันพิเศษ","on Monday, on May 5, on weekdays, on my first day","ปฏิทินหนึ่งแผ่นต่อหนึ่งวัน"],["in","เดือน ปี ฤดู ไตรมาส ช่วงกว้าง","in July, in 2026, in the morning, in the third quarter","ก้อนเวลาใหญ่ที่เราอยู่ข้างใน"],["by","ไม่เกิน... (เส้นตาย ทำก่อนได้)","Submit the form by Friday.","เส้นตายที่ห้ามเลย"],["until / till","จนถึง... (ทำต่อเนื่องแล้วหยุด)","The office is open until 6 P.M.","ลากยาวจนถึงจุดนั้น"],["for","นานเท่าไร (ตามด้วยความยาวเวลา)","for three years, for two hours","ไม้บรรทัดวัดความยาว"],["since","ตั้งแต่ (ตามด้วยจุดเริ่ม)","since 2019, since last March","หมุดปักจุดเริ่มต้น"],["during","ระหว่างช่วงนั้น (ตามด้วยคำนาม)","during the meeting, during the summer","อยู่กลางช่วงเวลา"],["within","ภายในไม่เกิน","within 24 hours, within two weeks","อยู่ในกรอบเวลาที่ให้"]]},{"type":"example","en":"The board meeting starts at 10:00 A.M. on Tuesday in October.","th":"การประชุมคณะกรรมการเริ่มเวลา 10 โมงเช้า ในวันอังคาร ของเดือนตุลาคม","note":"ประโยคเดียวเห็นครบสามตัว เรียงจากเล็กไปใหญ่ at (เวลา) → on (วัน) → in (เดือน) ถ้าจำการเรียงนี้ได้ เวลาเจอข้อสอบให้ดูว่าคำหลังช่องว่างเป็นเวลานาฬิกา วัน หรือเดือน แล้วเลือกได้เลย"},{"type":"example","en":"Please send your reply by Thursday; our office is open until 5 P.M. every day.","th":"กรุณาส่งคำตอบกลับมาภายในวันพฤหัสบดี สำนักงานของเราเปิดจนถึง 5 โมงเย็นทุกวัน","note":"by = เส้นตาย จะส่งวันจันทร์ก็ได้ ขอแค่ไม่เกินพฤหัสบดี ส่วน until = สภาพนั้นดำเนินต่อเนื่องแล้วค่อยหยุด ข้อสอบชอบเอาสองตัวนี้มาวางคู่กันมาก"},{"type":"warn","th":"ระวัง จุดที่คนไทยพลาดบ่อยที่สุดเรื่องเวลา ช่วงของวันใช้ in ทั้งหมด คือ in the morning, in the afternoon, in the evening แต่พอถึงกลางคืนกลับเปลี่ยนเป็น at night (ไม่ใช่ in the night) และ at noon, at midnight ก็ใช้ at เหมือนกัน ให้จำเป็นข้อยกเว้นสามตัวนี้ไปเลย night / noon / midnight ใช้ at"},{"type":"table","head":["คำบุพบท","ใช้กับสถานที่แบบไหน","ตัวอย่าง","วิธีจำ"],"rows":[["at","จุดเดียว บ้านเลขที่ สถานที่ที่มองเป็นจุดนัดพบ","at the reception desk, at the airport, at 25 Sathorn Road","หมุดปักแผนที่"],["on","อยู่บนพื้นผิว ชั้นของอาคาร ชื่อถนน","on the table, on the second floor, on Silom Road","สติกเกอร์แปะติด"],["in","อยู่ข้างในพื้นที่ปิด เมือง ประเทศ","in the meeting room, in Bangkok, in Japan","ของอยู่ในกล่อง"],["between","อยู่ระหว่างของสองสิ่ง","between the elevator and the stairs","สองสิ่งเท่านั้น"],["among","อยู่ท่ามกลางของสามสิ่งขึ้นไป","among the job applicants","กองรวมนับไม่ถ้วน"],["next to / beside","ข้างๆ ติดกัน","next to the printer","ยืนชิดกัน"],["across from / opposite","ตรงข้าม คนละฝั่ง","across from the bank","มองข้ามถนนไปเห็น"],["in front of","อยู่ข้างหน้า (นอกตัวอาคาร)","in front of the building","ยืนหน้าประตู"],["near / close to","ใกล้ๆ","near the warehouse","ไม่ไกล แต่ไม่ติด"]]},{"type":"example","en":"Mr. Silva is waiting at the front desk on the ground floor in the north building.","th":"คุณซิลวากำลังรออยู่ที่เคาน์เตอร์ประชาสัมพันธ์ ชั้นล่าง ในอาคารทิศเหนือ","note":"อีกครั้งที่เรียงเล็กไปใหญ่ at (จุด) → on (ชั้น) → in (อาคาร) ถ้าจำสูตร at จุด, on ชั้นและถนน, in อาคารและเมือง ได้ จะตอบข้อสอบสถานที่ได้เกือบทั้งหมด"},{"type":"warn","th":"ระวังพาหนะ เรื่องนี้ออกสอบและคนไทยตอบผิดประจำ ยานพาหนะขนาดใหญ่ที่เดินไปมาข้างในได้ใช้ on ทั้งหมด คือ on the bus, on the train, on the plane, on the subway แต่พอเป็นรถเล็กที่ต้องก้มตัวเข้าไปนั่งกลับใช้ in คือ in the car, in a taxi ให้จำว่าใหญ่พอเดินได้ใช้ on เล็กจนต้องมุดเข้าไปใช้ in"},{"type":"text","th":"ทีนี้มาถึงส่วนที่ทำคะแนนได้ง่ายที่สุดของบทนี้ นั่นคือ collocation (ชุดคำที่ต้องอยู่คู่กันเสมอ เปลี่ยนคำใดคำหนึ่งไม่ได้) ในโลกธุรกิจ ข้อสอบ TOEIC วนใช้ชุดคำพวกนี้ซ้ำไปซ้ำมาทุกปี ข้อดีของมันคือไม่ต้องคิดเหตุผลอะไรเลย เห็นปุ๊บตอบปั๊บ เหมือนคำว่า ทำการบ้าน ในภาษาไทยที่เราไม่พูดว่า สร้างการบ้าน ฉะนั้นตารางข้างล่างนี้ให้อ่านวันละรอบจนติดตา"},{"type":"table","head":["ชุดคำ","แปลไทย","ตัวอย่างประโยคสั้น"],"rows":[["in charge of","รับผิดชอบดูแล เป็นหัวหน้าเรื่องนั้น","She is in charge of the training program."],["responsible for","รับผิดชอบหน้าที่หรืองานนั้น","He is responsible for scheduling deliveries."],["according to","ตามที่...ระบุ อ้างอิงจาก","According to the report, sales rose eight percent."],["due to","เนื่องจาก (ตามด้วยคำนามเท่านั้น)","The delay was due to bad weather."],["in addition to","นอกจาก...แล้วยัง","In addition to Thai, she speaks Japanese."],["prior to","ก่อน (ทางการกว่า before)","Please arrive prior to nine o'clock."],["on behalf of","ในนามของ กระทำแทน","I am writing on behalf of Mr. Lee."],["in accordance with","เป็นไปตาม (กฎ ระเบียบ สัญญา)","in accordance with company policy"],["regardless of","ไม่ว่าจะ...ก็ตาม","regardless of the weather"],["in response to","เพื่อตอบสนองต่อ ตอบกลับเรื่อง","in response to your inquiry"],["with regard to / regarding","เกี่ยวกับเรื่อง","with regard to your recent order"],["as of","มีผลตั้งแต่วันที่","The new rate applies as of January 1."],["thanks to","ด้วยผลของ (ใช้กับเรื่องดีๆ)","Thanks to your help, we finished early."],["instead of","แทนที่จะ","instead of driving to the site"],["in spite of / despite","ทั้งๆ ที่","in spite of the heavy rain"],["aside from / apart from","นอกเหนือจาก","aside from the shipping cost"],["subject to","ขึ้นอยู่กับ อาจถูกเปลี่ยนได้","All prices are subject to change."],["in cooperation with","โดยความร่วมมือกับ","in cooperation with the city government"]]},{"type":"example","en":"Ms. Alvarez, who is in charge of quality control, will speak on behalf of the factory.","th":"คุณอัลวาเรซ ผู้ที่รับผิดชอบดูแลงานควบคุมคุณภาพ จะเป็นผู้พูดในนามของโรงงาน","note":"in charge of ตามด้วยงานที่เราคุมอยู่ ส่วน on behalf of ตามด้วยคนหรือองค์กรที่เราไปพูดแทน ข้อสอบชอบเว้นช่องตรงคำว่า charge หรือ behalf แล้วให้เราเติมคำบุพบทหน้าและหลัง"},{"type":"example","en":"In addition to the annual bonus, all staff will receive extra vacation days prior to the holiday season.","th":"นอกจากโบนัสประจำปีแล้ว พนักงานทุกคนจะได้วันหยุดเพิ่มก่อนถึงช่วงเทศกาล","note":"สังเกตว่าทั้ง in addition to และ prior to ลงท้ายด้วย to แล้วตามด้วยคำนาม ถ้าจะตามด้วยกริยาต้องเติม -ing เช่น prior to signing the contract ห้ามใช้ prior to sign"},{"type":"warn","th":"ระวังคู่ที่ออกสอบบ่อยที่สุดคู่หนึ่ง due to กับ because ทั้งคู่แปลว่าเพราะเหมือนกัน แต่ใช้ต่างกันคนละแบบ due to และ because of ต้องตามด้วยคำนามหรือกลุ่มคำนาม เช่น due to heavy traffic ส่วน because ต้องตามด้วย clause (ประโยคย่อยที่มีประธานและกริยาครบ) เช่น because the traffic was heavy วิธีตรวจง่ายๆ คือมองหลังช่องว่าง ถ้าเห็นแค่คำนามลอยๆ ให้เลือก due to หรือ because of ถ้าเห็นประธานกับกริยาครบให้เลือก because"},{"type":"table","head":["คำกริยา / คำคุณศัพท์ + คำบุพบทที่ติดกันตายตัว","แปล","ตัวอย่าง"],"rows":[["depend on","ขึ้นอยู่กับ","The price depends on the quantity."],["apply for","สมัคร (งาน ตำแหน่ง ทุน)","She applied for the manager position."],["apply to","มีผลบังคับใช้กับ","The discount applies to online orders only."],["participate in","เข้าร่วม","All staff must participate in the drill."],["comply with","ปฏิบัติตามกฎ","We comply with all safety regulations."],["specialize in","เชี่ยวชาญด้าน","The firm specializes in tax accounting."],["consist of","ประกอบด้วย","The team consists of six engineers."],["refer to","อ้างถึง ดูที่","Please refer to page four."],["result in","ส่งผลให้เกิด","The change resulted in higher sales."],["result from","เกิดจาก (เป็นผลมาจาก)","The error resulted from a typing mistake."],["account for","คิดเป็นสัดส่วน หรืออธิบายสาเหตุ","Exports account for half of our revenue."],["be familiar with","คุ้นเคยกับ","He is familiar with the new software."],["be eligible for","มีสิทธิ์ได้รับ","You are eligible for a full refund."],["be interested in","สนใจใน","We are interested in your proposal."],["look forward to","ตั้งตารอ (ตามด้วย -ing)","I look forward to meeting you."],["be committed to","มุ่งมั่นที่จะ (ตามด้วย -ing)","We are committed to improving service."]]},{"type":"tip","th":"เทคนิคทำข้อสอบภายในห้าวินาที พอเห็นตัวเลือกเป็นคำบุพบทสี่ตัว อย่าเพิ่งอ่านประโยคทั้งประโยค ให้กวาดตาไปที่คำที่อยู่ติดกับช่องว่างก่อน ถ้าคำหลังช่องว่างเป็นเวลานาฬิกาให้ตอบ at ถ้าเป็นชื่อวันให้ตอบ on ถ้าเป็นเดือนหรือปีให้ตอบ in ถ้าคำหน้าช่องว่างเป็นคำอย่าง responsible, in charge, depend, comply ให้ดึงชุดคำที่ท่องไว้มาใช้ทันที ข้อแบบนี้ควรใช้เวลาน้อยกว่าสิบวินาที เพื่อเก็บเวลาไปให้ Part 7"},{"type":"warn","th":"ระวังอย่าแปลจากภาษาไทยตรงตัว ภาษาไทยพูดว่า รับผิดชอบต่องาน หลายคนจึงเขียน responsible to the work ซึ่งผิด ต้องเป็น responsible for และภาษาไทยพูดว่า ขึ้นอยู่กับ หลายคนเลยเขียน depend with ซึ่งก็ผิด ต้องเป็น depend on คำบุพบทของภาษาอังกฤษไม่ได้แปลตรงกับภาษาไทยเสมอไป ให้จำเป็นชุดคำทั้งก้อน อย่าจำทีละคำ"},{"type":"text","th":"สรุปวันนี้ให้เหลือสามบรรทัดที่ต้องจำก่อนนอน หนึ่ง เวลาและสถานที่เรียงจากใหญ่ไปเล็กเสมอ in ก้อนใหญ่ on พื้นผิวหรือวัน at จุดเดียว สอง หลังคำบุพบทต้องเป็นคำนามหรือกริยาเติม -ing เท่านั้น สาม ชุดคำธุรกิจสิบแปดชุดในตารางคือคะแนนฟรี อ่านซ้ำวันละรอบ ไม่ต้องเข้าใจเหตุผล จำเป็นก้อนเหมือนจำเบอร์โทร พรุ่งนี้เราจะไปเรื่องการฟัง Part 2 ซึ่งเป็นส่วนที่ทำคะแนนได้ง่ายที่สุดในข้อสอบฟัง"}],"quiz":[{"id":"L06q-01","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา","stem":"The quarterly sales meeting will begin _____ 9:30 A.M. in the main confer "},{"type":"text","th":"กฎเหล็กข้อที่หนึ่ง ทุ่มสมาธิทั้งหมดไปที่คำแรกของประโยคคำถาม ถ้าคำแรกคือ Where, When, Who, Why, What, Which, How เราเรียกคำถามแบบนี้ว่า WH-question (คำถามที่ขึ้นต้นด้วยคำแสดงคำถามและต้องการข้อมูล ไม่ได้ถามว่าใช่หรือไม่ใช่) คำแรกคำเดียวจะบอกเลยว่าคำตอบต้องเป็นข้อมูลประเภทไหน ตารางข้างล่างนี้คือหัวใจของ Part 2 ทั้งหมด ท่องให้ขึ้นใจ"},{"type":"table","head":["คำแรกที่ได้ยิน","แปล","คำตอบต้องเป็นข้อมูลแบบไหน","ตัวอย่างคำตอบที่ถูก"],"rows":[["Where","ที่ไหน","สถานที่ ตำแหน่ง","On the second floor. / Next to the elevator."],["When","เมื่อไร","เวลา วัน ช่วงเวลา","Next Tuesday. / Not until noon."],["Who","ใคร","คน ตำแหน่งงาน แผนก","Ms. Chen. / Someone from accounting."],["Why","ทำไม","เหตุผล มักขึ้นด้วย Because หรือ To + กริยา","Because the road was closed. / To save money."],["What","อะไร","สิ่งของ เรื่องราว รายละเอียด","A new printer. / The budget report."],["Which","อันไหน","ตัวเลือกที่ระบุ มักมีคำว่า the one","The blue one. / The one on the left."],["How","อย่างไร","วิธีการ พาหนะ หรือความรู้สึก","By train. / It went very well."],["How much","เท่าไร (ราคา)","จำนวนเงิน","About fifty dollars."],["How many","กี่อัน กี่คน","จำนวนนับ","Twelve boxes."],["How long","นานแค่ไหน","ระยะเวลา","About two hours."],["How often","บ่อยแค่ไหน","ความถี่","Once a month."]]},{"type":"warn","th":"ระวัง นี่คือกฎที่ทำให้คุณได้คะแนนฟรีมากที่สุดในข้อสอบทั้งฉบับ คำถามที่ขึ้นต้นด้วย WH ตอบ Yes หรือ No ไม่ได้เด็ดขาด เพราะเขาไม่ได้ถามว่าใช่หรือไม่ใช่ เขาถามหาข้อมูล ฉะนั้นพอคุณได้ยินคำแรกว่า Where แล้วตัวเลือกไหนขึ้นต้นด้วย Yes หรือ No ให้กากบาททิ้งทันทีโดยไม่ต้องฟังส่วนที่เหลือเลย ข้อสอบจริงใส่กับดักนี้แทบทุกชุด และมักใส่มามากกว่าหนึ่งตัวด้วย"},{"type":"example","en":"Q: Where did you put the training manual?  A) Yes, I did.  B) In the top drawer.  C) It was very useful.","th":"ถาม: คุณเอาคู่มือฝึกอบรมไปวางไว้ที่ไหน  ก) ใช่ ฉันทำ  ข) ในลิ้นชักบนสุด  ค) มันมีประโยชน์มาก","note":"ข้อ ก ตัดทิ้งเพราะขึ้นต้นด้วย Yes ในขณะที่คำถามขึ้นต้นด้วย Where ข้อ ค พูดถึงคุณค่าของคู่มือ ไม่ได้บอกว่าอยู่ที่ไหน เหลือข้อ ข ที่บอกตำแหน่ง จึงเป็นคำตอบ สังเกตว่าเราไม่จำเป็นต้องเข้าใจคำว่า manual เลยด้วยซ้ำ แค่จับ Where ได้ก็ตอบถูกแล้ว"},{"type":"warn","th":"ระวังกับดักที่สอง คำพ้องเสียงและคำซ้ำ ผู้ออกข้อสอบรู้ว่าคนที่ฟังไม่ทันจะเกาะคำที่คุ้นหูไว้ เขาจึงเอาคำที่เพิ่งพูดในคำถาม หรือคำที่ออกเสียงคล้ายกันมาก มายัดไว้ในตัวเลือกที่ผิด กฎง่ายๆ ที่ใช้ได้เกือบร้อยเปอร์เซ็นต์คือ ถ้าคุณได้ยินคำในตัวเลือกเหมือนคำในคำถามเป๊ะๆ ให้สงสัยไว้ก่อนว่าตัวนั้นเป็นตัวลวง อย่ารีบเลือกเพราะดีใจที่ฟังออก"},{"type":"table","head":["คำในคำถาม","คำพ้องเสียงที่ข้อสอบชอบเอามาหลอก","ความหมายที่ต่างกัน"],"rows":[["copy (สำเนา)","coffee (กาแฟ)","เอกสาร กับ เครื่องดื่ม"],["sale (การขายลดราคา)","sail (แล่นเรือ)","การค้า กับ เรือ"],["right (ถูกต้อง ขวา)","write (เขียน)","เสียงเหมือนกันเป๊ะ แต่คนละความหมาย"],["hire (จ้าง)","higher (สูงกว่า)","การจ้างงาน กับ ความสูง"],["mail (จดหมาย)","male (เพศชาย)","ไปรษณีย์ กับ เพศ"],["week (สัปดาห์)","weak (อ่อนแอ)","เวลา กับ ความแข็งแรง"],["contract (สัญญา)","contact (ติดต่อ)","ต่างกันแค่ตัว r ตัวเดียว"],["report (รายงาน)","reporter (นักข่าว)","เอกสาร กับ คน"],["fair (งานแสดงสินค้า เป็นธรรม)","fare (ค่าโดยสาร)","งาน กับ ค่ารถ"],["fly (บิน)","flight (เที่ยวบิน)","กริยา กับ คำนาม ข้อสอบชอบสลับ"]]},{"type":"example","en":"Q: Have you signed the new contract yet?  A) I'll contact him tomorrow.  B) Not yet, I'm still reading it.  C) A three-year contract.","th":"ถาม: คุณเซ็นสัญญาฉบับใหม่แล้วหรือยัง  ก) ผมจะติดต่อเขาพรุ่งนี้  ข) ยังเลย ผมยังอ่านอยู่  ค) สัญญาสามปี","note":"ข้อ ก ใช้คำว่า contact ที่เสียงคล้าย contract มาหลอก ข้อ ค เอาคำว่า contract คำเดิมมาซ้ำแต่ไม่ได้ตอบว่าเซ็นหรือยัง เหลือข้อ ข ที่ตอบว่ายังไม่ได้เซ็นเพราะกำลังอ่านอยู่ นี่คือรูปแบบที่ข้อสอบจริงใช้ซ้ำไปซ้ำมาทุกชุด"},{"type":"text","th":"ทีนี้มาถึงเรื่องที่ทำให้คนพลาดมากที่สุด คือ indirect answer (คำตอบอ้อม คือคำตอบที่ไม่ได้ตอบตรงคำถาม แต่ก็สมเหตุสมผลในชีวิตจริง) หลายคนคาดหวังว่าถาม When ต้องตอบเวลาเท่านั้น พอได้ยินคำตอบว่าไปถามคนอื่นสิ ก็เลยตัดทิ้ง แล้วไปเลือกตัวลวงแทน แต่ในความจริงข้อสอบระดับที่ทำให้คุณได้ 750 คะแนนขึ้นไป จะใช้คำตอบอ้อมเป็นคำตอบถูกบ่อยมาก ลองนึกถึงชีวิตจริง ถ้ามีคนถามคุณว่าประชุมเริ่มกี่โมง แล้วคุณไม่รู้ คุณก็ตอบว่าไปดูในอีเมลสิ นั่นแหละคือคำตอบอ้อม และมันคือคำตอบที่ถูกต้อง"},{"type":"table","head":["รูปแบบคำตอบอ้อมที่เจอบ่อย","แปล","แปลว่าจริงๆ แล้วเขาหมายถึง"],"rows":[["I'm not sure. / I have no idea.","ผมไม่แน่ใจ ไม่รู้เหมือนกัน","ตอบไม่ได้ แต่เป็นคำตอบที่ถูกต้อง"],["Let me check.","ขอเช็กก่อนนะ","ยังไม่รู้ ขอไปดูก่อน"],["Ask Ms. Diaz. / Try the front desk.","ไปถามคุณดิแอซสิ","โยนไปให้คนที่รู้จริง"],["It hasn't been decided yet.","ยังไม่ได้ตัดสินใจเลย","ยังไม่มีคำตอบ"],["Didn't you get the e-mail?","คุณไม่ได้รับอีเมลเหรอ","ย้อนถามกลับ ซึ่งใช้เป็นคำตอบได้"],["I'm new here.","ผมเพิ่งมาใหม่","ผมไม่รู้เพราะเพิ่งเข้างาน"],["The meeting was canceled.","ประชุมถูกยกเลิกไปแล้ว","คำถามนั้นไม่จำเป็นต้องตอบแล้ว"],["It depends on the weather.","ขึ้นอยู่กับสภาพอากาศ","ยังบอกแน่นอนไม่ได้"]]},{"type":"example","en":"Q: How much will the roof repair cost?  A) On the top floor.  B) I haven't seen the estimate yet.  C) Yes, it costs a lot.","th":"ถาม: ค่าซ่อมหลังคาจะราคาเท่าไร  ก) อยู่ชั้นบนสุด  ข) ผมยังไม่เห็นใบประเมินราคาเลย  ค) ใช่ มันแพงมาก","note":"คำตอบที่ถูกคือข้อ ข ทั้งที่ไม่ได้บอกตัวเลขสักบาท เพราะมันบอกว่ายังไม่รู้ราคาซึ่งสมเหตุสมผล ส่วนข้อ ค แม้จะพูดคำว่า cost เหมือนกัน แต่ขึ้นต้นด้วย Yes ซึ่งใช้ตอบ How much ไม่ได้ ตัดทิ้งได้ทันที"},{"type":"text","th":"ประเภทถัดมาที่ต้องแยกให้ออกคือประโยคขอร้อง เสนอตัวช่วย และชักชวน กลุ่มนี้หน้าตาเป็นคำถามก็จริง แต่เขาไม่ได้ต้องการข้อมูล เขาต้องการให้คุณตอบว่าตกลงหรือปฏิเสธ ถ้าคุณฟังแล้วเผลอไปหาคำตอบที่เป็นข้อมูล คุณจะเลือกผิดทันที ให้จำหัวประโยคสามกลุ่มนี้ให้ขึ้นใจ"},{"type":"table","head":["ประเภท","หัวประโยคที่ได้ยิน","แปล","คำตอบที่ใช้ได้"],"rows":[["ขอร้อง","Could you… / Can you… / Would you…","ช่วย...หน่อยได้ไหม","Sure. / Of course. / I'd be happy to. / Sorry, I'm busy right now."],["ขอร้องแบบสุภาพมาก","Would you mind…","จะรังเกียจไหมถ้า...","No, not at all. / Of course not."],["เสนอตัวช่วย","Would you like me to… / Shall I… / Do you want me to…","ให้ผมช่วย...ไหม","Yes, please. / That would be great. / No thanks, I've got it."],["เสนอสิ่งของ","Would you like some…","รับ...ไหม","Yes, please. / No thank you."],["ชักชวน","Why don't we… / Let's… / How about…","เรา...กันไหม","Good idea. / Sounds good. / I'd rather not."],["ขออนุญาต","May I… / Can I…","ขอ...ได้ไหม","Go ahead. / Sure, help yourself."]]},{"type":"warn","th":"ระวังจุดที่คนไทยสับสนที่สุดในกลุ่มนี้ คำถาม Would you mind ที่แปลตรงตัวว่าคุณจะรังเกียจไหม การตอบว่า No, not at all ที่แปลว่าไม่รังเกียจเลย จริงๆ แล้วแปลว่ายินดีช่วย ไม่ได้แปลว่าปฏิเสธ ฉะนั้นอย่าเห็นคำว่า No แล้วรีบตัดทิ้ง ในทางกลับกัน คำถามที่ขึ้นต้นด้วย Why don't we ก็ไม่ได้ถามหาเหตุผล มันแปลว่าเราไปทำกันไหม ถ้ามีตัวเลือกไหนตอบว่า Because ให้สงสัยไว้ก่อนเลยว่าเป็นตัวลวง"},{"type":"text","th":"อีกประเภทที่ออกทุกชุดคือ tag question (คำถามหางเสียง คือประโยคบอกเล่าที่ห้อยท้ายด้วยคำถามสั้นๆ) เช่น You've already sent the invoice, haven't you? หรือ The store opens at nine, doesn't it? คนสอบมักตกใจเพราะหางเสียงพูดเร็วและเบามาก แต่ข่าวดีคือคุณไม่ต้องสนใจหางเสียงเลยแม้แต่นิดเดียว ให้ฟังแค่ประโยคข้างหน้าแล้วตอบเหมือนคำถาม Yes หรือ No ธรรมดา ถ้าเรื่องนั้นจริงก็ตอบ Yes ถ้าไม่จริงก็ตอบ No จบ"},{"type":"example","en":"Q: You've already reserved the meeting room, haven't you?  A) Yes, for two o'clock.  B) It's a large room.  C) No, she hasn't arrived.","th":"ถาม: คุณจองห้องประชุมไว้แล้วใช่ไหม  ก) ใช่ จองไว้บ่ายสองโมง  ข) มันเป็นห้องใหญ่  ค) ยัง เธอยังไม่มาเลย","note":"ข้อ ก ตอบว่าจองแล้วพร้อมบอกเวลาเพิ่ม เป็นคำตอบที่สมบูรณ์ ข้อ ข พูดถึงขนาดห้องซึ่งไม่เกี่ยว ข้อ ค แม้จะขึ้นต้นด้วย No ที่ดูใช้ได้ แต่พอฟังต่อกลับพูดถึง she ทั้งที่คำถามถามถึงตัวคุณ นี่คือกับดักสรรพนามผิดตัวที่ข้อสอบใช้บ่อยมาก"},{"type":"text","th":"ประเภทสุดท้ายคือ choice question (คำถามให้เลือก คือคำถามที่มีคำว่า or อยู่กลางประโยค) เช่น Would you prefer the morning session or the afternoon one? กฎคือห้ามตอบ Yes หรือ No เด็ดขาด เพราะเขาให้เลือก ไม่ได้ถามว่าใช่ไหม คำตอบที่ถูกมีได้สามแบบคือ เลือกอย่างแรก เลือกอย่างที่สอง หรือบอกว่าอันไหนก็ได้ ซึ่งมักใช้คำว่า Either one is fine, Whichever is easier, It doesn't matter to me สามสำนวนนี้จำไว้ให้ดีเพราะเป็นคำตอบถูกบ่อยมาก"},{"type":"example","en":"Q: Should I send the samples by courier or bring them myself?  A) Either way is fine.  B) Yes, I sent them.  C) In the sample room.","th":"ถาม: ผมควรส่งตัวอย่างสินค้าทางบริษัทขนส่ง หรือเอาไปเองดี  ก) แบบไหนก็ได้ทั้งนั้น  ข) ใช่ ผมส่งไปแล้ว  ค) อยู่ในห้องเก็บตัวอย่าง","note":"ข้อ ก คือคำตอบแบบอันไหนก็ได้ ซึ่งใช้ได้เสมอกับคำถามที่มี or ข้อ ข ขึ้นต้นด้วย Yes จึงตัดทิ้งทันที ข้อ ค เอาคำว่า sample มาซ้ำเพื่อหลอกคนที่ฟังไม่ทัน"},{"type":"tip","th":"ยุทธวิธีในห้องสอบจริงที่ต้องซ้อมให้เป็นนิสัย หนึ่ง วางปากกาไว้เฉยๆ ห้ามจดอะไรระหว่างฟัง เพราะจะเสียสมาธิ สอง ระหว่างฟังตัวเลือกให้ใช้นิ้วหรือปลายปากกาแตะช่องกระดาษไว้ พอได้ยินตัวไหนที่ผิดชัดเจนให้ตัดในใจทันทีแล้วเลื่อนต่อ สาม ถ้าฟังตัวเลือก A แล้วมั่นใจว่าใช่ ก็ยังต้องฟัง B และ C ให้จบ เพราะบางทีตัวหลังดีกว่า สี่ ถ้าจบสามตัวแล้วยังไม่รู้ ให้เดาแล้วฝนทันที ห้ามค้างเด็ดขาด"},{"type":"warn","th":"ระวังกับดักที่ทำให้คนเสียคะแนนเป็นสิบข้อโดยไม่รู้ตัว คือการค้างอยู่กับข้อที่ผ่านไปแล้ว เทปไม่รอใคร ถ้าคุณยังคิดถึงข้อที่ 12 อยู่ตอนที่เขาอ่านข้อ 13 คุณจะพลาดทั้งสองข้อ และมักจะพลาดข้อ 14 ตามไปด้วยเพราะจิตตก กติกาคือได้ยินเสียงถัดไปเมื่อไร ข้อเก่าตายแล้ว ทิ้งไปเลย ให้เดาแล้วเดินหน้าต่อทันที สภาพจิตใจสำคัญกว่าความรู้ในส่วนนี้"},{"type":"text","th":"ตอนนี้เราเรียนครบเจ็ดวันแล้ว ก่อนจะไปสัปดาห์ที่สอง ผมอยากให้คุณเห็นภาพรวมว่าที่ผ่านมาคุณสะสมอะไรไปแล้วบ้าง ตารางข้างล่างนี้คือสรุปทั้งสัปดาห์ในหน้าเดียว ให้ถ่ายรูปเก็บไว้ในมือถือ แล้วเปิดดูตอนรอรถหรือรอคิว ไม่ต้องอ่านซ้ำทั้งบท อ่านแค่ช่องขวาสุดที่เป็นสิ่งที่ต้องจำก็พอ"},{"type":"table","head":["วัน","เรื่องที่เรียน","สิ่งที่ต้องจำให้ได้แม่นที่สุด","ออกในส่วนไหนของข้อสอบ"],"rows":[["วันที่ 1","ตัวอักษรและการอ่านออกเสียง","สระเสียงยาวเสียงสั้น และเสียงท้ายคำที่ต้องออก เช่น s, ed, t, k","Part 1-4 ทั้งหมด เพราะถ้าอ่านผิดจะฟังไม่ออก"],["วันที่ 2","โครงประโยค ประธาน กริยา กรรม","ทุกประโยคอังกฤษต้องมีประธานและกริยาแท้เส  are on the notice board.","exTh":"รายละเอียดของเวิร์กช็อปที่กำลังจะมาถึงอยู่บนบอร์ดประกาศ","tags":["time","adjective"],"freq":4},{"id":"v0093","w":"because","ipa":"/bɪˈkɔːz/","th":"บิ-**คอส**","pos":"conj.","mean":"เพราะว่า (คำเชื่อมบอกเหตุผล ข้างหลังต้องเป็นประโยคเต็มที่มีประธานและกริยา)","ex":"The meeting ended early because the manager had another appointment.","exTh":"การประชุมจบเร็วเพราะผู้จัดการมีนัดอีกงานหนึ่ง","tags":["connector","grammar"],"freq":5},{"id":"v0094","w":"although","ipa":"/ɔːlˈðoʊ/","th":"ออล-**โธ**","pos":"conj.","mean":"ถึงแม้ว่า (คำเชื่อมบอกความขัดแย้ง ข้างหลังต้องเป็นประโยคเต็ม)","ex":"Although the price is high, the quality is excellent.","exTh":"ถึงแม้ราคาจะสูง แต่คุณภาพก็ดีเยี่ยม","tags":["connector","grammar"],"freq":5},{"id":"v0095","w":"however","ipa":"/haʊˈevər/","th":"เฮา-**เอ**-เวอร์","pos":"adv.","mean":"อย่างไรก็ตาม (คำเชื่อมความขัดแย้ง มักวางต้นประโยคแล้วตามด้วยเครื่องหมายจุลภาค)","ex":"The design looks good. However, the cost is too high.","exTh":"ดีไซน์ดูดี อย่างไรก็ตาม ต้นทุนสูงเกินไป","tags":["connector","grammar"],"freq":5},{"id":"v0096","w":"therefore","ipa":"/ˈðerfɔːr/","th":"**แธร์**-ฟอร์","pos":"adv.","mean":"ดังนั้น, เพราะฉะนั้น (คำเชื่อมบอกผลที่ตามมาจากเหตุที่กล่าวไปแล้ว)","ex":"The road is closed; therefore, the delivery will be late.","exTh":"ถนนปิด ดังนั้นการจัดส่งจะล่าช้า","tags":["connector","grammar"],"freq":4},{"id":"v0097","w":"during","ipa":"/ˈdʊrɪŋ/","th":"**ดัว**-ริ่ง","pos":"prep.","mean":"ในระหว่าง (ข้างหลังต้องเป็นคำนาม เช่น during the meeting ห้ามตามด้วยประโยคเต็ม)","ex":"Please turn off your phone during the presentation.","exTh":"กรุณาปิดโทรศัพท์ระหว่างการนำเสนอ","tags":["connector","time"],"freq":5},{"id":"v0098","w":"until","ipa":"/ənˈtɪl/","th":"เอิน-**ทิล**","pos":"prep./conj.","mean":"จนกระทั่ง, จนถึง (บอกเวลาสิ้นสุดของสิ่งที่ทำต่อเนื่องมาเรื่อยๆ)","ex":"The library stays open until nine on weekdays.","exTh":"ห้องสมุดเปิดจนถึงสามทุ่มในวันธรรมดา","tags":["connector","time"],"freq":5},{"id":"v0099","w":"instead","ipa":"/ɪnˈsted/","th":"อิน-**สเตด**","pos":"adv.","mean":"แทนที่จะเป็นอย่างนั้น (บอกว่าเราเลือกอีกทางหนึ่งมาทำแทน)","ex":"The elevator is broken, so we took the stairs instead.","exTh":"ลิฟต์เสีย เราจึงใช้บันไดแทน","tags":["connector","grammar"],"freq":4},{"id":"v0100","w":"while","ipa":"/waɪl/","th":"**ไวล์**","pos":"conj.","mean":"ในขณะที่ (ข้างหลังต้องเป็นประโยคเต็ม ต่างจาก during ที่ตามด้วยคำนาม)","ex":"Please take messages while I am in the meeting.","exTh":"ช่วยรับข้อความให้ด้วยขณะที่ฉันอยู่ในที่ประชุม","tags":["connector","time"],"freq":5}]},"vocab/vocab-02":{"meta":{"batch":"vocab-02","week":1,"count":100},"items":[{"id":"v0101","w":"flight","ipa":"/flaɪt/","th":"**ไฟลท์**","pos":"n.","mean":"เที่ยวบิน (การเดินทางด้วยเครื่องบินหนึ่งรอบ เช่น flight BA204 = เที่ยวบินที่ BA204)","ex":"Our flight to Osaka leaves at six in the morning.","exTh":"เที่ยวบินไปโอซาก้าของเราออกตอนหกโมงเช้า","tags":["travel","airport"],"freq":5},{"id":"v0102","w":"itinerary","ipa":"/aɪˈtɪnəreri/","th":"อาย-**ทิน**-เนอ-เร-รี","pos":"n.","mean":"กำหนดการเดินทาง (ตารางว่าวันไหนไปไหน เวลาเท่าไหร่ พักที่ไหน)","ex":"I attached the itinerary for your trip to Berlin.","exTh":"ฉันแนบกำหนดการเดินทางไปเบอร์ลินของคุณมาด้วยแล้ว","tags":["travel","office"],"freq":5},{"id":"v0103","w":"reservation","ipa":"/ˌrezərˈveɪʃən/","th":"เร-เซอร์-**เว**-ชัน","pos":"n.","mean":"การจอง (จองโรงแรม ตั๋ว หรือโต๊ะอาหารไว้ล่วงหน้า)","ex":"I made a hotel reservation for three nights.","exTh":"ฉันจองโรงแรมไว้สามคืน","tags":["travel","hotel"],"freq":5},{"id":"v0104","w":"luggage","ipa":"/ˈlʌɡɪdʒ/","th":"**ลัก**-กิจ","pos":"n.","mean":"กระเป๋าเดินทาง (นับเป็นกอง ไม่เติม s เช่น a lot of luggage ไม่ใช่ luggages)","ex":"Please leave your luggage at the front desk.","exTh":"กรุณาฝากกระเป๋าเดินทางไว้ที่เคาน์เตอร์ต้อนรับ","tags":["travel","hotel"],"freq":5},{"id":"v0105","w":"departure","ipa":"/dɪˈpɑːrtʃər/","th":"ดิ-**พาร์**-เชอร์","pos":"n.","mean":"การออกเดินทาง, ขาออก (ตรงข้ามกับ arrival ที่แปลว่าขาเข้า)"," <script>
/* ===== 00-core.js ===== */
;(function(){
/* ============================================================
   00-core — ยูทิลิตี้พื้นฐาน, DOM helper, วันที่, สุ่ม
   ============================================================ */
'use strict';

const App = (window.App = {});

/* ---------- DOM ---------- */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/**
 * สร้าง element แบบสั้น: h('div.card', {onclick}, 'text', childEl)
 * tag รองรับ  div  div.a.b  div#id.a  หรือแค่ .card (= div.card)
 */
function h(tag, props, ...kids) {
  const m = /^([a-z0-9]*)(#[^.]+)?((?:\.[^.#]+)*)$/i.exec(String(tag || 'div')) || [null, 'div', '', ''];
  const el = document.createElement(m[1] || 'div');
  if (m[2]) el.id = m[2].slice(1);
  if (m[3]) el.className = m[3].slice(1).split('.').join(' ');

  if (props && (typeof props !== 'object' || props instanceof Node)) {
    kids.unshift(props);
    props = null;
  }
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className += ' ' + v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  const add = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}

const esc = (s) =>
  String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );

/** แปลง **ตัวหนา** เป็น <b> (ใช้กับคำอ่านไทยและคำอธิบาย) */
const mdBold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

const clear = (el) => {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
};

/* ---------- วันที่ (ยึดเวลาท้องถิ่นของเครื่อง) ---------- */

const DAY_MS = 86400000;

function ymd(d) {
  const x = d instanceof Date ? d : new Date(d);
  const p = (n) => String(n).padStart(2, '0');
  return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
}

function today() {
  return ymd(new Date());
}

/** จำนวนวันเต็มระหว่าง 2 วันที่แบบ YYYY-MM-DD (b - a) */
function daysBetween(a, b) {
  const pa = a.split('-').map(Number);
  const pb = b.split('-').map(Number);
  const ta = Date.UTC(pa[0], pa[1] - 1, pa[2]);
  const tb = Date.UTC(pb[0], pb[1] - 1, pb[2]);
  return Math.round((tb - ta) / DAY_MS);
}

function addDays(dateStr, n) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + n);
  return ymd(d);
}

const TH_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

function thaiDate(dateStr, opts) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const be = p[0] + 543;
  const core = `${p[2]} ${TH_MONTH[p[1] - 1]} ${be}`;
  return opts && opts.dow ? `วัน${TH_DOW[d.getDay()]}ที่ ${core}` : core;
}

/** 3725000 -> "1:02:05" ; 65000 -> "1:05" */
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return hh ? `${hh}:${p(mm)}:${p(ss)}` : `${mm}:${p(ss)}`;
}

function fmtMin(min) {
  if (min < 60) return `${min} นาที`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `${h} ชม. ${m} นาที` : `${h} ชม.`;
}

/* ---------- สุ่ม (seeded เพื่อให้ชุดข้อสอบซ้ำได้) ---------- */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let hp = 0;
  for (let i = 0; i < s.length; i++) hp = (Math.imul(31, hp) + s.charCodeAt(i)) | 0;
  return hp >>> 0;
}

function shuffle(arr, rnd) {
  const r = rnd || Math.random;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const pick = (arr, n, rnd) => shuffle(arr, rnd).slice(0, n);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const uniq = (a) => Array.from(new Set(a));

function groupBy(arr, fn) {
  const o = {};
  for (const x of arr) {
    const k = fn(x);
    (o[k] || (o[k] = [])).push(x);
  }
  return o;
}

const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/* ---------- UI helpers ---------- */

let toastTimer = null;
function toast(msg, kind) {
  const old = $('.toast');
  if (old) old.remove();
  clearTimeout(toastTimer);
  const t = h('div.toast' + (kind ? '.' + kind : ''), msg);
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2200);
}

function modal(title, bodyEl, actions) {
  const bg = h('div.modal-bg', {
    onclick: (e) => {
      if (e.target === bg) close();
    },
  });
  const close = () => {
    bg.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => {
    if (e.key === 'Escape') close();
  };
  document.addEventListener('keydown', onKey);

  const box = h('div.modal', title ? h('h2', title) : null, bodyEl);
  if (actions && actions.length) {
    box.appendChild(
      h(
        'div.row.mt',
        actions.map((a) =>
          h(
            'button.btn.grow' + (a.kind ? '.' + a.kind : ''),
            {
              onclick: () => {
                if (!a.onclick || a.onclick() !== false) close();
              },
            },
            a.label,
          ),
        ),
      ),
    );
  }
  bg.appendChild(box);
  document.body.appendChild(bg);
  return { close, box };
}

function confirmBox(title, msg, onYes, yesLabel) {
  modal(title, h('p.small.muted', { style: { margin: '0' } }, msg), [
    { label: 'ยกเลิก', kind: 'ghost' },
    { label: yesLabel || 'ยืนยัน', kind: 'danger', onclick: onYes },
  ]);
}

function flyXP(n, x, y) {
  const el = h('div.xpfly', `+${n} XP`);
  el.style.left = (x || window.innerWidth / 2) + 'px';
  el.style.top = (y || window.innerHeight / 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function scrollTop() {
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

Object.assign(App, {

  ymd, today, daysBetween, addDays, thaiDate, fmtDur, fmtMin, TH_MONTH, TH_DOW,
  mulberry32, hashStr, shuffle, pick, clamp, sum, uniq, groupBy, pct,
  toast, modal, confirmBox, flyXP, scrollTop,
});

})();

    date: App.today(),
    mode: a.mode,

    tier: a.tier || null,
    topic: a.topic || null,
    label: a.label || '',
    n: a.items.length,
    correct: a.items.filter((i) => i.ok).length,
    ms: a.ms || 0,
    items: a.items,
  };
  S.attempts.push(rec);
  if (S.attempts.length > 800) S.attempts = S.attempts.slice(-800);

  for (const it of a.items) {
    S.seen[it.qid] = (S.seen[it.qid] || 0) + 1;

      const m = S.mistakes[it.qid];

        m.resolvedTs = Date.now();

    } else {
      const m = S.mistakes[it.qid] || {
        n: 0, part: it.part, tier: it.tier, topic: it.topic, resolved: false,

      m.n += 1;
      m.lastTs = Date.now();

      m.resolved = false;
      m.part = it.part != null ? it.part : m.part;
      m.tier = it.tier || m.tier;
      m.topic = it.topic || m.topic;
      S.mistakes[it.qid] = m;

];

function interp(anchors, raw) {
  const x = App.clamp(raw, 0, 100);
  for (let i = 1; i < anchors.length; i++) {
    const [x0, y0] = anchors[i - 1];
    const [x1, y1] = anchors[i];
    if (x <= x1) {
      const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
      return Math.round((y0 + t * (y1 - y0)) / 5) * 5;
    }
  }
  return 495;
}

const scaleL = (raw) => App.clamp(interp(ANCHOR_L, raw), 5, 495);
const scaleR = (raw) => App.clamp(interp(ANCHOR_R, raw), 5, 495);

/** rawL, rawR = จำนวนข้อถูกจาก 100 ข้อ */
function scaledFromRaw(rawL, rawR) {
  const L = scaleL(rawL);
  const R = scaleR(rawR);
  return { L, R, total: L + R };
}

/* จำนวนข้อจริงในแต่ละ Part */
const PART_N = { 1: 6, 2: 25, 3: 39, 4: 30, 5: 30, 6: 16, 7: 54 };
const LISTEN_PARTS = [1, 2, 3, 4];
const READ_PARTS = [5, 6, 7];

const PART_NAME = {
  1: 'Part 1 · รูปภาพ',
  2: 'Part 2 · ถาม-ตอบ',
  3: 'Part 3 · บทสนทนา',
  4: 'Part 4 · บทพูด',
  5: 'Part 5 · เติมคำในประโยค',
  6: 'Part 6 · เติมคำในบทความ',
  7: 'Part 7 · อ่านจับใจความ',
};

const PART_SHORT = {
  1: 'P1 รูปภาพ', 2: 'P2 ถาม-ตอบ', 3: 'P3 สนทนา', 4: 'P4 บทพูด',
  5: 'P5 เติมคำ', 6: 'P6 บทความ', 7: 'P7 อ่าน',
};

/**
 * ประมาณคะแนนจากผลการฝึกที่ผ่านมา
 * ใช้ % ความแม่นยำล่าสุดของแต่ละ Part ถ่วงน้ำหนักตามจำนวนข้อจริง
 * Part ที่ยังไม่เคยฝึก จะประมาณจากค่าเฉลี่ยของฝั่งเดียวกัน หรือค่าตั้งต้น 25% (เดาสุ่ม)
 */
function predict(state) {
  const acc = accuracyByPart(state, 220); // ดู 220 ข้อล่าสุดต่อ Part
  const guessFloor = { 1: 0.25, 2: 0.333, 3: 0.25, 4: 0.25, 5: 0.25, 6: 0.25, 7: 0.25 };

  const fill = (parts) => {
    const known = parts.filter((p) => acc[p] && acc[p].n >= 5);
    const avg = known.length
      ? App.sum(known.map((p) => acc[p].correct)) / App.sum(known.map((p) => acc[p].n))
      : null;
    const out = {};
    for (const p of parts) {
      if (acc[p] && acc[p].n >= 5) out[p] = acc[p].correct / acc[p].n;
      else if (avg != null) out[p] = App.clamp(avg * 0.92, guessFloor[p], 1); // ยังไม่เคยฝึก = หักลบเล็กน้อย
      else out[p] = guessFloor[p];
    }
    return out;
  };

  const rl = fill(LISTEN_PARTS);
  const rr = fill(READ_PARTS);

  const rawL = App.sum(LISTEN_PARTS.map((p) => rl[p] * PART_N[p]));
  const rawR = App.sum(READ_PARTS.map((p) => rr[p] * PART_N[p]));

  const sc = scaledFromRaw(rawL, rawR);
  const dataPoints = App.sum(Object.values(acc).map((a) => a.n));

  return {
    ...sc,
    rawL: Math.round(rawL),
    rawR: Math.round(rawR),
    rateL: rl,
    rateR: rr,
    dataPoints,
    confidence: dataPoints < 60 ? 'low' : dataPoints < 250 ? 'mid' : 'high',
  };
}

/** ความแม่นยำรายส่วนจากประวัติล่าสุด (ไม่นับโหมดทบทวนข้อผิด เพราะจะเบ้ต่ำ) */
function accuracyByPart(state, limitPerPart) {
  const out = {};
  const lim = limitPerPart || 999999;
  for (let i = state.attempts.length - 1; i >= 0; i--) {
    const a = state.attempts[i];
    if (a.mode === 'review') continue;
    for (const it of a.items) {
      const p = it.part;
      if (!p) continue;
      const o = out[p] || (out[p] = { n: 0, correct: 0, ms: 0 });
      if (o.n >= lim) continue;
      o.n += 1;
      o.ms += it.ms || 0;
      if (it.ok) o.correct += 1;
    }
  }
  return out;
}

/** ความแม่นยำรายหัวข้อไวยากรณ์ — ใช้หา "จุดอ่อน" */
function accuracyByTopic(state) {
  const out = {};
  for (const a of state.attempts) {
    for (const it of a.items) {
      if (!it.topic) continue;
      const o = out[it.topic] || (out[it.topic] = { n: 0, correct: 0, topicTh: it.topicTh || '' });
      o.n += 1;
      if (it.ok) o.correct += 1;
      if (it.topicTh) o.topicTh = it.topicTh;
    }
  }
  return out;
}

/** เส้นแนวโน้มคะแนนตามวัน (ใช้ทำกราฟ) */
function scoreTrend(state) {
  const byDate = {};
  for (const a of state.attempts) {
    if (a.mode === 'review') continue;
    const d = a.date || App.ymd(a.ts);
    const o = byDate[d] || (byDate[d] = {});
    for (const it of a.items) {
      if (!it.part) continue;
      const p = o[it.part] || (o[it.part] = { n: 0, c: 0 });
      p.n += 1;
      if (it.ok) p.c += 1;
    }
  }
  const dates = Object.keys(byDate).sort();
  const pts = [];
  const cum = {}; // สะสมแบบถ่วงน้ำหนักล่าสุด เพื่อให้เส้นไม่กระโดด
  for (const d of dates) {
    for (const p in byDate[d]) {
      const c = cum[p] || (cum[p] = { n: 0, c: 0 });
      c.n = c.n * 0.55 + byDate[d][p].n;
      c.c = c.c * 0.55 + byDate[d][p].c;
    }
    const rate = (p) => (cum[p] && cum[p].n >= 3 ? cum[p].c / cum[p].n : null);
    const side = (parts) => {
      const k = parts.filter((p) => rate(p) != null);
      if (!k.length) return null;
      const avg = App.sum(k.map((p) => rate(p) * PART_N[p])) / App.sum(k.map((p) => PART_N[p]));
      return App.sum(parts.map((p) => (rate(p) != null ? rate(p) : avg * 0.92) * PART_N[p]));
    };
    const rl = side(LISTEN_PARTS);
    const rr = side(READ_PARTS);
    if (rl == null && rr == null) continue;
    const sc = scaledFromRaw(rl == null ? 25 : rl, rr == null ? 25 : rr);
    pts.push({ date: d, total: sc.total, L: sc.L, R: sc.R });
  }
  return pts;
}

/** ระดับความหมายของคะแนน (ตามเกณฑ์ที่ ETS ใช้สื่อสาร) */
function scoreBand(total) {
  if (total >= 905) return { th: 'ใช้งานได้ใกล้เคียงเจ้าของภาษา', color: 'var(--gold)' };
  if (total >= 785) return { th: 'สื่อสารในงานได้คล่อง', color: 'var(--ok)' };
  if (total >= 605) return { th: 'สื่อสารในงานได้ในระดับพื้นฐาน', color: 'var(--brand)' };
  if (total >= 405) return { th: 'สื่อสารเรื่องง่ายๆ ได้บ้าง', color: 'var(--warn)' };
  if (total >= 255) return { th: 'เริ่มต้น เข้าใจประโยคสั้นๆ', color: 'var(--warn)' };
  return { th: 'ยังต้องสร้างพื้นฐาน', color: 'var(--bad)' };
}

/** เป้าหมายรายวัน: ควรอยู่ที่เท่าไหร่ในวันที่ n เพื่อจะถึง 750 ในวันที่ 30 */
function targetOnDay(day, startScore) {
  const s = startScore || 300;
  const t = App.clamp((day - 1) / 29, 0, 1);
  // โตแบบ ease-out: ช่วงแรกขึ้นเร็ว (ไวยากรณ์+ศัพท์คุ้มที่สุด) แล้วค่อยชะลอ
  const eased = 1 - Math.pow(1 - t, 1.55);
  return Math.round((s + (750 - s) * eased) / 5) * 5;
}

Object.assign(App, {
  Score: {
    scaleL, scaleR, scaledFromRaw,
    PART_N, PART_NAME, PART_SHORT, LISTEN_PARTS, READ_PARTS,
    predict, accuracyByPart, accuracyByTopic, scoreTrend, scoreBand, targetOnDay,
  },
});

})();

/* ===== 30-tts.js ===== */
;(function(){
/* ============================================================
   30-tts — อ่านออกเสียงภาษาอังกฤษด้วยเสียงในเบราว์เซอร์ (Web Speech API)
   รองรับ 4 สำเนียงเหมือนข้อสอบจริง: US / UK / CA / AU
   ============================================================ */
'use strict';

const LANG_OF = { US: 'en-US', UK: 'en-GB', CA: 'en-CA', AU: 'en-AU' };
const ACCENT_TH = { US: 'อเมริกัน', UK: 'อังกฤษ', CA: 'แคนาดา', AU: 'ออสเตรเลีย' };
const FALLBACK = { CA: ['en-US', 'en-GB'], AU: ['en-GB', 'en-US'], UK: ['en-US'], US: ['en-GB'] };

let voices = [];
let ready = false;
let readyWaiters = [];
let currentSeq = 0;
let onStateChange = null;

const synth = () => window.speechSynthesis;

function supported() {
  return typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
}

function loadVoices() {
  if (!supported()) return;
  const v = synth().getVoices() || [];
  if (v.length) {
    voices = v.filter((x) => /^en(-|_|$)/i.test(x.lang));
    if (!voices.length) voices = v;
    ready = true;
    readyWaiters.splice(0).forEach((fn) => fn());
  }
}

function whenReady() {
  return new Promise((res) => {
    if (ready || !supported()) return res();
    readyWaiters.push(res);
    setTimeout(res, 1600); // กันค้างถ้าเบราว์เซอร์ไม่ยิง event
  });
}

function init() {
  if (!supported()) return;
  loadVoices();
  synth().addEventListener?.('voiceschanged', loadVoices);
  if ('onvoiceschanged' in synth()) synth().onvoiceschanged = loadVoices;
  // iOS/Safari บางรุ่นต้องกระตุ้นครั้งแรกด้วย gesture
  const kick = () => {
    loadVoices();
    document.removeEventListener('pointerdown', kick);
  };
  document.addEventListener('pointerdown', kick, { once: true });
}

function listVoices() {
  return voices.slice();
}

/** เลือกเสียงที่เหมาะกับสำเนียง โดยเคารพเสียงที่ผู้ใช้ตั้งเองไว้ */
function voiceFor(accent) {
  const st = App.Store.state();
  const acc = st.settings.accentMode === 'us' ? 'US' : accent || 'US';
  const pinned = st.settings.voiceMap && st.settings.voiceMap[acc];
  if (pinned) {
    const v = voices.find((x) => x.voiceURI === pinned);
    if (v) return v;
  }
  const want = LANG_OF[acc] || 'en-US';
  const norm = (s) => String(s || '').replace('_', '-').toLowerCase();

  let v = voices.find((x) => norm(x.lang) === want.toLowerCase() && x.localService);
  if (!v) v = voices.find((x) => norm(x.lang) === want.toLowerCase());
  if (!v) {
    for (const fb of FALLBACK[acc] || ['en-US']) {
      v = voices.find((x) => norm(x.lang) === fb.toLowerCase());
      if (v) break;
    }
  }
  if (!v) v = voices.find((x) => norm(x.lang).startsWith('en'));
  return v || voices[0] || null;
}

/** สำเนียงที่เครื่องนี้รองรับจริง */
function availableAccents() {
  const out = {};
  for (const a in LANG_OF) {
    const v = voices.find((x) => String(x.lang).replace('_', '-').toLowerCase() === LANG_OF[a].toLowerCase());
    out[a] = { ok: !!v, name: v ? v.name : null };
  }
  return out;
}

function stop() {
  currentSeq++;
  try { synth().cancel(); } catch (e) {}
  setState(false);
}

function setState(playing) {
  if (onStateChange) onStateChange(playing);
}

/** พูดข้อความเดียว */
function say(text, accent, opts) {
  return speakSeq([{ text, accent }], opts);
}

/**
 * พูดหลายบรรทัดต่อกัน (ใช้กับ Part 3/4)
 * @param {Array<{text:string, accent?:string}>} lines
 * @param {{rate?:number, gap?:number, onLine?:(i:number)=>void}} opts
 */
function speakSeq(lines, opts) {
  opts = opts || {};
  if (!supported()) {
    App.toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน — กดดูสคริปต์แทนได้', 'bad');
    return Promise.resolve(false);
  }
  stop();
  const mySeq = ++currentSeq;
  const st = App.Store.state();
  const rate = opts.rate != null ? opts.rate : st.settings.ttsRate;

  return whenReady().then(
    () =>
      new Promise((resolve) => {
        setState(true);
        let i = 0;
        let watchdog = null;

        const finish = (okDone) => {
          clearTimeout(watchdog);
          if (mySeq === currentSeq) setState(false);
          resolve(okDone);
        };

        const next = () => {
          if (mySeq !== currentSeq) return resolve(false);
          if (i >= lines.length) return finish(true);
          const ln = lines[i];
          const idx = i;
          i++;
          if (opts.onLine) opts.onLine(idx);

          const u = new SpeechSynthesisUtterance(String(ln.text || '').trim());
          const v = voiceFor(ln.accent);
          if (v) {
            u.voice = v;
            u.lang = v.lang;
          } else {
            u.lang = LANG_OF[ln.accent] || 'en-US';
          }
          u.rate = App.clamp(rate, 0.5, 2);
          u.pitch = ln.pitch != null ? ln.pitch : ln.sp === 'W' ? 1.12 : ln.sp === 'M' ? 0.9 : 1;
          u.volume = 1;

          let advanced = false;
          const go = () => {
            if (advanced) return;
            advanced = true;
            clearTimeout(watchdog);
            const gap = opts.gap != null ? opts.gap : 380;
            setTimeout(next, gap);
          };
          u.onend = go;
          u.onerror = (e) => {
            if (e && e.error === 'interrupted') return resolve(false);
            console.warn('tts error', e);
            go();
          };

          // กันเคสเบราว์เซอร์ไม่ยิง onend (พบใน Chrome บางเวอร์ชัน)
          const est = 900 + (String(ln.text || '').length / Math.max(0.6, u.rate)) * 78;
          clearTimeout(watchdog);
          watchdog = setTimeout(go, est + 3500);

          try {
            synth().speak(u);
          } catch (e) {
            console.warn(e);
            go();
          }
        };
        next();
      }),
  );
}

/** แปลง group ของ Part 3/4 เป็นรายการบรรทัดสำหรับอ่าน */
function linesOf(group) {
  const ls = (group.audio && group.audio.lines) || [];
  return ls.map((l) => ({ text: l.text, accent: l.accent || 'US', sp: l.sp }));
}

/** สร้างรายการบรรทัดของ Part 1 (ตัวเลือก A–D) */
function part1Lines(item) {
  const acc = item.accent || 'US';
  return item.choices.map((c, i) => ({ text: `(${'ABCD'[i]})  ${c}`, accent: acc }));
}

/** สร้างรายการบรรทัดของ Part 2 (คำถาม + 3 ตัวเลือก) */
function part2Lines(item) {
  const qa = item.promptAccent || 'US';
  const ca = item.choicesAccent || 'UK';
  return [{ text: item.prompt, accent: qa }].concat(
    item.choices.map((c, i) => ({ text: `(${'ABC'[i]})  ${c}`, accent: ca })),
  );
}

Object.assign(App, {
  TTS: {
    init, supported, say, speakSeq, stop, listVoices, voiceFor, availableAccents,
    linesOf, part1Lines, part2Lines,
    ACCENT_TH, LANG_OF,
    set onState(fn) { onStateChange = fn; },
    get onState() { return onStateChange; },
  },
});

})();

/* ===== 40-data.js ===== */
;(function(){
/* ============================================================
   40-data — โหลดคลังเนื้อหา (ทำงานได้ทั้งแบบฝังในไฟล์เดียวและแบบโหลดทีละไฟล์)
   ============================================================ */
'use strict';

const MANIFEST = window.__MANIFEST__ || { drills: [], tests: [], lessons: [], vocab: [], static: [], plan: null };
const INLINE = window.__DATA__ || null;

const cache = new Map();      // "kind/name" -> object
const unitIndex = new Map();  // qid -> unit
const qIndex = new Map();     // qid -> {unit, qi}
let loadedAll = false;

const baseUrl = () => {
  const p = location.pathname;
  return p.slice(0, p.lastIndexOf('/') + 1);
};

function loadFile(kind, name) {
  const key = kind + '/' + name;
  if (cache.has(key)) return Promise.resolve(cache.get(key));
  if (INLINE) {
    const obj = INLINE[key] || null;
    cache.set(key, obj);
    return Promise.resolve(obj);
  }
  return fetch(`${baseUrl()}data/${kind}/${name}.json`, { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null)
    .then((obj) => {
      cache.set(key, obj);
      return obj;
    });
}

function filesOf(kind) {
  return (MANIFEST[kind] || []).slice();
}

function loadKind(kind) {
  return Promise.all(filesOf(kind).map((n) => loadFile(kind, n))).then((a) => a.filter(Boolean));
}

/* ---------- normalize ---------- */

const GROUP_PARTS = new Set([3, 4, 6, 7]);

/**
 * แปลง item ดิบเป็น "unit" ที่ตัวรันข้อสอบใช้
 * single = 1 คำถาม / group = หลายคำถามใช้เนื้อหาร่วมกัน
 */
function toUnit(raw, src) {
  if (!raw || typeof raw !== 'object') return null;
  const part = Number(raw.part);
  if (!part) return null;
  const isGroup = Array.isArray(raw.questions) && raw.questions.length > 0;

  const u = {
    id: raw.id,
    part,
    tier: raw.tier || 'medium',
    topic: raw.topic || null,
    topicTh: raw.topicTh || null,
    src: src || null,
    kind: isGroup ? 'group' : 'single',
    raw,
  };

  if (isGroup) {
    u.qs = raw.questions.map((q, i) => ({
      qid: `${raw.id}#${i + 1}`,
      idx: i,
      q: q.q || (q.blank ? `ช่องว่างที่ ${q.blank}` : ''),
      blank: q.blank || null,
      kindQ: q.kind || null,
      choices: q.choices || [],
      answer: q.answer,
      th: q.th || {},
      explain: q.explain || {},
    }));
  } else {
    u.qs = [
      {
        qid: raw.id,
        idx: 0,
        q: raw.stem || raw.prompt || '',
        choices: raw.choices || [],
        answer: raw.answer,
        th: raw.th || {},
        explain: raw.explain || {},
      },
    ];
  }
  u.n = u.qs.length;
  return u;
}

function indexUnits(units) {
  for (const u of units) {
    unitIndex.set(u.id, u);
    u.qs.forEach((q, qi) => qIndex.set(q.qid, { unit: u, qi }));
  }
}

/* ---------- ดริล ---------- */

let drillUnits = null;

function loadDrills() {
  if (drillUnits) return Promise.resolve(drillUnits);
  return loadKind('drills').then((files) => {
    const out = [];
    for (const f of files) {
      const src = (f.meta && f.meta.batch) || 'drill';
      for (const it of f.items || []) {
        const u = toUnit(it, src);
        if (u) out.push(u);
      }
    }
    drillUnits = out;
    indexUnits(out);
    return out;
  });
}

/** รวมข้อจากบทเรียน (quiz ท้ายบท) เข้าคลังด้วย เผื่อใช้ทบทวน */
let lessonUnits = null;
function loadLessonQuizUnits() {
  if (lessonUnits) return Promise.resolve(lessonUnits);
  return loadKind('lessons').then((files) => {
    const out = [];
    for (const f of files) {
      for (const it of f.quiz || []) {
        const u = toUnit(it, 'lesson:' + f.id);
        if (u) out.push(u);
      }
    }
    lessonUnits = out;
    indexUnits(out);
    return out;
  });
}

/**
 * เลือกข้อสำหรับฝึก
 * @param {{part?:number|number[], tier?:string, topic?:string, n?:number,
 *          preferUnseen?:boolean, seed?:number}} opt
 */
function selectDrill(opt) {
  opt = opt || {};
  return loadDrills().then((all) => {
    const parts = opt.part == null ? null : Array.isArray(opt.part) ? opt.part : [opt.part];
    let pool = all.filter((u) => {
      if (parts && !parts.includes(u.part)) return false;
      if (opt.tier && u.tier !== opt.tier) return false;
      if (opt.topic && u.topic !== opt.topic) return false;
      return true;
    });
    if (!pool.length) return [];

    const st = App.Store.state();
    const rnd = App.mulberry32(opt.seed != null ? opt.seed : (Date.now() & 0xffffff));

    if (opt.preferUnseen !== false) {
      const seenCount = (u) => App.sum(u.qs.map((q) => st.seen[q.qid] || 0));
      const fresh = App.shuffle(pool.filter((u) => seenCount(u) === 0), rnd);
      const rest = App.shuffle(pool.filter((u) => seenCount(u) > 0), rnd).sort(
        (a, b) => seenCount(a) - seenCount(b),
      );
      pool = fresh.concat(rest);
    } else {
      pool = App.shuffle(pool, rnd);
    }

    const want = opt.n || 20;
    const out = [];
    let cnt = 0;
    for (const u of pool) {
      if (cnt >= want) break;
      out.push(u);
      cnt += u.n;
    }
    return out;
  });
}

/** หัวข้อทั้งหมดที่มีในคลัง พร้อมจำนวนข้อ */
function drillTopics() {
  return loadDrills().then((all) => {
    const map = {};
    for (const u of all) {
      if (!u.topic) continue;
      const k = u.topic;
      const o = map[k] || (map[k] = { topic: k, topicTh: u.topicTh || k, n: 0, parts: new Set(), tiers: new Set() });
      o.n += u.n;
      o.parts.add(u.part);
      o.tiers.add(u.tier);
      if (u.topicTh) o.topicTh = u.topicTh;
    }
    return Object.values(map)
      .map((o) => ({ ...o, parts: Array.from(o.parts), tiers: Array.from(o.tiers) }))
      .sort((a, b) => b.n - a.n);
  });
}

/** จำนวนข้อที่มีในคลัง แยกตาม part/tier */
function drillCounts() {
  return loadDrills().then((all) => {
    const out = {};
    for (const u of all) {
      const p = (out[u.part] = out[u.part] || { total: 0, easy: 0, medium: 0, real: 0 });
      p.total += u.n;
      p[u.tier] = (p[u.tier] || 0) + u.n;
    }
    return out;
  });
}

/* ---------- ชุดสอบ ---------- */

function loadTest(name) {
  return loadFile('tests', name).then((f) => {
    if (!f) return null;
    const units = (f.items || []).map((it) => toUnit(it, name)).filter(Boolean);
    indexUnits(units);
    return { meta: f.meta || {}, units, name };
  });
}

function testList() {
  return filesOf('tests');
}

/* ---------- บทเรียน ---------- */

function lessons() {
  return loadKind('lessons').then((a) => a.sort((x, y) => (x.day || 0) - (y.day || 0)));
}
function lesson(id) {
  return loadFile('lessons', id);
}

/* ---------- คำศัพท์ ---------- */

let vocabAll = null;
function vocab() {
  if (vocabAll) return Promise.resolve(vocabAll);
  return loadKind('vocab').then((files) => {
    const out = [];
    for (const f of files) for (const it of f.items || []) out.push({ ...it, batch: (f.meta && f.meta.batch) || '' });
    const seenId = new Set();
    vocabAll = out.filter((x) => (seenId.has(x.id) ? false : (seenId.add(x.id), true)));
    return vocabAll;
  });
}

/* ---------- เอกสารคงที่ ---------- */

function staticDoc(name) {
  return loadFile('static', name);
}

/* ---------- แผน 30 วัน ---------- */

let planCache = null;
function plan() {
  if (planCache) return Promise.resolve(planCache);
  return loadFile('static', 'plan30').then((p) => {
    planCache = p || { days: [] };
    return planCache;
  });
}

/* ---------- ค้นหาข้อจาก qid (ใช้กับสมุดข้อผิด) ---------- */

function ensureAll(onProgress) {
  if (loadedAll) return Promise.resolve();
  const jobs = [loadDrills(), loadLessonQuizUnits()].concat(filesOf('tests').map((n) => loadTest(n)));
  let done = 0;
  return Promise.all(
    jobs.map((p) =>
      p.then((r) => {
        done++;
        if (onProgress) onProgress(done, jobs.length);
        return r;
      }),
    ),
  ).then(() => {
    loadedAll = true;
  });
}

function findQ(qid) {
  return qIndex.get(qid) || null;
}
function findUnit(id) {
  return unitIndex.get(id) || null;
}

/* ---------- สรุปว่ามีเนื้อหาอะไรพร้อมแล้วบ้าง ---------- */

function inventory() {
  return Promise.all([drillCounts(), vocab(), lessons()]).then(([dc, vc, ls]) => {
    const drillTotal = App.sum(Object.values(dc).map((x) => x.total));
    return {
      drills: dc,
      drillTotal,
      vocab: vc.length,
      lessons: ls.length,
      tests: filesOf('tests').filter((n) => n !== 'placement').length,
      hasPlacement: filesOf('tests').includes('placement'),
    };
  });
}

Object.assign(App, {
  Data: {
    MANIFEST, filesOf, loadFile, loadKind,
    loadDrills, selectDrill, drillTopics, drillCounts,
    loadTest, testList,
    lessons, lesson, loadLessonQuizUnits,
    vocab, staticDoc, plan,
    ensureAll, findQ, findUnit, toUnit, inventory,
    GROUP_PARTS,
  },
});

})();

;(function(){
/* ============================================================
   50-srs — ระบบทวนคำศัพท์แบบเว้นระยะ (ดัดแปลงจาก SM-2)
   ปรับให้ระยะสั้นกว่าปกติ เพราะมีเวลาเตรียมตัวแค่ 30 วัน
   ============================================================ */
'use strict';

/* ระยะทวนสูงสุดจำกัดที่ 12 วัน — เกินกว่านั้นจะไม่ทันได้ทวนก่อนสอบ */
const MAX_IV = 12;

const GRADE = {
  again: 0, // ไม่รู้เลย
  hard: 1,  // นึกออกยาก
  good: 2,  // นึกออก
  easy: 3,  // ง่ายมาก
};

function newCard() {
  return { ef: 2.4, iv: 0, due: App.today(), reps: 0, lapses: 0, last: null };
}

function get(id) {
  const s = App.Store.state();
  return s.srs[id] || null;
}

/** อัปเดตการ์ดตามผลการทวน แล้วคืนการ์ดใหม่ */
function review(id, grade) {
  const s = App.Store.state();
  const c = s.srs[id] || newCard();

  if (grade === GRADE.again) {
    c.lapses += 1;
    c.ef = Math.max(1.4, c.ef - 0.22);
    c.iv = 0;
    c.due = App.today(); // ทวนซ้ำในรอบเดียวกัน
  } else {
    const q = grade === GRADE.hard ? 3 : grade === GRADE.good ? 4 : 5;
    c.ef = App.clamp(c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)), 1.4, 2.7);

    if (c.reps === 0 || c.iv === 0) c.iv = grade === GRADE.easy ? 2 : 1;
    else if (c.iv === 1) c.iv = grade === GRADE.hard ? 1 : grade === GRADE.easy ? 4 : 2;
    else c.iv = Math.round(c.iv * (grade === GRADE.hard ? 1.25 : c.ef) * (grade === GRADE.easy ? 1.25 : 1));

    c.iv = App.clamp(c.iv, 1, MAX_IV);
    c.due = App.addDays(App.today(), c.iv);
    c.reps += 1;
  }

  c.last = Date.now();
  s.srs[id] = c;
  App.Store.save();
  return c;
}

/**
 * เลือกการ์ดสำหรับทวนวันนี้
 * ลำดับ: ครบกำหนดทวน (เก่าสุดก่อน) → คำใหม่ (เรียงตามความถี่ที่ออกสอบ)
 */
function due(allWords, limitNew, limitTotal) {
  const s = App.Store.state();
  const t = App.today();
  const dueList = [];
  const fresh = [];

  for (const w of allWords) {
    const c = s.srs[w.id];
    if (!c) fresh.push(w);
    else if (c.due <= t) dueList.push(w);
  }

  dueList.sort((a, b) => {
    const ca = s.srs[a.id], cb = s.srs[b.id];
    if (ca.due !== cb.due) return ca.due < cb.due ? -1 : 1;
    return (cb.lapses || 0) - (ca.lapses || 0);
  });

  fresh.sort((a, b) => (b.freq || 3) - (a.freq || 3) || String(a.id).localeCompare(String(b.id)));

  const nNew = Math.max(0, limitNew == null ? 20 : limitNew);
  const out = dueList.concat(fresh.slice(0, nNew));
  return limitTotal ? out.slice(0, limitTotal) : out;
}

function stats(allWords) {
  const s = App.Store.state();
  const t = App.today();
  let learning = 0, young = 0, mature = 0, dueNow = 0, untouched = 0;
  for (const w of allWords) {
    const c = s.srs[w.id];
    if (!c) { untouched++; continue; }
    if (c.due <= t) dueNow++;
    if (c.iv >= 7) mature++;
    else if (c.iv >= 2) young++;
    else learning++;
  }
  return { total: allWords.length, learning, young, mature, dueNow, untouched, started: allWords.length - untouched };
}

/** ตัวเลือกลวงสำหรับโหมด "เลือกความหมาย" */
function distractors(word, allWords, n) {
  const same = allWords.filter((w) => w.id !== word.id && w.pos === word.pos);
  const pool = (same.length >= n ? same : allWords.filter((w) => w.id !== word.id));
  return App.pick(pool, n || 3);
}

Object.assign(App, {
  SRS: { GRADE, newCard, get, review, due, stats, distractors, MAX_IV },
});

})();

function sanitizeSVG(svg) {
  let s = String(svg);
  s = s.replace(/<\s*(script|foreignObject|style|image|use|iframe)[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
  s = s.replace(/<\s*(script|foreignObject|style|image|use|iframe)[^>]*\/?>/gi, '');
  s = s.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');

  return el;
}

/* ---------- กราฟ (SVG เขียนเอง ไม่พึ่งไลบรารีภายนอก) ---------- */

function lineChart(points, opt) {
  opt = opt || {};
  const W = opt.w || 640, H = opt.h || 210;
  const pad = { l: 40, r: 12, t: 14, b: 26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  if (!points.length) return h('div.empty', 'ยังไม่มีข้อมูลพอจะวาดกราฟ — ทำข้อสอบสัก 20 ข้อก่อน');

  const ys = points.map((p) => p.y);
  const lo = opt.min != null ? opt.min : Math.min(...ys, 200) - 20;
  const hi = opt.max != null ? opt.max : Math.max(...ys, 800) + 20;
  const X = (i) => pad.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const Y = (v) => pad.t + ih - ((App.clamp(v, lo, hi) - lo) / (hi - lo)) * ih;

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', '100%');
  svg.style.minWidth = Math.min(W, 640) + 'px';

  const mk = (n, at) => {
    const e = document.createElementNS(NS, n);
    for (const k in at) e.setAttribute(k, at[k]);
    return e;
  };

  // เส้นกริดแนวนอน
  const ticks = opt.ticks || [200, 400, 600, 750, 900];
  ticks.forEach((t) => {
    if (t < lo || t > hi) return;
    svg.appendChild(mk('line', { x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t), stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': t === 750 ? '5 3' : '' }));
    const tx = mk('text', { x: 4, y: Y(t) + 4, fill: t === 750 ? 'var(--ok)' : 'var(--tx-faint)', 'font-size': 10 });
    tx.textContent = t;
    svg.appendChild(tx);
  });

  // พื้นที่ใต้เส้น
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  svg.appendChild(mk('path', {
    d: `${d} L${X(points.length - 1).toFixed(1)},${pad.t + ih} L${X(0).toFixed(1)},${pad.t + ih} Z`,
    fill: 'var(--brand)', opacity: .12,
  }));
  svg.appendChild(mk('path', { d, fill: 'none', stroke: 'var(--brand)', 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  points.forEach((p, i) => {
    svg.appendChild(mk('circle', { cx: X(i), cy: Y(p.y), r: 3.6, fill: 'var(--brand)', stroke: 'var(--bg)', 'stroke-width': 1.5 }));
    if (points.length <= 12 || i === 0 || i === points.length - 1) {
      const tx = mk('text', { x: X(i), y: H - 8, fill: 'var(--tx-faint)', 'font-size': 9, 'text-anchor': 'middle' });
      tx.textContent = p.label || '';
      svg.appendChild(tx);
    }
  });

  const wrap = h('div.chart');
  wrap.appendChild(svg);
  return wrap;
}

function hbars(rows) {
  const wrap = h('div.hbar');
  rows.forEach((r) => {
    const p = App.clamp(r.pct, 0, 100);
    const color = r.color || (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--brand)' : p >= 30 ? 'var(--warn)' : 'var(--bad)');
    wrap.appendChild(
      h('div.r',
        h('span.lb', r.label),
        h('span.tr', h('i', { style: { width: p + '%', background: color } })),
        h('span.vl', r.value != null ? r.value : p + '%')),
    );
  });
  return wrap;
}

/** ปฏิทินความสม่ำเสมอ 30 วัน */
function streakGrid(startDate, studyDates) {
  const set = new Set(studyDates);
  const wrap = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(10, 1fr)', gap: '5px' } });
  for (let i = 0; i < 30; i++) {
    const d = App.addDays(startDate, i);
    const isPast = App.daysBetween(d, App.today()) >= 0;
    const done = set.has(d);
    const el = h('div', {
      title: `วันที่ ${i + 1} · ${App.thaiDate(d)}${done ? ' · เรียนแล้ว' : ''}`,
      style: {
        aspectRatio: '1',
        borderRadius: '6px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: '.66rem', fontWeight: '700',
        background: done ? 'var(--ok)' : isPast ? 'var(--bad-sf)' : 'var(--card-2)',
        color: done ? '#fff' : isPast ? 'var(--bad)' : 'var(--tx-faint)',
        border: d === App.today() ? '2px solid var(--brand)' : '1px solid var(--line)',
      },
    }, String(i + 1));
    wrap.appendChild(el);
  }
  return wrap;
}

/* ---------- โครงหน้าจอ ---------- */

function view(...kids) {
  const f = document.createDocumentFragment();
  kids.forEach((k) => k && f.appendChild(k));
  return f;
}

function emptyState(icon, msg, action) {
  return h('div.empty', h('span.big', icon), h('div', { html: msg }), action ? h('div.mt', action) : null);
}

function tierPill(tier) {
  const m = { easy: ['ง่าย', 'ok'], medium: ['กลาง', 'warn'], real: ['ระดับจริง', 'bad'] };
  const x = m[tier] || ['—', ''];
  return h('span.pill.' + x[1], x[0]);
}

Object.assign(App, {
  UI: {
    topbar, backBtn, audioBox, sceneEl, passageEl, choicesEl, explainEl,
    vocabChip, lineChart, hbars, streakGrid, view, emptyState, stemHTML,
    tierPill, sanitizeSVG, docKindTh, LETTERS,
  },
});

})();

}

function active() {
  return session;
}

function exit(silent) {
  App.TTS.stop();

  }
}

/* ---------- ปิดท้าย ---------- */

function finish() {
  const s = session;
  if (!s || s.finished) return;
  s.finished = true;
  clearInterval(timerHandle);
  App.TTS.stop();

  const items = s.flat.map((f) => ({
    qid: f.q.qid,
    ch: s.answers[f.q.qid] != null ? s.answers[f.q.qid] : -1,
    ok: s.answers[f.q.qid] === f.q.answer,
    ms: s.times[f.q.qid] || 0,
    part: f.u.part,
    tier: f.u.tier,
    topic: f.u.topic,
    topicTh: f.u.topicTh,
  }));

  const result = {
    mode: s.cfg.mode,
    title: s.cfg.title,
    items,
    ms: Date.now() - s.startTs,
    units: s.units,
    answers: s.answers,
    byPart: App.Score.LISTEN_PARTS.concat(App.Score.READ_PARTS).reduce((o, p) => {
      const its = items.filter((i) => i.part === p);
      if (its.length) o[p] = { n: its.length, correct: its.filter((i) => i.ok).length };
      return o;
    }, {}),
  };

  const cb = s.cfg.onFinish;
  session = null;
  if (cb) cb(result);
}

function askExit() {
  const s = session;
  if (!s) return App.go('#/');
  const answered = s.flat.filter((f) => s.answers[f.q.qid] != null).length;
  if (!answered) {
    exit();
    return App.go(s.cfg.backTo || '#/');
  }
  App.confirmBox('ออกจากชุดนี้', `ทำไปแล้ว ${answered} ข้อ ถ้าออกตอนนี้ ${s.cfg.mode === 'exam' ? 'ผลสอบจะไม่ถูกบันทึก' : 'ระบบจะบันทึกเท่าที่ทำไปแล้ว'}`, () => {
    if (s.cfg.mode !== 'exam' && answered) {
      s.flat = s.flat.filter((f) => s.answers[f.q.qid] != null);
      finish();
    } else {
      const back = s.cfg.backTo || '#/';
      exit();
      App.go(back);
    }
  }, 'ออก');
}

function addNote(qid) {
  const st = App.Store.state();
  const ta = h('textarea', { rows: 4, placeholder: 'เช่น "ลืมว่า since ต้องใช้กับ present perfect"' });
  ta.value = st.notes[qid] || '';
  App.modal('โน้ตของข้อนี้', ta, [
    { label: 'ยกเลิก', kind: 'ghost' },
    {
      label: 'บันทึก', kind: 'primary',
      onclick: () => {
        if (ta.value.trim()) st.notes[qid] = ta.value.trim();
        else delete st.notes[qid];
        App.Store.save(true);
        App.toast('บันทึกโน้ตแล้ว', 'ok');
      },
    },
  ]);
}

/* ---------- ตัวช่วย ---------- */

function audioLinesFor(u, q) {
  if (u.part === 1) return App.TTS.part1Lines(u.raw);
  if (u.part === 2) return App.TTS.part2Lines(u.raw);
  if (u.part === 3 || u.part === 4) return App.TTS.linesOf(u.raw);
  return [];
}

function scriptLinesFor(u, q) {
  if (u.part === 1) {
    const th = (u.raw.th && u.raw.th.choices) || [];
    return [{ en: '🖼 ' + (u.raw.sceneTh || ''), th: '' }].concat(
      u.raw.choices.map((c, i) => ({ en: `(${U.LETTERS[i]}) ${c}`, th: th[i] || '' })),
    );
  }
  if (u.part === 2) {
    const th = u.raw.th || {};
    return [{ en: 'Q: ' + u.raw.prompt, th: th.prompt || '' }].concat(
      u.raw.choices.map((c, i) => ({ en: `(${U.LETTERS[i]}) ${c}`, th: (th.choices || [])[i] || '' })),
    );
  }
  const ls = (u.raw.audio && u.raw.audio.lines) || [];
  const th = (u.raw.th && u.raw.th.lines) || [];
  return ls.map((l, i) => ({ sp: l.sp, en: l.text, th: th[i] || '' }));
}

function bindKeys(q, revealed) {
  if (App._quizKeyHandler) document.removeEventListener('keydown', App._quizKeyHandler);
  const fn = (e) => {
    if (!session || session.cfg.mode === 'exam') return;
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    const k = e.key.toUpperCase();
    if (!revealed) {
      const i = U.LETTERS.indexOf(k);
      if (i >= 0 && i < q.choices.length) { e.preventDefault(); pickPractice(i, e); }
      if (/^[1-4]$/.test(k) && Number(k) <= q.choices.length) { e.preventDefault(); pickPractice(Number(k) - 1, e); }
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nextPractice();
    }
    if (k === 'R' && session) {
      const b = App.$('.audiobox .big');
      if (b) b.click();
    }
  };
  App._quizKeyHandler = fn;
  document.addEventListener('keydown', fn);
}

Object.assign(App, { Quiz: { start, render, active, exit, finish } });

})();

function taskTitle(t, meta) {
  if (t.type === 'lesson') return `บทเรียน: ${t.id}`;
  if (t.type === 'drill') {
    const tier = { easy: 'ง่าย', medium: 'กลาง', real: 'ระดับจริง' }[t.tier] || '';
    return `ฝึก ${App.Score.PART_SHORT[t.part]} (${tier})`;
  }
  if (t.type === 'vocab') return `ทวนคำศัพท์ ${t.n} คำ`;
  if (t.type === 'review') return `ทบทวนข้อที่เคยผิด ${t.n} ข้อ`;
  if (t.type === 'exam') return `สอบเสมือนจริง (${t.testId})`;
  if (t.type === 'checkpoint') return t.label || 'ทดสอบย่อย';
  return meta.name;
}

function taskAvailable(t, inv) {
  if (t.type === 'lesson') {
    return App.Data.filesOf('lessons').includes(t.id)
      ? { ok: true }
      : { ok: false, msg: `บท ${t.id} กำลังจัดทำ` };
  }
  if (t.type === 'exam') {
    return App.Data.filesOf('tests').includes(t.testId)
      ? { ok: true }
      : { ok: false, msg: `ชุดสอบ ${t.testId} กำลังจัดทำ` };
  }
  if (t.type === 'placement') {
    return App.Data.filesOf('tests').includes('placement') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  }
  if (t.type === 'drill' || t.type === 'checkpoint') {
    const c = inv.drills[t.part];
    if (!c || !c.total) return { ok: false, msg: `ข้อ ${App.Score.PART_SHORT[t.part]} กำลังจัดทำ` };
    if (t.tier && !c[t.tier]) return { ok: false, msg: 'ระดับนี้กำลังจัดทำ' };
    return { ok: true };
  }
  if (t.type === 'vocab') return inv.vocab ? { ok: true } : { ok: false, msg: 'คลังศัพท์กำลังจัดทำ' };
  if (t.type === 'cheatsheet') return App.Data.filesOf('static').includes('cheatsheet') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  if (t.type === 'examinfo') return App.Data.filesOf('static').includes('examinfo') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  return { ok: true };
}

function runTask(t, day, dayPlan) {
  const finishTask = () => App.Store.markTaskDone(day, t);

  switch (t.type) {
    case 'placement':
      return App.go('#/placement');
    case 'lesson':
      return App.go('#/lesson/' + t.id);
    case 'vocab':
      App.pendingCards = { n: t.n, onDone: finishTask };
      return App.go('#/cards');
    case 'cheatsheet':
      finishTask();
      return App.go('#/cheatsheet');
    case 'examinfo':
      finishTask();
      return App.go('#/examinfo');
    case 'exam':
      return App.go('#/exam/' + t.testId);
    case 'review':
      App.pendingReview = { n: t.n, onDone: finishTask };
      return App.go('#/review');
    case 'weakspot':
      return startWeakspot(t, finishTask);
    case 'drill':
    case 'checkpoint':
      return startPlanDrill(t, finishTask);
  }
}

function startPlanDrill(t, onDone) {
  App.Data.selectDrill({ part: t.part, tier: t.tier, topic: t.topic, n: t.n }).then((units) => {
    if (!units.length) return App.toast('ยังไม่มีข้อสอบส่วนนี้ในคลัง', 'bad');
    App.Quiz.start({
      units,
      mode: 'practice',
      title: t.label || `ฝึก ${App.Score.PART_SHORT[t.part]}`,
      backTo: '#/',
      onExit: () => App.go('#/'),
      onFinish: (res) => {
        App.Store.addAttempt({ mode: 'drill', part: t.part, tier: t.tier, topic: t.topic, items: res.items, ms: res.ms });
        App.Store.addXP(App.Store.XP.drillSet);
        if (onDone) onDone();
        App.pendingResult = res;
        App.go('#/result');
      },
    });
  });
}

function startWeakspot(t, onDone) {
  const st = App.Store.state();
  const acc = App.Score.accuracyByTopic(st);
  const weak = Object.entries(acc)
    .filter(([, v]) => v.n >= 5)
    .map(([k, v]) => ({ topic: k, rate: v.correct / v.n }))
    .sort((a, b) => a.rate - b.rate)
    .slice(0, 5)
    .map((x) => x.topic);

  const load = weak.length
    ? Promise.all(weak.map((tp) => App.Data.selectDrill({ topic: tp, n: Math.ceil(t.n / weak.length) }))).then((a) => a.flat())
    : App.Data.selectDrill({ n: t.n });

  load.then((units) => {
    if (!units.length) return App.toast('ยังไม่มีข้อมูลพอจะหาจุดอ่อน — ทำข้อสอบเพิ่มก่อน', 'bad');
    App.Quiz.start({
      units: App.shuffle(units).slice(0, Math.ceil(t.n / 1.2)),
      mode: 'practice',
      title: 'ซัดจุดอ่อนของคุณ',
      backTo: '#/',
      onExit: () => App.go('#/'),
      onFinish: (res) => {
        App.Store.addAttempt({ mode: 'drill', label: 'weakspot', items: res.items, ms: res.ms });
        App.Store.addXP(App.Store.XP.drillSet);
        if (onDone) onDone();
        App.pendingResult = res;
        App.go('#/result');
      },
    });
  });
}

App.Views.TASK_META = TASK_META;
App.Views.startPlanDrill = startPlanDrill;

})();

  const wrap = h('div');
  root.appendChild(wrap);
  wrap.appendChild(h('div.empty', 'กำลังโหลด…'));

  App.Data.lesson(id).then((L) => {
    App.clear(wrap);
    if (!L) {
      wrap.appendChild(U.emptyState('⏳', 'บทนี้กำลังจัดทำอยู่<br>จะเพิ่มให้ในรอบอัปเดตถัดไป',
        h('button.btn.primary', { onclick: () => App.go('#/learn') }, 'กลับไปเลือกบทอื่น')));
      return;
    }

    App.$('.topbar h1').textContent = L.title;
    App.$('.topbar .sub').textContent = `วันที่ ${L.day} · ${L.minutes || 30} นาที`;

    wrap.appendChild(h('div.card', { style: { borderColor: 'var(--brand)', background: 'var(--brand-sf)' } },
      h('div.tiny.b', { style: { color: 'var(--brand)' } }, '🎯 จบบทนี้แล้วคุณจะ'),
      h('div.small', { style: { marginTop: '4px' } }, L.goalTh)));

    const body = h('div.card');
    (L.blocks || []).forEach((b) => body.appendChild(blockEl(b)));
    wrap.appendChild(body);

    const quiz = L.quiz || [];
    if (quiz.length) {
      wrap.appendChild(h('div.card', { style: { textAlign: 'center' } },
        h('div.b', `แบบฝึกท้ายบท ${quiz.length} ข้อ`),
        h('div.small.muted', { style: { margin: '6px 0 12px' } }, 'ทำเลยตอนที่เพิ่งอ่านจบ จะจำได้แน่นกว่ามาก'),
        h('button.btn.primary.block.lg', { onclick: () => startLessonQuiz(L) }, 'เริ่มทำแบบฝึก →')));
    } else {
      wrap.appendChild(h('button.btn.primary.block.lg', { onclick: () => completeLesson(L) }, 'เรียนจบบทนี้แล้ว ✓'));
    }
  });
};

function blockEl(b) {
  switch (b.type) {
    case 'text':
      return h('p.lb-text', { html: App.mdBold(b.th || '') });
    case 'example': {
      const el = h('div.lb-ex',
        h('button.btn.sm.ghost.lb-spk', { onclick: () => App.TTS.say(b.en, 'US'), title: 'ฟัง' }, '🔊'),
        h('div.en', b.en),
        b.th ? h('div.th', b.th) : null,
        b.note ? h('div.nt', { html: App.mdBold(b.note) }) : null);
      const btn = el.querySelector('button');
      btn.style.float = 'right';
      btn.style.marginLeft = '8px';
      return el;
    }
    case 'table': {
      const w = h('div.tbl-wrap');
      const t = h('table.lb-tbl');
      if (b.head) {
        const tr = h('tr');
        b.head.forEach((x) => tr.appendChild(h('th', x)));
        t.appendChild(h('thead', tr));
      }
      const tb = h('tbody');
      (b.rows || []).forEach((r) => {
        const tr = h('tr');
        r.forEach((c) => tr.appendChild(h('td', { html: App.mdBold(c) })));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      w.appendChild(t);
      return w;
    }
    case 'tip':
      return h('div.lb-tip', h('span', '💡'), h('div', { html: App.mdBold(b.th || '') }));
    case 'warn':
      return h('div.lb-warn', h('span', '⚠️'), h('div', { html: App.mdBold(b.th || '') }));
    default:
      return h('p.lb-text', { html: App.mdBold(b.th || b.text || '') });
  }
}

function startLessonQuiz(L) {
  const units = (L.quiz || []).map((it) => App.Data.toUnit(it, 'lesson:' + L.id)).filter(Boolean);
  if (!units.length) return completeLesson(L);
  App.Quiz.start({
    units,
    mode: 'practice',
    title: 'แบบฝึกท้ายบท',
    backTo: '#/lesson/' + L.id,
    onExit: () => App.go('#/lesson/' + L.id),
    onFinish: (res) => {
      App.Store.addAttempt({ mode: 'lesson', label: L.id, items: res.items, ms: res.ms });
      completeLesson(L, true);
      App.pendingResult = res;
      App.go('#/result');
    },
  });
}

function completeLesson(L, silent) {
  const st = App.Store.state();
  if (!st.progress.lessonsDone[L.id]) {
    st.progress.lessonsDone[L.id] = Date.now();
    App.Store.addXP(App.Store.XP.lesson);
    App.Store.save(true);
    if (!silent) {
      App.toast(`เรียนจบบท ${L.id} แล้ว +${App.Store.XP.lesson} XP`, 'ok');
      setTimeout(() => App.go('#/learn'), 700);
    }
  } else if (!silent) {
    App.go('#/learn');
  }
  // ทำเครื่องหมายภารกิจในแผนวันนี้ให้ด้วย
  App.Data.plan().then((p) => {
    const d = (p.days || []).find((x) => x.d === App.Store.planDay());
    if (!d) return;
    const t = (d.tasks || []).find((x) => x.type === 'lesson' && x.id === L.id);
    if (t) App.Store.markTaskDone(d.d, t);
  });
}

/* ---------- สรุปผลหลังทำชุด ---------- */

App.Views.result = function (root) {
  const res = App.pendingResult;
  if (!res) {
    root.appendChild(U.emptyState('📊', 'ไม่มีผลลัพธ์ที่จะแสดง', h('button.btn.primary', { onclick: () => App.go('#/') }, 'กลับหน้าแรก')));
    return;
  }
  const n = res.items.length;
  const c = res.items.filter((i) => i.ok).length;
  const p = App.pct(c, n);
  const good = p >= 75;

  root.appendChild(U.topbar('สรุปผล', res.title || ''));

  root.appendChild(h('div.card', { style: { textAlign: 'center' } },
    h('div', { style: { fontSize: '3rem' } }, p >= 90 ? '🏆' : p >= 75 ? '🎉' : p >= 50 ? '💪' : '📚'),
    h('div', { style: { fontSize: '2.6rem', fontWeight: '800', color: good ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)' } },
      `${c}/${n}`),
    h('div.b', `ถูก ${p}%`),
    h('div.small.muted', { style: { marginTop: '6px' } },
      `ใช้เวลา ${App.fmtDur(res.ms)} · เฉลี่ย ${App.fmtDur(res.ms / Math.max(1, n))} ต่อข้อ`)));

  // รายส่วน
  const parts = Object.keys(res.byPart || {});
  if (parts.length > 1) {
    root.appendChild(h('div.card',
      h('h2', 'แยกตามส่วน'),
      U.hbars(parts.map((k) => ({
        label: App.Score.PART_SHORT[k],
        pct: App.pct(res.byPart[k].correct, res.byPart[k].n),
        value: `${res.byPart[k].correct}/${res.byPart[k].n}`,
      })))));
  }

  // หัวข้อที่ควรกลับไปทวน
  const wrongTopics = {};
  res.items.filter((i) => !i.ok && i.topic).forEach((i) => {
    wrongTopics[i.topic] = (wrongTopics[i.topic] || { n: 0, th: i.topicTh || i.topic });
    wrongTopics[i.topic].n++;
  });
  const wt = Object.entries(wrongTopics).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
  if (wt.length) {
    root.appendChild(h('div.card',
      h('h2', 'หัวข้อที่ควรกลับไปทวน'),
      h('div.row.wrap', wt.map(([k, v]) => h('span.pill.bad', `${v.th} × ${v.n}`)))));
  }

  const wrongs = res.items.filter((i) => !i.ok);
  root.appendChild(h('div.row.mt',
    wrongs.length
      ? h('button.btn.grow', { onclick: () => reviewWrongNow(res) }, `🔧 ทำข้อที่ผิดซ้ำ (${wrongs.length})`)
      : null,
    h('button.btn.primary.grow', { onclick: () => { App.pendingResult = null; App.go('#/'); } }, 'กลับหน้าแรก')));
};

function reviewWrongNow(res) {
  const ids = res.items.filter((i) => !i.ok).map((i) => i.qid);
  const unitMap = new Map();
  (res.units || []).forEach((u) => u.qs.forEach((q) => unitMap.set(q.qid, u)));
  const units = App.uniq(ids.map((id) => unitMap.get(id)).filter(Boolean));
  if (!units.length) return App.toast('ไม่พบข้อที่จะทวน', 'bad');
  App.pendingResult = null;
  App.Quiz.start({
    units,
    mode: 'practice',
    title: 'ทำข้อที่ผิดซ้ำ',
    backTo: '#/',
    onExit: () => App.go('#/'),
    onFinish: (r) => {
      App.Store.addAttempt({ mode: 'review', items: r.items, ms: r.ms });
      App.pendingResult = r;
      App.go('#/result');
    },
  });
}

})();
