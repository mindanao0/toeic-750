เจอทุกข้อสอบ","goalTh":"จบบทนี้คุณจะออกเสียงอังกฤษได้ถูกในจุดที่คนไทยพลาดบ่อยที่สุด อ่านคำที่ไม่เคยเห็นได้ด้วยกฎการอ่าน 4 ข้อ และรู้จัก 50 คำที่โผล่ในข้อสอบ TOEIC แทบทุกชุด","minutes":30,"blocks":[{"type":"text","th":"ยินดีต้อนรับสู่วันแรกครับ วันนี้เรายังไม่แตะไวยากรณ์เลยแม้แต่นิดเดียว เพราะถ้าคุณอ่านคำไม่ออก ต่อให้ท่องกฎไวยากรณ์ได้ทั้งเล่มก็ทำข้อสอบไม่ได้อยู่ดี TOEIC มีทั้งส่วนฟัง (Listening) และส่วนอ่าน (Reading) ถ้าเสียงในหัวคุณผิดตั้งแต่แรก เวลาเจ้าของภาษาพูดคำเดียวกันคุณจะฟังไม่ออก และเวลาอ่านเงียบๆ สมองก็จะสะดุดทุกคำ วันนี้เราจะแก้ตรงนั้น"},{"type":"text","th":"เรื่องแรกที่ต้องทำใจก่อน ภาษาอังกฤษ ตัวสะกดกับเสียงไม่ตรงกัน ต่างจากภาษาไทยที่เห็นตัวไหนอ่านตัวนั้น คำว่า through อ่านว่า ธรู (มีแค่ 3 เสียง) ทั้งที่เขียน 7 ตัวอักษร ดังนั้นอย่าพยายามอ่านทีละตัวอักษร ให้จำเป็นชุดเสียงแทน วันนี้ผมจะให้ชุดเสียงที่ใช้ได้จริงกับคำส่วนใหญ่"},{"type":"text","th":"ส่วนที่ 1 เสียงพยัญชนะ 5 กลุ่มที่คนไทยออกผิดมากที่สุด เอาแค่ 5 กลุ่มนี้ให้ได้ก่อน คะแนนฟังจะขยับทันที เพราะ 5 กลุ่มนี้อยู่ในคำที่ใช้บ่อยเกือบทุกประโยค"},{"type":"table","head":["เสียง","วิธีทำปาก","คนไทยมักออกเป็น","คำตัวอย่าง"],"rows":[["th แบบไม่มีเสียงก้อง /θ/","แลบปลายลิ้นออกมาแตะระหว่างฟันบนกับฟันล่าง แล้วเป่าลมออก คอไม่สั่น","ส หรือ ท","think, three, thank, month, through"],["th แบบมีเสียงก้อง /ð/","ลิ้นตำแหน่งเดียวกัน แต่ให้คอสั่นด้วย ลองเอามือแตะลำคอต้องรู้สึกสั่น","ด หรือ ซ","the, this, that, they, other"],["r /r/","ม้วนปลายลิ้นขึ้นลอยกลางปาก ห้ามให้ลิ้นแตะเพดานปาก ไม่ต้องรัวลิ้นแบบ ร เรือ","ล เรือ หรือ ตัดทิ้ง","report, require, arrange, price"],["l /l/","เอาปลายลิ้นแตะเหงือกหลังฟันบนค้างไว้ แล้วปล่อยเสียงออกข้างลิ้น","น หรือ กลืนหาย","late, please, delivery, available"],["v /v/","ฟันบนกัดริมฝีปากล่างเบาๆ แล้วปล่อยลมให้คอสั่น","ว แหวน","very, invoice, delivery, service"],["w /w/","ห่อปากกลมเหมือนจะเป่าเทียน ฟันไม่แตะปาก","(ตัวนี้คนไทยออกได้)","we, will, week, within"],["ch /tʃ/","เอาลิ้นแตะเพดานแล้วดีดออก มีเสียง ท นำหน้าเบาๆ","ช ช้าง อย่างเดียว","chair, change, purchase, check"],["sh /ʃ/","ห่อปากเล็กน้อย ปล่อยลมยาวๆ ลิ้นไม่แตะอะไรเลย","ช ช้าง อย่างเดียว","share, shipping, station, machine"]]},{"type":"warn","th":"ระวังจุดที่คนไทยพลาดหนักที่สุด คือเสียงพยัญชนะท้ายคำ ภาษาไทยมีตัวสะกดที่ไม่ปล่อยลม เช่น มาก ออกเสียงแล้วปิดคอทันที แต่ภาษาอังกฤษต้องปล่อยลมออกท้ายคำเสมอ โดยเฉพาะเสียง s ท้ายคำ คนไทยมักอ่าน reports เป็น ริ-พอร์ท แล้วเสียง s หายไปเลย ผลคือเวลาฟังข้อสอบคุณจะแยกไม่ออกว่า report (เอกพจน์ หมายถึงชิ้นเดียว) กับ reports (พหูพจน์ หมายถึงหลายชิ้น) และนี่คือคำใบ้สำคัญที่สุดของ Part 5 เรื่องประธานกับกริยาต้องสอดคล้องกัน ฝึกออก reports, costs, months, meets ให้ได้ยินเสียง ส ลากท้ายจริงๆ"},{"type":"example","en":"The manager sends three reports every month.","th":"ผู้จัดการส่งรายงานสามฉบับทุกเดือน","note":"ประโยคเดียวมีเสียง s ท้ายคำถึง 3 ที่ คือ sends, reports และเสียง th ใน three กับ month ลองอ่านช้าๆ ให้ครบทุกเสียงก่อน แล้วค่อยเร่งความเร็ว"},{"type":"tip","th":"เคล็ดลับฝึกเสียง th แบบง่ายที่สุด ให้เอาลิ้นแลบออกมาให้เห็นปลายลิ้นในกระจกก่อน ตอนแรกจะรู้สึกตลกมาก แต่ถ้าไม่เห็นปลายลิ้นแปลว่าคุณยังออกเป็น ส หรือ ด อยู่ ฝึกวันละ 2 นาทีกับ 6 คำนี้พอ think, three, thank, the, this, that"},{"type":"text","th":"ส่วนที่ 2 กฎการอ่านพื้นฐาน 4 ข้อ กฎพวกนี้ใช้ได้กับคำอังกฤษราว 70 เปอร์เซ็นต์ พอจำได้แล้วคุณจะเดาเสียงคำที่ไม่เคยเห็นได้เอง ซึ่งสำคัญมากในห้องสอบเพราะเจอคำใหม่แน่นอน"},{"type":"text","th":"กฎข้อ 1 silent e (อีใบ้) คือ e ตัวท้ายคำที่ไม่ออกเสียง แต่มันมีหน้าที่ไปสั่งให้สระตัวหน้าอ่านเป็นชื่อตัวอักษรของมันเอง พูดง่ายๆ คือ a อ่านว่า เอ, i อ่านว่า ไอ, o อ่านว่า โอ, u อ่านว่า ยู"},{"type":"table","head":["ไม่มี e ท้าย","คำอ่าน + แปล","เติม e ท้าย","คำอ่าน + แปล"],"rows":[["hat","แฮท = หมวก","hate","เฮท = เกลียด"],["tap","แทพ = ก๊อกน้ำ","tape","เทพ = เทป"],["kit","คิท = ชุดอุปกรณ์","kite","ไคท์ = ว่าว"],["not","นอท = ไม่","note","โนท = บันทึก"],["cut","คัท = ตัด","cute","คิวท์ = น่ารัก"],["rat","แรท = หนู","rate","เรท = อัตรา"]]},{"type":"example","en":"Please note the new rate on the price list.","th":"กรุณาจดอัตราใหม่ที่อยู่ในรายการราคา","note":"note, rate, price ทั้งสามคำลงท้ายด้วย silent e ทั้งหมด ไม่ต้องอ่านเสียง เออ หรือ อี ท้ายคำเด็ดขาด"},{"type":"text","th":"กฎข้อ 2 สระคู่ ee และ ea ปกติอ่านว่า อี ลากยาว และ oo อ่านได้ 2 แบบคือ อู ยาว กับ อุ สั้น"},{"type":"table","head":["ชุดตัวอักษร","เสียง","คำตัวอย่าง (แปล)"],"rows":[["ee","อี ยาว /iː/","meeting (การประชุม), week (สัปดาห์), need (ต้องการ), employee (พนักงาน)"],["ea แบบปกติ","อี ยาว /iː/","please (กรุณา), team (ทีม), reach (ไปถึง), increase (เพิ่มขึ้น)"],["ea แบบพิเศษ","เอะ สั้น /e/","head (หัว), bread (ขนมปัง), ready (พร้อม), weather (อากาศ), breakfast (อาหารเช้า)"],["oo แบบยาว","อู /uː/","soon (เร็วๆ นี้), room (ห้อง), food (อาหาร), school (โรงเรียน)"],["oo แบบสั้น","อุ /ʊ/","book (หนังสือ), good (ดี), look (มอง), foot (เท้า)"]]},{"type":"warn","th":"ระวัง ea ไม่ได้อ่านว่า อี เสมอไป มีกลุ่มคำที่ใช้บ่อยมากซึ่งอ่านว่า เอะ สั้นๆ คือ head, ready, already, weather, healthy, breakfast, instead ถ้าคุณอ่าน ready เป็น รี้-ดี้ เวลาเจ้าของภาษาพูดว่า เร้ด-ดี้ คุณจะฟังไม่ออกทันที คำกลุ่มนี้มีไม่กี่คำ ท่องจำเป็นข้อยกเว้นไปเลยง่ายกว่าหากฎ"},{"type":"text","th":"กฎข้อ 3 ough คือชุดตัวอักษรที่โหดที่สุดในภาษาอังกฤษ เพราะอ่านได้หลายแบบมาก แต่ข่าวดีคือคำที่ใช้จริงมีไม่ถึง 10 คำ ท่องแค่ตารางนี้พอ"},{"type":"table","head":["คำ","คำอ่านไทย","IPA","แปล"],"rows":[["through","**ธรู**","/θruː/","ผ่าน, ตลอด"],["though","**โธ่ว**","/ðoʊ/","ถึงแม้ว่า"],["thought","**ธอท**","/θɔːt/","คิด (ช่องที่ 2 ของ think)"],["enough","อิ-**นัฟ**","/ɪˈnʌf/","เพียงพอ"],["tough","**ทัฟ**","/tʌf/","ยาก, ทนทาน"],["cough","**คอฟ**","/kɔːf/","ไอ (อาการ)"],["bought","**บอท**","/bɔːt/","ซื้อ (ช่องที่ 2 ของ buy)"],["brought","**บรอท**","/brɔːt/","นำมา (ช่องที่ 2 ของ bring)"]]},{"type":"text","th":"กฎข้อ 4 หางคำที่เจอบ่อยที่สุดในข้อสอบ TOEIC คือ -tion และ -sion ทั้งคู่อ่านว่า เชิ่น เหมือนกันหมด ไม่ว่าจะเห็น t หรือ s ก็ตาม เช่น information อ่าน อิน-เฟอร์-เม้-เชิ่น, decision อ่าน ดิ-ซิ้-เชิ่น ส่วน -ture อ่านว่า เชอร์ เช่น future อ่าน ฟิว-เชอร์"},{"type":"example","en":"The station will provide information about the new schedule.","th":"สถานีจะให้ข้อมูลเกี่ยวกับตารางเวลาใหม่","note":"station และ information ลงท้าย -tion เหมือนกัน อ่าน สเต๊-เชิ่น และ อิน-เฟอร์-เม้-เชิ่น เสียงท้ายเหมือนกันเป๊ะ"},{"type":"tip","th":"เคล็ดลับเรื่องการลงเสียงหนัก ภาษาอังกฤษทุกคำที่มีมากกว่า 1 พยางค์จะมีพยางค์เดียวที่ออกเสียงดังกว่าเพื่อน เรียกว่าพยางค์เน้นเสียง ในตารางคำศัพท์ข้างล่างผมทำตัวหนาไว้ให้แล้ว เช่น de-**li**-ve-ry ให้ดังที่ ลิ ถ้าลงเสียงผิดที่ เจ้าของภาษาจะฟังไม่ออกเลยแม้ว่าคุณจะออกเสียงพยัญชนะครบทุกตัวก็ตาม"},{"type":"text","th":"ส่วนที่ 3 50 คำที่เจอทุกข้อสอบ ผมเลือกจากคำที่โผล่ซ้ำในข้อสอบ TOEIC แทบทุกชุด ถ้าคุณอ่าน 50 คำนี้ออกและรู้ความหมาย คุณจะเข้าใจโครงเรื่องของบทความและบทสนทนาได้ทันทีแม้จะยังไม่รู้ศัพท์อื่นเลย ท่องแบบออกเสียงดังๆ อย่าท่องในใจ กลุ่มที่ 1 คำนามในที่ทำงาน"},{"type":"table","head":["คำ","IPA","คำอ่านไทย","แปล"],"rows":[["office","/ˈɔːfɪs/","**ออฟ**-ฟิศ","สำนักงาน, ที่ทำงาน"],["meeting","/ˈmiːtɪŋ/","**มี**-ทิ่ง","การประชุม"],["report","/rɪˈpɔːrt/","ริ-**พอร์ท**","รายงาน"],["manager","/ˈmænɪdʒər/","**แม้น**-นิ-เจอร์","ผู้จัดการ"],["employee","/ɪmˈplɔɪiː/","เอิม-**พลอย**-อี","ลูกจ้าง, พนักงาน"],["customer","/ˈkʌstəmər/","**คัส**-เทอ-เมอร์","ลูกค้า"],["company","/ˈkʌmpəni/","**คัม**-เพอ-นี","บริษัท"],["schedule","/ˈskedʒuːl/","**สเก็ด**-จูล","ตารางเวลา, กำหนดการ"],["invoice","/ˈɪnvɔɪs/","**อิน**-วอยซ์","ใบแจ้งหนี้"],["department","/dɪˈpɑːrtmənt/","ดิ-**พาร์ท**-เมิ่นท์","แผนก, ฝ่าย"]]},{"type":"text","th":"กลุ่มที่ 2 คำกริยา 10 ตัวที่เจอในโจทย์ Part 5 บ่อยที่สุด สังเกตว่าส่วนใหญ่ลงเสียงหนักที่พยางค์หลัง ไม่ใช่พยางค์แรก"},{"type":"table","head":["คำ","IPA","คำอ่านไทย","แปล"],"rows":[["provide","/prəˈvaɪd/","เพรอ-**ไวด์**","จัดหาให้, จัดเตรียมให้"],["require","/rɪˈkwaɪər/","ริ-**ไคว**-เออร์","กำหนดให้ต้องมี, ต้องการ"],["attend","/əˈtend/","เออ-**เท็นด์**","เข้าร่วม (ประชุม, งาน)"],["submit","/səbˈmɪt/","เซิบ-**มิท**","ยื่น, ส่ง (เอกสาร)"],["receive","/rɪˈsiːv/","ริ-**ซีฟว์**","ได้รับ"],["announce","/əˈnaʊns/","เออ-**นาวน์ซ**","ประกาศ"],["increase","/ɪnˈkriːs/","อิน-**ครีส**","เพิ่มขึ้น, ทำให้เพิ่ม"],["confirm","/kənˈfɜːrm/","เคิน-**เฟิร์ม**","ยืนยัน"],["complete","/kəmˈpliːt/","เคิม-**พลีท**","ทำให้เสร็จสมบูรณ์"],["arrange","/əˈreɪndʒ/","เออ-**เรนจ์**","จัดการ, นัดหมาย, จัดเตรียม"]]},{"type":"text","th":"กลุ่มที่ 3 คำคุณศัพท์ คือคำที่เอาไว้บอกลักษณะของสิ่งของหรือคน กลุ่มนี้จะใช้หนักมากในบทที่ 3"},{"type":"table","head":["คำ","IPA","คำอ่านไทย","แปล"],"rows":[["available","/əˈveɪləbl/","เออ-**เว**-เลอ-เบิ้ล","ว่าง, พร้อมใช้, หาซื้อได้"],["recent","/ˈriːsnt/","**รี**-เซิ่นท์","ล่าสุด, เมื่อไม่นานมานี้"],["annual","/ˈænjuəl/","**แอน**-นิว-เอิ่ล","ประจำปี, รายปี"],["additional","/əˈdɪʃənl/","เออ-**ดิช**-เชอ-เนิ่ล","เพิ่มเติม"],["successful","/səkˈsesfl/","เซิค-**เซส**-เฟิ่ล","ประสบความสำเร็จ"],["current","/ˈkɜːrənt/","**เค้อ**-เริ่นท์","ปัจจุบัน, ตอนนี้"],["entire","/ɪnˈtaɪər/","อิน-**ไท**-เออร์","ทั้งหมด, ทั้งสิ้น"],["previous","/ˈpriːviəs/","**พรี**-เวีย-เสิ่","ก่อนหน้า, ครั้งที่แล้ว"],["temporary","/ˈtempəreri/","**เท็ม**-เพอ-เร-รี","ชั่วคราว"],["efficient","/ɪˈfɪʃnt/","อิ-**ฟิช**-เชิ่นท์","มีประสิทธิภาพ"]]},{"type":"text","th":"กลุ่มที่ 4 คำเชื่อมและคำบุพบท กลุ่มนี้ตัวเล็กแต่พลังสูงมาก เพราะมันบอกความสัมพันธ์ระหว่างสองส่วนของประโยค ข้อสอบชอบเอามาออกเพราะคนอ่านผ่านๆ จะไม่ทันสังเกต"},{"type":"table","head":["คำ","IPA","คำอ่านไทย","แปล"],"rows":[["because","/bɪˈkɔːz/","บิ-**คอส**","เพราะว่า (ตามด้วยประโยคเต็ม)"],["although","/ɔːlˈðoʊ/","ออล-**โธ่ว**","แม้ว่า (ตามด้วยประโยคเต็ม)"],["however","/haʊˈevər/","ฮาว-**เอ๊ฟ**-เวอร์","อย่างไรก็ตาม"],["therefore","/ˈðerfɔːr/","**แธร์**-ฟอร์","ดังนั้น, เพราะฉะนั้น"],["during","/ˈdʊrɪŋ/","**ดู**-ริ่ง","ในระหว่างช่วงเวลา (ตามด้วยคำนาม)"],["between","/bɪˈtwiːn/","บิ-**ทวีน**","ระหว่างสองสิ่ง"],["through","/θruː/","**ธรู**","ผ่าน, ตลอดช่วง"],["until","/ənˈtɪl/","เอิน-**ทิล**","จนกระทั่ง, จนถึง"],["within","/wɪˈðɪn/","วิ-**ธิน**","ภายใน (เวลาหรือขอบเขต)"],["instead","/ɪnˈsted/","อิน-**สเต็ด**","แทนที่จะ, แทน"]]},{"type":"text","th":"กลุ่มที่ 5 คำที่โผล่ในคำสั่งและในโจทย์ ถ้าคุณอ่านกลุ่มนี้ไม่ออก คุณจะไม่รู้ด้วยซ้ำว่าโจทย์ถามอะไร ให้ความสำคัญกับกลุ่มนี้เท่าๆ กับกลุ่มอื่น"},{"type":"table","head":["คำ","IPA","คำอ่านไทย","แปล"],"rows":[["according","/əˈkɔːrdɪŋ/","เออ-**คอร์**-ดิ่ง","ตามที่ (ใช้คู่กับ to เสมอ)"],["following","/ˈfɑːloʊɪŋ/","**ฟา**-โล-อิ่ง","ต่อไปนี้, ตามหลัง"],["approximately","/əˈprɑːksɪmətli/","เออ-**พร็อค**-ซิ-เมิท-ลี","ประมาณ, ราวๆ"],["immediately","/ɪˈmiːdiətli/","อิ-**มี**-เดียท-ลี","ทันที"],["currently","/ˈkɜːrəntli/","**เค้อ**-เริ่นท์-ลี","ในขณะนี้, ตอนนี้"],["regarding","/rɪˈɡɑːrdɪŋ/","ริ-**การ์**-ดิ่ง","เกี่ยวกับ"],["request","/rɪˈkwest/","ริ-**เคว็สท์**","คำขอ, ร้องขอ"],["deadline","/ˈdedlaɪn/","**เด็ด**-ไลน์","กำหนดส่ง, เส้นตาย"],["purchase","/ˈpɜːrtʃəs/","**เพอร์**-เชิส","ซื้อ, การซื้อ"],["delivery","/dɪˈlɪvəri/","ดิ-**ลิฟ**-เวอ-รี","การจัดส่ง"]]},{"type":"example","en":"According to the manager, the delivery will arrive within two days.","th":"ตามที่ผู้จัดการบอก การจัดส่งจะมาถึงภายในสองวัน","note":"ประโยคเดียวใช้คำจากตารางถึง 4 คำ คือ according, manager, delivery, within นี่คือเหตุผลที่ 50 คำนี้คุ้มค่าที่สุด"},{"type":"warn","th":"ระวังกับดักคำอ่านไทย คำอ่านไทยในตารางเป็นแค่ไม้ค้ำยันช่วงแรกเท่านั้น อย่ายึดติด เพราะภาษาไทยมีวรรณยุกต์ 5 เสียงแต่ภาษาอังกฤษไม่มีวรรณยุกต์เลย ถ้าคุณอ่าน report เป็น ริ-พ้อร์ท ด้วยเสียงตรีจัดๆ แบบไทย เจ้าของภาษาจะงง สิ่งที่ภาษาอังกฤษใช้แทนวรรณยุกต์คือความดังและความยาวของพยางค์ ให้ลากพยางค์ตัวหนาให้ยาวและดังกว่าพยางค์อื่น เท่านี้พอ อย่าใส่วรรณยุกต์"},{"type":"warn","th":"ระวังอย่าอ่านตัวอักษรทุกตัว คนไทยที่เพิ่งเริ่มมักอ่าน schedule เป็น สะ-เช-ดู-เล่ หรืออ่าน business เป็น บิ-สิ-เนส-ส์ ภาษาอังกฤษมีตัวอักษรที่ไม่ออกเสียงเยอะมาก เช่น business อ่านแค่ 2 พยางค์ คือ บิส-เนิส (ตัว i ตัวกลางหายไปเลย) และ Wednesday อ่านว่า เว็นส์-เดย์ ไม่ใช่ เว็ด-เนส-เดย์ วิธีแก้คือ ทุกครั้งที่เจอคำใหม่ ให้เช็ก IPA แล้วนับจำนวนพยางค์จาก IPA ไม่ใช่จากตัวสะกด"},{"type":"tip","th":"แผนฝึกวันนี้ให้ครบ 30 นาที แบ่งเป็น 10 นาทีแรกฝึก 8 เสียงพยัญชนะหน้ากระจก 10 นาทีถัดมาอ่านออกเสียง 50 คำดังๆ รอบละ 1 นาที ทำ 3 รอบ อีก 5 นาทีปิดคำแปลแล้วทายความหมาย และ 5 นาทีสุดท้ายทำแ มาต่อตรงๆ ไม่ได้ และความหมายก็ไม่เข้า","2":"happen แปลว่าเกิดขึ้น เป็นกริยาที่ไม่รับกรรม จะพูดว่า happen the training ไม่ได้ ต้องพูดว่า the training happens","3":"seem แปลว่าดูเหมือนว่า ต้องตามด้วยคำบอกลักษณะหรือ to เช่น seem tired จะเอาคำนามมาต่อตรงๆ ไม่ได้"},"point":"กริยาในภาษาอังกฤษแบ่งเป็นสองพวก พวกที่รับกรรมได้ (เช่น attend, submit, receive) กับพวกที่รับกรรมไม่ได้ (เช่น happen, arrive, belong) ถ้าหลังช่องว่างมีคำนามลอยๆ ให้เลือกพวกแรก","trick":"เห็นคำนามวางติดหลังช่องว่างโดยไม่มีคำเชื่อมคั่น ให้ตัดกริยาที่ต้องมี to หรือ at ตามหลังทิ้งทันที"},"vocab":[{"w":"attend","ipa":"/əˈtend/","th":"เออ-**เท็นด์**","mean":"เข้าร่วม (ประชุม อบรม งาน)","pos":"v."},{"w":"employee","ipa":"/ɪmˈplɔɪiː/","th":"เอิม-**พลอย**-อี","mean":"ลูกจ้าง พนักงาน","pos":"n."}]},{"id":"L01q-003","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา","stem":"The factory is closed _____ the national holiday.","choices":["although","however","during","because"],"answer":2,"th":{"stem":"โรงงานปิด_____วันหยุดประจำชาติ","choices":["แม้ว่า","อย่างไรก็ตาม","ในระหว่างช่วง","เพราะว่า"]},"explain":{"why":"หลังช่องว่างคือ the national holiday ซึ่งเป็นแค่คำนาม ไม่ใช่ประโยคเต็ม (ไม่มีกริยา) คำที่วางหน้าคำนามเวลาเพื่อบอกช่วงเวลาได้คือ during เท่านั้น","wrong":{"0":"although แปลว่าแม้ว่า เป็นคำเชื่อมประโยค ต้องตามด้วยประโยคเต็มที่มีทั้งประธานและกริยา เช่น although the factory is closed","1":"however แปลว่าอย่างไรก็ตาม เป็นคำวิเศษณ์เชื่อมความ ต้องอยู่ต้นประโยคใหม่และมีเครื่องหมายวรรคตอนคั่น วางกลางประโยคแบบนี้ไม่ได้","3":"because แปลว่าเพราะว่า ต้องตามด้วยประโยคเต็มเช่นกัน ถ้าจะใช้กับคำนามต้องเขียนว่า because of"},"point":"ดูสิ่งที่อยู่หลังช่องว่างเป็นอันดับแรก ถ้าเป็นคำนามเปล่าๆ ให้เลือกคำบุพบท ถ้าเป็นประโยคเต็ม (มีประธาน + กริยา) ให้เลือกคำเชื่อมประโยค","trick":"จำคู่แฝดไว้ during กับ because of ใช้กับคำนาม ส่วน while กับ because ใช้กับประโยคเต็ม"},"vocab":[{"w":"during","ipa":"/ˈdʊrɪŋ/","th":"**ดู**-ริ่ง","mean":"ในระหว่างช่วงเวลาหนึ่ง","pos":"prep."},{"w":"holiday","ipa":"/ˈhɑːlədeɪ/ e":"table","head":["ประโยคเต็ม","S ใคร","V ทำอะไร","O กับอะไร","คำแปล"],"rows":[["The company hired ten employees.","The company","hired","ten employees","บริษัทจ้างพนักงานสิบคน"],["Our team finished the project.","Our team","finished","the project","ทีมของเราทำโครงการเสร็จ"],["Ms. Lee sent an invoice.","Ms. Lee","sent","an invoice","คุณลีส่งใบแจ้งหนี้"],["The customer requested a refund.","The customer","requested","a refund","ลูกค้าขอเงินคืน"],["The train arrived.","The train","arrived","(ไม่มีกรรม)","รถไฟมาถึงแล้ว"]]},{"type":"text","th":"สังเกตประโยคสุดท้ายในตาราง The train arrived มีแค่ S กับ V ไม่มี O ก็ถือว่าเป็นประโยคสมบูรณ์แล้ว เพราะกริยาบางตัวไม่ต้องการกรรม เช่น arrive (มาถึง) go (ไป) happen (เกิดขึ้น) แต่สิ่งที่ขาดไม่ได้เด็ดขาดคือ S กับ V ต้องมีครบทั้งคู่เสมอ"},{"type":"warn","th":"ระวังจุดที่คนไทยพลาดเป็นอันดับหนึ่ง ภาษาไทยพูดว่า เธอสวย ได้เลย ไม่ต้องมีคำกริยา แต่ภาษาอังกฤษห้ามมีประโยคที่ไม่มีกริยาเด็ดขาด ถ้าเขียนว่า She beautiful ผิดทันที ต้องเขียนว่า She is beautiful เช่นเดียวกับ The office closed today ที่ต้องเป็น The office is closed today และ He a manager ที่ต้องเป็น He is a manager ทุกครั้งที่คุณเขียนหรือเลือกคำตอบ ให้ถามตัวเองว่ากริยาอยู่ไหน ถ้าหาไม่เจอแปลว่าประโยคยังไม่สมบูรณ์"},{"type":"text","th":"ตัวเชื่อมที่มาเติมเต็มช่องว่างตรงนั้นเรียกว่า be-verb (กริยาช่วยกลุ่ม be ซึ่งแปลว่า เป็น อยู่ คือ) มันคือกริยาที่คนไทยลืมใส่บ่อยที่สุด เพราะภาษาไทยไม่มีคำนี้ให้แปล be-verb มี 5 รูปที่ต้องจำ"},{"type":"table","head":["รูป","ใช้กับประธาน","เวลา","ตัวอย่าง","คำแปล"],"rows":[["am","I เท่านั้น","ปัจจุบัน","I am ready.","ฉันพร้อมแล้ว"],["is","he, she, it, คนเดียว สิ่งเดียว","ปัจจุบัน","The office is open.","สำนักงานเปิดอยู่"],["are","you, we, they, ของหลายชิ้น","ปัจจุบัน","The reports are ready.","รายงานพร้อมแล้ว"],["was","I, he, she, it, คนเดียว สิ่งเดียว","อดีต","The meeting was long.","การประชุมยาวนาน"],["were","you, we, they, ของหลายชิ้น","อดีต","The rooms were clean.","ห้องพวกนั้นสะอาด"]]},{"type":"text","th":"เมื่อไหร่ที่ต้องใช้ be-verb ให้จำ 3 กรณีนี้ หนึ่ง เมื่อจะบอกว่าใครเป็นอะไร เช่น He is a manager สอง เมื่อจะบอกลักษณะ เช่น The room is clean สาม เมื่อจะบอกว่าอยู่ที่ไหน เช่น The files are in the cabinet สรุปสั้นๆ ถ้าประโยคไม่มีการกระทำใดๆ มีแต่การบอกว่าเป็นอะไร เป็นยังไง หรืออยู่ที่ไหน ให้ใช้ be-verb"},{"type":"example","en":"Mr. Suzuki is the new sales director.","th":"คุณซูซูกิเป็นผู้อำนวยการฝ่ายขายคนใหม่","note":"ไม่มีการกระทำเลยในประโยคนี้ มีแต่การบอกว่าเขาเป็นอะไร จึงต้องใช้ is มาทำหน้าที่กริยา"},{"type":"example","en":"The samples were in the warehouse last week.","th":"ตัวอย่างสินค้าอยู่ในโกดังเมื่อสัปดาห์ที่แล้ว","note":"ประธาน samples เป็นของหลายชิ้น และ last week บอกว่าเป็นอดีต จึงต้องใช้ were ไม่ใช่ was"},{"type":"warn","th":"ระวังอย่าใส่ be-verb ซ้อนกับกริยาแท้ นี่คือความผิดพลาดอันดับสองของคนไทย เช่นเขียนว่า I am go to the office ผิด เพราะประโยคนี้มีกริยาสองตัวคือ am กับ go ที่ถูกคือ I go to the office (ฉันไปที่ทำงาน) หรือถ้าต้องการบอกว่ากำลังไป ต้องเป็น I am going to the office โดยเปลี่ยน go เป็น going กฎง่ายๆ คือ หนึ่งประโยคมีกริยาแท้ได้ตัวเดียว ถ้าจะใช้ be คู่กับกริยาอื่น กริยาตัวนั้นต้องเปลี่ยนรูปเป็น -ing หรือเป็นช่องที่ 3 เสมอ"},{"type":"table","head":["เขียนผิดแบบไทย","ทำไมผิด","เขียนถูก","คำแปล"],"rows":[["She very busy.","ไม่มีกริยาเลย","She is very busy.","เธอยุ่งมาก"],["He am the manager.","am ใช้กับ I เท่านั้น","He is the manager.","เขาเป็นผู้จัดการ"],["We is ready.","We เป็นพหูพจน์ ต้องใช้ are","We are ready.","พวกเราพร้อมแล้ว"],["I am work here.","มีกริยาสองตัวซ้อนกัน","I work here.","ฉันทำงานที่นี่"],["The report was send.","หลัง was ต้องใช้ช่องที่ 3","The report was sent.","รายงานถูกส่งไปแล้ว"]]},{"type":"text","th":"ทีนี้มาถึงทักษะหลักของ Part 5 คือการหาประธานและกริยาในประโยคยาว ข้อสอบจริงจะไม่ให้ประโยคสั้นแบบ The manager reviewed the report แต่จะยัดส่วนขยายเข้ามาเต็มไปหมดเพื่อให้คุณสับสน วิธีแก้คือกวาดส่วนขยายทิ้งก่อน แล้วโครงกระดูกจะโผล่ออกมาเอง"},{"type":"text","th":"ส่วนขยายที่ต้องกวาดทิ้งมีสองแบบหลัก แบบแรกคือวลีบุพบท (กลุ่มคำที่ขึ้นต้นด้วย of, in, on, for, with, at, from, near, between) แบบที่สองคือประโยคย่อยที่ขึ้นต้นด้วย who, which, that ทั้งสองแบบนี้ไม่มีทางเป็นประธานของประโยคหลักได้เลย ให้ใช้ดินสอวงเล็บครอบไว้แล้วมองข้ามไป"},{"type":"table","head":["ประโยคจากข้อสอบ","กวาดส่วนขยายทิ้ง","เหลือโครงกระดูก","คำแปล"],"rows":[["The report on the new products is ready.","(on the new products)","The report is ready.","รายงานเรื่องสินค้าใหม่พร้อมแล้ว"],["The boxes near the loading dock are heavy.","(near the loading dock)","The boxes are heavy.","กล่องที่อยู่ใกล้ท่าขนของหนักมาก"],["A list of all the employees was posted.","(of all the employees)","A list was posted.","รายชื่อพนักงานทั้งหมดถูกติดประกาศไว้"],["The manager who hired us is leaving.","(who hired us)","The manager is leaving.","ผู้จัดการที่จ้างเรากำลังจะลาออก"],["Copies of the contract for the client arrive tomorrow.","(of the contract) (for the client)","Copies arrive tomorrow.","สำเนาสัญญาสำหรับลูกค้าจะมาถึงพรุ่งนี้"]]},{"type":"warn","th":"ระวังกับดักคลาสสิกของ Part 5 ประธานไม่ใช่คำนามที่อยู่ติดกับช่องว่างเสมอไป ดูประโยค The boxes near the loading dock _____ heavy ถ้าคุณมองแค่คำที่อยู่ติดช่องว่างคือ dock ซึ่งเป็นเอกพจน์ คุณจะเลือก is แล้วผิดทันที ประธานจริงคือ boxes ซึ่งเป็นพหูพจน์ ต้องใช้ are ข้อสอบตั้งใจวางคำนามเอกพจน์ไว้ติดช่องว่างเพื่อดักคนที่อ่านผ่านๆ วิธีป้องกันคือกวาดวลีบุพบททิ้งก่อนเสมอ อย่าเพิ่งดูตัวเลือก"},{"type":"example","en":"The list of new customers from the Bangkok branch is on your desk.","th":"รายชื่อลูกค้าใหม่จากสาขากรุงเทพอยู่บนโต๊ะคุณ","note":"กวาด (of new customers) และ (from the Bangkok branch) ทิ้ง เหลือ The list is on your desk ประธานคือ list ซึ่งเป็นสิ่งเดียว จึงใช้ is แม้ว่าคำที่อยู่ติดกันจะเป็น branch ก็ตาม"},{"type":"tip","th":"เคล็ดลับ 3 ขั้นสำหรับทุกข้อของ Part 5 ขั้นที่หนึ่ง กวาดวลีบุพบทและประโยคย่อยทิ้ง ขั้นที่สอง ชี้ประธานให้ได้ว่าเป็นคนเดียวสิ่งเดียวหรือหลายสิ่ง ขั้นที่สาม มองหาคำบอกเวลาในประโยค เช่น yesterday, last week, now, tomorrow เพื่อรู้ว่าใช้กริยารูปอดีตหรือปัจจุบัน สามขั้นนี้ใช้เวลารวมไม่เกิน 8 วินาที แล้วคุณจะตัดตัวเลือกทิ้งได้ 2-3 ตัวทันที"},{"type":"text","th":"อีกเรื่องที่ต้องเข้าใจตั้งแต่วันนี้ กริยาในภาษาอังกฤษเปลี่ยนรูปตามประธานและตามเวลา ภาษาไทยไม่มีเรื่องนี้เลย เราพูดว่า เขาไป กับ พวกเขาไป ใช้คำว่าไปเหมือนกัน แต่อังกฤษต้องเป็น He goes กับ They go กฎง่ายที่สุดคือ ถ้าประธานเป็นคนเดียวสิ่งเดียวและเป็นปัจจุบัน กริยาต้องเติม s เสมอ"},{"type":"table","head":["ประธาน","กริยาปัจจุบัน","ตัวอย่าง","คำแปล"],"rows":[["I / You / We / They / พหูพจน์","รูปเปล่า ไม่เติม s","The managers work late.","บรรดาผู้จัดการทำงานดึก"],["He / She / It / เอกพจน์","เติม s หรือ es","The manager works late.","ผู้จัดการทำงานดึก"],["ทุกประธาน (อดีต)","เติม ed หรือใช้ช่องที่ 2","The manager worked late.","ผู้จัดการทำงานดึก (เมื่อวาน)"]]},{"type":"tip","th":"จุดที่คนไทยได้เปรียบคือ ภาษาไทยกับอังกฤษเรียง ประธาน กริยา กรรม เหมือนกัน ต่างจากภาษาญี่ปุ่นหรือเกาหลีที่เอากริยาไว้ท้ายสุด ดังนั้นเรื่องลำดับคำคุณแทบไม่ต้องฝึกเลย สิ่งที่ต้องฝึกจริงๆ มีแค่สองอย่างคือ อย่าลืมใส่กริยา และ อย่าลืมผันกริยาตามประธาน ทำสองอย่างนี้ให้ติดเป็นนิสัย คะแนน Part 5 จะขึ้นเองโดยที่ยังไม่ต้องท่องศัพท์เพิ่มเลย"},{"type":"text","th":"แผนฝึกวันนี้ ให้เอาตารางแยกส่วนประโยคด้านบนมาทำซ้ำกับประโยคตัวอย่างในบทที่ 1 ทุกประโยค ชี้ให้ได้ว่าอะไรคือ S อะไรคือ V ใช้เวลาประมาณ 10 นาที แล้วทำแบบฝึกหัด 8 ข้อข้างล่าง พรุ่งนี้เราจะเรียนเรื่องชนิดของคำ ซึ่งจะทำให้คุณตอบข้อสอบบางประเภทได้โดยไม่ต้องรู้ความหมายของคำเลยด้วยซ้ำ"}],"quiz":[{"id":"L02q-001","part":5,"tier":"easy","topic":"subject-verb-agreement","topicTh":"ประธานกับกริยาต้องสอดคล้องกัน","stem":"The report on the new products _____ ready for the meeting.","choices":["is","are","be","being"],"answer":0,"th":{"stem":"รายงานเกี่ยวกับสินค้าใหม่_____พร้อมสำหรับการประชุมแล้ว","choices":["เป็น อยู่ คือ (เอกพจน์ ปัจจุบัน)","เป็น อยู่ คือ (พหูพจน์ ปัจจุบัน)","รูปพื้นฐานของ be","รูป -ing ของ be"]},"explain":{"why":"ให้กวาดวลีบุพบท on the new products ทิ้งก่อน จะเหลือ The report _____ ready ประธานจริงคือ report ซึ่งเป็นสิ่งเดียว และประโยคเป็นปัจจุบัน จึงใช้ is","wrong":{"1":"are ใช้กับประธานที่เป็นของหลายชิ้น แต่ประธานจริงคือ report ตัวเดียว ไม่ใช่ products ที่อยู่ในวลีขยาย","2":"be เป็นรูปพื้นฐาน ใช้เป็นกริยาแท้ของประโยคไม่ได้ ต้องมี will, must, can หรือ to นำหน้า","3":"being เป็นรูป -ing ใช้ตามลำพังเป็นกริยาแท้ไม่ได้ ต้องมี is, are, was, were นำหน้า"},"point":"คำนามที่อยู่ติดช่องว่างมักไม่ใช่ประธานจริง ให้ตัดกลุ่มคำที่ขึ้นต้นด้วย of, on, in, for, with ทิ้งก่อนเสมอ","trick":"เห็นคำบุพบทหลังคำนามตัวแรก ให้เอานิ้วปิดตั้งแต่คำบุพบทถึงหน้าช่องว่าง แล้วอ่านใหม่ คำตอบจะโผล่ทันที"},"vocab":[{"w":"report","ipa":"/rɪˈpɔːrt/","th":"ริ-**พอร์ท**","mean":"รายงาน","pos":"n."}]},{"id":"L02q-002","part":5,"tier":"easy","topic":"subject-verb-agreement","topicTh":"เลือก be-verb ให้ตรงกับประธานและเวลา","stem":"My colleagues _____ in the conference room right now.","choices":["is","are","am","was"],"answer":1,"th":{"stem":"เพื่อนร่วมงานของฉัน_____ในห้องประชุมตอนนี้","choices":["อยู่ (เอกพจน์ ปัจจุบัน)","อยู่ (พหูพจน์ ปัจจุบัน)","อยู่ (ใช้กับ I เท่านั้น)","อยู่ (เอกพจน์ อดีต)"]},"explain":{"why":"ประธานคือ My colleagues มี s ท้ายคำแปลว่าเพื่อนร่วมงานหลายคน จึงเป็นพหูพจน์ และคำว่า right now บอกว่าเป็นตอนนี้ จึงต้องใช้ are","wrong":{"0":"is ใช้กับประธานคนเดียวสิ่งเดียว แต่ colleagues มีหลายคน","2":"am ใช้ได้กับประธาน I เท่านั้น ห้ามใช้กับประธานอื่นเด็ดขาด","3":"was เป็นรูปอดีตและใช้กับเอกพจน์ ผิดสองชั้น ทั้งเรื่องจำนวนและขัดกับคำว่า right now ที่แปลว่าตอนนี้"},"point":"ดูสองอย่างพร้อมกันเสมอ หนึ่งคือประธานเป็นเอกพจน์หรือพหูพจน์ สองคือคำบอกเวลาในประโยคชี้ไปที่ปัจจุบันหรืออดีต","trick":"เห็น s ท้ายคำนามประธาน ให้ตัด is, was, am ทิ้งทันทีเหลือแค่ are กับ were แล้วค่อยดูคำบอกเวลา"},"vocab":[{"w":"colleague","ipa":"/ˈkɑːliːɡ/","th":"**คอ**-ลีก","mean":"เพื่อนร่วมงาน","pos":"n."}]},{"id":"L02q-003","part":5,"tier":"easy","topic":"tense-past-simple","topicTh":"อดีตกาลธรรมดา","stem":"The delivery truck _____ at the warehouse an hour ago.","choices":["arrive","arrives","arrived","arriving"],"answer":2,"th":{"stem":"รถส่งของ_____ที่โกดังเมื่อชั่วโมงที่แล้ว","choices":["มาถึง (รูปพื้นฐาน)","มาถึง (ปัจจุบัน เอกพจน์)","มาถึง (อดีต)","กำลังมาถึง"]},"explain":{"why":"ท้ายประโยคมีคำว่า an hour ago แปลว่าเมื่อชั่วโมงที่แล้ว ซึ่งเป็นอดีตจบไปแล้ว กริยาจึงต้องเป็นรูปอดีตคือ arrived","wrong":{"0":"arrive เป็นรูปพื้นฐาน ใช้กับปัจจุบันและประธานพหูพจน์ แต่ประธานคือ truck เอกพจน์ และเวลาเป็นอดีต ผิดทั้งสองอย่าง","1":"arrives เป็นปัจจุบัน ใช้กับสิ่งที่ทำเป็นประจำ ขัดกับคำว่า ago ที่บอกว่าจบไปแล้ว","3":"arriving เป็นรูป -ing ใช้ตามลำพังเป็นกริยาแท้ไม่ได้ ต้องมี is หรือ was นำหน้า"},"point":"คำบอกเวลาอดีตที่ต้องจำ ago, yesterday, last week, last month, in 2019, this morning เห็นเมื่อไหร่ให้ใช้กริยารูปอดีตทันที","trick":"อ่านท้ายประโยคก่อนดูตัวเลือก คำบอกเวลามักซ่อนอยู่ท้ายประโยค เจอแล้วตัดได้ 3 ตัวใน 5 วินาที"},"vocab":[{"w":"warehouse","ipa":"/ˈwerhaʊs/","th":"**แวร์**-เฮาส์","mean":"โกดัง คลังสินค้า","pos":"n."}]},{"id":"L02q-004","part":5,"tier":"easy","topic":"subject-verb-agreement","topicTh":"ประธานเอกพจน์ต้องเติม s ที่กริยา","stem":"Every morning the receptionist _____ the office door at eight.","choices":["open","opening","are opening","opens"],"answer":3,"th":{"stem":"ทุกเช้าพนักงานต้อนรับ_____ประตูสำนักงานตอนแปดโมง","choices":["เปิด (รูปพื้นฐาน)","กำลังเปิด (รูป -ing เปล่าๆ)","กำลังเปิด (พหูพจน์)","เปิด (เอกพจน์ ปัจจุบัน)"]},"explain":{"why":"Every morning แปลว่าทุกเช้า เป็นสิ่งที่ทำเป็นประจำ จึงใช้ปัจจุบันกาลธรรมดา และประธาน the receptionist เป็นคนเดียว กริยาจึงต้องเติม s เป็น opens","wrong":{"0":"open เป็นรูปเปล่า ใช้กับประธานพหูพจน์หรือ I และ you แต่ประธานนี้เป็นคนเดียว จึงต้องเติม s","1":"opening เป็นรูป -ing ยืนเดี่ยวเป็นกริยาแท้ไม่ได้ ต้องมี is นำหน้า","2":"are opening ผิดที่ตัว are เพราะ are ใช้กับประธานหลายคน แต่ receptionist มีคนเดียว และ Every morning ควรใช้รูปธรรมดามากกว่ารูปกำลังทำ"},"point":"ประธานเอกพจน์บุรุษที่สาม (he, she, it หรือคำนามคนเดียวสิ่งเดียว) ในปัจจุบันกาล กริยาต้องเติม s เสมอ ไม่มีข้อยกเว้น","trick":"เจอ every day, every morning, usually, always แปลว่าเป็นเหตุการณ์ประจำ ให้ใช้ปัจจุบันกาลธรรมดา แล้วเช็กต่อว่าประธานคนเดียวหรือหลายคน"},"vocab":[{"w":"receptionist","ipa":"/rɪˈsepʃənɪst/","th":"ริ-**เซ็พ**-เชอ-นิสท์","mean":"พนักงานต้อนรับ","pos":"n."}]},{"id":"L02q-005","part":5,"tier":"easy","topic":"tense-past-continuous","topicTh":"be-verb รูปอดีตกับประธานพหูพจน์","stem":"Mr. Kim and his assistant _____ working on the budget yesterday.","choices":["were","was","is","are"],"answer":0,"th":{"stem":"คุณคิมกับผู้ช่วยของเขา_____ทำงานเรื่องงบประมาณอยู่เมื่อวานนี้","choices":["กำลัง (พหูพจน์ อดีต)","กำลัง (เอกพจน์ อดีต)","กำลัง (เอกพจน์ ปัจจุบัน)","กำลัง (พหูพจน์ ปัจจุบัน)"]},"explain":{"why":"ประธานคือ Mr. Kim and his assistant มีคำว่า and เชื่อมคนสองคน จึงนับเป็นพหูพจน์ และ yesterday บอกว่าเป็นอดีต จึงต้องใช้ were","wrong":{"1":"was เป็นรูปอดีตก็จริง แต่ใช้กับประธานคนเดียวเท่านั้น ประธานนี้มีสองคน","2":"is ผิดทั้งจำนวนและเวลา เพราะเป็นเอกพจน์และเป็นปัจจุบัน ขัดกับ yesterday","3":"are ถูกเรื่องจำนวนแต่ผิดเรื่องเวลา เพราะเป็นปัจจุบัน ส่วน yesterday บอกว่าเป็นอดีต"},"point":"คำนามสองตัวเชื่อมด้วย and ให้นับเป็นพหูพจน์เสมอ แม้แต่ละตัวจะเป็นคนเดียวก็ตาม","trick":"มองหาคำว่า and ระหว่างประธานสองตัว เจอแล้วตัด is กับ was ทิ้งได้ทันที"},"vocab":[{"w":"assistant","ipa":"/əˈsɪstənt/","th":"เออ-**ซิส**-เทิ่นท์","mean":"ผู้ช่วย","pos":"n."},{"w":"budget","ipa":"/ˈbʌdʒɪt/","th":"**บัด**-เจิท","mean":"งบประมาณ","pos":"n."}]},{"id":"L02q-006","part":5,"tier":"easy","topic":"subject-verb-agreement","topicTh":"ประโยคต้องมีกริยาแท้เสมอ","stem":"The new office building _____ very modern.","choices":["look","looks","looking","to look"],"answer":1,"th":{"stem":"อาคารสำนักงานหลังใหม่_____ทันสมัยมาก","choices":["ดู (รูปพื้นฐาน)","ดู (เอกพจน์ ปัจจุบัน)","กำลังดู","ที่จะดู"]},"explain":{"why":"ประโยคนี้ยังไม่มีกริยาเลย ช่องว่างจึงต้องเป็นกริยาแท้ ประธาน The new office building เป็นสิ่งเดียวและเป็นปัจจุบัน จึงต้องใช้ looks ที่เติม s แล้ว","wrong":{"0":"look รูปเปล่าใช้กับประธานพหูพจน์ แต่ประธานนี้เป็นอาคารหลังเดียว จึงต้องเติม s","2":"looking เป็นรูป -ing ใช้เป็นกริยาแท้ตามลำพังไม่ได้ ต้องมี is นำหน้าเป็น is looking","3":"to look เป็นรูป to + กริยา ทำหน้าที่กริยาแท้ของประโยคไม่ได้เลย"},"point":"กริยา look, seem, sound, feel ใช้บอกลักษณะได้เหมือน be-verb และต้องผันตามประธานเช่นเดียวกัน","trick":"อ่านประโยคแล้วหากริยาให้เจอก่อน ถ้าหาไม่เจอเลย แปลว่าช่องว่างคือกริยาแท้ ให้ตัดรูป -ing และรูป to ทิ้งทันที"},"vocab":[{"w":"modern","ipa":"/ˈmɑːdərn/","th":"**มา**-เดิร์น","mean":"ทันสมัย","pos":"adj."}]},{"id":"L02q-007","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล","stem":"Our team _____ the presentation next week.","choices":["finished","is finish","will finish","finishing"],"answer":2,"th":{"stem":"ทีมของเรา_____งานนำเสนอในสัปดาห์หน้า","choices":["ทำเสร็จ (อดีต)","รูปที่ผิดไวยากรณ์","จะทำเสร็จ (อนาคต)","กำลังทำเสร็จ"]},"explain":{"why":"next week แปลว่าสัปดาห์หน้า เป็นเวลาในอนาคต ภาษาอังกฤษใช้ will + กริยารูปพื้นฐาน จึงตอบ will finish","wrong":{"0":"finished เป็นรูปอดีต ขัดกับ next week ที่ยังไม่เกิดขึ้น","1":"is finish ผิดไวยากรณ์ เพราะเอากริยาสองตัวมาต่อกันโดยไม่เปลี่ยนรูป ถ้าจะใช้ is ต้องเป็น is finishing","3":"finishing เป็นรูป -ing ใช้ตามลำพังเป็นกริยาแท้ไม่ได้ ต้องมี is หรือ will be นำหน้า"},"point":"คำบอกเวลาอนาคตที่ต้องจำ tomorrow, next week, next month, soon, in two days เห็นแล้วให้มองหา will หรือ be going to","trick":"หลัง will ต้องเป็นกริยารูปพื้นฐานเสมอ ห้ามเติม s ห้ามเติม ed ห้ามเติม ing จำกฎนี้ข้อเดียวตอบได้หลายข้อ"},"vocab":[{"w":"presentation","ipa":"/ˌpriːznˈteɪʃn/","th":"พรี-เซิ่น-**เท**-เชิ่น","mean":"การนำเสนอ งานนำเสนอ","pos":"n."}]},{"id":"L02q-008","part":5,"tier":"easy","topic":"subject-verb-agreement","topicTh":"be-verb อดีตกับประธานพหูพจน์","stem":"The customers _____ satisfied with the new service last month.","choices":["is","are","am","were"],"answer":3,"th":{"stem":"ลูกค้า_____พอใจกับบริการใหม่เมื่อเดือนที่แล้ว","choices":["รู้สึก (เอกพจน์ ปัจจุบัน)","รู้สึก (พหูพจน์ ปัจจุบัน)","รู้สึก (ใช้กับ I เท่านั้น)","รู้สึก (พหูพจน์ อดีต)"]},"explain":{"why":"ประธาน The customers มี s ท้ายคำ เป็นลูกค้าหลายคน จึงเป็นพหูพจน์ และ last month บอกว่าเป็นอดีต รูปที่ตรงทั้งสอง คำสรรพนาม","ใช้แทนคำนามที่พูดถึงไปแล้ว","he, she, it, they, his, them"],["preposition","คำบุพบท","บอกความสัมพันธ์ด้านเวลาหรือสถานที่ ตามด้วยคำนาม","in, on, at, for, with, during"],["conjunction","คำสันธาน (คำเชื่อม)","เชื่อมคำหรือประโยคเข้าด้วยกัน","and, but, because, although"],["interjection","คำอุทาน","คำแสดงอารมณ์ ไม่ค่อยออกใน TOEIC","Oh!, Wow!, Well,"]]},{"type":"text","th":"จาก 8 ชนิดนั้น 4 ชนิดแรกคือ noun, verb, adjective, adverb เป็นหัวใจของข้อ word-form ทั้งหมด เพราะภาษาอังกฤษชอบเอารากคำเดียวกันมาแปลงหางให้กลายเป็นคนละชนิด แล้วเอามาเป็นตัวเลือกหลอกเรา ข่าวดีคือหางคำเหล่านี้มีแบบแผนชัดเจนมาก จำหางได้ก็รู้ชนิดได้"},{"type":"text","th":"กลุ่มที่ 1 หางคำของคำนาม (noun) คำนามคือชื่อของสิ่งต่างๆ ถ้าคำไหนลงท้ายแบบนี้ ให้ฟันธงว่าเป็นคำนาม"},{"type":"table","head":["หางคำ","อ่านว่า","ตัวอย่าง","แปล"],"rows":[["-tion / -sion","เชิ่น","information, decision, production, permission","ข้อมูล, การตัดสินใจ, การผลิต, การอนุญาต"],["-ment","เมิ่นท์","management, payment, agreement, department","การจัดการ, การชำระเงิน, ข้อตกลง, แผนก"],["-ness","เนิส","business, kindness, weakness, awareness","ธุรกิจ, ความใจดี, จุดอ่อน, ความตระหนัก"],["-ity / -ty","อิ-ที","quality, ability, security, safety","คุณภาพ, ความสามารถ, ความปลอดภัย, ความปลอดภัย"],["-ance / -ence","เอิ่นซ์","attendance, performance, difference, experience","การเข้าร่วม, ผลงาน, ความแตกต่าง, ประสบการณ์"],["-er / -or","เออร์","manager, worker, director, editor","ผู้จัดการ, คนงาน, ผู้อำนวยการ, บรรณาธิการ"],["-ist","อิสท์","specialist, receptionist, economist","ผู้เชี่ยวชาญ, พนักงานต้อนรับ, นักเศรษฐศาสตร์"],["-ship","ชิพ","leadership, membership, relationship","ภาวะผู้นำ, สมาชิกภาพ, ความสัมพันธ์"],["-al (บางคำ)","เอิ่ล","approval, arrival, proposal, renewal","การอนุมัติ, การมาถึง, ข้อเสนอ, การต่ออายุ"]]},{"type":"text","th":"จำง่ายๆ ว่าหาง -er และ -or แปลว่าคนที่ทำสิ่งนั้น เช่น work (ทำงาน) เติม -er เป็น worker (คนทำงาน) ส่วนหางอื่นๆ มักแปลว่าการกระทำนั้นหรือสภาพนั้น เช่น manage (จัดการ) เติม -ment เป็น management (การจัดการ)"},{"type":"text","th":"กลุ่มที่ 2 หางคำของคำคุณศัพท์ (adjective) คำคุณศัพท์มีหน้าที่เดียวคือบรรยายว่าคำนามนั้นเป็นอย่างไร มันจะยืนอยู่ 2 ที่เท่านั้น คือหน้าคำนาม กับหลัง be-verb"},{"type":"table","head":["หางคำ","อ่านว่า","ตัวอย่าง","แปล"],"rows":[["-ive","อิฟว์","creative, effective, productive, competitive","สร้างสรรค์, ได้ผล, มีผลผลิตสูง, ที่แข่งขัน"],["-able / -ible","เออ-เบิ้ล","available, comfortable, responsible, possible","พร้อมใช้, สบาย, รับผิดชอบ, เป็นไปได้"],["-al","เอิ่ล","additional, national, personal, professional","เพิ่มเติม, ระดับชาติ, ส่วนตัว, มืออาชีพ"],["-ful","เฟิ่ล","successful, careful, helpful, useful","สำเร็จ, รอบคอบ, ช่วยเหลือดี, มีประโยชน์"],["-less","เลิส","careless, useless, wireless, endless","สะเพร่า, ไร้ประโยชน์, ไร้สาย, ไม่รู้จบ"],["-ous","เอิส","previous, various, dangerous, famous","ก่อนหน้า, หลากหลาย, อันตราย, มีชื่อเสียง"],["-ic","อิค","specific, economic, electronic, basic","เฉพาะเจาะจง, ทางเศรษฐกิจ, อิเล็กทรอนิกส์, พื้นฐาน"],["-ent / -ant","เอิ่นท์","efficient, different, important, pleasant","มีประสิทธิภาพ, แตกต่าง, สำคัญ, น่าพอใจ"],["-y","อี","healthy, busy, rainy, wealthy","สุขภาพดี, ยุ่ง, ฝนตก, ร่ำรวย"]]},{"type":"example","en":"The company hired a creative designer for the new project.","th":"บริษัทจ้างนักออกแบบที่มีความคิดสร้างสรรค์มาทำโครงการใหม่","note":"creative ลงท้าย -ive จึงเป็นคำคุณศัพท์ และมันวางอยู่หน้าคำนาม designer พอดี นี่คือตำแหน่งมาตรฐานของคำคุณศัพท์"},{"type":"text","th":"กลุ่มที่ 3 หางคำของคำวิเศษณ์ (adverb) กลุ่มนี้จำง่ายที่สุดในโลก เพราะแทบทั้งหมดลงท้ายด้วย -ly หน้าที่ของมันคือขยายกริยา (บอกว่าทำอย่างไร) ขยายคำคุณศัพท์ (บอกว่าระดับไหน) หรือขยายทั้งประโยค"},{"type":"table","head":["คำวิเศษณ์","อ่านว่า","แปล","ตัวอย่างการใช้"],"rows":[["carefully","**แคร์**-เฟิ่ล-ลี","อย่างระมัดระวัง","He checked the numbers carefully. เขาตรวจตัวเลขอย่างระมัดระวัง"],["quickly","**ควิค**-ลี","อย่างรวดเร็ว","The team responded quickly. ทีมงานตอบสนองอย่างรวดเร็ว"],["currently","**เค้อ**-เริ่นท์-ลี","ในขณะนี้","The office is currently closed. ตอนนี้สำนักงานปิดอยู่"],["immediately","อิ-**มี**-เดียท-ลี","ทันที","Please reply immediately. กรุณาตอบกลับทันที"],["successfully","เซิค-**เซส**-เฟิ่ล-ลี","อย่างประสบความสำเร็จ","They completed it successfully. พวกเขาทำสำเร็จ"],["extremely","อิค-**สตรีม**-ลี","อย่างยิ่งยวด","The price is extremely high. ราคาสูงมากๆ"],["fast (ไม่มี -ly)","**ฟาสท์**","อย่างรวดเร็ว","She types fast. เธอพิมพ์เร็ว"],["hard (ไม่มี -ly)","**ฮาร์ด**","อย่างหนัก","They work hard. พวกเขาทำงานหนัก"],["well (รูปพิเศษของ good)","**เวล**","อย่างดี","He speaks English well. เขาพูดอังกฤษได้ดี"]]},{"type":"warn","th":"ระวังกับดักใหญ่ ไม่ใช่ทุกคำที่ลงท้าย -ly จะเป็นคำวิเศษณ์ มีกลุ่มคำที่ลงท้าย -ly แต่เป็นคำคุณศัพท์ ได้แก่ friendly (เป็นมิตร) costly (แพง) likely (มีแนวโน้ม) lovely (น่ารัก) timely (ทันเวลา) daily (รายวัน) weekly (รายสัปดาห์) monthly (รายเดือน) early (แต่เช้า) และคำกลุ่มนี้ต้องวางหน้าคำนามหรือหลัง be-verb เหมือนคำคุณศัพท์ทุกประการ เช่น a friendly staff member ถูก แต่ He works friendly ผิด ข้อสอบชอบเอา friendly มาเป็นตัวลวงในข้อที่ต้องการคำวิเศษณ์"},{"type":"text","th":"กลุ่มที่ 4 หางคำของคำกริยา (verb) กลุ่มนี้มีน้อยที่สุด แต่ก็ควรจำไว้เพราะถ้าเห็นหางพวกนี้แปลว่ามันเป็นกริยาแน่นอน"},{"type":"table","head":["หางคำ","ความหมายของหาง","ตัวอย่าง","แปล"],"rows":[["-ize / -ise","ทำให้เป็น...","organize, apologize, realize, minimize","จัดระเบียบ, ขอโทษ, ตระหนัก, ทำให้น้อยที่สุด"],["-ify","ทำให้เป็น...","notify, simplify, identify, verify","แจ้งให้ทราบ, ทำให้ง่าย, ระบุตัว, ตรวจสอบยืนยัน"],["-en","ทำให้...ขึ้น","strengthen, widen, shorten, lengthen","ทำให้แข็งแรงขึ้น, ขยายให้กว้าง, ทำให้สั้นลง, ทำให้ยาวขึ้น"],["-ate","ทำการ...","operate, communicate, participate, indicate","ดำเนินการ, สื่อสาร, มีส่วนร่วม, บ่งชี้"]]},{"type":"text","th":"ทีนี้มาดูของจริง ตารางครอบครัวคำ ข้อสอบ TOEIC ชอบเอาคำ 4 รูปจากรากเดียวกันมาเป็นตัวเลือกทั้ง 4 ตัว ตารางนี้คือ 12 ครอบครัวที่ออกบ่อยที่สุด ให้อ่านแนวนอนทีละแถว สังเกตว่าหางเปลี่ยนอย่างไร"},{"type":"table","head":["คำกริยา (verb)","คำนาม (noun)","คำคุณศัพท์ (adjective)","คำวิเศษณ์ (adverb)","ความหมายกลาง"],"rows":[["decide","decision","decisive","decisively","ตัดสินใจ"],["succeed","success","successful","successfully","สำเร็จ"],["create","creation","creative","creatively","สร้างสรรค์"],["compete","competition","competitive","competitively","แข่งขัน"],["produce","production","productive","productively","ผลิต"],["differ","difference","different","differently","แตกต่าง"],["act","action","active","actively","กระทำ"],["attract","attraction","attractive","attractively","ดึงดูด"],["accept","acceptance","acceptable","acceptably","ยอมรับ"],["add","addition","additional","additionally","เพิ่ม"],["compare","comparison","comparable","comparably","เปรียบเทียบ"],["depend","dependence","dependable","dependably","พึ่งพา"]]},{"type":"text","th":"มาถึงตารางที่สำคัญที่สุดของทั้งบท ตารางนี้คือสูตรตอบข้อ word-form ให้คุณดูว่าช่องว่างอยู่ตำแหน่งไหนในประโยค แล้วเลือกชนิดคำตามตาราง ผมแนะนำให้ถ่ายรูปตารางนี้เก็บไว้ในมือถือ แล้วเปิดดูทุกครั้งที่ฝึกทำข้อสอบในสัปดาห์แรก"},{"type":"table","head":["ช่องว่างอยู่ตรงไหน","ต้องเติมชนิดคำอะไร","ตัวอย่าง","คำแปล"],"rows":[["หลัง a / an / the","คำนาม","the _____ = the decision","การตัดสินใจนั้น"],["หลังคำคุณศัพท์","คำนาม","a final _____ = a final decision","การตัดสินใจครั้งสุดท้าย"],["หลังคำแสดงความเป็นเจ้าของ (my, your, its, our)","คำนาม","your _____ = your application","ใบสมัครของคุณ"],["หลังคำบุพบท (in, of, for, on, with)","คำนาม","for _____ = for approval","เพื่อขออนุมัติ"],["หน้าคำนาม","คำคุณศัพท์","a _____ plan = a successful plan","แผนที่ประสบความสำเร็จ"],["หลัง be-verb แล้วบรรยายประธาน","คำคุณศัพท์","She is _____ = She is creative","เธอมีความคิดสร้างสรรค์"],["หลัง very / extremely / highly / quite","คำคุณศัพท์","extremely _____ = extremely helpful","ช่วยได้มากๆ"],["หลังกริยาแท้ (บอกว่าทำอย่างไร)","คำวิเศษณ์","works _____ = works efficiently","ทำงานอย่างมีประสิทธิภาพ"],["หน้าคำคุณศัพท์","คำวิเศษณ์","_____ successful = highly successful","ประสบความสำเร็จอย่างสูง"],["ต้นประโยค แล้วมีลูกน้ำคั่น","คำวิเศษณ์","_____, the plan failed = Unfortunately, ...","น่าเสียดายที่แผนล้มเหลว"],["หลังประธาน แต่ประโยคยังไม่มีกริยา","คำกริยา","The board _____ the plan = approved","คณะกรรมการอนุมัติแผน"],["หลัง will / must / can / should / to","คำกริยารูปพื้นฐาน","will _____ = will approve","จะอนุมัติ"]]},{"type":"text","th":"ลองใช้ตารางกับข้อจริงดู ให้ทำตาม 3 ขั้นนี้ทุกครั้ง ขั้นที่หนึ่ง ปิดตัวเลือกไว้ก่อน อย่าเพิ่งอ่าน ขั้นที่สอง ดูคำที่อยู่ซ้ายและขวาของช่องว่างเท่านั้น แล้วบอกตัวเองให้ได้ว่าตรงนี้ต้องการคำชนิดไหน ขั้นที่สาม ค่อยเปิดดูตัวเลือกแล้วเลือกตัวที่หางตรงกับชนิดนั้น"},{"type":"example","en":"The manager reviewed the contract _____. (choices: care / careful / carefully / carefulness)","th":"ผู้จัดการตรวจสัญญาอย่าง_____ (ตัวเลือก: care / careful / carefully / carefulness)","note":"ซ้ายของช่องว่างคือ the contract ซึ่งเป็นกรรมของกริยา reviewed แล้ว ประโยคสมบูรณ์อยู่แล้ว ช่องว่างจึงเป็นคำที่มาเสริมว่าตรวจอย่างไร ตอบ carefully เพราะหาง -ly คือคำวิเศษณ์"},{"type":"example","en":"We need your _____ before Friday. (choices: approve / approval / approved / approving)","th":"เราต้องการ_____ของคุณก่อนวันศุกร์ (ตัวเลือก: approve / approval / approved / approving)","note":"ซ้ายของช่องว่างคือ your ซึ่งเป็นคำแสดงความเป็นเจ้าของ ตามตารางบอกว่าหลัง your ต้องเป็นคำนาม ตอบ approval เพราะหาง -al ในกรณีนี้เป็นคำนาม แปลว่าการอนุมัติ"},{"type":"example","en":"The new system is highly _____. (choices: efficiency / efficient / efficiently / efficiencies)","th":"ระบบใหม่มีประสิทธิภาพอย่าง_____ (ตัวเลือก: efficiency / efficient / efficiently / efficiencies)","note":"ซ้ายของช่องว่างคือ highly ซึ่งเป็นคำวิเศษณ์ที่แปลว่าอย่างสูง คำวิเศษณ์ต้องไปขยายคำคุณศัพท์ ตอบ efficient เพราะหาง -ent คือคำคุณศัพท์"},{"type":"warn","th":"ระวังคำที่ลงท้าย -ing และ -ed เพราะสองหางนี้เป็นได้ทั้งกริยาและคำคุณศัพท์ ต้องดูตำแหน่งเป็นหลัก ที่คนไทยสับสนบ่อยที่สุดคือคู่ interesting กับ interested คำที่ลงท้าย -ing ใช้บรรยายสิ่งที่ทำให้เกิดความรู้สึก เช่น The report is interesting แปลว่ารายงานน่าสนใจ ส่วนคำที่ลงท้าย -ed ใช้บรรยายคนที่รู้สึก เช่น I am interested in the report แปลว่าฉันสนใจรายงานนั้น ถ้าพูดว่า I am interesting จะกลายเป็นว่าตัวฉันเองเป็นคนน่าสนใจ ซึ่งฟังแล้วแปลกมาก คู่อื่นที่ใช้กฎเดียวกันคือ boring กับ bored, confusing กับ confused, surprising กับ surprised, exciting กับ excited"},{"type":"warn","th":"ระวังอย่าเอาคำวิเศษณ์ไปวางหลัง be-verb เมื่อต้องการบรรยายประธาน คนไทยมักเขียนว่า He is carefully ซึ่งผิด เพราะหลัง be-verb ที่บรรยายว่าประธานเป็นอย่างไร ต้องใช้คำคุณศัพท์คือ He is careful ส่วนคำวิเศษณ์จะใช้กับกริยาแท้ เช่น He works carefully วิธีเช็กง่ายๆ คือ ถ้ากริยาในประโยคเป็น is, am, are, was, were, seem, look, become ให้เติมคำคุณศัพท์ แต่ถ้าเป็นกริยาที่แสดงการกระทำจริง เช่น work, check, reply, complete ให้เติมคำวิเศษณ์"},{"type":"tip","th":"เคล็ดลับดูออกใน 10 วินาที พอเปิดข้อสอบมาแล้วเห็นตัวเลือกทั้ง 4 ตัวขึ้นต้นด้วยตัวอักษรชุดเดียวกัน เช่น decide, decision, decisive, decisively ให้รู้ทันทีว่านี่คือข้อ word-form ห้ามเสียเวลาอ่านทั้งประโยค ให้อ่านแค่ 2 คำหน้าช่องว่างกับ 2 คำหลังช่องว่างพอ แล้วเปิดตารางสูตรในหัว ข้อพวกนี้ควรใช้เวลาไม่เกิน 15 วินาทีต่อข้อ เวลาที่ประหยัดได้เอาไปทุ่มกับ Part 7 ซึ่งเป็นส่วนที่กินเวลาที่สุด"},{"type":"tip","th":"วิธีท่องคำศัพท์ที่ได้ผลที่สุดตั้งแต่วันนี้เป็นต้นไป อย่าท่องคำเดี่ยว ให้ท่องเป็นครอบครัวคำทีละแถวเหมือนในตาราง เช่นท่อง succeed success successful successfully พร้อมกัน 4 ตัว ใช้เวลาเท่ากับท่องคำเดียวแต่ได้คำเพิ่ม 4 เท่า และตรงกับรูปแบบที่ข้อสอบใช้จริงพอดี"},{"type":"text","th":"แผนฝึกวันนี้ 35 นาที ให้ใช้ 15 นาทีแรกอ่านตารางหางคำทั้ง 4 กลุ่มแล้วปิดตารางทดสอบตัวเองว่าเห็นหางแล้วบอกชนิดได้ไหม ใช้ 10 นาทีถัดมาท่องตารางครอบครัวคำ 12 แถวแบบออกเสียงดังๆ และ 10 นาทีสุดท้ายทำแบบฝึกหัด 12 ข้อข้างล่าง โดยบังคับตัวเองว่าต้องบอกให้ได้ก่อนว่าช่องว่างต้องการคำชนิดไหน แล้วค่อยดูตัวเลือก"}],"quiz":[{"id":"L03q-001","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ ต้องเติมคำนาม","stem":"The committee gave its final _____ on the budget yesterday.","choices":["approval","approve","approved","approvingly"],"answer":0,"th":{"stem":"ค ปอีก"},"point":"คำวิเศษณ์คือคำที่ตอบคำถามว่า ทำอย่างไร ถ้าช่องว่างวางหลังกริยาแสดงการกระทำและประโยคสมบูรณ์อยู่แล้ว ให้เติมคำที่ลงท้าย -ly","trick":"คำว่า more หรือ very หรือ quite ที่อยู่หน้าช่องว่างเป็นสัญญาณว่าช่องว่างเป็นคำขยาย ให้ดูต่อว่ามันขยายกริยา (ตอบ -ly) หรือขยายคำนาม (ตอบคำคุณศัพท์)"},"vocab":[{"w":"efficiently","ipa":"/ɪˈfɪʃntli/","th":"อิ-**ฟิช**-เชิ่นท์-ลี","mean":"อย่างมีประสิทธิภาพ","pos":"adv."},{"w":"staff","ipa":"/stæf/","th":"**สแตฟ**","mean":"พนักงาน (ใช้รวมทั้งกลุ่ม)","pos":"n."}]},{"id":"L03q-003","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ ต้องเติมคำคุณศัพท์หน้าคำนาม","stem":"Ms. Ito is a very _____ project leader.","choices":["create","creation","creative","creatively"],"answer":2,"th":{"stem":"คุณอิโตะเป็นหัวหน้าโครงการที่_____มาก","choices":["สร้าง (คำกริยา)","การสร้าง (คำนาม)","มีความคิดสร้างสรรค์ (คำคุณศัพท์)","อย่างสร้างสรรค์ (คำวิเศษณ์)"]},"explain":{"why":"ขวาของช่องว่างคือคำนาม project leader และซ้ายคือ very ตำแหน่งระหว่าง very กับคำนามคือที่ของคำคุณศัพท์ จึงตอบ creative ที่ลงท้าย -ive","wrong":{"0":"create เป็นคำกริยา วางหน้าคำนามเพื่อบรรยายลักษณะไม่ได้ และประโยคก็มีกริยา is อยู่แล้ว","1":"creation เป็นคำนาม (หาง -tion) ถ้าใส่จะกลายเป็นคำนามสองตัวซ้อนกันโดยไม่มีความหมาย และ very ก็ขยายคำนามไม่ได้","3":"creatively เป็นคำวิเศษณ์ (หาง -ly) ใช้ขยายกริยา ไม่ใช้ขยายคำนาม leader"},"point":"ตำแหน่งมาตรฐานของคำคุณศัพท์คือหน้าคำนามโดยตรง หรือหลัง be-verb ถ้าเห็นคำนามอยู่ขวาช่องว่าง ให้เดาคำคุณศัพท์ไว้ก่อนเสมอ","trick":"very ขยายได้แค่คำคุณศัพท์กับคำวิเศษณ์เท่านั้น เห็น very แล้วให้ตัดคำนามและคำกริยาทิ้งทันที เหลือ 2 ตัวแล้วดูว่ามีคำนามตามหลังไหม"},"vocab":[{"w":"creative","ipa":"/kriˈeɪtɪv/","th":"คริ-**เอ**-ทิฟว์","mean":"มีความคิดสร้างสรรค์","pos":"adj."}]},{"id":"L03q-004","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ หลัง must ต้องเป็นกริยารูปพื้นฐาน","stem":"All visitors must _____ at the front desk before entering.","choices":["registration","registered","registering","register"],"answer":3,"th":{"stem":"ผู ักงานใหม่ทุกคน","choices":["การเพิ่ม (คำนาม)","เพิ่มเติม (คำคุณศัพท์)","นอกจากนี้ (คำวิเศษณ์)","เพิ่ม (คำกริยา)"]},"explain":{"why":"ขวาของช่องว่างคือคำนาม training และซ้ายคือกริยา offers ช่องว่างจึงอยู่ระหว่างกริยากับคำนาม ทำหน้าที่บรรยายว่าเป็นการอบรมแบบไหน ตำแหน่งนี้คือคำคุณศัพท์ ตอบ additional","wrong":{"0":"addition เป็นคำนาม ถ้าใส่จะกลายเป็นคำนามสองตัวเรียงกันโดยไม่มีความหมายที่ถูกต้อง","2":"additionally เป็นคำวิเศษณ์ (หาง -ly) ใช้เชื่อมความระหว่างประโยค ไม่ใช้ขยายคำนาม training","3":"add เป็นคำกริยา แต่ประโยคมีกริยา offers อยู่แล้ว จะมีกริยาแท้สองตัวไม่ได้"},"point":"เมื่อช่องว่างถูกขนาบด้วยกริยาทางซ้ายและคำนามทางขวา คำตอบเป็นคำคุณศัพท์เกือบทุกครั้ง","trick":"อย่าดูแค่คำซ้าย ต้องดูคำขวาด้วย ถ้าขวาเป็นคำนามให้ตอบคำคุณศัพท์ ถ้าขวาเป็นจุดจบประโยคให้ตอบคำวิเศษณ์"},"vocab":[{"w":"additional","ipa":"/əˈdɪʃənl/","th":"เออ-**ดิช**-เชอ-เนิ่ล","mean":"เพิ่มเติม","pos":"adj."},{"w":"hire","ipa":"/ˈhaɪər/","th":"**ไฮ**-เออร์","mean":"จ้าง หรือ พนักงานที่เพิ่งถูกจ้าง","pos":"v./n."}]},{"id":"L03q-011","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ คำคุณศัพท์หลัง be-verb","stem":"The hotel staff were extremely _____ to the guests.","choices":["help","helpfully","helpful","helping"],"answer":2,"th":{"stem":"พนักงานโรงแรม_____กับแขกอย่างยิ่ง","choices":["ช่วย (คำกริยา)","อย่างช่วยเหลือ (คำวิเศษณ์)","ช่วยเหลือดี มีน้ำใจ (คำคุณศัพท์)","กำลังช่วย (รูป -ing)"]},"explain":{"why":"ช่องว่างอยู่หลัง were ซึ่งเป็น be-verb และหลัง extremely ที่เป็นคำวิเศษณ์ ตำแหน่งนี้ต้องบรรยายว่าประธานเป็นอย่างไร จึงต้องใช้คำคุณศัพท์ ตอบ helpful ที่ลงท้าย -ful","wrong":{"0":"help เป็นคำกริยารูปพื้นฐาน วางหลัง were ไม่ได้ เพราะจะกลายเป็นกริยาสองตัวซ้อนกัน","1":"helpfully เป็นคำวิเศษณ์ (หาง -ly) หลัง be-verb ที่บรรยายประธานต้องใช้คำคุณศัพท์ ไม่ใช่คำวิเศษณ์","3":"helping เป็นรูป -ing ถ้าใช้จะแปลว่ากำลังช่วย และต้องเขียนว่า were helping the guests โดยไม่มี to ทั้งรูปประโยคและความหมายจึงไม่เข้ากับที่นี่"},"point":"จำสูตรสั้นๆ be-verb + คำคุณศัพท์ = บรรยายว่าประธานเป็นอย่างไร ส่วน กริยาแสดงการกระทำ + คำวิเศษณ์ = บอกว่าทำอย่างไร","trick":"extremely, very, quite, highly, fairly ทุกตัวเป็นคำวิเศษณ์ที่ขยายคำคุณศัพท์ เห็นคำพวกนี้หน้าช่องว่างแล้วมี be-verb อยู่ก่อนหน้า ให้ตอบคำคุณศัพท์ทันที"},"vocab":[{"w":"helpful","ipa":"/ˈhelpfl/","th":"**เฮ็ลพ**-เฟิ่ล","mean":"ช่วยเหลือดี มีน้ำใจ","pos":"adj."},{"w":"guest","ipa":"/ɡest/","th":"**เก็สท์**","mean":"แขกผู้เข้าพัก","pos":"n."}]},{"id":"L03q-012","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ หลัง will ต้องเป็นกริยารูปพื้นฐาน","stem":"The safety inspector will _____ the factory next Tuesday.","choices":["inspection","inspector","inspecting","inspect"],"answer":3,"th":{"stem":"ผู้ตรวจสอบความปลอดภัยจะ_____โรงงานในวันอังคารหน้า","choices":["การตรวจสอบ (คำนาม)","ผู้ตรวจสอบ (คำนาม)","กำลังตรวจสอบ (รูป -ing)","ตรวจสอบ (กริยารูปพื้นฐาน)"]},"explain":{"why":"ซ้ายของช่องว่างคือ will ซึ่งเป็นกริยาช่วยบอกอนาคต หลัง will ต้องตามด้วยกริยารูปพื้นฐานเสมอ และขวาของช่องว่างคือกรรม the factory ยืนยันว่าต้องเป็นกริยา จึงตอบ inspect","wrong":{"0":"inspection เป็นคำนาม (หาง -tion) วางหลัง will ไม่ได้","1":"inspector เป็นคำนามที่แปลว่าคนตรวจ (หาง -or) วางหลัง will ไม่ได้ และคำนี้ปรากฏเป็นประธานอยู่แล้วในประโยค","2":"inspecting เป็นรูป -ing หลัง will ห้ามเติม ing ถ้าอยากใช้ต้องเขียนว่า will be inspecting"},"point":"หาง -or และ -er บอกว่าเป็นคนที่ทำสิ่งนั้น ส่วนหาง -tion บอกว่าเป็นการกระทำนั้น ทั้งสองเป็นคำนามทั้งคู่ วางหลังกริยาช่วยไม่ได้","trick":"ข้อ word-form ที่มี will, must, can, should นำหน้าช่องว่าง ถือเป็นข้อฟรี ใช้เวลา 5 วินาทีก็พอ เลือกกริยารูปเปล่าที่ไม่มีหางแล้วไปข้อต่อไปเลย"},"vocab":[{"w":"inspect","ipa":"/ɪnˈspekt/","th":"อิน-**สเป็คท์**","mean":"ตรวจสอบ ตรวจตรา","pos":"v."},{"w":"factory","ipa":"/ˈfæktri/","th":"**แฟค**-เทอ-รี","mean":"โรงงาน","pos":"n."}]}]},"lessons/L04":{"id":"L04","day":4,"title":"กาลเวลา 1: ปัจจุบัน อดีต อนาคต แบบธรรมดา","goalTh":"จบบทนี้แล้วคุณจะผันกริยาเป็นปัจจุบัน อดีต และอนาคตได้ถูก และที่สำคัญที่สุดคือ มองเห็นคำบอกเวลาในโจทย์แล้วเดาได้ทันทีว่าต้องเลือกกริยารูปไหน ซึ่งเป็นเทคนิคตอบ Part 5 ได้ภายใน 5 วินาที","minutes":35,"blocks":[{"type":"text","th":"สามวันที่ผ่านมาเราปูพื้นเรื่องการอ่านออกเสียง เรื่องโครงประโยค ประธาน-กริยา-กรรม และเรื่องการดูหางคำว่าเป็นคำชนิดไหน วันนี้เราจะเข้าเรื่องที่ทำคะแนน Part 5 (พาร์ทเติมคำในประโยค) ได้เยอะที่สุดเรื่องหนึ่ง นั่นคือ tense (เทนส์ = กาลเวลาของคำกริยา) ขอให้ตั้งใจเป็นพิเศษ เพราะข้อสอบจริงชุดหนึ่งมีเรื่องนี้ประมาณ 4-6 ข้อ และเป็นข้อที่ตอบได้เร็วที่สุดถ้ารู้เทคนิค"},{"type":"text","th":"ก่อนอื่นต้องเข้าใจความต่างระหว่างไทยกับอังกฤษก่อน ภาษาไทยเวลาจะบอกว่าเรื่องเกิดเมื่อไหร่ เราแค่เติมคำบอกเวลาเข้าไป ตัวคำกริยาไม่เปลี่ยนหน้าตาเลย เช่น ฉันกินข้าวเมื่อวาน / ฉันกินข้าวทุกวัน / ฉันจะกินข้าวพรุ่งนี้ คำว่า กิน หน้าตาเหมือนเดิมทั้งสามประโยค แต่ภาษาอังกฤษไม่ใช่แบบนั้น ตัวคำกริยาเองต้องเปลี่ยนรูปตามเวลา คำว่า eat (กิน) จะกลายเป็น ate เมื่อพูดถึงอดีต และกลายเป็น will eat เมื่อพูดถึงอนาคต จำหลักนี้ให้แน่น: ในภาษาอังกฤษ เวลาไปอยู่ที่ตัวกริยา"},{"type":"table","head":["ชื่อกาล","ใช้พูดถึงเรื่องแบบไหน","หน้าตาของกริยา","ตัวอย่าง"],"rows":[["present simple (พรี-เซ่นท์ ซิม-เพิล = ปัจจุบันกาลธรรมดา)","เรื่องที่ทำเป็นประจำ นิสัย ตารางงาน ความจริงทั่วไป","work / works","She works at a bank. (เธอทำงานที่ธนาคาร)"],["past simple (พาสท์ ซิม-เพิล = อดีตกาลธรรมดา)","เรื่องที่เกิดและจบไปแล้วในอดีต มีจุดเวลาชัดเจน","worked / went","She worked here last year. (เธอทำงานที่นี่เมื่อปีที่แล้ว)"],["future (ฟิว-เจอร์ = อนาคตกาล)","เรื่องที่ยังไม่เกิด กำลังจะเกิดข้างหน้า","will work / is going to work","She will work here next month. (เธอจะทำงานที่นี่เดือนหน้า)"]]},{"type":"text","th":"เริ่มที่ตัวแรก present simple (ปัจจุบันกาลธรรมดา) ใช้เมื่อไหร่ ให้จำ 4 กรณีนี้ หนึ่ง เรื่องที่ทำซ้ำๆ เป็นกิจวัตร เช่น ไปทำงานทุกเช้า สอง หน้าที่ประจำของคนหรือของบริษัท เช่น ฝ่ายบัญชีดูแลใบแจ้งหนี้ สาม ความจริงทั่วไปที่ไม่เปลี่ยน เช่น ร้านเปิด 9 โมง สี่ ตารางเวลาที่กำหนดไว้แน่นอน เช่น รถไฟออก 8 โมง ในข้อสอบ TOEIC เรื่องนี้โผล่บ่อยมากในบริบทออฟฟิศ เพราะเขาชอบบรรยายว่าใครทำอะไรเป็นประจำ"},{"type":"table","head":["ประธาน (ผู้ทำ)","รูปกริยาที่ต้องใช้","ตัวอย่าง","แปล"],"rows":[["I (ไอ = ฉัน)","รูปพื้นฐาน ไม่เติมอะไร","I work at a bank.","ฉันทำงานที่ธนาคาร"],["You (ยู = คุณ / พวกคุณ)","รูปพื้นฐาน","You work very fast.","คุณทำงานเร็วมาก"],["We (วี = พวกเรา)","รูปพื้นฐาน","We work together.","พวกเราทำงานด้วยกัน"],["They (เธ = พวกเขา)","รูปพื้นฐาน","They work at night.","พวกเขาทำงานตอนกลางคืน"],["He (ฮี = เขา ผู้ชาย)","เติม -s","He works late on Fridays.","เขาทำงานดึกทุกวันศุกร์"],["She (ชี = เธอ ผู้หญิง)","เติม -s","She works in Bangkok.","เธอทำงานที่กรุงเทพฯ"],["It (อิท = มัน ใช้กับสิ่งของ)","เติม -s","It works well.","มันทำงานได้ดี"],["ชื่อคน 1 คน เช่น Mr. Lee","เติม -s","Mr. Lee works upstairs.","คุณลีทำงานอยู่ชั้นบน"],["ของ 1 ชิ้น เช่น the machine","เติม -s","The machine starts at 7.","เครื่องจักรเริ่มทำงานตอน 7 โมง"],["คนหรือของหลายชิ้น เช่น the workers","รูปพื้นฐาน","The workers start at 7.","คนงานเริ่มงานตอน 7 โมง"]]},{"type":"tip","th":"เคล็ดลับจำง่ายที่สุดในโลก: HE SHE IT เติม s ท่องแบบนี้ซ้ำๆ 10 รอบ ประธานอะไรก็ตามที่แปลว่า เขาคนเดียว เธอคนเดียว มันอันเดียว ให้เติม s ที่กริยาเสมอ ถ้าประธานเป็น ฉัน คุณ พวกเรา พวกเขา หรือของหลายชิ้น ห้ามเติม s เด็ดขาด สังเกตว่ามันสลับกับคำนาม คือคำนามเติม s แปลว่าหลายอัน แต่กริยาเติม s แปลว่าประธานมีตัวเดียว"},{"type":"table","head":["กริยาลงท้ายด้วย","เติมอย่างไร","ตัวอย่าง"],"rows":[["ทั่วไป ไม่เข้าข้อยกเว้นข้างล่าง","เติม -s ตรงๆ","work → works, send → sends, call → calls, need → needs"],["-s, -ss, -sh, -ch, -x, -z","เติม -es (ออกเสียงเพิ่มเป็น อิซ)","pass → passes, wash → washes, teach → teaches, fix → fixes"],["-o","เติม -es","go → goes, do → does"],["พยัญชนะ + y","เปลี่ยน y เป็น i แล้วเติม -es","study → studies, carry → carries, apply → applies, try → tries"],["สระ (a e i o u) + y","เติม -s ตามปกติ ห้ามเปลี่ยน y","pay → pays, buy → buys, enjoy → enjoys, stay → stays"],["กริยาพิเศษที่ต้องจำเป็นรายตัว","จำเลย ไม่มีกฎ","have → has (แฮฟ → แฮส)"]]},{"type":"warn","th":"ระวัง 3 จุดที่คนไทยพลาดบ่อยที่สุดในเรื่องเติม s หนึ่ง have ต้องกลายเป็น has ไม่ใช่ haves เขียน He has a meeting ถูก เขียน He haves ผิด สอง ห้ามใส่เวลาสองที่ในประโยคเดียว เช่น He is works ผิด เพราะ is ก็บอกเวลาแล้ว works ก็บอกเวลาอีก ให้เลือกอย่างใดอย่างหนึ่ง He works หรือ He is working สาม พอมีคำว่า does หรือ doesn't นำหน้า กริยาต้องกลับไปเป็นรูปพื้นฐานทันที เขียน She doesn't work on Sunday ถูก เขียน She doesn't works ผิด เพราะ does ดูด s ไปแล้ว"},{"type":"example","en":"Our accounting department issues invoices every Friday afternoon.","th":"ฝ่ายบัญชีของเราออกใบแจ้งหนี้ทุกบ่ายวันศุกร์","note":"ประธานคือ department (แผนก) นับเป็นหนึ่งหน่วย เท่ากับ it จึงเติม s ที่ issue กลายเป็น issues และคำว่า every Friday (ทุกวันศุกร์) คือสัญญาณบอกว่าเป็นเรื่องประจำ ต้องใช้ present simple"},{"type":"example","en":"The technicians check all the machines twice a month.","th":"ช่างเทคนิคตรวจเครื่องจักรทุกเครื่องเดือนละสองครั้ง","note":"ประธานคือ technicians มี s แปลว่าหลายคน เท่ากับ they ดังนั้นกริยา check ห้ามเติม s ส่วน twice a month (เดือนละสองครั้ง) เป็นคำบอกความถี่ ยืนยันว่าเป็น present simple"},{"type":"text","th":"ต่อไปเป็นตัวที่สอง past simple (อดีตกาลธรรมดา) ใช้เมื่อเรื่องนั้นเกิดขึ้นแล้วและจบไปแล้ว มักมีจุดเวลาในอดีตกำกับอยู่ในประโยค วิธีสร้างมีสองแบบ แบบแรกคือกริยาปกติ (regular verb = กริยาที่เติม -ed ได้เลย) แบบที่สองคือกริยาอปกติ (irregular verb = กริยาที่เปลี่ยนรูปแบบมั่วๆ ต้องท่องจำ) เราเรียกรูปอดีตนี้ว่า กริยาช่อง 2 ส่วนรูปพื้นฐานเรียกว่า กริยาช่อง 1 ข่าวดีคือกริยาส่วนใหญ่เป็นแบบเติม -ed ข่าวร้ายคือกริยาที่ใช้บ่อยที่สุดมักเป็นพวกอปกติ เลยต้องท่อง"},{"type":"table","head":["กริยาลงท้ายด้วย","เติมอย่างไร","ตัวอย่าง"],"rows":[["ทั่วไป","เติม -ed","work → worked, open → opened, ask → asked, deliver → delivered"],["มี -e อยู่ท้ายแล้ว","เติมแค่ -d","arrive → arrived, close → closed, receive → received, hire → hired"],["พยัญชนะ + y","เปลี่ยน y เป็น i แล้วเติม -ed","study → studied, apply → applied, carry → carried"],["สระ + y","เติม -ed ตามปกติ","play → played, delay → delayed, enjoy → enjoyed"],["คำพยางค์เดียว สระเดี่ยว + พยัญชนะเดี่ยว","เพิ่มพยัญชนะตัวท้ายอีกหนึ่งตัวแล้วเติม -ed","stop → stopped, plan → planned, ship → shipped"]]},{"type":"text","th":"ทีนี้ถึงส่วนที่ต้องท่องจริงจัง ตารางข้างล่างคือกริยาอปกติ 40 คำที่ออกข้อสอบ TOEIC บ่อยที่สุด ผมแนะนำให้ท่องวันละ 10 คำ 4 วันจบ อ่านออกเสียงตามด้วยจะจำได้เร็วขึ้นมาก และให้จำเป็นคู่เสมอ เช่น go-went ท่องติดกันเหมือนคำเดียว ไม่ใช่ท่องแยกกัน"},{"type":"table","head":["ช่อง 1 (รูปพื้นฐาน)","ช่อง 2 (รูปอดีต)","คำอ่านไทยของช่อง 2","ความหมาย"],"rows":[["be (am / is / are)","was / were","วอส / เวอร์","เป็น อยู่ คือ"],["have","had","แฮด","มี"],["do","did","ดิด","ทำ"],["say","said","เซด","พูด กล่าว"],["go","went","เวนท์","ไป"],["get","got","ก็อท","ได้รับ"],["make","made","เมด","ทำ ผลิต"],["know","knew","นิว","รู้ รู้จัก"],["think","thought","ธอท","คิด"],["take","took","ทุค","หยิบ ใช้เวลา"],["see","saw","ซอ","เห็น"],["come","came","เคม","มา"],["give","gave","เกฟ","ให้"],["find","found","ฟาวด์","หาเจอ ค้นพบ"],["tell","told","โทลด์","บอก"],["become","became","บิ-เคม","กลายเป็น"],["leave","left","เลฟท์","ออกจาก ทิ้งไว้"],["feel","felt","เฟลท์","รู้สึก"],["bring","brought","บรอท","นำมา"],["begin","began","บิ-แกน","เริ่ม"],["keep","kept","เค็พท์","เก็บ รักษาไว้"],["hold","held","เฮลด์","ถือ จัด (งาน ประชุม)"],["write","wrote","โรท","เขียน"],["hear","heard","เฮิร์ด","ได้ยิน"],["meet","met","เม็ท","พบ เจอ"],["pay","paid","เพด","จ่ายเงิน"],["run","ran","แรน","วิ่ง บริหารกิจการ"],["speak","spoke","สโปค","พูด"],["send","sent","เซนท์","ส่ง"],["build","built","บิลท์","สร้าง"],["buy","bought","บอท","ซื้อ"],["sell","sold","โซลด์","ขาย"],["spend","spent","สเปนท์","ใช้ (เงิน เวลา)"],["lose","lost","ลอสท์","สูญเสีย ทำหาย แพ้"],["win","won","วัน","ชนะ ได้มา"],["choose","chose","โชส","เลือก"],["rise","rose","โรส","เพิ่มขึ้น สูงขึ้น"],["understand","understood","อัน-เดอร์-สตูด","เข้าใจ"],["put","put","พุท","วาง (ช่อง 2 หน้าตาเหมือนเดิม)"],["cost","cost","คอสท์","มีราคา (ช่อง 2 หน้าตาเหมือนเดิม)"]]},{"type":"warn","th":"ระวังสองเรื่องใหญ่ของกริยาช่อง 2 เรื่องแรก พอมี did หรือ didn't อยู่ในประโยค กริยาต้องกลับไปเป็นช่อง 1 ทันที เขียน She didn't go to the meeting ถูก เขียน She didn't went ผิด เพราะ did รับหน้าที่บอกอดีตไปแล้ว เรื่องที่สอง มีกริยาบางคำที่ช่อง 1 กับช่อง 2 หน้าตาเหมือนกันเป๊ะ เช่น put, cost, cut, let, read, hit อย่าคิดว่าเขาลืมผัน ถ้าเจอในข้อสอบให้ดูคำบอกเวลาแทน โดยเฉพาะ read ที่เขียนเหมือนกันทั้งสองช่องแต่ออกเสียงต่างกัน ช่อง 1 อ่าน รี้ด ช่อง 2 อ่าน เร็ด"},{"type":"example","en":"The supplier sent the samples three days ago, but we received them yesterday.","th":"ซัพพลายเออร์ส่งตัวอย่างสินค้าไปเมื่อสามวันก่อน แต่เราได้รับเมื่อวานนี้","note":"ประโยคนี้มีคำบอกอดีตสองตัวคือ ago (ที่แล้ว) และ yesterday (เมื่อวาน) กริยาจึงต้องเป็นช่อง 2 ทั้งคู่ send เป็นกริยาอปกติกลายเป็น sent ส่วน receive เป็นกริยาปกติเลยเติมแค่ -d เป็น received"},{"type":"text","th":"ตัวที่สาม future (อนาคตกาล) เรื่องที่ยังไม่เกิด ในระดับที่ TOEIC ออกบ่อย มีสองรูปแบบให้จำ แบบแรกคือ will (วิล) + กริยาช่อง 1 แบบที่สองคือ be going to (บี โกอิ้ง ทู) + กริยาช่อง 1 จุดสำคัญที่ต้องจำให้ขึ้นใจคือ หลัง will และหลัง to กริยาต้องเป็นรูปพื้นฐานเสมอ ห้ามเติม s ห้ามเติม -ed เด็ดขาด เขียน He will attend ถูก เขียน He will attends ผิด"},{"type":"table","head":["รูปแบบ","หน้าตาเต็ม","ใช้เมื่อ","ตัวอย่างพร้อมคำแปล"],"rows":[["will","will + กริยาช่อง 1 (ทุกประธานใช้ will เหมือนกันหมด)","ตัดสินใจตอนนี้ คาดการณ์ สัญญา ให้คำมั่น","I will call you tomorrow. (ฉันจะโทรหาคุณพรุ่งนี้)"],["be going to","am / is / are + going to + กริยาช่อง 1","วางแผนไว้แล้ว ตั้งใจไว้ก่อนแล้ว หรือมีสัญญาณให้เห็นชัด","We are going to open a new branch. (เรากำลังจะเปิดสาขาใหม่)"],["รูปปฏิเสธของ will","will not = won't (โวนท์)","บอกว่าจะไม่ทำ","The store won't open on Monday. (ร้านจะไม่เปิดวันจันทร์)"],["รูปย่อของ will","I will = I'll, we will = we'll, it will = it'll","ใช้ในภาษาพูดและอีเมลไม่เป็นทางการ","I'll send the file. (ฉันจะส่งไฟล์ให้)"]]},{"type":"example","en":"Ms. Alvarez will lead the training session next Wednesday.","th":"คุณอัลวาเรซจะเป็นผู้นำการอบรมในวันพุธหน้า","note":"มีคำว่า next Wednesday (วันพุธหน้า) ซึ่งยังมาไม่ถึง จึงต้องใช้อนาคต และสังเกตว่าหลัง will คำว่า lead เป็นรูปพื้นฐานเปล่าๆ ไม่มี s แม้ประธานจะเป็นผู้หญิงคนเดียวก็ตาม"},{"type":"text","th":"มาถึงหัวใจของบทนี้แล้ว ถ้าคุณจะจำอะไรจากวันนี้ได้แค่อย่างเดียว ให้จำเรื่องนี้ ข้อสอบ Part 5 ที่ถามเรื่องกาลเวลา เกือบทุกข้อจะแอบใส่ คำบอกเวลา ไว้ในประโยคเสมอ คำพวกนี้คือกุญแจไขคำตอบ เพราะแต่ละคำผูกติดกับกาลแค่กาลเดียว ถ้าคุณเห็นคำว่า yesterday คุณไม่ต้องแปลประโยคทั้งประโยคเลยก็ตอบได้ว่าต้องเป็นช่อง 2 นี่คือเหตุผลที่คนเก่งทำ Part 5 บางข้อได้ใน 5 วินาที เขาไม่ได้อ่านเร็วกว่าคุณ เขาแค่รู้ว่าต้องมองหาอะไร"},{"type":"table","head":["คำบอกเวลาที่ต้องจำ","คำอ่านและคำแปล","บังคับให้ใช้กาลอะไร","ตัวอย่างในประโยค"],"rows":[["every day / every week / every month / every year","เอฟ-วรี่ = ทุก","present simple (กริยาช่อง 1 หรือเติม s)","He checks his email every morning."],["each morning / on Mondays / twice a week","อีช = แต่ละ, ทไวซ์ = สองครั้ง","present simple","The team meets twice a week."],["always / usually / often / sometimes / never / regularly","ออล-เวย์ส = เสมอ, ยู-ชวล-ลี่ = ปกติแล้ว, ออฟ-เฟ่น = บ่อยๆ, ซัม-ไทม์ส = บางครั้ง, เน-เวอร์ = ไม่เคย","present simple","She usually arrives before eight."],["generally / normally / as a rule","เจน-เนอ-รัล-ลี่ = โดยทั่วไป","present simple","The office normally closes at six."],["yesterday","เยส-เตอร์-เดย์ = เมื่อวาน","past simple (กริยาช่อง 2)","We received the shipment yesterday."],["last night / last week / last month / last year / last Friday","ลาสท์ = ที่แล้ว","past simple","The manager resigned last month."],["... ago เช่น two days ago, a week ago, ten years ago","อะ-โก = ที่ผ่านมาแล้ว","past simple","They signed the contract two weeks ago."],["in 2019 / in March (ปีหรือเดือนที่ผ่านไปแล้ว)","อิน = ใน","past simple","The company moved to Osaka in 2019."],["this morning / earlier today (เมื่อเวลานั้นผ่านไปแล้ว)","เอียร์-ลี-เออร์ = ก่อนหน้านี้","past simple","I spoke with the client earlier today."],["previously / formerly / originally","พรี-เวียส-ลี่ = ก่อนหน้านี้, ฟอร์-เมอร์-ลี่ = แต่ก่อน","past simple","The building previously housed a bank."],["tomorrow","ทู-มอ-โร่ = พรุ่งนี้","future (will หรือ be going to)","The auditor will arrive tomorrow."],["next week / next month / next year / next Monday","เน็กซ์ท์ = หน้า ถัดไป","future","We will announce the results next week."],["soon / shortly","ซูน = เร็วๆ นี้, ชอร์ท-ลี่ = ในไม่ช้า","future","The new policy will take effect soon."],["in two days / in an hour / in three weeks","อิน = อีก (นับไปข้างหน้า)","future","The flight will depart in two hours."],["starting next month / as of June 1","สตาร์ท-ติ้ง = เริ่มตั้งแต่","future","The new rates will apply starting next month."],["later this afternoon / tonight","เล-เทอร์ = ทีหลัง","future","I will send the file later this afternoon."]]},{"type":"tip","th":"เทคนิค 5 วินาทีสำหรับ Part 5 ทำตามนี้ทีละขั้น ขั้นที่ 1 ดูตัวเลือกทั้ง 4 ตัวก่อน ถ้าเห็นว่าเป็นคำเดียวกันแต่คนละรูป เช่น work / works / worked / will work แสดงว่าข้อนี้ถามเรื่องกาลเวลาหรือเรื่องประธานกับกริยา ขั้นที่ 2 อย่าเพิ่งอ่านทั้งประโยค ให้กวาดตาหาคำบอกเวลาก่อน มักซ่อนอยู่ท้ายประโยค ขั้นที่ 3 เจอคำบอกเวลาแล้วเทียบกับตารางข้างบน แล้วเลือกเลย ขั้นที่ 4 ถ้าไม่มีคำบอกเวลาเลย ค่อยย้อนกลับไปดูว่าประธานเป็นเอกพจน์หรือพหูพจน์ แล้วตัดสินด้วยเรื่องเติม s แทน"},{"type":"warn","th":"ระวังคำบอกเวลาที่หน้าตาคล้ายกันแต่คนละทิศทาง สามคู่นี้ข้อสอบชอบเอามาหลอก คู่ที่ 1 last กับ next คำว่า last week คือสัปดาห์ที่แล้ว เป็นอดีต ส่วน next week คือสัปดาห์หน้า เป็นอนาคต ต่างกันคนละขั้ว คู่ที่ 2 ago กับ in ประโยค two days ago แปลว่าสองวันที่แล้ว เป็นอดีต แต่ in two days แปลว่าอีกสองวันข้างหน้า เป็นอนาคต สังเกตว่า ago วางไว้หลังตัวเลข ส่วน in วางไว้หน้าตัวเลข คู่ที่ 3 tomorrow กับ yesterday ทั้งสองคำยาวและหน้าตาแปลกเหมือนกัน ให้จำว่า yesterday มีคำว่า yes อยู่ข้างหน้า และเรื่องที่ yes ไปแล้วคือเรื่องที่ผ่านไปแล้ว"},{"type":"warn","th":"ระวังกับดักที่คนไทยติดกันเยอะมาก อย่าแปลคำว่า จะ ในภาษาไทยเป็น will ทุกครั้ง ประโยคไทยที่ว่า เธอจะออกจากออฟฟิศตอนหกโมงทุกวัน ไม่ได้แปลว่า She will leave the office at six every day แต่ต้องแปลว่า She leaves the office at six every day เพราะคำว่า every day บอกว่าเป็นเรื่องประจำ ไม่ใช่อนาคต ให้ดูคำบอกเวลาในประโยคภาษาอังกฤษเป็นหลักเสมอ อย่าไปดูว่าภาษาไทยพูดยังไง"},{"type":"text","th":"สรุปขั้นตอนทั้งหมดเป็น 3 คำถามที่ต้องถามตัวเองทุกครั้งที่เจอข้อเติมกริยา คำถามที่ 1 ประโยคนี้มีคำบอกเวลาไหม ถ้ามีให้เลือกกาลตามคำนั้นทันที คำถามที่ 2 ถ้าเป็นปัจจุบัน ประธานเป็นเขาคนเดียวหรือหลายคน ถ้าคนเดียวเติม s ถ้าหลายคนไม่เติม คำถามที่ 3 ในตัวเลือกมี will หรือ to หรือ did หรือไม่ ถ้ามีให้ใช้กริยารูปพื้นฐานเปล่าๆ ตามหลัง ท่องสามข้อนี้จนติดปาก แล้วคุณจะเก็บข้อกาลเวลาได้เกือบเต็ม"},{"type":"tip","th":"การบ้านวันนี้ ก่อนนอนให้ท่องกริยาอปกติ 40 คำในตารางแบบออกเสียงดังๆ 1 รอบ แล้วปิดคอลัมน์ช่อง 2 ไว้ ทดสอบตัวเองว่านึกออกกี่คำ พรุ่งนี้ตอนตื่นทดสอบซ้ำอีกรอบก่อนเริ่มบทที่ 5 การท่องแบบทิ้งช่วงข้ามคืนแบบนี้ทำให้จำได้นานกว่าท่องรวดเดียว 20 รอบ"}],"quiz":[{"id":"L04q-001","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา","stem":"Ms. Carter _____ the monthly sales report every Monday.","choices":["prepare","prepared","prepares","will prepare"],"answer":2,"th":{"stem":"คุณคาร์เตอร์_____รายงานยอดขายรายเดือนทุกวันจันทร์","choices":["เตรียม (รูปพื้นฐาน)","เตรียม (อดีต ช่อง 2)","เตรียม (ปัจจุบัน เติม s)","จะเตรียม (อนาคต)"]},"explain":{"why":"ท้ายประโยคมีคำว่า every Monday แปลว่าทุกวันจันทร์ เป็นสัญญาณของเรื่องที่ทำเป็นประจำ ต้องใช้ present simple (ปัจจุบันกาลธรรมดา) และประธานคือ Ms. Carter ซึ่งเป็นผู้หญิงคนเดียว เท่ากับ she จึงต้องเติม s ที่กริยา กลายเป็น prepares","wrong":{"0":"prepare เป็นรูปพื้นฐาน ใช้กับประธาน I you we they หรือคนหลายคนเท่านั้น แต่ประธานนี้คือคนเดียว จึงต้องเติม s","1":"prepared เป็นกริยาช่อง 2 บอกอดีต แต่ประโยคนี้พูดถึงสิ่งที่ทำทุกวันจันทร์ ซึ่งยังทำอยู่จนถึงตอนนี้ ไม่ใช่เรื่องที่จบไปแล้ว","3":"will prepare แปลว่าจะเตรียมในอนาคต ขัดกับ every Monday ที่บอกว่าเป็นกิจวัตรทำซ้ำอยู่แล้ว"},"point":"เห็นคำว่า every ตามด้วยหน่วยเวลา (every day, every week, every Monday) ให้ใช้ present simple ทันที","trick":"อ่านคำสองสามคำสุดท้ายของประโยคก่อน คำบอกเวลามักซ่อนอยู่ตรงนั้น เจอ every เมื่อไหร่ตัดตัวเลือกที่เป็นอดีตและอนาคตทิ้งได้ทันที"},"vocab":[{"w":"monthly","ipa":"/ˈmʌnθli/","th":"มันธ์-ลี่","mean":"รายเดือน ทุกเดือน","pos":"adj."}]},{"id":"L04q-002","part":5,"tier":"easy","topic":"tense-past-simple","topicTh":"อดีตกาลธรรมดา","stem":"The delivery truck _____ at the warehouse two hours ago.","choices":["arrived","arrives","will arrive","arrive"],"answer":0,"th":{"stem":"รถบรรทุกส่งของ_____ที่คลังสินค้าเมื่อสองชั่วโมงที่แล้ว","choices":["มาถึง (อดีต)","มาถึง (ปัจจุบัน เติม s)","จะมาถึง (อนาคต)","มาถึง (รูปพื้นฐาน)"]},"explain":{"why":"คำว่า two hours ago แปลว่าเมื่อสองชั่วโมงที่แล้ว เป็นเวลาที่ผ่านไปแล้ว จึงต้องใช้ past simple (อดีตกาลธรรมดา) คือ arrived ซึ่ง arrive มี e อยู่ท้ายแล้วจึงเติมแค่ d","wrong":{"1":"arrives เป็นปัจจุบันกาล ใช้กับเรื่องที่ทำเป็นประจำ ขัดกับคำว่า ago ที่ชี้ชัดว่าเรื่องจบไปแล้ว","2":"will arrive แปลว่าจะมาถึงในอนาคต แต่ ago บอกว่าเหตุการณ์เกิดไปแล้ว สองอย่างนี้อยู่คนละทิศทาง","3":"arrive เป็นรูปพื้นฐาน นอกจากจะไม่บอกอดีตแล้ว ยังใช้กับประธานเอกพจน์อย่าง the truck ไม่ได้ด้วย ผิดสองชั้น"},"point":"คำว่า ago จะวางไว้หลังจำนวนเวลาเสมอ และบังคับให้ใช้กริยาช่อง 2 ร้อยเปอร์เซ็นต์","trick":"ago กับ in สลับกันหลอกบ่อย two hours ago คือสองชั่วโมงที่แล้ว (อดีต) แต่ in two hours คืออีกสองชั่วโมง (อนาคต) ให้ดูว่าคำไหนอยู่หน้าอยู่หลังตัวเลข"},"vocab":[{"w":"warehouse","ipa":"/ˈwerhaʊs/","th":"แวร์-เฮาส์","mean":"คลังสินค้า โกดัง","pos":"n."}]},{"id":"L04q-003","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล","stem":"Mr. Lopez _____ the new client in Tokyo next Tuesday.","choices":["met","meet","meeting","will meet"],"answer":3,"th":{"stem":"คุณโลเปซ_____ลูกค้ารายใหม่ที่โตเกียวในวันอังคารหน้า","choices":["พบ (อดีต)","พบ (รูปพื้นฐาน)","กำลังพบ (รูป -ing)","จะพบ (อนาคต)"]},"explain":{"why":"คำว่า next Tuesday แปลว่าวันอังคารหน้า ซึ่งยังมาไม่ถึง ต้องใช้รูปอนาคตคือ will ตามด้วยกริยารูปพื้นฐาน จึงได้ will meet","wrong":{"0":"met เป็นกริยาช่อง 2 ของ meet บอกอดีต แต่ next Tuesday คือเวลาข้างหน้า ใช้ด้วยกันไม่ได้","1":"mee tem":"Mr. Silva _____ to Singapore three days ago for the annual trade fair.","choices":["flies","will fly","flew","flying"],"answer":2,"th":{"stem":"คุณซิลวา_____ไปสิงคโปร์เมื่อสามวันก่อนเพื่อไปงานแสดงสินค้าประจำปี","choices":["บิน (ปัจจุบัน เติม s)","จะบิน (อนาคต)","บิน (อดีต ช่อง 2)","กำลังบิน (รูป -ing)"]},"explain":{"why":"three days ago แปลว่าเมื่อสามวันที่แล้ว เป็นอดีต จึงต้องใช้กริยาช่อง 2 คำว่า fly เป็นกริยาอปกติ ช่อง 2 คือ flew อ่านว่า ฟลู","wrong":{"0":"flies เป็นปัจจุบันกาลใช้กับเรื่องที่ทำเป็นประจำ แต่ ago ชี้ว่าเหตุการณ์นี้เกิดครั้งเดียวและจบไปแล้ว","1":"will fly เป็นอนาคต ขัดกับ ago ที่บอกว่าเรื่องผ่านไปแล้วสามวัน","3":"flying เป็นรูป -ing ยืนเป็นกริยาตามลำพังไม่ได้ ต้องมี is หรือ was นำหน้า"},"point":"จำนวน + หน่วยเวลา + ago เป็นชุดคำบอกอดีตที่ TOEIC ใช้บ่อยที่สุดชุดหนึ่ง","trick":"กริยาอปกติที่เกี่ยวกับการเดินทางออกสอบบ่อย ท่องคู่นี้ไว้ fly-flew, go-went, take-took, leave-left, come-came"},"vocab":[{"w":"annual","ipa":"/ˈænjuəl/","th":"แอน-นวล","mean":"ประจำปี ทุกๆ ปี","pos":"adj."},{"w":"trade fair","ipa":"/ˈtreɪd fer/","th":"เทรด แฟร์","mean":"งานแสดงสินค้า","pos":"n."}]}]},"lessons/L05":{"id":"L05","day":5,"title":"ประธานกับกริยาต้องเข้าคู่กัน + คำนำหน้านาม a/an/the","goalTh":"จบบทนี้แล้วคุณจะหาประธานตัวจริงของประโยคเจอแม้จะมีคำมาคั่นเยอะแค่ไหน เลือกกริยาให้เข้าคู่กับประธานได้ถูก และรู้ว่าเมื่อไหร่ต้องใส่ a an the เมื่อไหร่ห้ามใส่ รวมถึงเลือก much many few little ได้ถูกทุกครั้ง","minutes":35,"blocks":[{"type":"text","th":"เมื่อวานเราคุยกันเรื่องกาลเวลา และตอนท้ายผมแอบเกริ่นไว้ว่า ถ้าประโยคไม่มีคำบอกเวลาให้ดู เราต้องหันไปดูประธานแทน วันนี้เราจะเจาะเรื่องนั้นให้ลึก เรียกว่า subject-verb agreement (ซับ-เจ็คท์ เวิร์บ อะ-กรี-เม้นท์ = การทำให้ประธานกับกริยาเข้าคู่กัน) พูดง่ายๆ คือถ้าประธานมีตัวเดียว กริยาต้องเป็นรูปเอกพจน์ ถ้าประธานมีหลายตัว กริยาต้องเป็นรูปพหูพจน์ ห้ามใส่ผิดคู่ ข้อสอบ TOEIC ชุดหนึ่งมีเรื่องนี้ราว 2-4 ข้อ และเกือบทุกข้อจะใส่กับดักไว้ ผมจะสอนกับดักทั้งหมดให้ในบทนี้"},{"type":"text","th":"ทบทวนพื้นฐานก่อน คำว่า เอกพจน์ (singular = มีอย่างเดียว) กับ พหูพจน์ (plural = มีมากกว่าหนึ่ง) ในภาษาไทยเราไม่แยก จะพูดว่า พนักงานมา ก็ใช้ได้ทั้งคนเดียวและร้อยคน แต่ภาษาอังกฤษต้องแยกให้ชัด และตัวกริยาต้องเปลี่ยนตามด้วย ตารางข้างล่างคือหน้าตาของกริยาที่คุณต้องจำให้แม่น สังเกตให้ดีว่า be-verb (กริยาช่วยที่แปลว่า เป็น อยู่ คือ) เปลี่ยนรูปเยอะที่สุด"},{"type":"table","head":["ประเภทประธาน","ตัวอย่างประธาน","be-verb ปัจจุบัน","be-verb อดีต","กริยาทั่วไป ปัจจุบัน"],"rows":[["เอกพจน์ บุรุษที่ 3","he, she, it, Mr. Kim, the report, our team","is","was","เติม -s เช่น works, needs, has"],["พหูพจน์","they, we, the reports, the employees","are","were","รูปพื้นฐาน เช่น work, need, have"],["I (ฉัน)","I","am","was","รูปพื้นฐาน เช่น work, need, have"],["you (คุณ / พวกคุณ)","you","are","were","รูปพื้นฐาน เช่น work, need, have"]]},{"type":"example","en":"The report is ready. The reports are ready.","th":"รายงานฉบับนั้นพร้อมแล้ว / รายงานหลายฉบับนั้นพร้อมแล้ว","note":"เปรียบเทียบให้เห็นชัดๆ ประโยคแรกคำนามไม่มี s กริยาจึงเป็น is ประโยคหลังคำนามมี s กริยาจึงเป็น are จำภาพนี้ไว้เป็นแม่แบบ"},{"type":"text","th":"ทีนี้มาถึงกับดัก ถ้าข้อสอบเขียนง่ายๆ ว่า The report ___ ready ทุกคนก็ตอบถูกหมด เขาจึงไม่เขียนแบบนั้น เขาจะเอาคำหรือวลีมาคั่นระหว่างประธานกับกริยา ให้คุณเผลอไปมองคำที่อยู่ติดช่องว่างแทนที่จะมองประธานตัวจริง นี่คือกับดักที่ 1 และเป็นกับดักที่คนพลาดมากที่สุด วลีที่เอามาคั่นมักขึ้นต้นด้วย of, in, on, for, with, from, along with, as well as, together with, including"},{"type":"example","en":"The box of tools is on the second shelf.","th":"กล่องเครื่องมือวางอยู่บนชั้นที่สอง","note":"หลายคนเห็นคำว่า tools ที่มี s อยู่ติดช่องว่างแล้วรีบตอบ are ซึ่งผิด ประธานตัวจริงคือ box (กล่อง) มีแค่ใบเดียว ส่วน of tools เป็นแค่วลีบอกว่ากล่องอะไร ให้ขีดฆ่าทิ้งได้เลย"},{"type":"example","en":"The new manager, along with three assistants, visits the factory every month.","th":"ผู้จัดการคนใหม่ พร้อมด้วยผู้ช่วยสามคน ไปเยี่ยมโรงงานทุกเดือน","note":"คำว่า along with (พร้อมด้วย) ไม่ได้เพิ่มจำนวนประธาน ประธานตัวจริงยังคงเป็น the new manager คนเดียว กริยาจึงต้องเติม s เป็น visits ต่างจาก and ที่เพิ่มจำนวนจริง ถ้าเขียนว่า The manager and three assistants visit ก็จะเป็นพหูพจน์"},{"type":"warn","th":"ระวังให้มาก คนไทยแพ้กับดักนี้มากที่สุด อย่ามองคำที่อยู่ติดกับช่องว่างแล้วตัดสินใจ ให้ย้อนกลับไปที่ต้นประโยคเสมอ วิธีป้องกันคือใช้ดินสอขีดฆ่าวลีที่ขึ้นต้นด้วย of, in, on, with, along with, as well as, including, together with ออกให้หมดก่อน แล้วอ่านประโยคที่เหลือ ตัวที่เหลืออยู่หน้าสุดนั่นแหละคือประธานตัวจริง คำที่อยู่หลัง of ไม่มีสิทธิ์เป็นประธานเด็ดขาด"},{"type":"text","th":"กับดักที่ 2 คือคำที่หน้าตาเหมือนพหูพจน์แต่จริงๆ แล้วเป็นเอกพจน์ ตัวหลักที่ต้องจำคือ each (แต่ละ) และ every (ทุก) แม้ความหมายไทยจะฟังดูเหมือนมีหลายอัน แต่ในไวยากรณ์อังกฤษถือว่ามองทีละอัน จึงเป็นเอกพจน์เสมอ ตารางข้างล่างคือรายการคำที่ต้องใช้กริยาเอกพจน์ทั้งหมด ให้ท่องไว้เลย"},{"type":"table","head":["คำหรือรูปแบบ","คำแปล","กริยาที่ต้องใช้","ตัวอย่างพร้อมคำแปล"],"rows":[["each + คำนามเอกพจน์","อีช = แต่ละ","เอกพจน์","Each employee has a locker. (พนักงานแต่ละคนมีตู้ล็อกเกอร์)"],["every + คำนามเอกพจน์","เอฟ-วรี่ = ทุก","เอกพจน์","Every order requires a signature. (คำสั่งซื้อทุกใบต้องมีลายเซ็น)"],["each of the + คำนามพหูพจน์","แต่ละคนในกลุ่ม","เอกพจน์","Each of the rooms has a phone. (ห้องแต่ละห้องมีโทรศัพท์)"],["one of the + คำนามพหูพจน์","หนึ่งใน","เอกพจน์","One of the printers is broken. (เครื่องพิมพ์เครื่องหนึ่งเสีย)"],["everyone / everybody / someone / anyone / nobody","ทุกคน / บางคน / ใครก็ตาม / ไม่มีใคร","เอกพจน์","Everyone needs a badge. (ทุกคนต้องมีบัตรพนักงาน)"],["everything / something / nothing","ทุกอย่าง / บางอย่าง / ไม่มีอะไร","เอกพจน์","Everything looks fine. (ทุกอย่างดูเรียบร้อยดี)"],["the number of + คำนามพหูพจน์","จำนวนของ","เอกพจน์","The number of complaints has dropped. (จำนวนคำร้องเรียนลดลงแล้ว)"],["a number of + คำนามพหูพจน์","จำนวนหนึ่ง หลาย","พหูพจน์","A number of guests have arrived. (แขกจำนวนหนึ่งมาถึงแล้ว)"],["ชื่อวิชา ชื่อบริษัทที่ลงท้ายด้วย s","เช่น economics, news, Wilson Brothers","เอกพจน์","The news is encouraging. (ข่าวน่าให้กำลังใจ)"],["จำนวนเงินหรือระยะเวลาที่มองเป็นก้อนเดียว","เช่น two weeks, fifty dollars","เอกพจน์","Two weeks is enough time. (สองสัปดาห์เป็นเวลาที่พอเพียง)"]]},{"type":"text","th":"กับดักที่ 3 คือประโยคที่ขึ้นต้นด้วย there is หรือ there are แปลว่า มี... โครงสร้างนี้พลิกกลับหัว คือของจริงที่เป็นประธานไปอยู่ข้างหลัง ไม่ได้อยู่ข้างหน้า ให้จำว่า there ไม่ใช่ประธาน มันเป็นแค่คำนำ ให้มองข้ามไปดูคำนามที่ตามหลังกริยา ถ้าคำนามนั้นเป็นเอกพจน์ใช้ there is ถ้าเป็นพหูพจน์ใช้ there are ในอดีตก็ใช้ there was กับ there were ตามหลักเดียวกัน"},{"type":"example","en":"There is a package at the reception desk. There are two packages at the reception desk.","th":"มีพัสดุหนึ่งชิ้นอยู่ที่โต๊ะต้อนรับ / มีพัสดุสองชิ้นอยู่ที่โต๊ะต้อนรับ","note":"ให้ดูคำนามหลังกริยาเสมอ ประโยคแรก a package เป็นชิ้นเดียวจึงใช้ is ประโยคหลัง two packages หลายชิ้นจึงใช้ are คิดง่ายๆ ว่าอ่านย้อนจากขวามาซ้าย"},{"type":"tip","th":"เทคนิคหาประธานตัวจริงใน 3 วินาที ขั้นที่ 1 มองหากริยาแท้หรือช่องว่างก่อน ขั้นที่ 2 เดินย้อนซ้ายไปเรื่อยๆ พร้อมขีดฆ่าวลีที่ขึ้นต้นด้วย of, in, on, at, for, with, from, along with, as well as, including, that, who, which ขั้นที่ 3 คำนามตัวแรกที่รอดจากการขีดฆ่าคือประธานตัวจริง ขั้นที่ 4 ถามตัวเองว่าคำนั้นเป็นหนึ่งหรือหลาย แล้วเลือกกริยาให้ตรงกัน ฝึกจนเป็นนิสัยแล้วคุณจะไม่พลาดข้อประเภทนี้อีกเลย"},{"type":"text","th":"ครึ่งหลังของบทนี้เป็นเรื่อง article (อาร์-ทิ-เคิ่ล = คำนำหน้านาม) ได้แก่ a, an, the สามคำนี้ตัวเล็กนิดเดียวแต่ออกสอบทุกชุด และเป็นเรื่องที่คนไทยงงที่สุด เพราะภาษาไทยไม่มีคำแบบนี้เลย เราพูดว่า ผมซื้อหนังสือ ไม่ต้องมีอะไรนำหน้า แต่ภาษาอังกฤษต้องบอกเสมอว่าหนังสือเล่มไหน เล่มที่ผู้ฟังรู้จักอยู่แล้วหรือเล่มไหนก็ได้ นี่คือหน้าที่ของ a, an, the"},{"type":"text","th":"เริ่มจากง่ายที่สุดคือ a กับ an ทั้งคู่แปลว่า หนึ่ง...ที่ยังไม่เจาะจง ใช้กับคำนามนับได้ที่เป็นเอกพจน์เท่านั้น ความต่างมีแค่เรื่องเสียงของคำที่ตามมา และนี่คือจุดที่ต้องระวังมาก กฎที่ถูกต้องคือดูที่ เสียง ไม่ใช่ที่ ตัวอักษร ถ้าคำถัดไปเริ่มด้วยเสียงสระ (อะ อา เอ อี ออ อู เอ็ม เอ็ส) ใช้ an ถ้าเริ่มด้วยเสียงพยัญชนะใช้ a"},{"type":"table"
