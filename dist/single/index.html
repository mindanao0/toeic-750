<title>TOEIC 750 ใน 30 วัน</title>


<style>/* ==========================================================================
   TOEIC 750 — stylesheet
   ปรับธีมด้วย data-theme บน <html>, ปรับขนาดตัวอักษรด้วย --fs
   ========================================================================== */

:root {
  --fs: 1;

  --bg:        #0e1117;
  --bg-soft:   #161b23;
  --card:      #1a2029;
  --card-2:    #212936;
  --line:      #2b3442;
  --line-soft: #232b36;

  --tx:        #e8edf4;
  --tx-dim:    #9aa7b8;
  --tx-faint:  #6b7789;

  --brand:     #4f9cf9;
  --brand-dk:  #2b7de0;
  --brand-sf:  #16304f;

  --ok:        #35c77f;
  --ok-sf:     #10331f;
  --bad:       #f2555a;
  --bad-sf:    #3a1518;
  --warn:      #f5a623;
  --warn-sf:   #3a2a0c;
  --gold:      #ffc94a;

  --r:   14px;
  --r-s: 9px;
  --shadow: 0 4px 20px rgba(0, 0, 0, .3);

  --nav-h: 62px;
  --maxw: 780px;
}

:root[data-theme="light"] {
  --bg:        #f4f6fa;
  --bg-soft:   #ffffff;
  --card:      #ffffff;
  --card-2:    #f0f3f8;
  --line:      #d9e0ea;
  --line-soft: #e8edf3;

  --tx:        #16202e;
  --tx-dim:    #55637a;
  --tx-faint:  #8492a6;

  --brand:     #1f6fdc;
  --brand-dk:  #145bbd;
  --brand-sf:  #e3eefc;

  --ok:        #12a05e;
  --ok-sf:     #dcf5e8;
  --bad:       #d92b32;
  --bad-sf:    #fde3e4;
  --warn:      #b57500;
  --warn-sf:   #fdf0d6;
  --gold:      #c48a00;

  --shadow: 0 3px 14px rgba(20, 35, 60, .09);
}

* { box-sizing: border-box; }

html {
  font-size: calc(16px * var(--fs));
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun",
               "Leelawadee UI", Roboto, "Helvetica Neue", sans-serif;
  line-height: 1.65;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- layout ---------- */

#app {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 14px calc(var(--nav-h) + 28px);
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0 10px;
  background: linear-gradient(var(--bg) 72%, transparent);
  backdrop-filter: blur(6px);
}
.topbar h1 { font-size: 1.12rem; margin: 0; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.topbar .sub { font-size: .78rem; color: var(--tx-dim); font-weight: 500; }

.row  { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.col  { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.spacer { flex: 1; }
.center { text-align: center; }
.hidden { display: none !important; }

.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: repeat(2, 1fr); } }

/* ---------- cards ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px;
  margin-bottom: 12px;
}
.card.tight { padding: 12px; }
.card.flat  { background: var(--card-2); border-color: transparent; }
.card h2 { font-size: 1.02rem; margin: 0 0 10px; font-weight: 700; }
.card h3 { font-size: .93rem; margin: 14px 0 7px; font-weight: 700; color: var(--tx-dim); }

.sec-title {
  font-size: .78rem;
  font-weight: 700;
  color: var(--tx-faint);
  letter-spacing: .07em;
  margin: 20px 2px 9px;
  text-transform: uppercase;
}

/* ---------- buttons ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--tx);
  font: inherit;
  font-weight: 600;
  padding: 11px 16px;
  border-radius: var(--r-s);
  cursor: pointer;
  transition: transform .08s, filter .15s, background .15s;
  text-align: center;
  line-height: 1.35;
}
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--brand-dk); }
.btn.ghost   { background: transparent; }
.btn.danger  { background: var(--bad-sf); border-color: var(--bad); color: var(--bad); }
.btn.ok      { background: var(--ok-sf); border-color: var(--ok); color: var(--ok); }
.btn.block   { display: block; width: 100%; }
.btn.sm      { padding: 7px 11px; font-size: .84rem; }
.btn.lg      { padding: 15px 20px; font-size: 1.05rem; }
.btn.icon    { padding: 8px 11px; font-size: 1.05rem; line-height: 1; }

/* ---------- bottom nav ---------- */

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
}
.nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--tx-faint);
  text-decoration: none;
  font-size: .68rem;
  font-weight: 600;
  padding-top: 4px;
}
.nav a .ic { font-size: 1.28rem; line-height: 1; }
.nav a.on { color: var(--brand); }

/* ---------- pills / badges ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--tx-dim);
  white-space: nowrap;
}
.pill.on  { background: var(--brand-sf); border-color: var(--brand); color: var(--brand); }
.pill.ok  { background: var(--ok-sf);   border-color: var(--ok);   color: var(--ok); }
.pill.bad { background: var(--bad-sf);  border-color: var(--bad);  color: var(--bad); }
.pill.warn{ background: var(--warn-sf); border-color: var(--warn); color: var(--warn); }

.tag {
  font-size: .7rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--card-2);
  color: var(--tx-faint);
}

/* ---------- stat tiles ---------- */

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 11px 8px;
  text-align: center;
}
.tile .v { font-size: 1.42rem; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
.tile .k { font-size: .7rem; color: var(--tx-faint); font-weight: 600; margin-top: 1px; }
.tile .v.gold { color: var(--gold); }
.tile .v.ok   { color: var(--ok); }
.tile .v.br   { color: var(--brand); }

/* ---------- progress ---------- */

.bar {
  height: 9px;
  background: var(--card-2);
  border-radius: 99px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: 99px;
  transition: width .4s ease;
}
.bar.ok > i  { background: var(--ok); }
.bar.warn > i{ background: var(--warn); }
.bar.thin { height: 6px; }

/* ---------- task list ---------- */

.task {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.task:hover { border-color: var(--brand); }
.task.done { opacity: .55; }
.task.done .t-title { text-decoration: line-through; }
.task .t-ic {
  width: 34px; height: 34px;
  flex: 0 0 34px;
  display: flex; align-items: center; justify-content: center;
  background: var(--card-2);
  border-radius: 9px;
  font-size: 1.1rem;
}
.task .t-body { flex: 1; min-width: 0; }
.task .t-title { font-weight: 650; font-size: .93rem; }
.task .t-meta  { font-size: .76rem; color: var(--tx-faint); }
.task .t-chk {
  width: 22px; height: 22px; flex: 0 0 22px;
  border: 2px solid var(--line);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem;
  color: transparent;
}
.task.done .t-chk { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- question UI ---------- */

.qwrap { padding-bottom: 8px; }

.qhead {
  display: flex; align-items: center; gap: 8px;
  font-size: .78rem; color: var(--tx-faint); font-weight: 600;
  margin-bottom: 10px;
}

.qstem {
  font-size: 1.06rem;
  line-height: 1.8;
  font-weight: 550;
  margin: 4px 0 16px;
  word-break: break-word;
}
.qstem .blank { color: var(--brand); font-weight: 800; letter-spacing: .06em; }

.choices { display: flex; flex-direction: column; gap: 9px; }

.choice {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--r-s);
  padding: 12px 13px;
  font: inherit;
  color: var(--tx);
  cursor: pointer;
  transition: border-color .12s, background .12s, transform .08s;
  line-height: 1.6;
}
.choice:active { transform: scale(.99); }
.choice:hover:not(:disabled) { border-color: var(--brand); }
.choice .k {
  flex: 0 0 25px;
  width: 25px; height: 25px;
  border-radius: 50%;
  background: var(--card-2);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 800;
  color: var(--tx-dim);
  margin-top: 1px;
}
.choice .c-tx { flex: 1; min-width: 0; }
.choice .c-th { display: block; font-size: .8rem; color: var(--tx-faint); margin-top: 3px; }

.choice.sel      { border-color: var(--brand); background: var(--brand-sf); }
.choice.sel .k   { background: var(--brand); border-color: var(--brand); color: #fff; }
.choice.right    { border-color: var(--ok); background: var(--ok-sf); }
.choice.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.choice.wrong    { border-color: var(--bad); background: var(--bad-sf); }
.choice.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice.dim      { opacity: .5; }
.choice:disabled { cursor: default; }

/* ---------- explanation ---------- */

.exp {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  animation: slideIn .22s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.exp-head {
  padding: 11px 14px;
  font-weight: 800;
  font-size: .97rem;
  display: flex; align-items: center; gap: 8px;
}
.exp-head.ok  { background: var(--ok-sf);  color: var(--ok); }
.exp-head.bad { background: var(--bad-sf); color: var(--bad); }

.exp-body { padding: 13px 14px; background: var(--card); }
.exp-body > * + * { margin-top: 13px; }

.exp-sec { }
.exp-sec > .lbl {
  font-size: .74rem; font-weight: 800; color: var(--tx-faint);
  letter-spacing: .04em; margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.exp-sec p { margin: 0; font-size: .93rem; line-height: 1.75; }

.exp-wrong { display: flex; flex-direction: column; gap: 7px; }
.exp-wrong .w {
  display: flex; gap: 8px;
  font-size: .88rem; line-height: 1.65;
  background: var(--card-2);
  border-radius: 8px;
  padding: 8px 10px;
}
.exp-wrong .w b { color: var(--bad); flex: 0 0 auto; font-weight: 800; }

.exp-point { background: var(--brand-sf); border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0; padding: 9px 12px; }
.exp-trick { background: var(--warn-sf); border-left: 3px solid var(--warn); border-radius: 0 8px 8px 0; padding: 9px 12px; }

.vocab-chip {
  display: inline-flex; flex-direction: column;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 7px 11px;
  margin: 0 6px 6px 0;
  font-size: .84rem;
  cursor: pointer;
}
.vocab-chip b { font-weight: 700; }
.vocab-chip .ph { font-size: .74rem; color: var(--tx-faint); }
.vocab-chip .mn { font-size: .8rem; color: var(--tx-dim); }

/* ---------- passages ---------- */

.passage {
  background: var(--card-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
  padding: 13px 14px;
  font-size: .95rem;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 12px;
}
.passage .p-head {
  border-bottom: 1px dashed var(--line);
  padding-bottom: 8px;
  margin-bottom: 9px;
  font-size: .84rem;
  color: var(--tx-dim);
  white-space: normal;
}
.passage .p-head b { color: var(--tx); }
.passage .p-kind {
  display: inline-block;
  font-size: .68rem; font-weight: 800; letter-spacing: .05em;
  background: var(--brand-sf); color: var(--brand);
  padding: 2px 8px; border-radius: 5px; margin-bottom: 8px;
}
.passage .mark { color: var(--brand); font-weight: 800; }
.passage .th-tr { color: var(--tx-faint); font-size: .88rem; border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 9px; }

.scene { text-align: center; margin-bottom: 12px; }
.scene svg { max-width: 100%; height: auto; border-radius: var(--r-s); background: #fff; border: 1px solid var(--line); }

/* ---------- audio ---------- */

.audiobox {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 12px;
  text-align: center;
}
.audiobox .big {
  width: 66px; height: 66px;
  border-radius: 50%;
  border: none;
  background: var(--brand);
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
.audiobox .big:active { transform: scale(.93); }
.audiobox .big.playing { animation: pulse 1.25s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,156,249,.45); } 50% { box-shadow: 0 0 0 13px rgba(79,156,249,0); } }
.audiobox .hint { font-size: .8rem; color: var(--tx-faint); margin-top: 9px; }

.script-box {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 11px 12px;
  margin-top: 11px;
  font-size: .9rem;
  line-height: 1.75;
}
.script-box .ln { margin-bottom: 8px; }
.script-box .sp { font-weight: 800; color: var(--brand); }
.script-box .th { color: var(--tx-faint); font-size: .84rem; display: block; }

/* ---------- flashcards ---------- */

.fc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 30px 18px;
  text-align: center;
  min-height: 236px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
}
.fc .w    { font-size: 2.05rem; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
.fc .ipa  { font-size: .95rem; color: var(--tx-dim); }
.fc .thr  { font-size: 1.08rem; color: var(--brand); font-weight: 700; }
.fc .pos  { font-size: .78rem; color: var(--tx-faint); }
.fc .mean { font-size: 1.14rem; font-weight: 650; margin-top: 4px; }
.fc .ex   { font-size: .9rem; color: var(--tx-dim); margin-top: 10px; font-style: italic; }
.fc .exth { font-size: .84rem; color: var(--tx-faint); }

/* ---------- charts ---------- */

.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }

.hbar { display: flex; flex-direction: column; gap: 9px; }
.hbar .r { display: flex; align-items: center; gap: 9px; font-size: .85rem; }
.hbar .r .lb { flex: 0 0 84px; color: var(--tx-dim); font-weight: 600; }
.hbar .r .tr { flex: 1; height: 17px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.hbar .r .tr > i { display: block; height: 100%; border-radius: 99px; transition: width .5s; }
.hbar .r .vl { flex: 0 0 52px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- lesson blocks ---------- */

.lb-text  { font-size: .98rem; line-height: 1.9; margin: 0 0 13px; }
.lb-ex {
  background: var(--card-2);
  border-left: 3px solid var(--brand);
  border-radius: 0 var(--r-s) var(--r-s) 0;
  padding: 10px 13px;
  margin: 0 0 13px;
}
.lb-ex .en { font-size: 1rem; font-weight: 600; }
.lb-ex .th { font-size: .89rem; color: var(--tx-dim); margin-top: 2px; }
.lb-ex .nt { font-size: .82rem; color: var(--tx-faint); margin-top: 6px; }
.lb-ex .spk { float: right; margin-left: 8px; }

.lb-tip, .lb-warn {
  border-radius: var(--r-s);
  padding: 11px 13px;
  margin: 0 0 13px;
  font-size: .92rem;
  line-height: 1.75;
  display: flex; gap: 9px;
}
.lb-tip  { background: var(--ok-sf); border: 1px solid var(--ok); }
.lb-warn { background: var(--warn-sf); border: 1px solid var(--warn); }

.tbl-wrap { overflow-x: auto; margin: 0 0 13px; -webkit-overflow-scrolling: touch; }
table.lb-tbl { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 300px; }
table.lb-tbl th, table.lb-tbl td {
  border: 1px solid var(--line);
  padding: 7px 10px;
  text-align: left;
  vertical-align: top;
}
table.lb-tbl th { background: var(--card-2); font-weight: 700; white-space: nowrap; }

/* ---------- modal / toast ---------- */

.modal-bg {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0, 0, 0, .6);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
  animation: fade .18s;
}
@keyframes fade { from { opacity: 0; } }
@media (min-width: 560px) { .modal-bg { align-items: center; padding: 20px; } }

.modal {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px;
  animation: up .22s ease;
}
@media (min-width: 560px) { .modal { border-radius: var(--r); } }
@keyframes up { from { transform: translateY(18px); opacity: .4; } }
.modal h2 { margin: 0 0 12px; font-size: 1.1rem; }

.toast {
  position: fixed;
  left: 50%; bottom: calc(var(--nav-h) + 16px);
  transform: translateX(-50%);
  z-index: 95;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 99px;
  padding: 10px 18px;
  font-size: .89rem;
  font-weight: 600;
  animation: up .2s;
  max-width: 90vw;
  text-align: center;
}
.toast.ok  { border-color: var(--ok);  color: var(--ok); }
.toast.bad { border-color: var(--bad); color: var(--bad); }

/* ---------- timer ---------- */

.timerbar {
  position: sticky; top: 0; z-index: 41;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 9px 13px;
  margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}
.timerbar .t { font-size: 1.12rem; font-weight: 800; }
.timerbar.low .t { color: var(--bad); }
.timerbar .lbl { font-size: .78rem; color: var(--tx-faint); }

/* ---------- misc ---------- */

.muted { color: var(--tx-dim); }
.faint { color: var(--tx-faint); }
.small { font-size: .84rem; }
.tiny  { font-size: .74rem; }
.b     { font-weight: 700; }
.mono  { font-variant-numeric: tabular-nums; }
.nowrap{ white-space: nowrap; }
.mt    { margin-top: 12px; }
.mb0   { margin-bottom: 0; }

.empty {
  text-align: center;
  color: var(--tx-faint);
  padding: 34px 16px;
  font-size: .92rem;
  line-height: 1.8;
}
.empty .big { font-size: 2.6rem; display: block; margin-bottom: 8px; }

hr.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

a { color: var(--brand); }

.seg {
  display: flex;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 3px;
  gap: 3px;
}
.seg button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--tx-dim);
  font: inherit;
  font-weight: 650;
  font-size: .85rem;
  padding: 7px 6px;
  border-radius: 6px;
  cursor: pointer;
}
.seg button.on { background: var(--brand); color: #fff; }

input[type="range"] { width: 100%; accent-color: var(--brand); }
input[type="text"], input[type="date"], input[type="time"], select, textarea {
  width: 100%;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: var(--r-s);
  padding: 9px 11px;
  font: inherit;
  font-size: .92rem;
}
label.field { display: block; margin-bottom: 13px; }
label.field > span { display: block; font-size: .82rem; color: var(--tx-dim); font-weight: 600; margin-bottom: 5px; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
.switch .lbl { font-size: .93rem; font-weight: 600; }
.switch .lbl small { display: block; font-size: .76rem; color: var(--tx-faint); font-weight: 400; }
.switch input { width: auto; accent-color: var(--brand); transform: scale(1.25); }

.xpfly {
  position: fixed;
  z-index: 99;
  font-weight: 800;
  color: var(--gold);
  pointer-events: none;
  animation: fly 1s ease-out forwards;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
}
@keyframes fly { to { transform: translateY(-58px); opacity: 0; } }

@media print {
  .nav, .topbar, .btn, .no-print { display: none !important; }
  #app { padding: 0; max-width: 100%; }
  body { background: #fff; color: #000; }
  .card, .passage, .exp { border-color: #bbb; break-inside: avoid; background: #fff; }
  .exp-head.ok, .exp-head.bad { background: #eee !important; color: #000 !important; }
}
</style>

<script>window.__MANIFEST__={"drills":["p5e-01","p5e-02"],"tests":[],"lessons":["L01","L02","L03","L04","L05","L06","L07"],"vocab":["vocab-01","vocab-02"],"static":["plan30"]};window.__DATA__={"drills/p5e-01":{"meta":{"batch":"p5e-01","part":5,"tier":"easy","count":50},"items":[{"id":"p5e-01-001","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา + verb to be","stem":"Ms. Carter _____ the office manager at our Bangkok branch.","choices":["is","are","be","being"],"answer":0,"th":{"stem":"คุณคาร์เตอร์_____ผู้จัดการสำนักงานที่สาขากรุงเทพของเรา","choices":["เป็น/คือ (ใช้กับประธานเอกพจน์)","เป็น/คือ (ใช้กับประธานพหูพจน์)","เป็น (รูปพื้นฐาน ยังไม่ผัน)","กำลังเป็น (รูปเติม -ing)"]},"explain":{"why":"ประธาน (subject = ผู้ทำ หรือ ตัวหลักของประโยค) คือ Ms. Carter ซึ่งเป็นคนเดียว = เอกพจน์ (singular = มีแค่หนึ่ง) และประโยคนี้พูดถึงเรื่องปัจจุบัน จึงต้องใช้ verb to be (กริยาที่แปลว่า เป็น/อยู่/คือ) รูป is ครับ","wrong":{"1":"are ใช้กับประธานพหูพจน์ (plural = มากกว่าหนึ่ง) เช่น they, the managers แต่ในข้อนี้มีคุณคาร์เตอร์คนเดียว","2":"be เป็นรูปพื้นฐานที่ยังไม่ผันตามประธาน วางเดี่ยวๆ ในประโยคบอกเล่าไม่ได้ ต้องมี will, must หรือ to นำหน้า เช่น will be","3":"being เป็นรูปเติม -ing ของ be ต้องมี is/am/are/was นำหน้าเสมอ จะยืนตามลำพังไม่ได้"},"point":"ประธานคนเดียว/สิ่งเดียว + ปัจจุบัน ใช้ is, ประธานหลายคน ใช้ are, ประธาน I ใช้ am","trick":"มองคำหน้าช่องว่างอย่างเดียวก่อนว่าเป็นคนเดียวหรือหลายคน แค่นี้ก็ตัดตัวเลือกทิ้งได้ครึ่งหนึ่งแล้ว"},"vocab":[{"w":"branch","ipa":"/bræntʃ/","th":"**แบรนช์**","mean":"สาขา (ที่ทำการย่อยของบริษัทหรือธนาคาร)","pos":"n."}]},{"id":"p5e-01-002","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา + verb to be","stem":"The new employees _____ very friendly to every customer.","choices":["is","are","am","be"],"answer":1,"th":{"stem":"พนักงานใหม่ทั้งหลาย_____เป็นมิตรมากกับลูกค้าทุกคน","choices":["เป็น (ใช้กับเอกพจน์)","เป็น (ใช้กับพหูพจน์)","เป็น (ใช้กับ I เท่านั้น)","เป็น (รูปพื้นฐาน)"]},"explain":{"why":"ดูที่คำว่า employees มีตัว s ต่อท้าย แปลว่าพนักงานหลายคน = พหูพจน์ (plural = มากกว่าหนึ่ง) เมื่อประธานเป็นพหูพจน์และเป็นเรื่องปัจจุบัน verb to be (กริยาแปลว่า เป็น/อยู่/คือ) ต้องใช้รูป are","wrong":{"0":"is ใช้กับประธานเอกพจน์ (singular = มีแค่หนึ่ง) เท่านั้น เช่น the employee แต่ตรงนี้มี s แสดงว่าหลายคน","2":"am ใช้ได้กับประธาน I (ฉัน) คำเดียวในโลกนี้เท่านั้น ห้ามใช้กับคำอื่นเด็ดขาด","3":"be เป็นรูปดิบที่ยังไม่ผันตามประธาน ในประโยคบอกเล่าธรรมดาต้องผันเป็น is/am/are ก่อนเสมอ"},"point":"เห็นคำนามลงท้ายด้วย s (พหูพจน์) ให้เลือก are ทันที","trick":"หา s ท้ายคำนามที่เป็นประธานก่อนเลย มี s = are, ไม่มี s = is จบใน 3 วินาที"},"vocab":[{"w":"employee","ipa":"/ɪmˈplɔɪiː/","th":"เอม-**พลอย**-อี","mean":"พนักงาน, ลูกจ้าง","pos":"n."}]},{"id":"p5e-01-003","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา","stem":"Mr. Lee _____ to the office by train every morning.","choices":["come","is come","comes","coming"],"answer":2,"th":{"stem":"คุณลี_____ที่ทำงานโดยรถไฟทุกเช้า","choices":["มา (รูปพื้นฐาน ไม่เติม s)","เป็นมา (รูปที่ผิดหลักภาษา)","มา (เติม s ตามประธานเอกพจน์)","กำลังมา (รูปเติม -ing)"]},"explain":{"why":"คำว่า every morning (ทุกเช้า) บอกว่าเป็นเรื่องที่ทำเป็นประจำ จึงต้องใช้ present simple (ปัจจุบันกาลธรรมดา ใช้เล่าเรื่องที่ทำซ้ำๆ เป็นกิจวัตร) และเพราะประธานคือ Mr. Lee คนเดียว = เอกพจน์ กริยาต้องเติม s กลายเป็น comes","wrong":{"0":"come ที่ไม่เติม s ใช้กับประธาน I, you, we, they เท่านั้น ไม่ใช่กับคนเดียวอย่าง Mr. Lee","1":"is come ผิดหลัก เพราะ come เป็นกริยาแท้อยู่แล้ว ไม่ต้องมี is นำหน้า ถ้าจะใช้ is ต้องเป็น is coming","3":"coming เป็นรูปเติม -ing ยืนเดี่ยวไม่ได้ ต้องมี is/am/are นำหน้าเสมอ"},"point":"every + ช่วงเวลา (every day, every morning) เป็นสัญญาณของปัจจุบันกาลธรรมดา ประธานคนเดียวให้เติม s ที่กริยา","trick":"เจอ every ให้ตัดตัวเลือกที่เป็นอดีตหรือ -ing ทิ้งก่อน แล้วค่อยดูว่าต้องเติม s ไหม"},"vocab":[{"w":"office","ipa":"/ˈɔːfɪs/","th":"**ออฟ**-ฟิศ","mean":"สำนักงาน, ที่ทำงาน","pos":"n."}]},{"id":"p5e-01-004","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา","stem":"Our manager _____ a short meeting with us every Monday.","choices":["are having","have","having","has"],"answer":3,"th":{"stem":"ผู้จัดการของเรา_____ประชุมสั้นๆ กับพวกเราทุกวันจันทร์","choices":["กำลังมี (ใช้กับพหูพจน์)","มี (รูปพื้นฐาน)","กำลังมี (รูปเติม -ing)","มี (รูปเติม s ของ have)"]},"explain":{"why":"every Monday (ทุกวันจันทร์) บอกว่าเป็นกิจวัตร ต้องใช้ปัจจุบันกาลธรรมดา และประธานคือ Our manager คนเดียว = เอกพจน์ กริยา have เมื่อใช้กับเอกพจน์จะเปลี่ยนรูปเป็น has ไม่ใช่ haves","wrong":{"0":"are having ผิดสองชั้น คือ are ใช้กับประธานหลายคน และรูปกำลังทำก็ไม่เข้ากับคำว่า every Monday ที่แปลว่าทำเป็นประจำ","1":"have ใช้กับประธาน I, you, we, they เท่านั้น ไม่ใช้กับคนเดียวอย่าง our manager","2":"having เป็นรูปเติม -ing วางเดี่ยวๆ เป็นกริยาแท้ของประโยคไม่ได้ ต้องมี is นำหน้า"},"point":"have เป็นคำพิเศษ ประธานเอกพจน์ไม่ได้เติม s เฉยๆ แต่ต้องเปลี่ยนเป็น has","trick":"จำคู่นี้ให้ขึ้นใจ he/she/it + has ส่วน I/you/we/they + have"},"vocab":[{"w":"meeting","ipa":"/ˈmiːtɪŋ/","th":"**มี**-ทิ่ง","mean":"การประชุม","pos":"n."}]},{"id":"p5e-01-005","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา + verb to be","stem":"I _____ ready for the training class now.","choices":["is","am","are","be"],"answer":1,"th":{"stem":"ฉัน_____พร้อมสำหรับคลาสอบรมแล้วตอนนี้","choices":["เป็น (ใช้กับ he/she/it)","เป็น (ใช้กับ I เท่านั้น)","เป็น (ใช้กับพหูพจน์)","เป็น (รูปพื้นฐาน)"]},"explain":{"why":"ประธานคือ I (ฉัน) ซึ่งเป็นคำเดียวในภาษาอังกฤษที่ใช้คู่กับ am เสมอ ไม่ว่าจะอยู่ในประโยคแบบไหน ถ้าเป็นเรื่องปัจจุบันก็ต้อง I am เท่านั้น","wrong":{"0":"is ใช้กับ he, she, it หรือชื่อคนคนเดียว ไม่เคยใช้กับ I","2":"are ใช้กับ you, we, they หรือคำนามพหูพจน์ ไม่ใช้กับ I","3":"be เป็นรูปดิบ ต้องผันก่อนใช้ในประโยคบอกเล่า ถ้าไม่ผันจะต้องมี will หรือ to นำหน้า"},"point":"ท่องคู่หูให้ติดปาก I am, He/She/It is, You/We/They are","trick":"เห็น I เป็นประธานเมื่อไร ให้กาที่ am ก่อนแล้วค่อยอ่านประโยคทวนอีกที"},"vocab":[{"w":"training","ipa":"/ˈtreɪnɪŋ/","th":"**เทรน**-นิ่ง","mean":"การฝึกอบรม","pos":"n."}]},{"id":"p5e-01-006","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา","stem":"The store _____ at nine o'clock every day.","choices":["open","opening","opens","to open"],"answer":2,"th":{"stem":"ร้าน_____ตอนเก้าโมงทุกวัน","choices":["เปิด (รูปพื้นฐาน ไม่เติม s)","กำลังเปิด (รูปเติม -ing)","เปิด (เติม s ตามประธานเอกพจน์)","เพื่อเปิด (to + กริยา)"]},"explain":{"why":"every day (ทุกวัน) บอกชัดว่าเป็นเรื่องที่เกิดเป็นประจำ จึงใช้ปัจจุบันกาลธรรมดา และประธาน The store เป็นสิ่งเดียว = เอกพจน์ กริยาจึงต้องเติม s เป็น opens","wrong":{"0":"open ที่ไม่เติม s ใช้กับประธานพหูพจน์ เช่น the stores open ถ้าประธานมีตัวเดียวต้องเติม s","1":"opening ต้องมี is นำหน้าถึงจะเป็นกริยาได้ และรูปกำลังทำก็ขัดกับคำว่า every day","3":"to open คือ to + กริยา ใช้เป็นกริยาแท้ของประโยคไม่ได้ ประโยคจะไม่มีกริยาหลักเลย"},"point":"ประโยคหนึ่งต้องมีกริยาแท้ที่ผันตามประธานเสมอ รูป -ing และ to + กริยา ไม่ใช่กริยาแท้","trick":"ตัด to + กริยา และ -ing ที่ไม่มีตัวช่วยทิ้งก่อน เหลือแค่สองตัวให้เลือกว่าเติม s หรือไม่"},"vocab":[{"w":"store","ipa":"/stɔːr/","th":"**สโตร์**","mean":"ร้านค้า","pos":"n."}]},{"id":"p5e-01-007","part":5,"tier":"easy","topic":"tense-present-simple","topicTh":"ปัจจุบันกาลธรรมดา + verb to be","stem":"We _____ in the meeting room on the second floor.","choices":["is","am","be","are"],"answer":3,"th":{"stem":"พวกเรา_____อยู่ในห้องประชุมชั้นสอง","choices":["อยู่ (ใช้กับเอกพจน์)","อยู่ (ใช้กับ I)","อยู่ (รูปพื้นฐาน)","อยู่ (ใช้กับพหูพจน์)"]},"explain":{"why":"ประธานคือ We (พวกเรา) เป็นคนหลายคน = พหูพจน์ verb to be ที่คู่กับ we คือ are เสมอ ในที่นี้ are แปลว่า อยู่ (บอกตำแหน่งที่อยู่)","wrong":{"0":"is ใช้กับประธานคนเดียวหรือสิ่งเดียว เช่น he, she, it ไม่ใช้กับ we","1":"am ใช้กับประธาน I เท่านั้น เป็นคำเดียวที่ผูกกับ I","2":"be เป็นรูปดิบยังไม่ผัน ในประโยคบอกเล่าปัจจุบันต้องผันเป็น is/am/are ก่อน"},"point":"verb to be ไม่ได้แปลว่า เป็น อย่างเดียว แต่แปลว ่องใหญ่ใช้ in กล่องกลางคือวันใช้ on จุดเล็กสุดคือนาฬิกาใช้ at"},"vocab":[{"w":"company","ipa":"/ˈkʌmpəni/","th":"**คัม**-พะ-นี่","mean":"บริษัท","pos":"n."}]},{"id":"p5e-01-043","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"The delivery will arrive _____ Monday morning before ten.","choices":["at","in","on","of"],"answer":2,"th":{"stem":"ของจะมาส่ง_____เช้าวันจันทร์ก่อนสิบโมง","choices":["ตอน (ใช้กับเวลานาฬิกา)","ใน (ใช้กับเดือน ปี)","ใน (ใช้กับวัน)","ของ (แสดงความเป็นเจ้าของ)"]},"explain":{"why":"ปกติเราพูดว่า in the morning แต่ถ้ามีชื่อวันมาอยู่ข้างหน้าเมื่อไร เช่น Monday morning ให้ถือว่าเป็นวันหนึ่งวัน จึงเปลี่ยนไปใช้ on ทันที","wrong":{"0":"at ใช้กับเวลานาฬิกา เช่น at ten แต่ Monday morning เป็นชื่อวัน ไม่ใช่ตัวเลขนาฬิกา","1":"in ใช้ได้กับ the morning ที่ไม่มีชื่อวัน แต่พอมีคำว่า Monday นำหน้าก็ต้องเปลี่ยนเป็น on","3":"of แปลว่า ของ ใช้บอกความเป็นเจ้าของ ไม่ใช้กับเวลา"},"point":"มีชื่อวันอยู่ในวลี ให้ใช้ on เสมอ แม้จะมีคำว่า morning หรือ evening ตามมา","trick":"เห็นชื่อวัน Monday, Friday, Sunday โผล่มาในช่องเวลาเมื่อไร กา on ได้เลย"},"vocab":[{"w":"delivery","ipa":"/dɪˈlɪvəri/","th":"ดิ-**ลิฟ**-เวอ-รี่","mean":"การส่งของ, ของที่ส่งมา","pos":"n."}]},{"id":"p5e-01-044","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"Mr. Torres always checks his email _____ the morning.","choices":["on","at","of","in"],"answer":3,"th":{"stem":"คุณตอร์เรสตรวจอีเมลของเขา_____ตอนเช้าเสมอ","choices":["ใน (ใช้กับวัน)","ตอน (ใช้กับเวลานาฬิกา)","ของ (แสดงความเป็นเจ้าของ)","ใน (ใช้กับช่วงของวัน)"]},"explain":{"why":"ช่วงของวัน ได้แก่ the morning, the afternoon, the evening ให้ใช้ in ทั้งหมด เพราะเป็นช่วงเวลาที่กินเวลาหลายชั่วโมง ไม่ใช่จุดเดียว","wrong":{"0":"on ใช้กับวันหรือวันที่ ถ้าจะใช้ on ต้องมีชื่อวันด้วย เช่น on Monday morning","1":"at ใช้กับจุดเวลา เช่น at seven มีข้อยกเว้นคือ at night เท่านั้นที่ใช้ at","2":"of แปลว่า ของ ไม่ได้ใช้บอกเวลา ใส่แล้วประโยคจะไม่มีความหมาย"},"point":"in the morning, in the afternoon, in the evening แต่ at night เป็นข้อยกเว้นเดียว","trick":"ท่องสามตัวคู่กับ in แล้วจำข้อยกเว้น at night ไว้ตัวเดียว ก็ตอบได้หมดทุกข้อ"},"vocab":[{"w":"always","ipa":"/ˈɔːlweɪz/","th":"**ออล**-เวย์ส","mean":"เสมอ, ตลอดเวลา","pos":"adv."}]},{"id":"p5e-01-045","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"Our office is very busy _____ December every year.","choices":["at","in","on","to"],"answer":1,"th":{"stem":"ออฟฟิศของเรายุ่งมาก_____เดือนธันวาคมของทุกปี","choices":["ตอน (ใช้กับเวลานาฬิกา)","ใน (ใช้กับเดือน)","ใน (ใช้กับวันที่)","ไปยัง (บอกทิศทาง)"]},"explain":{"why":"ชื่อเดือนเป็นช่วงเวลายาวประมาณสามสิบวัน จึงใช้ in เหมือนกับปีและฤดูกาล พูดว่า in December, in May, in January","wrong":{"0":"at ใช้กับจุดเวลาแคบๆ อย่างเวลานาฬิกา ไม่ใช้กับเดือนทั้งเดือน","2":"on ใช้เมื่อระบุวันที่ด้วย เช่น on December 5 แต่ถ้าบอกแค่ชื่อเดือนเปล่าๆ ต้องใช้ in","3":"to แปลว่าไปยัง เป็นคำบอกทิศทางหรือปลายทาง ไม่ใช้บอกเวลาแบบนี้"},"point":"ชื่อเดือนเปล่าๆ ใช้ in แต่ถ้ามีตัวเลขวันที่ตามมา ให้เปลี่ยนเป็น on ทันที","trick":"ดูว่ามีตัวเลขวันที่ต่อท้ายชื่อเดือนหรือไม่ ไม่มีตัวเลขตอบ in มีตัวเลขตอบ on"},"vocab":[{"w":"December","ipa":"/dɪˈsembər/","th":"ดิ-**เซม**-เบอร์","mean":"เดือนธันวาคม","pos":"n."}]},{"id":"p5e-01-046","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"The company party will be held _____ July 15.","choices":["in","at","on","of"],"answer":2,"th":{"stem":"งานเลี้ยงบริษัทจะจัดขึ้น_____วันที่ 15 กรกฎาคม","choices":["ใน (ใช้กับเดือนเปล่าๆ)","ตอน (ใช้กับเวลานาฬิกา)","ใน (ใช้กับวันที่)","ของ (แสดงความเป็นเจ้าของ)"]},"explain":{"why":"เมื่อระบุวันที่เจาะจง เช่น July 15 แปลว่าเจาะจงลงมาเหลือวันเดียว จึงต้องใช้ on เหมือนกับที่ใช้กับชื่อวันในสัปดาห์","wrong":{"0":"in ใช้กับชื่อเดือนที่ไม่มีวันที่ เช่น in July แต่พอมีเลข 15 ตามมาก็ต้องเปลี่ยนเป็น on","1":"at ใช้กับเวลานาฬิกา ไม่ใช้กับวันที่","3":"of แปลว่า ของ ใช้บอกความเป็นเจ้าของ ไม่ใช้บอกวันเวลา"},"point":"เจาะจงเหลือวันเดียวเมื่อไร ให้ใช้ on ไม่ว่าจะเป็นชื่อวันหรือวันที่","trick":"เห็นตัวเลขวันที่อยู่หลังชื่อเดือน ให้กา on ได้เลยโดยไม่ต้องคิด"},"vocab":[{"w":"hold","ipa":"/hoʊld/","th":"**โฮลด์**","mean":"จัด (งาน หรือการประชุม) ในรูป be held แปลว่าถูกจัดขึ้น","pos":"v."}]},{"id":"p5e-01-047","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"Please call me back _____ two o'clock this afternoon.","choices":["in","on","of","at"],"answer":3,"th":{"stem":"กรุณาโทรกลับหาฉัน_____บ่ายสองโมงวันนี้","choices":["ใน (ใช้กับเดือน ปี)","ใน (ใช้กับวัน)","ของ (แสดงความเป็นเจ้าของ)","ตอน (ใช้กับเวลานาฬิกา)"]},"explain":{"why":"two o'clock เป็นเวลานาฬิกาที่ระบุเป็นจุดชัดเจน จึงใช้ at แม้จะมีคำว่า afternoon อยู่ท้ายประโยค แต่คำที่อยู่ติดช่องว่างคือเวลานาฬิกา จึงต้องยึดที่ตรงนั้น","wrong":{"0":"in ใช้กับช่วงเวลายาวอย่างเดือนหรือปี ไม่ใช้กับเวลานาฬิกา","1":"on ใช้กับวันหรือวันที่ แต่ตรงนี้เป็นตัวเลขบอกโมงยาม","2":"of แปลว่า ของ ไม่ใช่คำบอกเวลา ใส่แล้วประโยคผิดทันที"},"point":"ให้ดูคำที่อยู่ติดกับช่องว่างเป็นหลัก อย่าไปสนใจคำอื่นที่อยู่ไกลออกไป","trick":"โจทย์ชอบวางคำว่า afternoon หรือ morning ไว้ท้ายประโยคเพื่อหลอก ให้มองคำแรกหลังช่องว่างเสมอ"},"vocab":[{"w":"call back","ipa":"/kɔːl bæk/","th":"**คอล** **แบค**","mean":"โทรกลับ","pos":"v."}]},{"id":"p5e-01-048","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"The machines are turned off _____ night for safety.","choices":["at","in","on","to"],"answer":0,"th":{"stem":"เครื่องจักรจะถูกปิด_____ตอนกลางคืนเพื่อความปลอดภัย","choices":["ตอน (ใช้กับ night)","ใน (ใช้กับช่วงของวันอื่น)","ใน (ใช้กับวัน)","ไปยัง (บอกทิศทาง)"]},"explain":{"why":"คำว่า night เป็นข้อยกเว้นพิเศษ แม้จะเป็นช่วงของวันเหมือน morning หรือ afternoon แต่ภาษาอังกฤษใช้ว่า at night ไม่ใช่ in the night ต้องท่องจำเป็นวลีติดกันไปเลย","wrong":{"1":"in ใช้กับช่วงของวันตัวอื่น เช่น in the morning, in the evening แต่กับ night เจ้าของภาษาใช้ at","2":"on ใช้กับวันหรือวันที่ ถ้าจะใช้ on ต้องมีชื่อวันด้วย เช่น on Friday night","3":"to แปลว่าไปยัง เป็นคำบอกทิศทาง ไม่ใช้บอกเวลา"},"point":"at night เป็นวลีตายตัว ท่องคู่กับ at noon และ at midnight ไปเลย","trick":"จำสามตัวยกเว้นนี้ให้ขึ้นใจ at night, at noon, at midnight แล้วที่เหลือค่อยใช้กฎปกติ"},"vocab":[{"w":"safety","ipa":"/ˈseɪfti/","th":"**เซฟ**-ตี้","mean":"ความปลอดภัย","pos":"n."}]},{"id":"p5e-01-049","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"Many workers take a long holiday _____ the summer.","choices":["at","in","on","of"],"answer":1,"th":{"stem":"พนักงานหลายคนหยุดยาว_____ช่วงหน้าร้อน","choices":["ตอน (ใช้กับเวลานาฬิกา)","ใน (ใช้กับฤดูกาล)","ใน (ใช้กับวัน)","ของ (แสดงความเป็นเจ้าของ)"]},"explain":{"why":"ฤดูกาล เช่น summer, winter, spring, fall เป็นช่วงเวลายาวหลายเดือน จึงใช้ in เหมือนกับเดือนและปี พูดว่า in the summer หรือ in summer ก็ได้","wrong":{"0":"at ใช้กับจุดเวลาแคบๆ อย่างเวลานาฬิกา ไม่เหมาะกับฤดูกาลที่ยาวเป็นเดือน","2":"on ใช้กับวันเดียวหรือวันที่ แต่ฤดูร้อนกินเวลาหลายเดือน","3":"of แปลว่า ของ ใช้แสดงความเป็นเจ้าของ ไม่ใช้บอกเวลา"},"point":"จัดกลุ่มไว้เลยว่า in ใช้กับ เดือน ปี ฤดูกาล และช่วงของวัน","trick":"ถามตัวเองว่าเวลาที่พูดถึงยาวกว่าหนึ่งวันหรือไม่ ถ้ายาวกว่า ให้ตอบ in ไว้ก่อน"},"vocab":[{"w":"holiday","ipa":"/ˈhɑːlədeɪ/","th":"**ฮอ**-ลิ-เดย์","mean":"วันหยุด, ช่วงวันหยุดพักผ่อน","pos":"n."}]},{"id":"p5e-01-050","part":5,"tier":"easy","topic":"preposition-time","topicTh":"คำบุพบทบอกเวลา in/on/at","stem":"The report is due _____ Friday, not Thursday.","choices":["in","at","on","of"],"answer":2,"th":{"stem":"รายงานต้องส่ง_____วันศุกร์ ไม่ใช่วันพฤหัสบดี","choices":["ใน (ใช้กับเดือน ปี)","ตอน (ใช้กับเวลานาฬิกา)","ใน (ใช้กับวันในสัปดาห์)","ของ (แสดงความเป็นเจ้าของ)"]},"explain":{"why":"ชื่อวันในสัปดาห์ เช่น Friday, Monday, Sunday ต้องใช้ on นำหน้าเสมอ เพราะเป็นการเจาะจงลงมาเหลือวันเดียว","wrong":{"0":"in ใช้กับช่วงเวลายาวอย่างเดือน ปี หรือฤดูกาล ไม่ใช้กับวันเดียว","1":"at ใช้กับเวลานาฬิกา เช่น at five แต่ Friday เป็นชื่อวัน ไม่ใช่ตัวเลขนาฬิกา","3":"of แปลว่า ของ ใช้แสดงความเป็นเจ้าของ ไม่ใช่คำบอกเวลา"},"point":"on + ชื่อวันในสัปดาห์ และ on + วันที่ เป็นกฎเดียวกัน","trick":"สรุปให้จำง่าย at ใช้กับนาฬิกา on ใช้กับวัน in ใช้กับอะไรที่ยาวกว่าวัน"},"vocab":[{"w":"due","ipa":"/duː/","th":"**ดิว**","mean":"ถึงกำหนดส่ง, ครบกำหนด","pos":"adj."}]}]},"drills/p5e-02":{"meta":{"batch":"p5e-02","part":5,"tier":"easy","count":50},"items":[{"id":"p5e-02-001","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"The meeting last week was very _____.","choices":["success","successful","successfully","succeed"],"answer":1,"th":{"stem":"การประชุมเมื่อสัปดาห์ที่แล้ว_____มาก","choices":["ความสำเร็จ (คำนาม)","ที่สำเร็จ / ประสบความสำเร็จ (คำคุณศัพท์ หางคำ -ful)","อย่างประสบความสำเร็จ (คำวิเศษณ์ หางคำ -ly)","ประสบความสำเร็จ (คำกริยา)"]},"explain":{"why":"หลังคำว่า very (มาก) ต้องตามด้วย adjective (คำคุณศัพท์ = คำที่บอกลักษณะ) เสมอ ในตัวเลือกนี้คำที่ลงท้ายด้วย -ful คือ successful เป็น adjective จึงตอบข้อนี้ได้เลยโดยไม่ต้องรู้ว่าแปลว่าอะไร","wrong":{"0":"success ไม่มีหางคำพิเศษ เป็น noun (คำนาม = คำที่ใช้เรียกสิ่งของหรือเรื่องราว) วาง very ไว้หน้า noun ไม่ได้ ต้องพูดว่า a big success ไม่ใช่ very success","2":"successfully ลงท้าย -ly เป็น adverb (คำวิเศษณ์ = คำที่ใช้ขยายกริยา บอกว่าทำอย่างไร) ต้องมีคำกริยาให้ขยาย แต่ประโยคนี้ตำแหน่งว่างอยู่หลัง was ซึ่งต้องการคำบอกลักษณะ","3":"succeed เป็น verb (คำกริยา = คำบอกการกระทำ) ประโยคนี้มีกริยา was อยู่แล้ว จะใส่กริยาซ้อนอีกตัวไม่ได้"},"point":"very + adjective เสมอ และหางคำ -ful บอกว่าเป็น adjective เกือบ 100%","trick":"เจอ very หรือ so ค้างอยู่หน้าช่องว่าง ให้กวาดตาหาตัวเลือกที่ลงท้าย -ful, -ive, -ous, -able ก่อนเลย"},"vocab":[{"w":"successful","ipa":"/səkˈsesfl/","th":"ซัค-**เซส**-ฟุล","mean":"ที่ประสบความสำเร็จ ได้ผลดี","pos":"adj."}]},{"id":"p5e-02-002","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"The staff checked every box _____.","choices":["care","careful","carefully","caring"],"answer":2,"th":{"stem":"พนักงานตรวจกล่องทุกใบ_____","choices":["ความระมัดระวัง (คำนาม)","ที่ระมัดระวัง (คำคุณศัพท์ หางคำ -ful)","อย่างระมัดระวัง (คำวิเศษณ์ หางคำ -ly)","กำลังดูแล (กริยาเติม -ing)"]},"explain":{"why":"ประโยคนี้ครบแล้ว มีประธาน (The staff) มีกริยา (checked) มีกรรม (every box) ช่องว่างท้ายประโยคจึงเป็นคำที่มาขยายกริยาว่า 'ตรวจแบบไหน' ซึ่งต้องใช้ adverb (คำวิเศษณ์ = คำขยายกริยา) คือคำที่ลงท้าย -ly ได้แก่ carefully","wrong":{"0":"care ไม่มีหางคำ เป็น noun (คำนาม) ถ้าเอามาวางท้ายประโยคจะกลายเป็นกรรมตัวที่สอง ซึ่งประโยคนี้มีกรรมคือ every box อยู่แล้ว","1":"careful ลงท้าย -ful เป็น adjective (คำคุณศัพท์) ใช้ขยายคำนามเท่านั้น เช่น a careful worker ไม่ใช้ขยายกริยา","3":"caring เป็นรูป -ing ถ้าจะใช้ต้องมี is/was/are นำหน้า แต่ประโยคนี้ใช้กริยา checked ไปแล้ว"},"point":"ประโยคสมบูรณ์แล้ว + ช่องว่างอยู่ท้ายประโยค = เติม adverb (คำลงท้าย -ly)","trick":"ลองปิดช่องว่างด้วยนิ้ว ถ้าอ่านที่เหลือแล้วประโยคยังสมบูรณ์ ให้เลือกคำที่ลงท้าย -ly ทันที"}},{"id":"p5e-02-003","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"Our company needs a new _____.","choices":["manager","manage","manages","managing"],"answer":0,"th":{"stem":"บริษัทของเราต้องการ_____คนใหม่","choices":["ผู้จัดการ (คำนาม หางคำ -er แปลว่าคนที่ทำสิ่งนั้น)","จัดการ (คำกริยารูปพื้นฐาน)","จัดการ (คำกริยาเติม -s)","กำลังจัดการ (กริยาเติม -ing)"]},"explain":{"why":"หลัง a new (คำนำหน้านาม a + คำคุณศัพท์ new) ต้องเป็น noun (คำนาม) เสมอ ตัวเลือกที่ลงท้าย -er แปลว่า 'คนที่ทำสิ่งนั้น' จึงเป็นคำนาม ตอบ manager","wrong":{"1":"manage เป็น verb (คำกริยา = คำบอกการกระทำ) วางหลัง a ไม่ได้ เพราะ a ใช้นำหน้าคำนามเท่านั้น","2":"manages เป็นกริยาเติม -s ใช้กับประธานเอกพจน์ในปัจจุบัน ไม่ใช่คำนาม จึงวางหลัง a new ไม่ได้","3":"managing เป็นรูป -ing ต้องมี is/are นำหน้า ตรงนี้มี a new นำหน้าอยู่ จึงผิด"},"point":"a / an / the + (คำคุณศัพท์) + คำนาม เสมอ และหางคำ -er, -or มักแปลว่า 'คนที่ทำสิ่งนั้น' = คำนาม","trick":"เห็น a, an, the ค้างอยู่หน้าช่องว่าง ให้มองหาคำที่ลงท้าย -er, -or, -tion, -ment, -ist ได้เลย"},"vocab":[{"w":"manager","ipa":"/ˈmænɪdʒər/","th":"**แม**-นิ-เจอร์","mean":"ผู้จัดการ คนที่ดูแลงานและลูกน้อง","pos":"n."}]},{"id":"p5e-02-004","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"We received the _____ this morning.","choices":["inform","informs","informative","information"],"answer":3,"th":{"stem":"เราได้รับ_____เมื่อเช้านี้","choices":["แจ้ง (คำกริยารูปพื้นฐาน)","แจ้ง (คำกริยาเติม -s)","ที่ให้ข้อมูลดี (คำคุณศัพท์ หางคำ -ive)","ข้อมูล ข่าวสาร (คำนาม หางคำ -tion)"]},"explain":{"why":"หลัง the ต้องเป็น noun (คำนาม) เท่านั้น และหางคำ -tion บอกว่าเป็นคำนามแทบทุกครั้ง จึงตอบ information","wrong":{"0":"inform ไม่มีหางคำ เป็น verb (คำกริยา) ประโยคนี้มีกริยา received อยู่แล้ว และ the ก็ต้องตามด้วยคำนาม","1":"informs เป็นกริยาเติม -s ยังคงเป็นคำกริยาอยู่ดี วางหลัง the ไม่ได้","2":"informative ลงท้าย -ive เป็น adjective (คำคุณศัพท์) ต้องมีคำนามตามหลัง เช่น the informative report แต่ประโยคนี้ไม่มีคำนามต่อท้ายช่องว่าง"},"point":"หางคำ -tion / -sion / -ment / -ness / -ity = คำนาม ใส่หลัง the ได้เลย","trick":"จำสูตรสั้นๆ ว่า 'the + คำที่ลงท้าย -tion' แล้วข้อแบบนี้จะตอบได้ใน 3 วินาที"},"vocab":[{"w":"information","ipa":"/ˌɪnfərˈmeɪʃn/","th":"อิน-เฟอร์-**เม**-ชัน","mean":"ข้อมูล ข่าวสาร (เป็นคำนามนับไม่ได้ ห้ามเติม s)","pos":"n."}]},{"id":"p5e-02-005","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"Ms. Chen is a very _____ worker.","choices":["quickly","quick","quickness","quicker"],"answer":1,"th":{"stem":"คุณเฉินเป็นพนักงานที่_____มาก","choices":["อย่างรวดเร็ว (คำวิเศษณ์ หางคำ -ly)","เร็ว (คำคุณศัพท์ รูปธรรมดา)","ความรวดเร็ว (คำนาม หางคำ -ness)","เร็วกว่า (รูปเปรียบเทียบ หางคำ -er)"]},"explain":{"why":"ช่องว่างอยู่ระหว่าง very กับคำนาม worker ตำแหน่งนี้ต้องเป็น adjective (คำคุณศัพท์ = คำบอกลักษณะของคน สัตว์ สิ่งของ) รูปธรรมดา คือ quick","wrong":{"0":"quickly ลงท้าย -ly เป็น adverb (คำวิเศษณ์) ใช้ขยายกริยา ไม่ใช้ขยายคำนามอย่าง worker","2":"quickness ลงท้าย -ness เป็น noun (คำนาม) เอาคำนามสองคำมาต่อกันแบบ quickness worker ไม่ได้","3":"quicker ลงท้าย -er เป็นรูปเปรียบเทียบ 'เร็วกว่า' ต้องใช้คู่กับ than และห้ามใช้กับ very ต้องใช้ much quicker แทน"},"point":"โครงสร้าง a + very + adjective + noun เป็นรูปแบบที่เจอบ่อยมากใน Part 5","trick":"ถ้าช่องว่างถูกขนาบด้วย very ข้างหน้า และคำนามข้างหลัง ให้เลือกคำคุณศัพท์รูปธรรมดา ตัดคำที่ลงท้าย -ly และ -ness ทิ้งทันที"}},{"id":"p5e-02-006","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"We plan to _____ the office next month.","choices":["move","movement","moving","mover"],"answer":0,"th":{"stem":"เราวางแผนที่จะ_____สำนักงานเดือนหน้า","choices":["ย้าย (คำกริยารูปพื้นฐาน)","การเคลื่อนไหว (คำนาม หางคำ -ment)","กำลังย้าย (กริยาเติม -ing)","คนขนย้าย (คำนาม หางคำ -er)"]},"explain":{"why":"หลังคำว่า to ที่แปลว่า 'ที่จะ' ต้องตามด้วยกริยารูปพื้นฐาน (base form = รูปที่ไม่เติมอะไรเลย) เสมอ จึงตอบ move","wrong":{"1":"movement ลงท้าย -ment เป็น noun (คำนาม) ในโครงสร้าง plan to ต้องเป็นคำกริยา ไม่ใช่คำนาม","2":"moving เป็นรูปเติม -ing ใช้ต่อจาก to แบบนี้ไม่ได้ (to move เท่านั้น)","3":"mover ลงท้าย -er แปลว่าคนขนย้าย เป็นคำนาม จึงต่อจาก to ไม่ได้"},"point":"to + กริยารูปพื้นฐาน (ไม่เติม s ไม่เติม ing ไม่เติม ed)","trick":"เห็นคำว่า to ค้างอยู่หน้าช่องว่าง ให้เลือกคำที่สั้นที่สุดและไม่มีหางคำ มักถูกเสมอ"}},{"id":"p5e-02-007","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"We need a quick _____ to this problem.","choices":["solve","solved","solution","solving"],"answer":2,"th":{"stem":"เราต้องการ_____ที่รวดเร็วสำหรับปัญหานี้","choices":["แก้ (คำกริยารูปพื้นฐาน)","แก้แล้ว (คำกริยาช่อง 2/3)","ทางแก้ วิธีแก้ (คำนาม หางคำ -tion)","กำลังแก้ (กริยาเติม -ing)"]},"explain":{"why":"หน้าช่องว่างมี a quick คือ คำนำหน้านาม + คำคุณศัพท์ ดังนั้นช่องว่างต้องเป็น noun (คำนาม) และคำที่ลงท้าย -tion คือคำนามแน่นอน ตอบ solution","wrong":{"0":"solve เป็น verb (คำกริยา) วางหลัง a quick ไม่ได้ เพราะคำคุณศัพท์ต้องขยายคำนามเท่านั้น","1":"solved เป็นกริยาช่อง 2 ใช้เล่าเรื่องอดีต ไม่ใช่คำนาม จึงมาอยู่ตรงนี้ไม่ได้","3":"solving เป็นรูป -ing ถ้าใช้เป็นคำนามต้องไม่มี a นำหน้าและไม่มีคำคุณศัพท์แบบนี้ขยาย"},"point":"a/an + คำคุณศัพท์ + ช่องว่าง = ต้องเป็นคำนาม 100%","trick":"หาคำที่ลงท้าย -tion, -sion, -ment, -ance ในตัวเลือกก่อน เพราะโจทย์แบบนี้ออกซ้ำๆ ทุกชุด"},"vocab":[{"w":"solution","ipa":"/səˈluːʃn/","th":"เซอ-**ลู**-ชัน","mean":"ทางแก้ปัญหา วิธีแก้","pos":"n."}]},{"id":"p5e-02-008","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"The report was _____ written and easy to read.","choices":["clear","clearer","clarity","clearly"],"answer":3,"th":{"stem":"รายงานฉบับนี้เขียนไว้_____และอ่านง่าย","choices":["ชัดเจน (คำคุณศัพท์)","ชัดเจนกว่า (รูปเปรียบเทียบ หางคำ -er)","ความชัดเจน (คำนาม)","อย่างชัดเจน (คำวิเศษณ์ หางคำ -ly)"]},"explain":{"why":"ช่องว่างอยู่หน้าคำว่า written ซึ่งเป็นคำกริยา คำที่มาขยายกริยาต้องเป็น adverb (คำวิเศษณ์ = คำขยายกริยา บอกว่าทำอย่างไร) คือคำที่ลงท้าย -ly ตอบ clearly","wrong":{"0":"clear เป็น adjective (คำคุณศัพท์) ใช้ขยายคำนาม ไม่ใช้ขยายคำกริยา written","1":"clearer เป็นรูปเปรียบเทียบ 'ชัดกว่า' ต้องมี than ตามหลัง ประโยคนี้ไม่มีการเปรียบเทียบ","2":"clarity เป็น noun (คำนาม) เอาคำนามมาวางหน้ากริยาแบบนี้ไม่ได้"},"point":"ขยายคำกริยา = ใช้คำลงท้าย -ly ขยายคำนาม = ใช้คำคุณศัพท์","trick":"มองคำที่อยู่ติดช่องว่าง ถ้าเป็นคำกริยา (written, made, done, prepared) ให้เลือก -ly ทันที"}},{"id":"p5e-02-009","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"_____ is very important in this factory.","choices":["Safe","Safely","Safety","Safer"],"answer":2,"th":{"stem":"_____สำคัญมากในโรงงานแห่งนี้","choices":["ปลอดภัย (คำคุณศัพท์)","อย่างปลอดภัย (คำวิเศษณ์ หางคำ -ly)","ความปลอดภัย (คำนาม หางคำ -ty)","ปลอดภัยกว่า (รูปเปรียบเทียบ)"]},"explain":{"why":"ช่องว่างอยู่หน้าสุดของประโยค ตำแหน่ง subject (ประธาน = ผู้ทำหรือสิ่งที่ถูกพูดถึง) ซึ่งต้องเป็น noun (คำนาม) เท่านั้น คำที่ลงท้าย -ty คือคำนาม ตอบ Safety","wrong":{"0":"Safe เป็น adjective (คำคุณศัพท์) เอามาเป็นประธานของประโยคไม่ได้ ต้องมีคำนามให้มันขยาย","1":"Safely ลงท้าย -ly เป็น adverb (คำวิเศษณ์) ใช้ขยายกริยา ไม่ใช่ประธาน","3":"Safer เป็นรูปเปรียบเทียบ 'ปลอดภัยกว่า' ยังเป็นคำคุณศัพท์อยู่ จึงเป็นประธานไม่ได้ และต้องมี than ด้วย"},"point":"ตำแหน่งประธานหน้าสุดของประโยค ต้องเป็นคำนามเสมอ (หางคำ -ty, -ness, -tion, -ment)","trick":"ถ้าช่องว่างอยู่คำแรกของประโยคแล้วตามด้วย is/are/was ให้เลือกคำนามทันที"},"vocab":[{"w":"safety","ipa":"/ˈseɪfti/","th":"**เซฟ**-ที","mean":"ความปลอดภัย","pos":"n."}]},{"id":"p5e-02-010","part":5,"tier":"easy","topic":"word-form","topicTh":"รูปคำ (ดูหางคำแล้วเลือกชนิดของคำ)","stem":"The team will _____ the new plan tomorrow.","choices":["discuss","discussion","discussed","discussing"],"answer":0,"th":{"stem":"ทีมงานจะ_____แผนใหม่ในวันพรุ่งนี้","choices":["พูดคุยถกกัน (คำกริยารูปพื้นฐาน)","การพูดคุย (คำนาม หางคำ -sion)","พูดคุยแล้ว (คำกริยาช่อง 2/3)","กำลังพูดคุย (กริยาเติม -ing)"]},"explain":{"why":"หลัง will (จะ) ต้องตามด้วยกริยารูปพื้นฐานเสมอ ห้ามเติมอะไรทั้งสิ้น จึงตอบ discuss","wrong":{"1":"discussion ลงท้าย -sion เป็น noun (คำนาม) วางหลัง will ไม่ได้ เพราะ will ต้องตามด้วยคำกริยา","2":"discussed เป็นกริยาช่อง 2 ใช้กับอดีต ขัดกับคำว่า tomorrow (พรุ่งนี้) และห้ามใช้หลัง will","3":"discussing เป็นรูป -ing ถ้าจะใช้ต้องเขียนว่า will be discussing ซึ่งประโยคนี้ไม่มี be"},"point":"will / can / must / should + กริยารูปพื้นฐาน ไม่เติม s ไม่เติม ed ไม่เติม ing","trick":"เห็น will อยู่หน้าช่องว่าง ให้เลือกคำที่ 'เปลือย' ที่สุด คือไม่มีหางคำเลย"}},{"id":"p5e-02-011","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"Mr. Kim called _____ about the meeting.","choices":["I","me","my","mine"],"answer":1,"th":{"stem":"คุณคิมโทรหา_____เรื่องการประชุม","choices":["ฉัน (ใช้เป็นผู้ทำ)","ฉัน (ใช้เป็นผู้ถูกกระทำ)","ของฉัน (ต้องมีคำนามตามหลัง)","ของฉัน (ใช้ยืนเดี่ยว ไม่มีคำนามตาม)"]},"explain":{"why":"ช่องว่างอยู่หลังคำกริยา called (โทรหา) ตำแหน่งนี้คือ object (กรรม = ผู้ถูกกระทำ) ต้องใช้สรรพนามรูปกรรม คือ me","wrong":{"0":"I เป็นรูปประธาน (ผู้ทำ) ใช้ไว้หน้ากริยาเท่านั้น เช่น I called him ไม่ใช้หลังกริยา","2":"my แปลว่า 'ของฉัน' ต้องมีคำนามตามหลังเสมอ เช่น my phone ในประโยคนี้ไม่มีคำนามตาม","3":"mine แปลว่า 'ของฉัน' เหมือนกันแต่ยืนเดี่ยว ใช้แทนสิ่งของ ไม่ได้ใช้แทนตัวคนที่ถูกโทรหา"},"point":"หน้ากริยาใช้ I / หลังกริยาและหลังคำบุพบทใช้ me","trick":"ถามตัวเองว่า 'ใครทำ' หรือ 'ทำใส่ใคร' ถ้าเป็นผู้ถูกทำให้เลือก me, him, her, them ทันที"}},{"id":"p5e-02-012","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"_____ am the new sales assistant.","choices":["I","Me","My","Mine"],"answer":0,"th":{"stem":"_____เป็นผู้ช่วยฝ่ายขายคนใหม่","choices":["ฉัน (รูปประธาน)","ฉัน (รูปกรรม)","ของฉัน (ต้องมีคำนามตามหลัง)","ของฉัน (ยืนเดี่ยว)"]},"explain":{"why":"ช่องว่างอยู่หน้ากริยา am ซึ่งเป็นตำแหน่ง subject (ประธาน = ผู้ทำ) และคำว่า am ใช้คู่กับ I เท่านั้น จึงตอบ I","wrong":{"1":"Me เป็นรูปกรรม (ผู้ถูกกระทำ) เอามาวางหน้ากริยาเป็นประธานไม่ได้","2":"My ต้องมีคำนามตามหลัง เช่น My job แต่ตรงนี้ตามด้วยกริยา am","3":"Mine ยืนเดี่ยวแทนสิ่งของ ไม่ได้แทนตัวคนที่เป็นประธานของประโยค"},"point":"am ใช้กับ I เท่านั้น / is ใช้กับ he, she, it / are ใช้กับ you, we, they","trick":"เห็นคำว่า am ในประโยค ให้ตอบ I ได้เลยโดยไม่ต้องอ่านที่เหลือ"},"vocab":[{"w":"assistant","ipa":"/əˈsɪstənt/","th":"เออ-**ซิส**-เทินท์","mean":"ผู้ช่วย","pos":"n."}]},{"id":"p5e-02-013","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"This is _____ desk, not yours.","choices":["I","me","my","mine"],"answer":2,"th":{"stem":"นี่คือโต๊ะ_____ ไม่ใช่ของคุณ","choices":["ฉัน (รูปประธาน)","ฉัน (รูปกรรม)","ของฉัน (ต้องมีคำนามตามหลัง)","ของฉัน (ยืนเดี่ยว ไม่มีคำนามตาม)"]},"explain":{"why":"หลังช่องว่างมีคำนาม desk (โต๊ะ) อยู่ ดังนั้นต้องใช้คำแสดงความเป็นเจ้าของที่วางหน้าคำนามได้ คือ my","wrong":{"0":"I เป็นรูปประธาน วางหน้าคำนามเพื่อบอกความเป็นเจ้าของไม่ได้","1":"me เป็นรูปกรรม ใช้หลังกริยาหรือหลังคำบุพบท ไม่ใช้ขยายคำนาม","3":"mine ใช้ยืนเดี่ยวโดยไม่มีคำนามตามหลัง เช่น This desk is mine แต่ประโยคนี้มีคำว่า desk ตามหลังอยู่แล้ว"},"point":"my + คำนาม / mine ยืนเดี่ยวไม่มีคำนามตาม","trick":"ดูคำที่อยู่ถัดจากช่องว่าง ถ้าเป็นคำนาม ให้เลือก my, his, their ถ้าไม่มีคำนามให้เลือก mine, his, theirs"}},{"id":"p5e-02-014","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"The blue folder on the table is _____.","choices":["I","me","my","mine"],"answer":3,"th":{"stem":"แฟ้มสีน้ำเงินบนโต๊ะเป็น_____","choices":["ฉัน (รูปประธาน)","ฉัน (รูปกรรม)","ของฉัน (ต้องมีคำนามตามหลัง)","ของฉัน (ยืนเดี่ยวได้)"]},"explain":{"why":"ช่องว่างอยู่ท้ายประโยคหลัง is และไม่มีคำนามตามหลังแล้ว จึงต้องใช้คำแสดงความเป็นเจ้าของแบบยืนเดี่ยว คือ mine","wrong":{"0":"I เป็นรูปประธาน ใช้เป็นส่วนขยายหลัง is แบบนี้ไม่ได้ และความหมายก็ผิด (แฟ้มไม่ใช่ตัวคน)","1":"me เป็นรูปกรรม ใช้หลังกริยาที่มีการกระทำหรือหลังคำบุพบท ไม่ใช้บอกความเป็นเจ้าของ","2":"my ต้องมีคำนามตามหลังเสมอ เช่น my folder แต่ประโยคนี้จบตรงช่องว่างพอดี"},"point":"โครงสร้าง 'สิ่งของ + is + mine/yours/his/hers/theirs' ใช้บอกว่าของสิ่งนั้นเป็นของใคร","trick":"ถ้าช่องว่างเป็นคำสุดท้ายของประโยคและมี is/are อยู่ข้างหน้า ให้เลือกตัวที่ลงท้ายด้วย -s หรือ mine"},"vocab":[{"w":"folder","ipa":"/ˈfoʊldər/","th":"**โฟล**-เดอร์","mean":"แฟ้มใส่เอกสาร","pos":"n."}]},{"id":"p5e-02-015","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"Ms. Park sent _____ the sales report yesterday.","choices":["he","him","his","himself"],"answer":1,"th":{"stem":"คุณพาร์คส่งรายงานยอดขายให้_____เมื่อวานนี้","choices":["เขา (ผู้ชาย รูปประธาน)","เขา (ผู้ชาย รูปกรรม)","ของเขา (ต้องมีคำนามตามหลัง)","ตัวเขาเอง (สรรพนามสะท้อน)"]},"explain":{"why":"ช่องว่างอยู่หลังกริยา sent (ส่ง) และเป็นคนที่รับของ จึงเป็น object (กรรม = ผู้ถูกกระทำ) ต้องใช้ him","wrong":{"0":"he เป็นรูปประธาน ใช้หน้ากริยาเท่านั้น เช่น He sent the report","2":"his แปลว่า 'ของเขา' ต้องมีคำนามตามหลังทันที แต่คำถัดไปคือ the ซึ่งเป็นคำนำหน้านามอยู่แล้ว จึงซ้ำซ้อนและผิด","3":"himself แปลว่า 'ตัวเขาเอง' ใช้เมื่อผู้ทำกับผู้ถูกทำเป็นคนเดียวกัน แต่ประโยคนี้ผู้ส่งคือคุณพาร์ค คนละคนกัน"},"point":"หลังคำกริยาที่มีการกระทำ ต้องใช้สรรพนามรูปกรรม: me, him, her, us, them","trick":"แปลไทยแล้วมีคำว่า 'ให้...' หรือ 'หา...' อยู่หลังกริยา ให้เลือกรูปกรรมทันที"}},{"id":"p5e-02-016","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"_____ works in the finance department.","choices":["He","Him","His","Himself"],"answer":0,"th":{"stem":"_____ทำงานอยู่ในแผนกการเงิน","choices":["เขา (ผู้ชาย รูปประธาน)","เขา (ผู้ชาย รูปกรรม)","ของเขา (ต้องมีคำนามตามหลัง)","ตัวเขาเอง (สรรพนามสะท้อน)"]},"explain":{"why":"ช่องว่างอยู่หน้าสุดของประโยคและตามด้วยกริยา works จึงเป็นตำแหน่ง subject (ประธาน = ผู้ทำ) ต้องใช้ He","wrong":{"1":"Him เป็นรูปกรรม ใช้เป็นประธานหน้ากริยาไม่ได้","2":"His ต้องมีคำนามตามหลัง เช่น His office แต่ตรงนี้ตามด้วยกริยา works","3":"Himself เป็นสรรพนามสะท้อน ใช้ยืนเป็นประธานเดี่ยวๆ ไม่ได้"},"point":"ตำแหน่งหน้ากริยา = ประธาน ใช้ I, you, he, she, we, they","trick":"ถ้าคำถัดจากช่องว่างเป็นคำกริยา (works, lives, sends) ให้เลือกรูปประธานทันที"},"vocab":[{"w":"department","ipa":"/dɪˈpɑːrtmənt/","th":"ดิ-**พาร์ท**-เมินท์","mean":"แผนก ฝ่ายในองค์กร","pos":"n."}]},{"id":"p5e-02-017","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"The manager likes _____ new office very much.","choices":["he","him","his","himself"],"answer":2,"th":{"stem":"ผู้จัดการชอบสำนักงานใหม่_____มาก","choices":["เขา (รูปประธาน)","เขา (รูปกรรม)","ของเขา (วางหน้าคำนามได้)","ตัวเขาเอง (สรรพนามสะท้อน)"]},"explain":{"why":"หลังช่องว่างมีคำว่า new office ซึ่งเป็นคำคุณศัพท์ + คำนาม จึงต้องใช้คำแสดงความเป็นเจ้าของที่วางหน้าคำนามได้ คือ his","wrong":{"0":"he เป็นรูปประธาน วางไว้หน้าคำนามเพื่อบอกความเป็นเจ้าของไม่ได้","1":"him เป็นรูปกรรม ถ้าใส่ตรงนี้จะกลายเป็นว่าชอบตัวเขา แล้วคำว่า new office จะเกินมาไม่มีที่อยู่","3":"himself ใช้ยืนเดี่ยวเป็นกรรม ไม่ใช้วางหน้าคำนามเพื่อบอกความเป็นเจ้าของ"},"point":"his + คำนาม = ของเขา (ผู้ชาย) เทียบกับ her + คำนาม = ของเธอ","trick":"มองคำถัดจากช่องว่าง ถ้ามีคำนามตามมา ให้เลือกกลุ่ม my/your/his/her/our/their เสมอ"}},{"id":"p5e-02-018","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"The workers said _____ would arrive at nine.","choices":["them","their","theirs","they"],"answer":3,"th":{"stem":"คนงานบอกว่า_____จะมาถึงตอนเก้าโมง","choices":["พวกเขา (รูปกรรม)","ของพวกเขา (ต้องมีคำนามตามหลัง)","ของพวกเขา (ยืนเดี่ยว)","พวกเขา (รูปประธาน)"]},"explain":{"why":"หลังคำว่า said มีประโยคย่อยตามมา และช่องว่างอยู่หน้ากริยา would arrive จึงเป็นประธานของประโยคย่อย ต้องใช้ they","wrong":{"0":"them เป็นรูปกรรม ใช้เป็นประธานหน้ากริยาไม่ได้","1":"their ต้องมีคำนามตามหลัง เช่น their bags แต่ตรงนี้ตามด้วยกริยา would arrive","2":"theirs ใช้ยืนเดี่ยวแทนสิ่งของที่เป็นของพวกเขา ไม่ได้ใช้เป็นประธานที่มากระทำกริยา"},"point":"หลัง said / thinks / knows มักมีประโยคย่อย ซึ่งต้องมีประธานเป็นของตัวเอง","trick":"หากริยาที่อยู่หลังช่องว่าง ถ้าเจอกริยาให้เลือกรูปประธาน (they, he, she) ทันที"}},{"id":"p5e-02-019","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"Please give these boxes to _____.","choices":["they","them","their","theirs"],"answer":1,"th":{"stem":"กรุณาส่งกล่องเหล่านี้ให้_____","choices":["พวกเขา (รูปประธาน)","พวกเขา (รูปกรรม)","ของพวกเขา (ต้องมีคำนามตามหลัง)","ของพวกเขา (ยืนเดี่ยว)"]},"explain":{"why":"ช่องว่างอยู่หลังคำว่า to ซึ่งเป็น preposition (คำบุพบท = คำบอกทิศทางหรือความสัมพันธ์) หลังคำบุพบทต้องใช้สรรพนามรูปกรรมเสมอ จึงตอบ them","wrong":{"0":"they เป็นรูปประธาน ใช้หลังคำบุพบทไม่ได้ ต้องเปลี่ยนเป็น them","2":"their ต้องมีคำนามตามหลัง เช่น to their office แต่ประโยคนี้จบตรงช่องว่าง","3":"theirs แปลว่า 'ของพวกเขา' หมายถึงสิ่งของ ไม่ได้หมายถึงตัวคนที่จะรับกล่อง"},"point":"หลัง to, for, with, from, at ต้องใช้ me, him, her, us, them เท่านั้น","trick":"เจอคำบุพบทติดหน้าช่องว่าง ให้ตัดรูปประธาน (I, he, she, they) ทิ้งได้ทันที"}},{"id":"p5e-02-020","part":5,"tier":"easy","topic":"pronoun","topicTh":"คำสรรพนาม (คำที่ใช้แทนชื่อคน)","stem":"All the staff brought _____ own laptops.","choices":["they","them","their","theirs"],"answer":2,"th":{"stem":"พนักงานทุกคนนำโน้ตบุ๊ก_____มาเอง","choices":["พวกเขา (รูปประธาน)","พวกเขา (รูปกรรม)","ของพวกเขา (วางหน้าคำนามได้)","ของพวกเขา (ยืนเดี่ยว)"]},"explain":{"why":"หลังช่องว่างมีคำว่า own laptops ซึ่งเป็นคำนาม จึงต้องใช้คำแสดงความเป็นเจ้าของที่วางหน้าคำนามได้ คือ their","wrong":{"0":"they เป็นรูปประธาน วางหน้าคำนามเพื่อบอกความเป็นเจ้าของไม่ได้","1":"them เป็นรูปกรรม ต้องอยู่หลังกริยาหรือหลังคำบุพบท ไม่ใช่หน้าคำนาม","3":"theirs ใช้ยืนเดี่ยวโดยไม่มีคำนามตามหลัง เช่น The laptops are theirs"},"point":"โครงสร้าง their own + คำนาม แปลว่า 'ของตัวเขาเอง' เจอบ่อยในข้อสอบ","trick":"ถ้าเห็นคำว่า own อยู่หลังช่องว่าง ให้เลือกกลุ่ม my/his/her/our/their ได้เลย"}},{"id":"p5e-02-021","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"The printer is _____ the second floor.","choices":["in","on","at","between"],"answer":1,"th":{"stem":"เครื่องพิมพ์อยู่_____ชั้นสอง","choices":["ใน (อยู่ข้างในพื้นที่ปิด)","บน (อยู่บนพื้นผิว / ใช้กับชั้นของอาคาร)","ที่ (จุดใดจุดหนึ่ง)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"การบอกชั้นของอาคารในภาษาอังกฤษใช้ on เสมอ เช่น on the first floor, on the second floor ถือเป็นวลีตายตัวที่ต้องจำ","wrong":{"0":"in ใช้กับพื้นที่ที่มีขอบเขตปิด เช่น in the room ไม่ใช้กับชั้นของอาคาร","2":"at ใช้ระบุจุดหรือสถานที่แบบจุดเดียว เช่น at the door ไม่ใช้กับชั้นอาคาร","3":"between แปลว่าอยู่ระหว่างสองสิ่ง ต้องมีสองสิ่งให้เปรียบ แต่ประโยคนี้มีสิ่งเดียวคือชั้นสอง"},"point":"ชั้นของตึกใช้ on the ... floor จำเป็นวลีเดียวไปเลย","trick":"เห็นคำว่า floor, wall, page, street ในประโยค ให้นึกถึง on ก่อนเสมอ"}},{"id":"p5e-02-022","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"All the files are _____ the metal drawer.","choices":["in","on","at","between"],"answer":0,"th":{"stem":"เอกสารทั้งหมดอยู่_____ลิ้นชักเหล็ก","choices":["ใน (อยู่ข้างในพื้นที่ปิด)","บน (อยู่บนพื้นผิวด้านบน)","ที่ (จุดใดจุดหนึ่ง)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"ลิ้นชักเป็นพื้นที่ปิดที่มีข้างในให้ใส่ของ จึงใช้ in ซึ่งแปลว่า 'อยู่ข้างใน'","wrong":{"1":"on แปลว่าอยู่บนพื้นผิวด้านบน ถ้าใช้จะกลายเป็นวางไว้บนหลังลิ้นชัก ไม่ใช่เก็บไว้ข้างใน","2":"at ใช้ระบุจุดที่ยืนหรือจุดนัดพบ ไม่ใช้บอกว่าของอยู่ข้างในภาชนะ","3":"between ต้องมีสองสิ่ง เช่น between the two drawers แต่ประโยคนี้มีลิ้นชักใบเดียว"},"point":"ภาชนะหรือพื้นที่ที่มีข้างใน (box, bag, drawer, room, building) ใช้ in","trick":"ถามตัวเองว่าของชิ้นนั้น 'อยู่ข้างใน' หรือ 'วางทับข้างบน' ถ้าข้างในตอบ in ถ้าข้างบนตอบ on"},"vocab":[{"w":"drawer","ipa":"/drɔːr/","th":"ดรอร์","mean":"ลิ้นชัก","pos":"n."}]},{"id":"p5e-02-023","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"Let's meet _____ the front desk at nine.","choices":["on","in","at","between"],"answer":2,"th":{"stem":"เจอกัน_____เคาน์เตอร์ต้อนรับตอนเก้าโมงนะ","choices":["บน (พื้นผิวด้านบน)","ใน (ข้างในพื้นที่ปิด)","ที่ (จุดนัดพบจุดหนึ่ง)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"การนัดเจอกันตรงจุดใดจุดหนึ่งใช้ at เสมอ เช่น at the front desk, at the entrance, at the bus stop","wrong":{"0":"on แปลว่าอยู่บนพื้นผิว ถ้าใช้จะกลายเป็นปีนขึ้นไปยืนบนเคาน์เตอร์","1":"in แปลว่าอยู่ข้างใน เคาน์เตอร์ไม่ใช่พื้นที่ที่คนเข้าไปอยู่ข้างในได้","3":"between ต้องมีสองสิ่งให้อยู่ตรงกลาง แต่ประโยคนี้พูดถึงเคาน์เตอร์แห่งเดียว"},"point":"จุดนัดพบ (front desk, gate, corner, station) ใช้ at","trick":"แปลไทยได้ว่า 'ที่...' แบบชี้จุด ให้เลือก at ทันที"},"vocab":[{"w":"front desk","ipa":"/frʌnt desk/","th":"ฟรันท์ เดสก์","mean":"เคาน์เตอร์ต้อนรับ (ในโรงแรมหรือออฟฟิศ)","pos":"n."}]},{"id":"p5e-02-024","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"The cafe is _____ the bank and the bookstore.","choices":["near","on","in","between"],"answer":3,"th":{"stem":"ร้านกาแฟอยู่_____ธนาคารกับร้านหนังสือ","choices":["ใกล้ (ใช้กับสิ่งเดียว)","บน (พื้นผิวด้านบน)","ใน (ข้างในพื้นที่ปิด)","ระหว่าง (ใช้กับสองสิ่ง)"]},"explain":{"why":"ประโยคนี้มีสองสถานที่เชื่อมด้วย and คือ the bank และ the bookstore เวลาบอกว่าอยู่ตรงกลางของสองสิ่ง ต้องใช้ between เท่านั้น","wrong":{"0":"near แปลว่าอยู่ใกล้ ใช้กับสถานที่เดียว ถ้าใช้กับ A and B จะไม่สื่อว่าอยู่ตรงกลาง","1":"on แปลว่าอยู่บนพื้นผิว ใช้กับสองอาคารแบบนี้ไม่ได้","2":"in แปลว่าอยู่ข้างใน ร้านกาแฟไม่ได้อยู่ในธนาคารและร้านหนังสือพร้อมกัน"},"point":"เห็นโครงสร้าง ... A and B ที่เป็นสถานที่สองแห่ง ให้ตอบ between","trick":"กวาดตาหาคำว่า and ในประโยค ถ้าเชื่อมสถานที่สองแห่ง ตอบ between ได้เลยใน 3 วินาที"}},{"id":"p5e-02-025","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"The parking lot is _____ the hotel, just 50 meters away.","choices":["in","near","on","between"],"answer":1,"th":{"stem":"ลานจอดรถอยู่_____โรงแรม ห่างไปแค่ 50 เมตร","choices":["ใน (ข้างในพื้นที่ปิด)","ใกล้ (ไม่ไกล แต่ไม่ติดกัน)","บน (พื้นผิวด้านบน)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"ท้ายประโยคบอกว่า just 50 meters away (ห่างไปแค่ 50 เมตร) แสดงว่าอยู่คนละที่แต่ไม่ไกล คำที่ตรงความหมายนี้คือ near = ใกล้","wrong":{"0":"in แปลว่าอยู่ข้างใน ถ้าอยู่ในโรงแรมก็จะไม่ห่างออกไป 50 เมตร ขัดกับข้อมูลท้ายประโยค","2":"on แปลว่าอยู่บนพื้นผิว จะกลายเป็นลานจอดรถอยู่บนหลังคาโรงแรม ซึ่งขัดกับคำว่า away","3":"between ต้องมีสองสิ่ง แต่ประโยคนี้พูดถึงโรงแรมแห่งเดียว"},"point":"near = ใกล้แต่แยกกันคนละที่ ต่างจาก in ที่แปลว่าอยู่ข้างใน","trick":"อ่านส่วนท้ายประโยคให้จบก่อน คำบอกระยะทางอย่าง meters away มักเป็นตัวเฉลย"},"vocab":[{"w":"parking lot","ipa":"/ˈpɑːrkɪŋ lɑːt/","th":"**พาร์**-คิง ลอท","mean":"ลานจอดรถ","pos":"n."}]},{"id":"p5e-02-026","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"Please put the boxes _____ the table.","choices":["on","in","at","between"],"answer":0,"th":{"stem":"กรุณาวางกล่อง_____โต๊ะ","choices":["บน (วางทับพื้นผิวด้านบน)","ใน (ข้างในพื้นที่ปิด)","ที่ (จุดใดจุดหนึ่ง)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"โต๊ะมีพื้นผิวด้านบนให้วางของ การวางของทับลงบนพื้นผิวใช้ on เสมอ","wrong":{"1":"in แปลว่าอยู่ข้างใน โต๊ะไม่ใช่ภาชนะที่มีข้างในให้ใส่กล่อง","2":"at ใช้ระบุจุดที่คนอยู่ เช่น sit at the table (นั่งที่โต๊ะ) แต่ไม่ใช้กับการวางของทับลงไป","3":"between ต้องมีสองสิ่ง เช่น between the two tables แต่ประโยคนี้มีโต๊ะตัวเดียว"},"point":"วางของทับพื้นผิว (table, desk, shelf, floor) ใช้ on","trick":"จำภาพว่า on = แตะพื้นผิว, in = อยู่ข้างใน, at = ยืนอยู่ตรงจุดนั้น"}},{"id":"p5e-02-027","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"The manager is _____ his office, so please knock first.","choices":["on","between","in","near"],"answer":2,"th":{"stem":"ผู้จัดการอยู่_____ห้องทำงานของเขา กรุณาเคาะประตูก่อน","choices":["บน (พื้นผิวด้านบน)","ระหว่าง (ต้องมีสองสิ่ง)","ใน (ข้างในห้อง)","ใกล้ (อยู่นอกห้อง)"]},"explain":{"why":"ห้องเป็นพื้นที่ปิดที่มีข้างใน จึงใช้ in และประโยคยังบอกให้เคาะประตูก่อน แปลว่าเขาอยู่ข้างในห้องจริงๆ","wrong":{"0":"on แปลว่าอยู่บนพื้นผิว ถ้าใช้จะกลายเป็นปีนขึ้นไปอยู่บนหลังคาห้อง","1":"between ต้องมีสองสิ่ง แต่ประโยคนี้มีห้องเดียว","3":"near แปลว่าอยู่ใกล้ๆ ซึ่งหมายถึงอยู่ข้างนอกห้อง ถ้าอยู่ข้างนอกก็ไม่ต้องเคาะประตู ขัดกับข้อความท้ายประโยค"},"point":"ห้องและอาคาร (office, room, building, car) ใช้ in เพราะเข้าไปอยู่ข้างในได้","trick":"ถ้าประโยคมีคำใบ้ว่าต้องเปิดหรือเคาะประตู แสดงว่าคนอยู่ข้างใน ให้เลือก in"}},{"id":"p5e-02-028","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"The clock hangs _____ the two windows.","choices":["on","in","near","between"],"answer":3,"th":{"stem":"นาฬิกาแขวนอยู่_____หน้าต่างสองบาน","choices":["บน (พื้นผิวด้านบน)","ใน (ข้างในพื้นที่ปิด)","ใกล้ (ไม่บอกว่าอยู่ตรงกลาง)","ระหว่าง (อยู่ตรงกลางของสองสิ่ง)"]},"explain":{"why":"ประโยคระบุชัดว่ามี two windows คือหน้าต่างสองบาน เมื่อของอยู่ตรงกลางระหว่างสองสิ่ง ต้องใช้ between","wrong":{"0":"on แปลว่าติดอยู่บนพื้นผิวของสิ่งนั้น ถ้าใช้จะกลายเป็นนาฬิกาติดอยู่บนตัวหน้าต่าง ไม่ใช่ตรงกลางระหว่างสองบาน","1":"in แปลว่าอยู่ข้างใน นาฬิกาไม่ได้อยู่ข้างในหน้าต่าง","2":"near แปลว่าอยู่ใกล้ ไม่ได้บอกว่าอยู่ตรงกลาง จึงไม่ตรงกับคำว่า two windows ที่โจทย์เน้น"},"point":"คำว่า two, both หรือ A and B เป็นสัญญาณของ between","trick":"เห็นเลข two หรือคำว่า both ในประโยค ให้มองหา between ในตัวเลือกก่อนเลย"}},{"id":"p5e-02-029","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"Anna is waiting _____ the bus stop.","choices":["between","on","at","in"],"answer":2,"th":{"stem":"แอนนากำลังรออยู่_____ป้ายรถเมล์","choices":["ระหว่าง (ต้องมีสองสิ่ง)","บน (พื้นผิวด้านบน)","ที่ (จุดใดจุดหนึ่ง)","ใน (ข้างในพื้นที่ปิด)"]},"explain":{"why":"ป้ายรถเมล์เป็นจุดหนึ่งบนแผนที่ที่คนไปยืนรอ การบอกว่าอยู่ตรงจุดนั้นใช้ at เสมอ (at the bus stop เป็นวลีตายตัว)","wrong":{"0":"between ต้องมีสองสิ่ง แต่ประโยคนี้พูดถึงป้ายรถเมล์แห่งเดียว","1":"on แปลว่าอยู่บนพื้นผิว ถ้าใช้จะกลายเป็นปีนขึ้นไปยืนบนป้าย","3":"in แปลว่าอยู่ข้างใน ป้ายรถเมล์ไม่ใช่พื้นที่ปิดที่คนเข้าไปอยู่ข้างใน"},"point":"at ใช้กับจุดเล็กๆ ที่คนไปรอหรือไปเจอกัน เช่น at the bus stop, at the gate, at the corner","trick":"ท่องวลีเป็นชุด at the bus stop / at the airport / at the door จะตอบได้ทันทีโดยไม่ต้องคิด"}},{"id":"p5e-02-030","part":5,"tier":"easy","topic":"preposition-place","topicTh":"คำบุพบทบอกสถานที่","stem":"My house is _____ the office, so I walk to work.","choices":["in","near","on","between"],"answer":1,"th":{"stem":"บ้านของฉันอยู่_____ที่ทำงาน ฉันเลยเดินไปทำงาน","choices":["ใน (ข้างในพื้นที่ปิด)","ใกล้ (ไม่ไกล เดินถึงได้)","บน (พื้นผิวด้านบน)","ระหว่าง (ต้องมีสองสิ่ง)"]},"explain":{"why":"ครึ่งหลังของประโยคบอกว่าเดินไปทำงาน แปลว่าระยะทางไม่ไกล คำที่แปลว่า 'ใกล้' คือ near จึงเป็นคำตอบเดียวที่เข้ากับเหตุผลนี้","wrong":{"0":"in แปลว่าอยู่ข้างใน ถ้าบ้านอยู่ในออฟฟิศก็ไม่สมเหตุสมผล และไม่ต้องเดินไปทำงาน","2":"on แปลว่าอยู่บนพื้นผิว บ้านไม่ได้ตั้งอยู่บนตัวอาคารสำนักงาน","3":"between ต้องมีสองสถานที่ให้อยู่ตรงกลาง แต่ประโยคนี้เอ่ยถึงที่ทำงานที่เดียว"},"point":"near = ใกล้ ใช้บอกว่าสองที่อยู่ไม่ไกลกัน แต่ยังแยกกันคนละที่","trick":"อ่านประโยคหลังเครื่องหมายคอมมาเสมอ เพราะเหตุผลตรงนั้นมักเป็นตัวชี้คำตอบ"}},{"id":"p5e-02-031","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"How _____ chairs do we need for the meeting?","choices":["many","much","few","little"],"answer":0,"th":{"stem":"เราต้องใช้เก้าอี้กี่ตัวสำหรับการประชุม","choices":["กี่ (ใช้กับของนับได้)","เท่าไร (ใช้กับของนับไม่ได้)","น้อย (ใช้กับของนับได้ ไม่ใช้ถามจำนวน)","น้อย (ใช้กับของนับไม่ได้)"]},"explain":{"why":"chairs เป็น countable noun (คำนามนับได้) และอยู่ในรูปพหูพจน์เติม s เวลาถามจำนวนของนับได้ต้องใช้ How many","wrong":{"1":"much ใช้ถามปริมาณของที่นับไม่ได้ เช่น How much water ใช้กับ chairs ไม่ได้เพราะเก้าอี้นับเป็นตัวๆ ได้","2":"few แปลว่า 'น้อย' ใช้บอกปริมาณ ไม่ใช้กับโครงสร้างคำถาม How ... ?","3":"little แปลว่า 'น้อย' และใช้กับของนับไม่ได้ ผิดทั้งความหมายและชนิดคำนาม"},"point":"How many + คำนามเติม s (นับได้) / How much + คำนามไม่เติม s (นับไม่ได้)","trick":"ดูว่าคำนามหลังช่องว่างเติม s หรือไม่ ถ้าเติม s ตอบ many ถ้าไม่เติม s ตอบ much"}},{"id":"p5e-02-032","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"We do not have _____ time before the flight.","choices":["many","much","few","a few"],"answer":1,"th":{"stem":"เราไม่มีเวลามาก_____ก่อนขึ้นเครื่อง","choices":["มาก (ใช้กับของนับได้)","มาก (ใช้กับของนับไม่ได้)","น้อย (ใช้กับของนับได้)","เล็กน้อย (ใช้กับของนับได้)"]},"explain":{"why":"time (เวลา) เป็น uncountable noun (คำนามนับไม่ได้) คือไม่เติม s และนับเป็นชิ้นไม่ได้ ในประโยคปฏิเสธจึงใช้ much","wrong":{"0":"many ใช้กับคำนามนับได้ที่เติม s เช่น many hours แต่ time เฉยๆ นับไม่ได้","2":"few ใช้กับคำนามนับได้พหูพจน์เท่านั้น เช่น few people ใช้กับ time ไม่ได้","3":"a few ก็ใช้กับคำนามนับได้พหูพจน์เช่นกัน และวางหลัง not have แบบนี้ไม่เป็นธรรมชาติ"},"point":"คำนามนับไม่ได้ที่เจอบ่อยในข้อสอบ: time, money, information, water, work, advice","trick":"จำกลุ่มคำนามนับไม่ได้ไว้สัก 6 คำ พอเห็นปุ๊บให้ตอบ much ได้เลย"}},{"id":"p5e-02-033","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"There are three _____ in the meeting room.","choices":["box","box's","boxes","boxs"],"answer":2,"th":{"stem":"มีกล่องสามใบอยู่ในห้องประชุม","choices":["กล่อง (เอกพจน์ ใบเดียว)","ของกล่อง (รูปแสดงความเป็นเจ้าของ)","กล่องหลายใบ (พหูพจน์ที่ถูกต้อง)","รูปพหูพจน์ที่สะกดผิด"]},"explain":{"why":"มีคำว่า three (สาม) และกริยา are ซึ่งใช้กับพหูพจน์ คำนามจึงต้องเป็นพหูพจน์ คำที่ลงท้ายด้วยเสียง -x ต้องเติม -es ไม่ใช่ -s จึงเป็น boxes","wrong":{"0":"box เป็นเอกพจน์แปลว่ากล่องใบเดียว ขัดกับคำว่า three และกริยา are","1":"box's เป็นรูปแสดงความเป็นเจ้าของ แปลว่า 'ของกล่อง' ต้องมีคำนามตามหลัง ไม่ใช่รูปพหูพจน์","3":"boxs สะกดผิด คำที่ลงท้าย -s, -x, -ch, -sh, -o ต้องเติม -es"},"point":"คำลงท้าย -s, -x, -ch, -sh เติม -es เช่น boxes, buses, watches, dishes","trick":"เห็นตัวเลขมากกว่าหนึ่ง หรือคำว่า are, many, several ให้เลือกรูปพหูพจน์ทันที"}},{"id":"p5e-02-034","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"How _____ money did the company spend last month?","choices":["many","few","little","much"],"answer":3,"th":{"stem":"บริษัทใช้เงินไปเท่าไรเมื่อเดือนที่แล้ว","choices":["กี่ (ใช้กับของนับได้)","น้อย (ใช้กับของนับได้)","น้อย (ใช้กับของนับไม่ได้)","เท่าไร (ใช้กับของนับไม่ได้)"]},"explain":{"why":"money (เงิน) เป็น uncountable noun (คำนามนับไม่ได้) เพราะไม่เติม s เวลาถามปริมาณของนับไม่ได้ต้องใช้ How much","wrong":{"0":"many ใช้กับคำนามนับได้พหูพจน์ เช่น many coins แต่ money เองนับไม่ได้","1":"few ใช้กับคำนามนับได้พหูพจน์ และไม่ใช้ในโครงสร้างคำถาม How ... ?","2":"little แปลว่าน้อย ใช้บอกปริมาณในประโยคบอกเล่า ไม่ใช้ถามจำนวนหลัง How"},"point":"money ไม่มีรูปพหูพจน์ จึงคู่กับ much เสมอ (How much money)","trick":"money, time, information ไม่เติม s เด็ดขาด เห็นสามคำนี้ให้ตอบ much"}},{"id":"p5e-02-035","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"Many _____ came to the training yesterday.","choices":["employees","employee","employee's","employ"],"answer":0,"th":{"stem":"พนักงานหลายคนมาเข้าอบรมเมื่อวานนี้","choices":["พนักงานหลายคน (พหูพจน์)","พนักงานหนึ่งคน (เอกพจน์)","ของพนักงาน (รูปแสดงความเป็นเจ้าของ)","จ้างงาน (คำกริยา)"]},"explain":{"why":"หลังคำว่า Many ต้องตามด้วยคำนามนับได้รูปพหูพจน์ที่เติม s เสมอ จึงตอบ employees","wrong":{"1":"employee เป็นเอกพจน์ ถ้าจะใช้ต้องมี a หรือ one นำหน้า ไม่เข้ากับ Many","2":"employee's เป็นรูปแสดงความเป็นเจ้าของ แปลว่า 'ของพนักงาน' ต้องมีคำนามตามหลัง เช่น employee's desk","3":"employ เป็นคำกริยาแปลว่าจ้าง วางหลัง Many ไม่ได้เพราะ Many ต้องตามด้วยคำนาม"},"point":"many / several / a few / a lot of + คำนามนับได้พหูพจน์ (เติม s)","trick":"เห็น many อยู่หน้าช่องว่าง ให้มองหาตัวเลือกที่ลงท้ายด้วย s ธรรมดา (ไม่มีเครื่องหมาย ')"},"vocab":[{"w":"employee","ipa":"/ɪmˈplɔɪiː/","th":"เอ็ม-**พลอย**-อี","mean":"ลูกจ้าง พนักงานในบริษัท","pos":"n."}]},{"id":"p5e-02-036","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"There are too _____ people in this small room.","choices":["much","many","little","a little"],"answer":1,"th":{"stem":"มีคนเยอะเกินไปในห้องเล็กๆ ห้องนี้","choices":["มาก (ใช้กับของนับไม่ได้)","มาก (ใช้กับของนับได้)","น้อย (ใช้กับของนับไม่ได้)","เล็กน้อย (ใช้กับของนับไม่ได้)"]},"explain":{"why":"people (ผู้คน) เป็นคำนามนับได้รูปพหูพจน์อยู่แล้ว (เป็นพหูพจน์ของ person) และประโยคใช้ are จึงต้องใช้ many คู่กับ too เป็น too many","wrong":{"0":"much ใช้กับคำนามนับไม่ได้ เช่น too much noise แต่คนนับเป็นคนๆ ได้","2":"little แปลว่าน้อย ใช้กับของนับไม่ได้ ทั้งความหมายและชนิดคำนามผิดทั้งคู่","3":"a little แปลว่าเล็กน้อย ใช้กับของนับไม่ได้ และวางหลัง too ไม่ได้"},"point":"people เป็นพหูพจน์เสมอ ใช้กับ are และ many ห้ามเติม s อีก","trick":"too many = เยอะเกินไป (ของนับได้), too much = มากเกินไป (ของนับไม่ได้) ท่องคู่กันไปเลย"}},{"id":"p5e-02-037","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"I have only a _____ minutes before the call.","choices":["much","little","few","many"],"answer":2,"th":{"stem":"ฉันมีเวลาแค่ไม่กี่นาทีก่อนจะถึงเวลาโทร","choices":["มาก (ใช้กับของนับไม่ได้)","เล็กน้อย (ใช้กับของนับไม่ได้)","ไม่กี่ (ใช้กับของนับได้)","มาก (ใช้กับของนับได้ แต่ห้ามมี a นำหน้า)"]},"explain":{"why":"minutes (นาที) เป็นคำนามนับได้พหูพจน์ และหน้าช่องว่างมีคำว่า a อยู่ จึงต้องเป็นวลี a few ซึ่งแปลว่า 'ไม่กี่ / เล็กน้อย' และใช้กับของนับได้","wrong":{"0":"much ใช้กับของนับไม่ได้ และไม่มีรูป a much ในภาษาอังกฤษ","1":"little ใช้กับของนับไม่ได้ เช่น a little water จึงใช้กับ minutes ไม่ได้","3":"many ใช้กับของนับได้ก็จริง แต่ห้ามมี a นำหน้า ไม่มีวลี a many"},"point":"a few + คำนามนับได้พหูพจน์ / a little + คำนามนับไม่ได้","trick":"เห็นคำว่า a ค้างอยู่หน้าช่องว่างและมีคำนามเติม s ตามหลัง ให้ตอบ few ทันที"}},{"id":"p5e-02-038","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","stem":"We have very _____ information about the new client.","choices":["few","many","a few","little"],"answer":3,"th":{"stem":"เรามีข้อมูลน้อยมากเกี่ยวกับลูกค้ารายใหม่","choices":["น้อย (ใช้กับของนับได้)","มาก (ใช้กับของนับได้)","ไม่กี่ (ใช้กับของนับได้)","น้อย (ใช้กับของนับไม่ได้)"]},"explain":{"why":"information (ข้อมูล) เป็น uncountable noun (คำนามนับไม่ได้) ห้ามเติม s คำที่แปลว่า 'น้อย' และใช้กับของนับไม่ได้คือ little จึงตอบ very little","wrong":{"0":"few แปลว่าน้อยเหมือนกัน แต่ใช้กับคำนามนับได้พหูพจน์เท่านั้น เช่น few clients","1":"many ใช้กับคำนามนับได้พหูพจน์ และความหมายเป็น 'มาก' ซึ่งขัดกับ very ในโครงสร้างนี้","2":"a few ใช้กับคำนามนับได้พหูพจน์ และวางหลัง very ไม่ได้"},"point":"very little + คำนามนับไม่ได้ = มีน้อยมาก เทียบกับ very few + คำนามนับได้พหูพจน์","trick":"ดูคำนามหลังช่องว่าง ถ้าไม่มี s และเป็นคำอย่าง information, money, time ให้เลือก little"},"vocab":[{"w":"client","ipa":"/ˈklaɪənt/","th":"**ไคล**-เอินท์","mean":"ลูกค้า (โดยเฉพาะลูกค้าที่ใช้บริการ)","pos":"n."}]},{"id":"p5e-02-039","part":5,"tier":"easy","topic":"quantifier","topicTh":"คำบอกปริมาณ และคำนามนับได้ / นับไม่ได้","ste ":"p5e-02-041","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล will และ be going to","stem":"We _____ send the invoice to the client next week.","choices":["will","are","were","have"],"answer":0,"th":{"stem":"เรา_____ส่งใบแจ้งหนี้ให้ลูกค้าสัปดาห์หน้า","choices":["จะ (กริยาช่วยบอกอนาคต)","เป็น/อยู่ (กริยาช่วยรูปปัจจุบัน)","เป็น/อยู่ (กริยาช่วยรูปอดีต)","ได้...แล้ว (กริยาช่วยบอกความสมบูรณ์)"]},"explain":{"why":"ประโยคมี next week (สัปดาห์หน้า) ซึ่งเป็นอนาคต และคำหลังช่องว่างคือ send ที่เป็นกริยารูปพื้นฐาน กริยาช่วยที่ตามด้วยกริยารูปพื้นฐานเพื่อบอกอนาคตคือ will","wrong":{"1":"are ต้องตามด้วยรูป -ing หรือกริยาช่อง 3 เช่น are sending จะเขียนว่า are send ไม่ได้","2":"were เป็นรูปอดีต ขัดกับ next week และก็ต้องตามด้วย -ing เช่นกัน จึงผิดสองชั้น","3":"have ต้องตามด้วยกริยาช่อง 3 คือ have sent ไม่ใช่ have send และยังสื่อถึงอดีตถึงปัจจุบัน ไม่ใช่อนาคต"},"point":"will + กริยารูปพื้นฐาน = จะทำ ใช้กับเวลาอนาคตอย่าง tomorrow, next week, next month","trick":"หาคำบอกเวลาก่อน ถ้าเจอ next / tomorrow ให้มองหา will ในตัวเลือกทันที"},"vocab":[{"w":"invoice","ipa":"/ˈɪnvɔɪs/","th":"**อิน**-วอยซ์","mean":"ใบแจ้งหนี้ เอกสารเรียกเก็บเงินจากผู้ซื้อ","pos":"n."}]},{"id":"p5e-02-042","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล will และ be going to","stem":"She is going _____ start a new job in May.","choices":["to","for","with","at"],"answer":0,"th":{"stem":"เธอกำลังจะ_____เริ่มงานใหม่ในเดือนพฤษภาคม","choices":["to (ส่วนหนึ่งของวลี be going to)","สำหรับ (คำบุพบท)","กับ (คำบุพบท)","ที่ (คำบุพบท)"]},"explain":{"why":"be going to เป็นวลีตายตัวที่ใช้บอกอนาคตที่วางแผนไว้แล้ว โครงสร้างคือ is/am/are + going + to + กริยารูปพื้นฐาน จึงต้องเติม to","wrong":{"1":"for เป็น preposition (คำบุพบท) ต้องตามด้วยคำนาม ไม่ใช่กริยา start และไม่ใช่ส่วนของวลีบอกอนาคต","2":"with แปลว่า 'กับ' ต้องตามด้วยคำนามเช่นกัน ใช้ต่อหน้ากริยาไม่ได้","3":"at แปลว่า 'ที่' ใช้บอกสถานที่หรือเวลา ไม่ใช่ตัวเชื่อมของวลี be going to"},"point":"จำเป็นชุดเดียวเลยว่า be going to + กริยารูปพื้นฐาน = ก :"easy","topic":"tense-future","topicTh":"อนาคตกาล will และ be going to","stem":"Sorry, I _____ not be at the meeting tomorrow.","choices":["am","do","will","was"],"answer":2,"th":{"stem":"ขอโทษด้วย ฉัน_____ไม่อยู่ในที่ประชุมพรุ่งนี้","choices":["เป็น/อยู่ (ต้องตามด้วย -ing หรือคำขยาย)","กริยาช่วยของปัจจุบัน","จะ (กริยาช่วยบอกอนาคต)","เป็น/อยู่ (รูปอดีต)"]},"explain":{"why":"หลังช่องว่างมี not be ตามมา ซึ่งเป็นรูปปฏิเสธของอนาคต โครงสร้างคือ will not be (จะไม่อยู่) และคำว่า tomorrow ก็ยืนยันว่าเป็นอนาคต","wrong":{"0":"am ตามด้วย not ได้ก็จริง แต่จะเป็น I am not at the meeting ห้ามมี be ต่อท้ายอีก","1":"do ใช้สร้างประโยคปฏิเสธในปัจจุบัน แต่ต้องตามด้วยกริยาทั่วไป ไม่ใช้กับ be ในรูปนี้ และไม่บอกอนาคต","3":"was เป็นรูปอดีต ขัดกับ tomorrow และตามด้วย be ไม่ได้"},"point":"รูปปฏิเสธของอนาคตคือ will not + กริยารูปพื้นฐาน ย่อได้เป็น won't","trick":"ถ้าเห็นคำว่า be เปล่าๆ อยู่หลัง not ให้นึกถึง will ทันที เพราะมีแต่ will เท่านั้นที่ตามด้วย be เปล่าได้"}},{"id":"p5e-02-048","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล will และ be going to","stem":"_____ you help me with these files tomorrow?","choices":["Are","Did","Was","Will"],"answer":3,"th":{"stem":"พรุ่งนี้คุณ_____ช่วยฉันจัดการแฟ้มพวกนี้ได้ไหม","choices":["เป็น/อยู่ (ต้องตามด้วย -ing)","กริยาช่วยรูปอดีต","เป็น/อยู่ (รูปอดีต)","จะ (กริยาช่วยบอกอนาคต)"]},"explain":{"why":"ประโยคนี้เป็นคำถามที่ขอความช่วยเหลือในอนาคต (มีคำว่า tomorrow) และตามด้วยกริยารูปพื้นฐาน help จึงต้องขึ้นต้นด้วย Will","wrong":{"0":"Are ต้องตามด้วยรูป -ing เช่น Are you helping ... จะใช้ Are you help ไม่ได้","1":"Did เป็นกริยาช่วยของอดีต ขัดกับคำว่า tomorrow อย่างชัดเจน","2":"Was ใช้กับประธานเอกพจน์ในอดีต ผิดทั้งประธาน (you ต้องใช้ were) และผิดเวลา"},"point":"Will you ...? ใช้ขอให้คนอื่นช่วยทำอะไรให้ เป็นสำนวนที่เจอบ่อยมาก","trick":"คำถามที่มี tomorrow หรือ next week ให้ตัดกริยาช่วยรูปอดีต (Did, Was, Were) ทิ้งได้ทันที"}},{"id":"p5e-02-049","part":5,"tier":"easy","topic":"tense-future","topicTh":"อนาคตกาล will และ be going to","stem":"
