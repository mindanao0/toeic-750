<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0e1117">
<meta name="description" content="ติว TOEIC 750+ ใน 30 วัน สำหรับคนไทยที่เริ่มจากศูนย์ — ข้อสอบครบทุก Part พร้อมเฉลยละเอียดภาษาไทย">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>TOEIC 750 ใน 30 วัน</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/* ==========================================================================
   TOEIC 750 — stylesheet
   ปรับธีมด้วย data-theme บน <html>, ปรับขนาดตัวอักษรด้วย --fs
   ========================================================================== */

:root {
  --fs: 1;

  --bg:        #0e1117;
  --bg-soft:   #161b23;
  --card:      #1a2029;
  --card-2:    #212936;
  --line:      #2b3442;
  --line-soft: #232b36;

  --tx:        #e8edf4;
  --tx-dim:    #9aa7b8;
  --tx-faint:  #6b7789;

  --brand:     #4f9cf9;
  --brand-dk:  #2b7de0;
  --brand-sf:  #16304f;

  --ok:        #35c77f;
  --ok-sf:     #10331f;
  --bad:       #f2555a;
  --bad-sf:    #3a1518;
  --warn:      #f5a623;
  --warn-sf:   #3a2a0c;
  --gold:      #ffc94a;

  --r:   14px;
  --r-s: 9px;
  --shadow: 0 4px 20px rgba(0, 0, 0, .3);

  --nav-h: 62px;
  --maxw: 780px;
}

:root[data-theme="light"] {
  --bg:        #f4f6fa;
  --bg-soft:   #ffffff;
  --card:      #ffffff;
  --card-2:    #f0f3f8;
  --line:      #d9e0ea;
  --line-soft: #e8edf3;

  --tx:        #16202e;
  --tx-dim:    #55637a;
  --tx-faint:  #8492a6;

  --brand:     #1f6fdc;
  --brand-dk:  #145bbd;
  --brand-sf:  #e3eefc;

  --ok:        #12a05e;
  --ok-sf:     #dcf5e8;
  --bad:       #d92b32;
  --bad-sf:    #fde3e4;
  --warn:      #b57500;
  --warn-sf:   #fdf0d6;
  --gold:      #c48a00;

  --shadow: 0 3px 14px rgba(20, 35, 60, .09);
}

* { box-sizing: border-box; }

html {
  font-size: calc(16px * var(--fs));
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun",
               "Leelawadee UI", Roboto, "Helvetica Neue", sans-serif;
  line-height: 1.65;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- layout ---------- */

#app {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 14px calc(var(--nav-h) + 28px);
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0 10px;
  background: linear-gradient(var(--bg) 72%, transparent);
  backdrop-filter: blur(6px);
}
.topbar h1 { font-size: 1.12rem; margin: 0; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.topbar .sub { font-size: .78rem; color: var(--tx-dim); font-weight: 500; }

.row  { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.col  { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.spacer { flex: 1; }
.center { text-align: center; }
.hidden { display: none !important; }

.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: repeat(2, 1fr); } }

/* ---------- cards ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px;
  margin-bottom: 12px;
}
.card.tight { padding: 12px; }
.card.flat  { background: var(--card-2); border-color: transparent; }
.card h2 { font-size: 1.02rem; margin: 0 0 10px; font-weight: 700; }
.card h3 { font-size: .93rem; margin: 14px 0 7px; font-weight: 700; color: var(--tx-dim); }

.sec-title {
  font-size: .78rem;
  font-weight: 700;
  color: var(--tx-faint);
  letter-spacing: .07em;
  margin: 20px 2px 9px;
  text-transform: uppercase;
}

/* ---------- buttons ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--tx);
  font: inherit;
  font-weight: 600;
  padding: 11px 16px;
  border-radius: var(--r-s);
  cursor: pointer;
  transition: transform .08s, filter .15s, background .15s;
  text-align: center;
  line-height: 1.35;
}
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--brand-dk); }
.btn.ghost   { background: transparent; }
.btn.danger  { background: var(--bad-sf); border-color: var(--bad); color: var(--bad); }
.btn.ok      { background: var(--ok-sf); border-color: var(--ok); color: var(--ok); }
.btn.block   { display: block; width: 100%; }
.btn.sm      { padding: 7px 11px; font-size: .84rem; }
.btn.lg      { padding: 15px 20px; font-size: 1.05rem; }
.btn.icon    { padding: 8px 11px; font-size: 1.05rem; line-height: 1; }

/* ---------- bottom nav ---------- */

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
}
.nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--tx-faint);
  text-decoration: none;
  font-size: .68rem;
  font-weight: 600;
  padding-top: 4px;
}
.nav a .ic { font-size: 1.28rem; line-height: 1; }
.nav a.on { color: var(--brand); }

/* ---------- pills / badges ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--tx-dim);
  white-space: nowrap;
}
.pill.on  { background: var(--brand-sf); border-color: var(--brand); color: var(--brand); }
.pill.ok  { background: var(--ok-sf);   border-color: var(--ok);   color: var(--ok); }
.pill.bad { background: var(--bad-sf);  border-color: var(--bad);  color: var(--bad); }
.pill.warn{ background: var(--warn-sf); border-color: var(--warn); color: var(--warn); }

.tag {
  font-size: .7rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--card-2);
  color: var(--tx-faint);
}

/* ---------- stat tiles ---------- */

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 11px 8px;
  text-align: center;
}
.tile .v { font-size: 1.42rem; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
.tile .k { font-size: .7rem; color: var(--tx-faint); font-weight: 600; margin-top: 1px; }
.tile .v.gold { color: var(--gold); }
.tile .v.ok   { color: var(--ok); }
.tile .v.br   { color: var(--brand); }

/* ---------- progress ---------- */

.bar {
  height: 9px;
  background: var(--card-2);
  border-radius: 99px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: 99px;
  transition: width .4s ease;
}
.bar.ok > i  { background: var(--ok); }
.bar.warn > i{ background: var(--warn); }
.bar.thin { height: 6px; }

/* ---------- task list ---------- */

.task {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.task:hover { border-color: var(--brand); }
.task.done { opacity: .55; }
.task.done .t-title { text-decoration: line-through; }
.task .t-ic {
  width: 34px; height: 34px;
  flex: 0 0 34px;
  display: flex; align-items: center; justify-content: center;
  background: var(--card-2);
  border-radius: 9px;
  font-size: 1.1rem;
}
.task .t-body { flex: 1; min-width: 0; }
.task .t-title { font-weight: 650; font-size: .93rem; }
.task .t-meta  { font-size: .76rem; color: var(--tx-faint); }
.task .t-chk {
  width: 22px; height: 22px; flex: 0 0 22px;
  border: 2px solid var(--line);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem;
  color: transparent;
}
.task.done .t-chk { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- question UI ---------- */

.qwrap { padding-bottom: 8px; }

.qhead {
  display: flex; align-items: center; gap: 8px;
  font-size: .78rem; color: var(--tx-faint); font-weight: 600;
  margin-bottom: 10px;
}

.qstem {
  font-size: 1.06rem;
  line-height: 1.8;
  font-weight: 550;
  margin: 4px 0 16px;
  word-break: break-word;
}
.qstem .blank { color: var(--brand); font-weight: 800; letter-spacing: .06em; }

.choices { display: flex; flex-direction: column; gap: 9px; }

.choice {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--r-s);
  padding: 12px 13px;
  font: inherit;
  color: var(--tx);
  cursor: pointer;
  transition: border-color .12s, background .12s, transform .08s;
  line-height: 1.6;
}
.choice:active { transform: scale(.99); }
.choice:hover:not(:disabled) { border-color: var(--brand); }
.choice .k {
  flex: 0 0 25px;
  width: 25px; height: 25px;
  border-radius: 50%;
  background: var(--card-2);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 800;
  color: var(--tx-dim);
  margin-top: 1px;
}
.choice .c-tx { flex: 1; min-width: 0; }
.choice .c-th { display: block; font-size: .8rem; color: var(--tx-faint); margin-top: 3px; }

/* ตัวเลือกที่เสียงกำลังอ่านถึง */
.choice.speaking {
  border-color: var(--brand);
  background: var(--brand-sf);
  box-shadow: 0 0 0 3px rgba(79, 156, 249, .28);
}
.choice.speaking .k { background: var(--brand); border-color: var(--brand); color: #fff; }
.choice.speaking .c-tx .faint::after {
  content: ' 🔊';
}

.choice.sel      { border-color: var(--brand); background: var(--brand-sf); }
.choice.sel .k   { background: var(--brand); border-color: var(--brand); color: #fff; }
.choice.right    { border-color: var(--ok); background: var(--ok-sf); }
.choice.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.choice.wrong    { border-color: var(--bad); background: var(--bad-sf); }
.choice.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice.dim      { opacity: .5; }
.choice:disabled { cursor: default; }

/* ---------- explanation ---------- */

.exp {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  animation: slideIn .22s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.exp-head {
  padding: 11px 14px;
  font-weight: 800;
  font-size: .97rem;
  display: flex; align-items: center; gap: 8px;
}
.exp-head.ok  { background: var(--ok-sf);  color: var(--ok); }
.exp-head.bad { background: var(--bad-sf); color: var(--bad); }

.exp-body { padding: 13px 14px; background: var(--card); }
.exp-body > * + * { margin-top: 13px; }

.exp-sec { }
.exp-sec > .lbl {
  font-size: .74rem; font-weight: 800; color: var(--tx-faint);
  letter-spacing: .04em; margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.exp-sec p { margin: 0; font-size: .93rem; line-height: 1.75; }

.exp-wrong { display: flex; flex-direction: column; gap: 7px; }
.exp-wrong .w {
  display: flex; gap: 8px;
  font-size: .88rem; line-height: 1.65;
  background: var(--card-2);
  border-radius: 8px;
  padding: 8px 10px;
}
.exp-wrong .w b { color: var(--bad); flex: 0 0 auto; font-weight: 800; }

.exp-point { background: var(--brand-sf); border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0; padding: 9px 12px; }
.exp-trick { background: var(--warn-sf); border-left: 3px solid var(--warn); border-radius: 0 8px 8px 0; padding: 9px 12px; }

.vocab-chip {
  display: inline-flex; flex-direction: column;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 7px 11px;
  margin: 0 6px 6px 0;
  font-size: .84rem;
  cursor: pointer;
}
.vocab-chip b { font-weight: 700; }
.vocab-chip .ph { font-size: .74rem; color: var(--tx-faint); }
.vocab-chip .mn { font-size: .8rem; color: var(--tx-dim); }

/* ---------- passages ---------- */

.passage {
  background: var(--card-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-s);
  padding: 13px 14px;
  font-size: .95rem;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 12px;
}
.passage .p-head {
  border-bottom: 1px dashed var(--line);
  padding-bottom: 8px;
  margin-bottom: 9px;
  font-size: .84rem;
  color: var(--tx-dim);
  white-space: normal;
}
.passage .p-head b { color: var(--tx); }
.passage .p-kind {
  display: inline-block;
  font-size: .68rem; font-weight: 800; letter-spacing: .05em;
  background: var(--brand-sf); color: var(--brand);
  padding: 2px 8px; border-radius: 5px; margin-bottom: 8px;
}
.passage .mark { color: var(--brand); font-weight: 800; }
.passage .th-tr { color: var(--tx-faint); font-size: .88rem; border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 9px; }

/* กล่องภาพ Part 1 — กำหนดอัตราส่วนที่กล่อง ไม่พึ่ง height:auto ของ svg
   (inline SVG ที่มีแต่ viewBox จะสูง 0 บน Safari/iOS) */
.scene { margin-bottom: 12px; }
.scene-box {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  overflow: hidden;
}
.scene-box > svg {
  display: block;
  width: 100%;
  height: 100%;
}
/* สำรองสำหรับเบราว์เซอร์เก่าที่ยังไม่รู้จัก aspect-ratio */
@supports not (aspect-ratio: 4 / 3) {
  .scene-box {
    position: relative;
    height: 0;
    padding-bottom: var(--ar-pad, 75%);
  }
  .scene-box > svg { position: absolute; top: 0; left: 0; }
}
.scene-fail {
  padding: 30px 10px;
  color: var(--bad);
  font-size: .9rem;
  text-align: center;
}

/* ---------- audio ---------- */

.audiobox {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 12px;
  text-align: center;
}
.audiobox .big {
  width: 66px; height: 66px;
  border-radius: 50%;
  border: none;
  background: var(--brand);
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
.audiobox .big:active { transform: scale(.93); }
.audiobox .big.playing { animation: pulse 1.25s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,156,249,.45); } 50% { box-shadow: 0 0 0 13px rgba(79,156,249,0); } }
.audiobox .hint { font-size: .8rem; color: var(--tx-faint); margin-top: 9px; }

.script-box {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 11px 12px;
  margin-top: 11px;
  font-size: .9rem;
  line-height: 1.75;
}
.script-box .ln { margin-bottom: 8px; }
.script-box .sp { font-weight: 800; color: var(--brand); }
.script-box .th { color: var(--tx-faint); font-size: .84rem; display: block; }

/* ---------- flashcards ---------- */

.fc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 30px 18px;
  text-align: center;
  min-height: 236px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
}
.fc .w    { font-size: 2.05rem; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
.fc .ipa  { font-size: .95rem; color: var(--tx-dim); }
.fc .thr  { font-size: 1.08rem; color: var(--brand); font-weight: 700; }
.fc .pos  { font-size: .78rem; color: var(--tx-faint); }
.fc .mean { font-size: 1.14rem; font-weight: 650; margin-top: 4px; }
.fc .ex   { font-size: .9rem; color: var(--tx-dim); margin-top: 10px; font-style: italic; }
.fc .exth { font-size: .84rem; color: var(--tx-faint); }

/* ---------- charts ---------- */

.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }

.hbar { display: flex; flex-direction: column; gap: 9px; }
.hbar .r { display: flex; align-items: center; gap: 9px; font-size: .85rem; }
.hbar .r .lb { flex: 0 0 84px; color: var(--tx-dim); font-weight: 600; }
.hbar .r .tr { flex: 1; height: 17px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.hbar .r .tr > i { display: block; height: 100%; border-radius: 99px; transition: width .5s; }
.hbar .r .vl { flex: 0 0 52px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- lesson blocks ---------- */

.lb-text  { font-size: .98rem; line-height: 1.9; margin: 0 0 13px; }
.lb-ex {
  background: var(--card-2);
  border-left: 3px solid var(--brand);
  border-radius: 0 var(--r-s) var(--r-s) 0;
  padding: 10px 13px;
  margin: 0 0 13px;
}
.lb-ex .en { font-size: 1rem; font-weight: 600; }
.lb-ex .th { font-size: .89rem; color: var(--tx-dim); margin-top: 2px; }
.lb-ex .nt { font-size: .82rem; color: var(--tx-faint); margin-top: 6px; }
.lb-ex .spk { float: right; margin-left: 8px; }

.lb-tip, .lb-warn {
  border-radius: var(--r-s);
  padding: 11px 13px;
  margin: 0 0 13px;
  font-size: .92rem;
  line-height: 1.75;
  display: flex; gap: 9px;
}
.lb-tip  { background: var(--ok-sf); border: 1px solid var(--ok); }
.lb-warn { background: var(--warn-sf); border: 1px solid var(--warn); }

.tbl-wrap { overflow-x: auto; margin: 0 0 13px; -webkit-overflow-scrolling: touch; }
table.lb-tbl { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 300px; }
table.lb-tbl th, table.lb-tbl td {
  border: 1px solid var(--line);
  padding: 7px 10px;
  text-align: left;
  vertical-align: top;
}
table.lb-tbl th { background: var(--card-2); font-weight: 700; white-space: nowrap; }

/* ---------- modal / toast ---------- */

.modal-bg {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0, 0, 0, .6);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
  animation: fade .18s;
}
@keyframes fade { from { opacity: 0; } }
@media (min-width: 560px) { .modal-bg { align-items: center; padding: 20px; } }

.modal {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px;
  animation: up .22s ease;
}
@media (min-width: 560px) { .modal { border-radius: var(--r); } }
@keyframes up { from { transform: translateY(18px); opacity: .4; } }
.modal h2 { margin: 0 0 12px; font-size: 1.1rem; }

.toast {
  position: fixed;
  left: 50%; bottom: calc(var(--nav-h) + 16px);

 * สร้าง element แบบสั้น: h('div.card', {onclick}, 'text', childEl)
 * tag รองรับ  div  div.a.b  div#id.a  หรือแค่ .card (= div.card)
 */
function h(tag, props, ...kids) {
  const m = /^([a-z0-9]*)(#[^.]+)?((?:\.[^.#]+)*)$/i.exec(String(tag || 'div')) || [null, 'div', '', ''];
  const el = document.createElement(m[1] || 'div');
  if (m[2]) el.id = m[2].slice(1);
  if (m[3]) el.className = m[3].slice(1).split('.').join(' ');

  if (props && (typeof props !== 'object' || props instanceof Node)) {
    kids.unshift(props);
    props = null;
  }
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') {
        // Object.assign ตั้งค่า CSS custom property (--x) ไม่ได้ ต้องใช้ setProperty
        for (const sk in v) {
          if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]);
          else el.style[sk] = v[sk];
        }
      }
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className += ' ' + v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  const add = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}

  String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],

/** แปลง **ตัวหนา** เป็น <b> (ใช้กับคำอ่านไทยและคำอธิบาย) */
const mdBold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

const DAY_MS = 86400000;

function ymd(d) {
  const x = d instanceof Date ? d : new Date(d);
  const p = (n) => String(n).padStart(2, '0');
  return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
}

/** จำนวนวันเต็มระหว่าง 2 วันที่แบบ YYYY-MM-DD (b - a) */
function daysBetween(a, b) {
  const pa = a.split('-').map(Number);
  const pb = b.split('-').map(Number);
  const ta = Date.UTC(pa[0], pa[1] - 1, pa[2]);
  const tb = Date.UTC(pb[0], pb[1] - 1, pb[2]);
  return Math.round((tb - ta) / DAY_MS);
}

function addDays(dateStr, n) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + n);
  return ymd(d);
}

const TH_DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

function thaiDate(dateStr, opts) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const be = p[0] + 543;
  const core = `${p[2]} ${TH_MONTH[p[1] - 1]} ${be}`;
  return opts && opts.dow ? `วัน${TH_DOW[d.getDay()]}ที่ ${core}` : core;
}

function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return hh ? `${hh}:${p(mm)}:${p(ss)}` : `${mm}:${p(ss)}`;
}

function fmtMin(min) {
  if (min < 60) return `${min} นาที`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `${h} ชม. ${m} นาที` : `${h} ชม.`;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function hashStr(s) {
  let hp = 0;
  for (let i = 0; i < s.length; i++) hp = (Math.imul(31, hp) + s.charCodeAt(i)) | 0;
  return hp >>> 0;
}

  const r = rnd || Math.random;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const uniq = (a) => Array.from(new Set(a));

  return o;

  const bg = h('div.modal-bg', {

function totalAnswered(s) {
  return App.sum(s.attempts.map((a) => a.n || 0));
}
function matureWords(s) {
  return Object.values(s.srs).filter((c) => c.iv >= 7).length;
}
function bestScore(s) {
  const fromExam = s.exams.map((e) => e.scaled.total);
  const fromPl = s.placement ? [s.placement.scaled.total] : [];
  return Math.max(0, ...fromExam, ...fromPl);
}

function checkBadges() {
  const have = new Set(S.progress.badges.map((b) => b.id));
  const won = [];
  for (const b of BADGES) {
    if (have.has(b.id)) continue;
    let pass = false;
    try { pass = b.test(S); } catch (e) { /* ข้ามถ้าโครงสร้างยังไม่พร้อม */ }
    if (pass) {
      S.progress.badges.push({ id: b.id, ts: Date.now() });
      won.push(b);
    }
  }
  if (won.length) {
    save();
    setTimeout(() => showBadgeWin(won), 400);
  }
  return won;
}

function showBadgeWin(list) {
  const body = App.h(
    'div.center',
    list.map((b) =>
      App.h(
        'div',
        { style: { margin: '14px 0' } },
        App.h('div', { style: { fontSize: '3rem', lineHeight: '1.2' } }, b.icon),
        App.h('div.b', { style: { fontSize: '1.1rem' } }, b.name),
        App.h('div.small.muted', b.desc),
      ),
    ),
  );
  App.modal('🎉 ได้เหรียญใหม่!', body, [{ label: 'เยี่ยม!', kind: 'primary' }]);
}

/* ---------- บันทึกการทำข้อสอบ ---------- */

/**
 * @param {{mode:string, part?:number, tier?:string, topic?:string, label?:string,
 *          items:Array<{qid,ch,ok,ms,part,tier,topic}>, ms:number}} a
 */
function addAttempt(a) {
  const rec = {
    id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
    ts: Date.now(),
    date: App.today(),
    mode: a.mode,
    part: a.part || null,
    tier: a.tier || null,
    topic: a.topic || null,
    label: a.label || '',
    n: a.items.length,
    correct: a.items.filter((i) => i.ok).length,
    ms: a.ms || 0,
    items: a.items,
  };
  S.attempts.push(rec);
  if (S.attempts.length > 800) S.attempts = S.attempts.slice(-800);

  for (const it of a.items) {
    S.seen[it.qid] = (S.seen[it.qid] || 0) + 1;
    if (it.ok) {
      const m = S.mistakes[it.qid];
      if (m && !m.resolved) {
        m.resolved = true;
        m.resolvedTs = Date.now();
      }
    } else {
      const m = S.mistakes[it.qid] || {
        n: 0, part: it.part, tier: it.tier, topic: it.topic, resolved: false,
      };
      m.n += 1;
      m.lastTs = Date.now();
      m.lastCh = it.ch;
      m.resolved = false;
      m.part = it.part != null ? it.part : m.part;
      m.tier = it.tier || m.tier;
      m.topic = it.topic || m.topic;
      S.mistakes[it.qid] = m;
    }
  }
  markStudiedToday();
  save(true);
  checkBadges();
  return rec;
}

function taskKey(day, t) {
  return `${day}:${t.type}:${t.id || t.part || ''}:${t.tier || ''}`;
}
function isTaskDone(day, t) {
  return !!S.progress.doneTasks[taskKey(day, t)];
}
function markTaskDone(day, t) {
  const k = taskKey(day, t);
  if (S.progress.doneTasks[k]) return false;
  S.progress.doneTasks[k] = Date.now();
  save();
  return true;
}

/* ---------- นำเข้า / ส่งออก ---------- */

function exportJSON() {
  return JSON.stringify(S, null, 1);
}

function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function importJSON(text) {
  const obj = JSON.parse(text);
  if (!obj || typeof obj !== 'object' || !obj.progress || !obj.settings) {
    throw new Error('ไฟล์ไม่ใช่ข้อมูลสำรองของแอปนี้');
  }
  S = migrate(obj);
  const d = DEFAULT_STATE();
  for (const k in d) if (!(k in S)) S[k] = d[k];
  save(true);
  return S;
}

function resetAll() {
  S = DEFAULT_STATE();
  S.plan.startDate = App.today();
  save(true);
}

Object.assign(App, {
  Store: {
    load, save, state, resetAll,
    planDay, calendarDay, daysLeft,
    markStudiedToday, addXP, XP,
    addAttempt, taskKey, isTaskDone, markTaskDone,
    checkBadges, BADGES, totalAnswered, matureWords, bestScore,
    exportJSON, importJSON, download,
    STORE_KEY,
  },
});

})();

/* ===== 20-score.js ===== */
;(function(){
/* ============================================================
   20-score — แปลงคะแนนดิบเป็นคะแนน TOEIC (ประมาณการ)

   TOEIC จริงใช้ตารางแปลงที่ต่างกันเล็กน้อยในแต่ละครั้งสอบ
   ตัวเลขที่ได้จากที่นี่จึงเป็น "ประมาณการ" คลาดเคลื่อนได้ราว ±25 คะแนน
   จุดยึด (anchor) ด้านล่างอิงจากช่วงคะแนนที่ ETS เผยแพร่ในชุดฝึกอย่างเป็นทางการ
   ============================================================ */
'use strict';

/* raw (0–100) -> scaled (5–495) : จุดยึดแล้ว interpolate เชิงเส้น */
const ANCHOR_L = [
  [0, 5], [5, 5], [10, 25], [15, 50], [20, 75], [25, 100], [30, 125],
  [35, 150], [40, 185], [45, 210], [50, 235], [55, 260], [60, 285],
  [65, 310], [70, 335], [75, 360], [80, 385], [85, 410], [90, 435],
  [95, 460], [98, 480], [100, 495],
];

const ANCHOR_R = [
  [0, 5], [5, 5], [10, 30], [15, 55], [20, 75], [25, 100], [30, 125],
  [35, 150], [40, 175], [45, 200], [50, 230], [55, 255], [60, 285],
  [65, 310], [70, 340], [75, 365], [80, 395], [85, 420], [90, 445],
  [95, 470], [98, 485], [100, 495],
];

function interp(anchors, raw) {
  const x = App.clamp(raw, 0, 100);
  for (let i = 1; i < anchors.length; i++) {
    const [x0, y0] = anchors[i - 1];
    const [x1, y1] = anchors[i];
    if (x <= x1) {
      const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
      return Math.round((y0 + t * (y1 - y0)) / 5) * 5;
    }
  }
  return 495;
}

const scaleL = (raw) => App.clamp(interp(ANCHOR_L, raw), 5, 495);
const scaleR = (raw) => App.clamp(interp(ANCHOR_R, raw), 5, 495);

/** rawL, rawR = จำนวนข้อถูกจาก 100 ข้อ */
function scaledFromRaw(rawL, rawR) {
  const L = scaleL(rawL);
  const R = scaleR(rawR);
  return { L, R, total: L + R };
}

/* จำนวนข้อจริงในแต่ละ Part */
const PART_N = { 1: 6, 2: 25, 3: 39, 4: 30, 5: 30, 6: 16, 7: 54 };
const LISTEN_PARTS = [1, 2, 3, 4];
const READ_PARTS = [5, 6, 7];

const PART_NAME = {
  1: 'Part 1 · รูปภาพ',
  2: 'Part 2 · ถาม-ตอบ',
  3: 'Part 3 · บทสนทนา',
  4: 'Part 4 · บทพูด',
  5: 'Part 5 · เติมคำในประโยค',
  6: 'Part 6 · เติมคำในบทความ',
  7: 'Part 7 · อ่านจับใจความ',
};

const PART_SHORT = {
  1: 'P1 รูปภาพ', 2: 'P2 ถาม-ตอบ', 3: 'P3 สนทนา', 4: 'P4 บทพูด',
  5: 'P5 เติมคำ', 6: 'P6 บทความ', 7: 'P7 อ่าน',
};

/**
 * ประมาณคะแนนจากผลการฝึกที่ผ่านมา
 * ใช้ % ความแม่นยำล่าสุดของแต่ละ Part ถ่วงน้ำหนักตามจำนวนข้อจริง
 * Part ที่ยังไม่เคยฝึก จะประมาณจากค่าเฉลี่ยของฝั่งเดียวกัน หรือค่าตั้งต้น 25% (เดาสุ่ม)
 */
function predict(state) {
  const acc = accuracyByPart(state, 220); // ดู 220 ข้อล่าสุดต่อ Part
  const guessFloor = { 1: 0.25, 2: 0.333, 3: 0.25, 4: 0.25, 5: 0.25, 6: 0.25, 7: 0.25 };

  const fill = (parts) => {
    const known = parts.filter((p) => acc[p] && acc[p].n >= 5);
    const avg = known.length
      ? App.sum(known.map((p) => acc[p].correct)) / App.sum(known.map((p) => acc[p].n))
      : null;
    const out = {};
    for (const p of parts) {
      if (acc[p] && acc[p].n >= 5) out[p] = acc[p].correct / acc[p].n;
      else if (avg != null) out[p] = App.clamp(avg * 0.92, guessFloor[p], 1); // ยังไม่เคยฝึก = หักลบเล็กน้อย
      else out[p] = guessFloor[p];
    }
    return out;
  };

  const rl = fill(LISTEN_PARTS);
  const rr = fill(READ_PARTS);

  const rawL = App.sum(LISTEN_PARTS.map((p) => rl[p] * PART_N[p]));
  const rawR = App.sum(READ_PARTS.map((p) => rr[p] * PART_N[p]));

  const sc = scaledFromRaw(rawL, rawR);
  const dataPoints = App.sum(Object.values(acc).map((a) => a.n));

  return {
    ...sc,
    rawL: Math.round(rawL),
    rawR: Math.round(rawR),
    rateL: rl,
    rateR: rr,
    dataPoints,
    confidence: dataPoints < 60 ? 'low' : dataPoints < 250 ? 'mid' : 'high',
  };
}

/** ความแม่นยำรายส่วนจากประวัติล่าสุด (ไม่นับโหมดทบทวนข้อผิด เพราะจะเบ้ต่ำ) */
function accuracyByPart(state, limitPerPart) {
  const out = {};
  const lim = limitPerPart || 999999;
  for (let i = state.attempts.length - 1; i >= 0; i--) {
    const a = state.attempts[i];
    if (a.mode === 'review') continue;
    for (const it of a.items) {
      const p = it.part;
      if (!p) continue;
      const o = out[p] || (out[p] = { n: 0, correct: 0, ms: 0 });
      if (o.n >= lim) continue;
      o.n += 1;
      o.ms += it.ms || 0;
      if (it.ok) o.correct += 1;
    }
  }
  return out;
}

/** ความแม่นยำรายหัวข้อไวยากรณ์ — ใช้หา "จุดอ่อน" */
function accuracyByTopic(state) {
  const out = {};
  for (const a of state.attempts) {
    for (const it of a.items) {
      if (!it.topic) continue;
      const o = out[it.topic] || (out[it.topic] = { n: 0, correct: 0, topicTh: it.topicTh || '' });
      o.n += 1;
      if (it.ok) o.correct += 1;
      if (it.topicTh) o.topicTh = it.topicTh;
    }
  }
  return out;
}

/** เส้นแนวโน้มคะแนนตามวัน (ใช้ทำกราฟ) */
function scoreTrend(state) {
  const byDate = {};
  for (const a of state.attempts) {
    if (a.mode === 'review') continue;
    const d = a.date || App.ymd(a.ts);
    const o = byDate[d] || (byDate[d] = {});
    for (const it of a.items) {
      if (!it.part) continue;
      const p = o[it.part] || (o[it.part] = { n: 0, c: 0 });
      p.n += 1;
      if (it.ok) p.c += 1;
    }
  }
  const dates = Object.keys(byDate).sort();
  const pts = [];
  const cum = {}; // สะสมแบบถ่วงน้ำหนักล่าสุด เพื่อให้เส้นไม่กระโดด
  for (const d of dates) {
    for (const p in byDate[d]) {
      const c = cum[p] || (cum[p] = { n: 0, c: 0 });
      c.n = c.n * 0.55 + byDate[d][p].n;
      c.c = c.c * 0.55 + byDate[d][p].c;
    }
    const rate = (p) => (cum[p] && cum[p].n >= 3 ? cum[p].c / cum[p].n : null);
    const side = (parts) => {
      const k = parts.filter((p) => rate(p) != null);
      if (!k.length) return null;
      const avg = App.sum(k.map((p) => rate(p) * PART_N[p])) / App.sum(k.map((p) => PART_N[p]));
      return App.sum(parts.map((p) => (rate(p) != null ? rate(p) : avg * 0.92) * PART_N[p]));
    };
    const rl = side(LISTEN_PARTS);
    const rr = side(READ_PARTS);
    if (rl == null && rr == null) continue;
    const sc = scaledFromRaw(rl == null ? 25 : rl, rr == null ? 25 : rr);
    pts.push({ date: d, total: sc.total, L: sc.L, R: sc.R });
  }
  return pts;
}

/** ระดับความหมายของคะแนน (ตามเกณฑ์ที่ ETS ใช้สื่อสาร) */
function scoreBand(total) {
  if (total >= 905) return { th: 'ใช้งานได้ใกล้เคียงเจ้าของภาษา', color: 'var(--gold)' };
  if (total >= 785) return { th: 'สื่อสารในงานได้คล่อง', color: 'var(--ok)' };
  if (total >= 605) return { th: 'สื่อสารในงานได้ในระดับพื้นฐาน', color: 'var(--brand)' };
  if (total >= 405) return { th: 'สื่อสารเรื่องง่ายๆ ได้บ้าง', color: 'var(--warn)' };
  if (total >= 255) return { th: 'เริ่มต้น เข้าใจประโยคสั้นๆ', color: 'var(--warn)' };
  return { th: 'ยังต้องสร้างพื้นฐาน', color: 'var(--bad)' };
}

/** เป้าหมายรายวัน: ควรอยู่ที่เท่าไหร่ในวันที่ n เพื่อจะถึง 750 ในวันที่ 30 */
function targetOnDay(day, startScore) {
  const s = startScore || 300;
  const t = App.clamp((day - 1) / 29, 0, 1);
  // โตแบบ ease-out: ช่วงแรกขึ้นเร็ว (ไวยากรณ์+ศัพท์คุ้มที่สุด) แล้วค่อยชะลอ
  const eased = 1 - Math.pow(1 - t, 1.55);
  return Math.round((s + (750 - s) * eased) / 5) * 5;
}

Object.assign(App, {
  Score: {
    scaleL, scaleR, scaledFromRaw,
    PART_N, PART_NAME, PART_SHORT, LISTEN_PARTS, READ_PARTS,
    predict, accuracyByPart, accuracyByTopic, scoreTrend, scoreBand, targetOnDay,
  },
});

})();

}

function genderOf(v) {
  const n = String(v.name || '');
  if (FEMALE.test(n)) return 'W';
  if (MALE.test(n)) return 'M';
  return null;
}

/** เสียงทั้งหมดที่ตรงภาษาที่ต้องการ เรียงจากดีที่สุด */
function candidates(accent) {
  const st = App.Store.state();
  const acc = st.settings.accentMode === 'us' ? 'US' : accent || 'US';
  const chain = [LANG_OF[acc] || 'en-US'].concat(FALLBACK[acc] || ['en-US']);

  for (const lang of chain) {
    const hit = voices.filter((v) => normLang(v.lang) === lang.toLowerCase());
    if (hit.length) return hit.slice().sort((a, b) => voiceScore(b) - voiceScore(a));
  }
  const anyEn = voices.filter((v) => normLang(v.lang).startsWith('en'));
  return (anyEn.length ? anyEn : voices).slice().sort((a, b) => voiceScore(b) - voiceScore(a));
}

/**
 * เลือกเสียงที่เหมาะกับสำเนียงและเพศผู้พูด
 * @param {string} accent US|UK|CA|AU
 * @param {string} [speaker] 'M' | 'W'
 */
function voiceFor(accent, speaker) {
  const st = App.Store.state();
  const acc = st.settings.accentMode === 'us' ? 'US' : accent || 'US';

  const pinned = st.settings.voiceMap && st.settings.voiceMap[acc];
  if (pinned) {
    const v = voices.find((x) => x.voiceURI === pinned);
    if (v) return v;
  }

  const list = candidates(acc);
  if (!list.length) return null;
  if (speaker === 'M' || speaker === 'W') {
    const match = list.find((v) => genderOf(v) === speaker);
    if (match) return match;
  }
  return list[0];
}

/** สำเนียงที่เครื่องนี้รองรับจริง + คุณภาพ */
function availableAccents() {
  const out = {};
  for (const a in LANG_OF) {
    const exact = voices
      .filter((v) => normLang(v.lang) === LANG_OF[a].toLowerCase())
      .sort((x, y) => voiceScore(y) - voiceScore(x));
    const best = exact[0] || null;
    out[a] = {
      ok: !!best,
      name: best ? best.name : null,
      quality: !best ? 'none' : voiceScore(best) >= 60 ? 'good' : voiceScore(best) <= -100 ? 'poor' : 'ok',
      count: exact.length,
    };
  }
  return out;
}

/** สรุปคุณภาพเสียงโดยรวมของเครื่องนี้ */
function quality() {
  if (!supported()) return { level: 'none', msg: 'เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน' };
  if (!voices.length) return { level: 'none', msg: 'ยังตรวจไม่พบเสียงในเครื่อง' };
  const best = Math.max(...voices.map(voiceScore));
  if (best >= 60) return { level: 'good', msg: 'เครื่องนี้มีเสียงคุณภาพสูง' };
  if (best <= -100) return {
    level: 'poor',
    msg: 'เครื่องนี้มีแต่เสียงสังเคราะห์พื้นฐาน (eSpeak) ซึ่งฟังเป็นหุ่นยนต์มาก — ' +
      'แนะนำให้เปิดแอปบนมือถือ (Android/iOS เสียงดีกว่ามาก) หรือใช้ Chrome ตอนต่อเน็ต',
  };
  return { level: 'ok', msg: 'เสียงในเครื่องใช้ได้ แต่ไม่ใช่เสียงคุณภาพสูงสุด' };
}

/* ---------- เตรียมข้อความให้อ่านออกเสียงได้ดี ---------- */

const ABBR = [
  [/\bMr\./g, 'Mister'], [/\bMrs\./g, 'Missus'], [/\bMs\./g, 'Miss'], [/\bDr\./g, 'Doctor'],
  [/\bSt\./g, 'Street'], [/\bAve\./g, 'Avenue'], [/\bRd\./g, 'Road'], [/\bDept\./g, 'Department'],
  [/\bInc\./g, 'Incorporated'], [/\bLtd\./g, 'Limited'], [/\bCo\./g, 'Company'], [/\bNo\./g, 'Number'],
  [/\ba\.m\./gi, 'A M'], [/\bp\.m\./gi, 'P M'], [/\bA\.M\./g, 'A M'], [/\bP\.M\./g, 'P M'],
  [/&/g, ' and '], [/#(\d)/g, 'number $1'], [/\$/g, ' dollars '],
];

function normalizeText(t) {
  let s = String(t == null ? '' : t);
  s = s.replace(/^\s*\(?[A-D]\)?[.)]\s+/, '');   // ตัด "(A) " / "A. " ที่หน้าประโยคออก
  s = s.replace(/\*\*/g, '').replace(/\[\[?\d+\]?\]/g, ' ');
  for (const [re, rep] of ABBR) s = s.replace(re, rep);
  s = s.replace(/\s+/g, ' ').trim();
  if (s && !/[.!?…]$/.test(s)) s += '.';
  return s;
}

/* ---------- เล่นเสียง ---------- */

function setState(playing) {
  if (onStateChange) onStateChange(playing);
}

function stop() {
  currentSeq++;
  try {
    synth().cancel();
    lastCancelAt = Date.now();
  } catch (e) {}
  setState(false);
}

function say(text, accent, opts) {
  return speakSeq([{ text, accent }], opts);
}

/**
 * พูดหลายบรรทัดต่อกัน
 * @param {Array<{text:string, accent?:string, sp?:string, gap?:number, choice?:number}>} lines
 * @param {{rate?:number, gap?:number, onLine?:(i:number, line:object)=>void, onDone?:Function}} opts
 */
function speakSeq(lines, opts) {
  opts = opts || {};
  if (!supported()) {
    App.toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน — กดดูสคริปต์แทนได้', 'bad');
    return Promise.resolve(false);
  }
  stop();
  const mySeq = ++currentSeq;
  const st = App.Store.state();
  const rate = opts.rate != null ? opts.rate : st.settings.ttsRate;

  // Chrome มีบั๊ก: cancel() แล้ว speak() ทันทีจะเงียบ — เว้นจังหวะสั้นๆ ก่อน
  const settle = Math.max(0, 140 - (Date.now() - lastCancelAt));

  return whenReady().then(
    () =>
      new Promise((resolve) => {
        setState(true);
        let i = 0;
        let watchdog = null;

        const finish = (ok) => {
          clearTimeout(watchdog);
          if (mySeq === currentSeq) setState(false);
          if (opts.onDone) opts.onDone(ok);
          resolve(ok);
        };

        const next = () => {
          if (mySeq !== currentSeq) return resolve(false);
          if (i >= lines.length) return finish(true);

          const ln = lines[i];
          const idx = i;
          i++;
          if (opts.onLine) opts.onLine(idx, ln);

          const text = normalizeText(ln.text);
          if (!text) return setTimeout(next, 40);

          const u = new SpeechSynthesisUtterance(text);
          const v = voiceFor(ln.accent, ln.sp);
          if (v) {
            u.voice = v;
            u.lang = v.lang;
          } else {
            u.lang = LANG_OF[ln.accent] || 'en-US';
          }
          u.rate = App.clamp(rate, 0.5, 2);
          u.volume = 1;
          // บิด pitch เฉพาะตอนที่หาเสียงคนละคนไม่ได้จริงๆ
          const sameVoiceClash = ln.sp && v && genderOf(v) !== ln.sp;
          u.pitch = sameVoiceClash ? (ln.sp === 'W' ? 1.18 : 0.86) : 1;

          let advanced = false;
          const go = () => {
            if (advanced) return;
            advanced = true;
            clearTimeout(watchdog);
            const gap = ln.gap != null ? ln.gap : opts.gap != null ? opts.gap : 320;
            setTimeout(next, gap);
          };
          u.onend = go;
          u.onerror = (e) => {
            if (e && (e.error === 'interrupted' || e.error === 'canceled')) return resolve(false);
            console.warn('tts error', e && e.error);
            go();
          };

          // กันเคสเบราว์เซอร์ไม่ยิง onend
          const est = 1200 + (text.length / Math.max(0.6, u.rate)) * 85;
          clearTimeout(watchdog);
          watchdog = setTimeout(() => {
            if (synth().speaking) {
              watchdog = setTimeout(go, 4000);
              return;
            }
            go();
          }, est + 2500);

          try {
            synth().speak(u);
          } catch (e) {
            console.warn(e);
            go();
          }
        };

        setTimeout(next, settle);
      }),
  );
}

/* ---------- สร้างรายการบรรทัดของแต่ละ Part ---------- */

/** Part 3/4 — บทสนทนา/บทพูด */
function linesOf(group) {
  const ls = (group.audio && group.audio.lines) || [];
  return ls.map((l, i) => ({
    text: l.text,
    accent: l.accent || 'US',
    sp: l.sp,
    gap: i === ls.length - 1 ? 0 : 230,   // จังหวะสลับคนพูดแบบธรรมชาติ
  }));
}

/**
 * Part 1 — 4 ประโยคเรียงกัน ไม่อ่านตัวอักษร A-D ออกเสียง (เหมือนข้อสอบจริง)
 * ใส่ choice ไว้ให้หน้าจอไฮไลต์ว่ากำลังอ่านตัวเลือกไหน
 */
function part1Lines(item) {
  const acc = item.accent || 'US';
  return item.choices.map((c, i) => ({ text: c, accent: acc, choice: i, gap: i === item.choices.length - 1 ? 0 : 620 }));
}

/** Part 2 — คำถาม แล้วเว้นจังหวะ แล้ว 3 ตัวเลือก */
function part2Lines(item) {
  const qa = item.promptAccent || 'US';
  const ca = item.choicesAccent || 'UK';
  return [{ text: item.prompt, accent: qa, sp: 'M', gap: 900 }].concat(
    item.choices.map((c, i) => ({
      text: c, accent: ca, sp: 'W', choice: i,
      gap: i === item.choices.length - 1 ? 0 : 620,
    })),
  );
}

Object.assign(App, {
  TTS: {
    init, supported, say, speakSeq, stop, listVoices, voiceFor, availableAccents, quality,
    linesOf, part1Lines, part2Lines, normalizeText, voiceScore, genderOf,
    ACCENT_TH, LANG_OF,
    set onState(fn) { onStateChange = fn; },
    get onState() { return onStateChange; },
  },
});

})();

/* ===== 40-data.js ===== */
;(function(){
/* ============================================================
   40-data — โหลดคลังเนื้อหา (ทำงานได้ทั้งแบบฝังในไฟล์เดียวและแบบโหลดทีละไฟล์)
   ============================================================ */
'use strict';

const MANIFEST = window.__MANIFEST__ || { drills: [], tests: [], lessons: [], vocab: [], static: [], plan: null };
const INLINE = window.__DATA__ || null;

const cache = new Map();      // "kind/name" -> object
const unitIndex = new Map();  // qid -> unit
const qIndex = new Map();     // qid -> {unit, qi}
let loadedAll = false;

const baseUrl = () => {
  const p = location.pathname;
  return p.slice(0, p.lastIndexOf('/') + 1);
};

function loadFile(kind, name) {
  const key = kind + '/' + name;
  if (cache.has(key)) return Promise.resolve(cache.get(key));
  if (INLINE) {
    const obj = INLINE[key] || null;
    cache.set(key, obj);
    return Promise.resolve(obj);
  }
  return fetch(`${baseUrl()}data/${kind}/${name}.json`, { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null)
    .then((obj) => {
      cache.set(key, obj);
      return obj;
    });
}

function filesOf(kind) {
  return (MANIFEST[kind] || []).slice();
}

function loadKind(kind) {
  return Promise.all(filesOf(kind).map((n) => loadFile(kind, n))).then((a) => a.filter(Boolean));
}

/* ---------- normalize ---------- */

const GROUP_PARTS = new Set([3, 4, 6, 7]);

/**
 * แปลง item ดิบเป็น "unit" ที่ตัวรันข้อสอบใช้
 * single = 1 คำถาม / group = หลายคำถามใช้เนื้อหาร่วมกัน
 */
function toUnit(raw, src) {
  if (!raw || typeof raw !== 'object') return null;
  const part = Number(raw.part);
  if (!part) return null;
  const isGroup = Array.isArray(raw.questions) && raw.questions.length > 0;

  const u = {
    id: raw.id,
    part,
    tier: raw.tier || 'medium',
    topic: raw.topic || null,
    topicTh: raw.topicTh || null,
    src: src || null,
    kind: isGroup ? 'group' : 'single',
    raw,
  };

  if (isGroup) {
    u.qs = raw.questions.map((q, i) => ({
      qid: `${raw.id}#${i + 1}`,
      idx: i,
      q: q.q || (q.blank ? `ช่องว่างที่ ${q.blank}` : ''),
      blank: q.blank || null,
      kindQ: q.kind || null,
      choices: q.choices || [],
      answer: q.answer,
      th: q.th || {},
      explain: q.explain || {},
    }));
  } else {
    u.qs = [
      {
        qid: raw.id,
        idx: 0,
        q: raw.stem || raw.prompt || '',
        choices: raw.choices || [],
        answer: raw.answer,
        th: raw.th || {},
        explain: raw.explain || {},
      },
    ];
  }
  u.n = u.qs.length;
  return u;
}

function indexUnits(units) {
  for (const u of units) {
    unitIndex.set(u.id, u);
    u.qs.forEach((q, qi) => qIndex.set(q.qid, { unit: u, qi }));
  }
}

/* ---------- ดริล ---------- */

let drillUnits = null;

function loadDrills() {
  if (drillUnits) return Promise.resolve(drillUnits);
  return loadKind('drills').then((files) => {
    const out = [];
    for (const f of files) {
      const src = (f.meta && f.meta.batch) || 'drill';
      for (const it of f.items || []) {
        const u = toUnit(it, src);
        if (u) out.push(u);
      }
    }
    drillUnits = out;
    indexUnits(out);
    return out;
  });
}

/** รวมข้อจากบทเรียน (quiz ท้ายบท) เข้าคลังด้วย เผื่อใช้ทบทวน */
let lessonUnits = null;
function loadLessonQuizUnits() {
  if (lessonUnits) return Promise.resolve(lessonUnits);
  return loadKind('lessons').then((files) => {
    const out = [];
    for (const f of files) {
      for (const it of f.quiz || []) {
        const u = toUnit(it, 'lesson:' + f.id);
        if (u) out.push(u);
      }
    }
    lessonUnits = out;
    indexUnits(out);
    return out;
  });
}

/**
 * เลือกข้อสำหรับฝึก
 *
 * ถ้าระบุ topic แล้วข้อในหัวข้อนั้นไม่พอตามจำนวนที่ขอ จะเติมจากหัวข้ออื่น
 * ใน Part/ระดับเดียวกันจนครบ — ดีกว่าให้ผู้เรียนได้ทำน้อยกว่าที่แผนตั้งไว้
 * (และการสลับหัวข้อยังช่วยความจำระยะยาวมากกว่าการฝึกหัวข้อเดียวรวด)
 *
 * @param {{part?:number|number[], tier?:string, topic?:string, n?:number,
 *          preferUnseen?:boolean, seed?:number, strictTopic?:boolean}} opt
 */
function selectDrill(opt) {
  opt = opt || {};
  return loadDrills().then((all) => {
    const parts = opt.part == null ? null : Array.isArray(opt.part) ? opt.part : [opt.part];
    const inScope = (u) => {
      if (parts && !parts.includes(u.part)) return false;
      if (opt.tier && u.tier !== opt.tier) return false;
      return true;
    };

    const scoped = all.filter(inScope);
    if (!scoped.length) return [];

    const primary = opt.topic ? scoped.filter((u) => u.topic === opt.topic) : scoped;
    const backup = opt.topic && !opt.strictTopic ? scoped.filter((u) => u.topic !== opt.topic) : [];
    if (!primary.length && !backup.length) return [];

    const st = App.Store.state();
    const rnd = App.mulberry32(opt.seed != null ? opt.seed : Date.now() & 0xffffff);

    // ข้อที่ยังไม่เคยเจอมาก่อน แล้วค่อยวนกลับไปข้อที่เจอมาน้อยที่สุด
    const order = (list) => {
      if (opt.preferUnseen === false) return App.shuffle(list, rnd);
      const seenCount = (u) => App.sum(u.qs.map((q) => st.seen[q.qid] || 0));
      const fresh = App.shuffle(list.filter((u) => seenCount(u) === 0), rnd);
      const rest = App.shuffle(list.filter((u) => seenCount(u) > 0), rnd)
        .sort((a, b) => seenCount(a) - seenCount(b));
      return fresh.concat(rest);
    };

    const want = opt.n || 20;
    const out = [];
    let cnt = 0;
    for (const list of [order(primary), order(backup)]) {
      for (const u of list) {
        if (cnt >= want) break;
        out.push(u);
        cnt += u.n;
      }
      if (cnt >= want) break;
    }
    return out;
  });
}

/** หัวข้อทั้งหมดที่มีในคลัง พร้อมจำนวนข้อ */
function drillTopics() {
  return loadDrills().then((all) => {
    const map = {};
    for (const u of all) {
      if (!u.topic) continue;
      const k = u.topic;
      const o = map[k] || (map[k] = { topic: k, topicTh: u.topicTh || k, n: 0, parts: new Set(), tiers: new Set() });
      o.n += u.n;
      o.parts.add(u.part);
      o.tiers.add(u.tier);
      if (u.topicTh) o.topicTh = u.topicTh;
    }
    return Object.values(map)
      .map((o) => ({ ...o, parts: Array.from(o.parts), tiers: Array.from(o.tiers) }))
      .sort((a, b) => b.n - a.n);
  });
}

/** จำนวนข้อที่มีในคลัง แยกตาม part/tier */
function drillCounts() {
  return loadDrills().then((all) => {
    const out = {};
    for (const u of all) {
      const p = (out[u.part] = out[u.part] || { total: 0, easy: 0, medium: 0, real: 0 });
      p.total += u.n;
      p[u.tier] = (p[u.tier] || 0) + u.n;
    }
    return out;
  });
}

/* ---------- ชุดสอบ ---------- */

function loadTest(name) {
  return loadFile('tests', name).then((f) => {
    if (!f) return null;
    const units = (f.items || []).map((it) => toUnit(it, name)).filter(Boolean);
    indexUnits(units);
    return { meta: f.meta || {}, units, name };
  });
}

function testList() {

}

/* ---------- บทเรียน ---------- */

function lessons() {

}

}

/* ---------- คำศัพท์ ---------- */

let vocabAll = null;
function vocab() {
  if (vocabAll) return Promise.resolve(vocabAll);
  return loadKind('vocab').then((files) => {
    const out = [];
    for (const f of files) for (const it of f.items || []) out.push({ ...it, batch: (f.meta && f.meta.batch) || '' });
    const seenId = new Set();
    vocabAll = out.filter((x) => (seenId.has(x.id) ? false : (seenId.add(x.id), true)));
    return vocabAll;

/* ---------- เอกสารคงที่ ---------- */

function staticDoc(name) {

    return planCache;

/* ---------- ค้นหาข้อจาก qid (ใช้กับสมุดข้อผิด) ---------- */

function ensureAll(onProgress) {
  if (loadedAll) return Promise.resolve();
  const jobs = [loadDrills(), loadLessonQuizUnits()].concat(filesOf('tests').map((n) => loadTest(n)));
  let done = 0;
  return Promise.all(
    jobs.map((p) =>
      p.then((r) => {
        done++;
        if (onProgress) onProgress(done, jobs.length);
        return r;

    ),
  ).then(() => {
    loadedAll = true;
  });

/* ---------- สรุปว่ามีเนื้อหาอะไรพร้อมแล้วบ้าง ---------- */

      tests: filesOf('tests').filter((n) => n !== 'placement').length,
      hasPlacement: filesOf('tests').includes('placement'),

Object.assign(App, {

/* ============================================================
   50-srs — ระบบทวนคำศัพท์แบบเว้นระยะ (ดัดแปลงจาก SM-2)
   ปรับให้ระยะสั้นกว่าปกติ เพราะมีเวลาเตรียมตัวแค่ 30 วัน

'use strict';

/* ระยะทวนสูงสุดจำกัดที่ 12 วัน — เกินกว่านั้นจะไม่ทันได้ทวนก่อนสอบ */
const MAX_IV = 12;

const GRADE = {
  again: 0, // ไม่รู้เลย
  hard: 1,  // นึกออกยาก
  good: 2,  // นึกออก
  easy: 3,  // ง่ายมาก
};

function newCard() {
  return { ef: 2.4, iv: 0, due: App.today(), reps: 0, lapses: 0, last: null };
}

function get(id) {
  const s = App.Store.state();
  return s.srs[id] || null;
}

/** อัปเดตการ์ดตามผลการทวน แล้วคืนการ์ดใหม่ */
function review(id, grade) {
  const s = App.Store.state();
  const c = s.srs[id] || newCard();

  if (grade === GRADE.again) {
    c.lapses += 1;
    c.ef = Math.max(1.4, c.ef - 0.22);
    c.iv = 0;
    c.due = App.today(); // ทวนซ้ำในรอบเดียวกัน
  } else {
    const q = grade === GRADE.hard ? 3 : grade === GRADE.good ? 4 : 5;
    c.ef = App.clamp(c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)), 1.4, 2.7);

    if (c.reps === 0 || c.iv === 0) c.iv = grade === GRADE.easy ? 2 : 1;
    else if (c.iv === 1) c.iv = grade === GRADE.hard ? 1 : grade === GRADE.easy ? 4 : 2;
    else c.iv = Math.round(c.iv * (grade === GRADE.hard ? 1.25 : c.ef) * (grade === GRADE.easy ? 1.25 : 1));

    c.iv = App.clamp(c.iv, 1, MAX_IV);
    c.due = App.addDays(App.today(), c.iv);
    c.reps += 1;
  }

  c.last = Date.now();
  s.srs[id] = c;
  App.Store.save();
  return c;
}

/**
 * เลือกการ์ดสำหรับทวนวันนี้
 * ลำดับ: ครบกำหนดทวน (เก่าสุดก่อน) → คำใหม่ (เรียงตามความถี่ที่ออกสอบ)
 */
function due(allWords, limitNew, limitTotal) {
  const s = App.Store.state();
  const t = App.today();
  const dueList = [];
  const fresh = [];

  for (const w of allWords) {
    const c = s.srs[w.id];
    if (!c) fresh.push(w);
    else if (c.due <= t) dueList.push(w);
  }

  dueList.sort((a, b) => {
    const ca = s.srs[a.id], cb = s.srs[b.id];
    if (ca.due !== cb.due) return ca.due < cb.due ? -1 : 1;
    return (cb.lapses || 0) - (ca.lapses || 0);
  });

  fresh.sort((a, b) => (b.freq || 3) - (a.freq || 3) || String(a.id).localeCompare(String(b.id)));

  const nNew = Math.max(0, limitNew == null ? 20 : limitNew);
  const out = dueList.concat(fresh.slice(0, nNew));
  return limitTotal ? out.slice(0, limitTotal) : out;
}

function stats(allWords) {
  const s = App.Store.state();
  const t = App.today();
  let learning = 0, young = 0, mature = 0, dueNow = 0, untouched = 0;
  for (const w of allWords) {
    const c = s.srs[w.id];
    if (!c) { untouched++; continue; }
    if (c.due <= t) dueNow++;
    if (c.iv >= 7) mature++;
    else if (c.iv >= 2) young++;
    else learning++;
  }
  return { total: allWords.length, learning, young, mature, dueNow, untouched, started: allWords.length - untouched };
}

/** ตัวเลือกลวงสำหรับโหมด "เลือกความหมาย" */
function distractors(word, allWords, n) {
  const same = allWords.filter((w) => w.id !== word.id && w.pos === word.pos);
  const pool = (same.length >= n ? same : allWords.filter((w) => w.id !== word.id));
  return App.pick(pool, n || 3);
}

Object.assign(App, {
  SRS: { GRADE, newCard, get, review, due, stats, distractors, MAX_IV },
});

})();

        if (opt.onChoice) opt.onChoice(ln && ln.choice != null ? ln.choice : null);
      },
    }).then(() => {
      setPlaying(false);
      App.$$('.ln', scriptWrap).forEach((x) => (x.style.background = ''));
      if (opt.onPlayed) opt.onPlayed(plays);
      if (limited) {
        const left = opt.playsLeft - plays;

function stemHTML(text) {
  return esc(text).replace(/_{3,}/g, '<span class="blank">_____</span>');
}

/**
 * กล่องภาพของ Part 1
 * inline SVG ที่มีแต่ viewBox จะสูงเป็น 0 บน Safari/iOS ถ้าใช้ height:auto
 * จึงต้องกำหนดอัตราส่วนที่กล่องครอบ และบังคับให้ svg เต็มกล่อง
 */
function sceneEl(raw) {
  if (!raw.svg) return null;
  const clean = sanitizeSVG(raw.svg);

  const vb = /viewBox\s*=\s*["']\s*(-?[\d.]+)[,\s]+(-?[\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(clean);
  const vw = vb ? parseFloat(vb[3]) : 400;
  const vh = vb ? parseFloat(vb[4]) : 300;
  const ratio = vh > 0 && vw > 0 ? vh / vw : 0.75;

  const box = h('div.scene-box', {
    style: { aspectRatio: `${vw} / ${vh}`, '--ar-pad': (ratio * 100).toFixed(3) + '%' },
  });
  box.innerHTML = clean;

  const svg = box.querySelector('svg');
  if (svg) {
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    if (!svg.getAttribute('preserveAspectRatio')) svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.removeAttribute('style');
  } else {
    // กันกรณี SVG เสียจนเบราว์เซอร์ parse ไม่ได้
    box.textContent = '';
    box.appendChild(h('div.scene-fail', '⚠️ แสดงภาพไม่ได้'));
  }

  return h('div.scene', box);
}

/** ตัดสิ่งที่ไม่ปลอดภัย/ไม่อนุญาตออกจาก SVG ที่มาจากคลังเนื้อหา */
function sanitizeSVG(svg) {
  let s = String(svg);
  s = s.replace(/<\s*(script|foreignObject|style|image|use|iframe)[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
  s = s.replace(/<\s*(script|foreignObject|style|image|use|iframe)[^>]*\/?>/gi, '');
  s = s.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  s = s.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  s = s.replace(/(href|xlink:href)\s*=\s*("[^"]*"|'[^']*')/gi, '');
  return s;
}

/* ---------- กราฟ (SVG เขียนเอง ไม่พึ่งไลบรารีภายนอก) ---------- */

function lineChart(points, opt) {
  opt = opt || {};
  const W = opt.w || 640, H = opt.h || 210;
  const pad = { l: 40, r: 12, t: 14, b: 26 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  if (!points.length) return h('div.empty', 'ยังไม่มีข้อมูลพอจะวาดกราฟ — ทำข้อสอบสัก 20 ข้อก่อน');

  const ys = points.map((p) => p.y);
  const lo = opt.min != null ? opt.min : Math.min(...ys, 200) - 20;
  const hi = opt.max != null ? opt.max : Math.max(...ys, 800) + 20;
  const X = (i) => pad.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const Y = (v) => pad.t + ih - ((App.clamp(v, lo, hi) - lo) / (hi - lo)) * ih;

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', '100%');
  svg.style.minWidth = Math.min(W, 640) + 'px';

  const mk = (n, at) => {
    const e = document.createElementNS(NS, n);
    for (const k in at) e.setAttribute(k, at[k]);
    return e;
  };

  // เส้นกริดแนวนอน
  const ticks = opt.ticks || [200, 400, 600, 750, 900];
  ticks.forEach((t) => {
    if (t < lo || t > hi) return;
    svg.appendChild(mk('line', { x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t), stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': t === 750 ? '5 3' : '' }));
    const tx = mk('text', { x: 4, y: Y(t) + 4, fill: t === 750 ? 'var(--ok)' : 'var(--tx-faint)', 'font-size': 10 });
    tx.textContent = t;
    svg.appendChild(tx);
  });

  // พื้นที่ใต้เส้น
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  svg.appendChild(mk('path', {
    d: `${d} L${X(points.length - 1).toFixed(1)},${pad.t + ih} L${X(0).toFixed(1)},${pad.t + ih} Z`,
    fill: 'var(--brand)', opacity: .12,
  }));
  svg.appendChild(mk('path', { d, fill: 'none', stroke: 'var(--brand)', 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  points.forEach((p, i) => {
    svg.appendChild(mk('circle', { cx: X(i), cy: Y(p.y), r: 3.6, fill: 'var(--brand)', stroke: 'var(--bg)', 'stroke-width': 1.5 }));
    if (points.length <= 12 || i === 0 || i === points.length - 1) {
      const tx = mk('text', { x: X(i), y: H - 8, fill: 'var(--tx-faint)', 'font-size': 9, 'text-anchor': 'middle' });
      tx.textContent = p.label || '';
      svg.appendChild(tx);
    }
  });

  const wrap = h('div.chart');
  wrap.appendChild(svg);
  return wrap;
}

function hbars(rows) {
  const wrap = h('div.hbar');
  rows.forEach((r) => {
    const p = App.clamp(r.pct, 0, 100);
    const color = r.color || (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--brand)' : p >= 30 ? 'var(--warn)' : 'var(--bad)');
    wrap.appendChild(
      h('div.r',
        h('span.lb', r.label),
        h('span.tr', h('i', { style: { width: p + '%', background: color } })),
        h('span.vl', r.value != null ? r.value : p + '%')),
    );
  });
  return wrap;
}

/** ปฏิทินความสม่ำเสมอ 30 วัน */
function streakGrid(startDate, studyDates) {
  const set = new Set(studyDates);
  const wrap = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(10, 1fr)', gap: '5px' } });
  for (let i = 0; i < 30; i++) {
    const d = App.addDays(startDate, i);
    const isPast = App.daysBetween(d, App.today()) >= 0;
    const done = set.has(d);
    const el = h('div', {
      title: `วันที่ ${i + 1} · ${App.thaiDate(d)}${done ? ' · เรียนแล้ว' : ''}`,
      style: {
        aspectRatio: '1',
        borderRadius: '6px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: '.66rem', fontWeight: '700',
        background: done ? 'var(--ok)' : isPast ? 'var(--bad-sf)' : 'var(--card-2)',
        color: done ? '#fff' : isPast ? 'var(--bad)' : 'var(--tx-faint)',
        border: d === App.today() ? '2px solid var(--brand)' : '1px solid var(--line)',
      },
    }, String(i + 1));
    wrap.appendChild(el);
  }
  return wrap;
}

/* ---------- โครงหน้าจอ ---------- */

function view(...kids) {
  const f = document.createDocumentFragment();
  kids.forEach((k) => k && f.appendChild(k));
  return f;
}

function emptyState(icon, msg, action) {
  return h('div.empty', h('span.big', icon), h('div', { html: msg }), action ? h('div.mt', action) : null);
}

function tierPill(tier) {
  const m = { easy: ['ง่าย', 'ok'], medium: ['กลาง', 'warn'], real: ['ระดับจริง', 'bad'] };
  const x = m[tier] || ['—', ''];
  return h('span.pill.' + x[1], x[0]);
}

Object.assign(App, {
  UI: {
    topbar, backBtn, audioBox, sceneEl, passageEl, choicesEl, explainEl,
    vocabChip, lineChart, hbars, streakGrid, view, emptyState, stemHTML,
    tierPill, sanitizeSVG, docKindTh, LETTERS,
  },
});

})();

;(function(){
/* ============================================================
   65-quiz — ตัวรันข้อสอบ
   โหมด practice = เฉลยทันทีทีละข้อ / โหมด exam = จับเวลา ไม่เฉลยระหว่างทำ

'use strict';

const { h, esc } = App;

let session = null;

/**
 * @param {{units:Array, mode:'practice'|'exam'|'review', title:string, sub?:string,
 *          timeLimitMs?:number, sections?:Array, onFinish:Function, onExit?:Function,
 *          autoAudio?:boolean, allowScript?:boolean}} cfg

function start(cfg) {
  const flat = [];
  cfg.units.forEach((u, ui) => {
    u.qs.forEach((q, qi) => flat.push({ ui, qi, u, q }));
  });

  session = {
    cfg,
    units: cfg.units,
    flat,
    answers: {},        // qid -> chosen index
    times: {},          // qid -> ms
    flags: {},          // qid -> true
    revealed: {},       // qid -> true (practice)
    stepUnit: 0,        // exam: ดัชนี unit
    stepQ: 0,           // practice: ดัชนีใน flat
    startTs: Date.now(),
    qStartTs: Date.now(),
    audioPlayedFor: {}, // unitId -> true
    finished: false,
    deadline: cfg.timeLimitMs ? Date.now() + cfg.timeLimitMs : null,
  };
  App.go('#/quiz');
}

function active() {
  return session;
}

function exit(silent) {
  App.TTS.stop();
  const s = session;
  session = null;
  if (s && s.cfg.onExit && !silent) s.cfg.onExit();
}

/* ---------- หน้าจอหลัก ---------- */

function render(root) {
  if (!session) {
    root.appendChild(U.emptyState('🤔', 'ไม่มีชุดข้อสอบที่กำลังทำอยู่', h('button.btn.primary', { onclick: () => App.go('#/') }, 'กลับหน้าแรก')));

  }
  if (session.cfg.mode === 'exam') renderExam(root);
  else renderPractice(root);

function renderPractice(root) {
  const s = session;
  const cur = s.flat[s.stepQ];

  const { u, q, qi } = cur;

  const isFirstOfUnit = qi === 0;

  root.appendChild(
    U.topbar(
      s.cfg.title,
      `ข้อ ${s.stepQ + 1} จาก ${s.flat.length}`,

    ),
  );

  // แถบความคืบหน้า
  const done = s.flat.filter((f) => s.revealed[f.q.qid]).length;
  const nCorrect = s.flat.filter((f) => s.revealed[f.q.qid] && s.answers[f.q.qid] === f.q.answer).length;
  root.appendChild(

  // เสียง (Part 1-4)

      hint: u.part <= 2 ? 'ตัวเลือกที่กำลังอ่านจะสว่างขึ้นให้เห็น' : 'กดฟังบทสนทนา',

  // ภาพ Part 1

  // บทความ Part 6/7
  const pg = U.passageEl(u.raw, { showThai: !!s.showThai });
  if (pg) card.appendChild(pg);

  // โจทย์
  if (u.part === 1) {
    card.appendChild(h('div.qstem', 'ฟังทั้ง 4 ประโยค แล้วเลือกข้อที่ตรงกับภาพมากที่สุด'));
  } else if (u.part === 2) {
    card.appendChild(h('div.qstem', 'ฟังคำถาม แล้วเลือกคำตอบที่เหมาะสมที่สุด'));
  } else if (u.part === 5) {
    card.appendChild(h('div.qstem', { html: U.stemHTML(q.q) }));
  } else if (u.part === 6) {
    card.appendChild(h('div.qstem', `ช่องว่างที่ ( ${q.blank} ) ควรเติมอะไร`));
  } else {
    card.appendChild(h('div.qstem', q.q));
  }

  if (s.showThai && u.part === 5 && u.raw.th && u.raw.th.stem) {
    card.appendChild(h('div.small.faint', { style: { marginTop: '-10px', marginBottom: '14px' } }, u.raw.th.stem));
  }
  if (s.showThai && q.th && q.th.q) {
    card.appendChild(h('div.small.faint', { style: { marginTop: '-10px', marginBottom: '14px' } }, q.th.q));
  }

  // ตัวเลือก
  const hideText = (u.part === 1 || u.part === 2) && !revealed;
  const chEl = U.choicesEl(q, {
    hideText,
    chosen,
    revealed,
    showThai: true,
    onPick: (i, ev) => pickPractice(i, ev),
  });
  if (s.hintOut != null && !revealed) {
    const btns = chEl.querySelectorAll('.choice');
    if (btns[s.hintOut]) {
      btns[s.hintOut].classList.add('dim');
      btns[s.hintOut].disabled = true;
    }
  }
  card.appendChild(chEl);

  // ปุ่มช่วยเหลือ
  if (!revealed && App.Store.state().settings.helpBtn) {
    const tools = h('div.row.wrap', { style: { marginTop: '12px', justifyContent: 'center' } });
    if (u.part >= 5 || u.part === 6 || u.part === 7) {
      tools.appendChild(h('button.btn.sm.ghost', {
        onclick: () => { s.showThai = !s.showThai; App.rerender(); },
      }, s.showThai ? '🇹🇭 ซ่อนคำแปล' : '🇹🇭 ดูคำแปล'));
    }
    if (s.hintOut == null && q.choices.length > 2) {
      tools.appendChild(h('button.btn.sm.ghost', {
        onclick: () => {
          const wrongs = q.choices.map((_, i) => i).filter((i) => i !== q.answer);
          s.hintOut = wrongs[Math.floor(Math.random() * wrongs.length)];

function pickPractice(i, ev) {

/* ---------- โหมดสอบ: ทีละชุด จับเวลา ไม่เฉลย ---------- */

let timerHandle = null;

function renderExam(root) {
  const s = session;
  const u = s.units[s.stepUnit];
  if (!u) return finish();

  root.appendChild(
    U.topbar('สอบเสมือนจริง', s.cfg.sub || '', h('button.btn.icon.ghost', { onclick: askExit, title: 'ออก' }, '✕')),

  root.appendChild(bar);

  clearInterval(timerHandle);
  const tick = () => {
    if (!session || session.finished) return clearInterval(timerHandle);
    const left = s.deadline - Date.now();

    let label;

    else if (u.part === 2) label = 'เลือกคำตอบที่เหมาะสมที่สุด';
    else if (u.part === 5) label = null;
    else if (u.part === 6) label = `ช่องว่างที่ ( ${q.blank} )`;

    );

        ? h('button.btn.primary.grow', { onclick: confirmSubmit }, 'ส่งคำตอบ')

function answeredCount() {
  const s = session;
  return s.flat.filter((f) => s.answers[f.q.qid] != null).length;
}

function showPalette() {
  const s = session;
  const grid = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(8,1fr)', gap: '6px' } });
  s.flat.forEach((f, i) => {
    const ans = s.answers[f.q.qid] != null;
    const flag = s.flags[f.q.qid];
    grid.appendChild(
      h('button.btn.sm', {
        style: {
          padding: '7px 0',
          background: flag ? 'var(--warn-sf)' : ans ? 'var(--ok-sf)' : 'var(--card-2)',
          borderColor: flag ? 'var(--warn)' : ans ? 'var(--ok)' : 'var(--line)',
        },
        onclick: () => { s.stepUnit = f.ui; App.scrollTop(); App.rerender(); m.close(); },
      }, String(i + 1)),
    );
  });
  const m = App.modal(`ตอบแล้ว ${answeredCount()}/${s.flat.length}`, h('div', grid,
    h('div.small.faint.mt', '🟩 ตอบแล้ว · 🟨 ทำเครื่องหมายไว้ · ⬜ ยังไม่ตอบ')), [{ label: 'ปิด' }]);
}

function confirmSubmit() {
  const left = session.flat.length - answeredCount();
  if (left > 0) {
    App.confirmBox('ส่งคำตอบเลยไหม', `ยังไม่ได้ตอบอีก ${left} ข้อ ข้อที่ไม่ตอบจะนับเป็นผิด`, finish, 'ส่งเลย');
  } else {
    App.confirmBox('ส่งคำตอบ', 'ตรวจครบทุกข้อแล้ว ส่งคำตอบเลยไหม', finish, 'ส่งคำตอบ');
  }
}

/* ---------- ปิดท้าย ---------- */

function finish() {
  const s = session;
  if (!s || s.finished) return;
  s.finished = true;
  clearInterval(timerHandle);
  App.TTS.stop();

  const items = s.flat.map((f) => ({
    qid: f.q.qid,
    ch: s.answers[f.q.qid] != null ? s.answers[f.q.qid] : -1,
    ok: s.answers[f.q.qid] === f.q.answer,
    ms: s.times[f.q.qid] || 0,
    part: f.u.part,
    tier: f.u.tier,
    topic: f.u.topic,
    topicTh: f.u.topicTh,
  }));

  const result = {
    mode: s.cfg.mode,
    title: s.cfg.title,
    items,
    ms: Date.now() - s.startTs,
    units: s.units,
    answers: s.answers,
    byPart: App.Score.LISTEN_PARTS.concat(App.Score.READ_PARTS).reduce((o, p) => {
      const its = items.filter((i) => i.part === p);
      if (its.length) o[p] = { n: its.length, correct: its.filter((i) => i.ok).length };
      return o;
    }, {}),
  };

  const cb = s.cfg.onFinish;
  session = null;
  if (cb) cb(result);
}

function askExit() {
  const s = session;
  if (!s) return App.go('#/');
  const answered = s.flat.filter((f) => s.answers[f.q.qid] != null).length;
  if (!answered) {
    exit();
    return App.go(s.cfg.backTo || '#/');
  }
  App.confirmBox('ออกจากชุดนี้', `ทำไปแล้ว ${answered} ข้อ ถ้าออกตอนนี้ ${s.cfg.mode === 'exam' ? 'ผลสอบจะไม่ถูกบันทึก' : 'ระบบจะบันทึกเท่าที่ทำไปแล้ว'}`, () => {
    if (s.cfg.mode !== 'exam' && answered) {
      s.flat = s.flat.filter((f) => s.answers[f.q.qid] != null);
      finish();
    } else {
      const back = s.cfg.backTo || '#/';
      exit();
      App.go(back);
    }
  }, 'ออก');
}

function addNote(qid) {
  const st = App.Store.state();
  const ta = h('textarea', { rows: 4, placeholder: 'เช่น "ลืมว่า since ต้องใช้กับ present perfect"' });
  ta.value = st.notes[qid] || '';
  App.modal('โน้ตของข้อนี้', ta, [
    { label: 'ยกเลิก', kind: 'ghost' },
    {
      label: 'บันทึก', kind: 'primary',
      onclick: () => {
        if (ta.value.trim()) st.notes[qid] = ta.value.trim();
        else delete st.notes[qid];
        App.Store.save(true);
        App.toast('บันทึกโน้ตแล้ว', 'ok');
      },
    },
  ]);
}

/* ---------- ตัวช่วย ---------- */

/** ทำให้ตัวเลือกที่กำลังถูกอ่านออกเสียงสว่างขึ้น (แทนการอ่าน "(A)" ออกเสียง) */
function highlightChoice(i) {
  const btns = App.$$('.choices .choice');
  btns.forEach((b, k) => b.classList.toggle('speaking', i != null && k === i));
}

function audioLinesFor(u, q) {
  if (u.part === 1) return App.TTS.part1Lines(u.raw);
  if (u.part === 2) return App.TTS.part2Lines(u.raw);
  if (u.part === 3 || u.part === 4) return App.TTS.linesOf(u.raw);
  return [];
}

function scriptLinesFor(u, q) {
  if (u.part === 1) {
    const th = (u.raw.th && u.raw.th.choices) || [];
    return [{ en: '🖼 ' + (u.raw.sceneTh || ''), th: '' }].concat(
      u.raw.choices.map((c, i) => ({ en: `(${U.LETTERS[i]}) ${c}`, th: th[i] || '' })),
    );
  }
  if (u.part === 2) {
    const th = u.raw.th || {};
    return [{ en: 'Q: ' + u.raw.prompt, th: th.prompt || '' }].concat(
      u.raw.choices.map((c, i) => ({ en: `(${U.LETTERS[i]}) ${c}`, th: (th.choices || [])[i] || '' })),
    );
  }
  const ls = (u.raw.audio && u.raw.audio.lines) || [];
  const th = (u.raw.th && u.raw.th.lines) || [];
  return ls.map((l, i) => ({ sp: l.sp, en: l.text, th: th[i] || '' }));
}

function bindKeys(q, revealed) {
  if (App._quizKeyHandler) document.removeEventListener('keydown', App._quizKeyHandler);
  const fn = (e) => {
    if (!session || session.cfg.mode === 'exam') return;
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    const k = e.key.toUpperCase();
    if (!revealed) {
      const i = U.LETTERS.indexOf(k);
      if (i >= 0 && i < q.choices.length) { e.preventDefault(); pickPractice(i, e); }
      if (/^[1-4]$/.test(k) && Number(k) <= q.choices.length) { e.preventDefault(); pickPractice(Number(k) - 1, e); }
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nextPractice();
    }
    if (k === 'R' && session) {
      const b = App.$('.audiobox .big');
      if (b) b.click();
    }
  };
  App._quizKeyHandler = fn;
  document.addEventListener('keydown', fn);
}

Object.assign(App, { Quiz: { start, render, active, exit, finish } });

})();

function taskTitle(t, meta) {
  if (t.type === 'lesson') return `บทเรียน: ${t.id}`;

    return `ฝึก ${App.Score.PART_SHORT[t.part]} (${tier})`;
  }
  if (t.type === 'vocab') return `ทวนคำศัพท์ ${t.n} คำ`;
  if (t.type === 'review') return `ทบทวนข้อที่เคยผิด ${t.n} ข้อ`;
  if (t.type === 'exam') return `สอบเสมือนจริง (${t.testId})`;
  if (t.type === 'checkpoint') return t.label || 'ทดสอบย่อย';
  return meta.name;
}

function taskAvailable(t, inv) {
  if (t.type === 'lesson') {
    return App.Data.filesOf('lessons').includes(t.id)
      ? { ok: true }
      : { ok: false, msg: `บท ${t.id} กำลังจัดทำ` };
  }
  if (t.type === 'exam') {
    return App.Data.filesOf('tests').includes(t.testId)
      ? { ok: true }
      : { ok: false, msg: `ชุดสอบ ${t.testId} กำลังจัดทำ` };
  }
  if (t.type === 'placement') {
    return App.Data.filesOf('tests').includes('placement') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  }
  if (t.type === 'drill' || t.type === 'checkpoint') {
    const c = inv.drills[t.part];
    if (!c || !c.total) return { ok: false, msg: `ข้อ ${App.Score.PART_SHORT[t.part]} กำลังจัดทำ` };
    if (t.tier && !c[t.tier]) return { ok: false, msg: 'ระดับนี้กำลังจัดทำ' };
    return { ok: true };
  }
  if (t.type === 'vocab') return inv.vocab ? { ok: true } : { ok: false, msg: 'คลังศัพท์กำลังจัดทำ' };
  if (t.type === 'cheatsheet') return App.Data.filesOf('static').includes('cheatsheet') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  if (t.type === 'examinfo') return App.Data.filesOf('static').includes('examinfo') ? { ok: true } : { ok: false, msg: 'กำลังจัดทำ' };
  return { ok: true };
}

function runTask(t, day, dayPlan) {
  const finishTask = () => App.Store.markTaskDone(day, t);

  switch (t.type) {
    case 'placement':
      return App.go('#/placement');
    case 'lesson':
      return App.go('#/lesson/' + t.id);
    case 'vocab':
      App.pendingCards = { n: t.n, onDone: finishTask };
      return App.go('#/cards');
    case 'cheatsheet':
      finishTask();
      return App.go('#/cheatsheet');
    case 'examinfo':
      finishTask();
      return App.go('#/examinfo');
    case 'exam':
      return App.go('#/exam/' + t.testId);
    case 'review':
      App.pendingReview = { n: t.n, onDone: finishTask };
      return App.go('#/review');
    case 'weakspot':
      return startWeakspot(t, finishTask);
    case 'drill':
    case 'checkpoint':
      return startPlanDrill(t, finishTask);
  }
}

function startPlanDrill(t, onDone) {
  App.Data.selectDrill({ part: t.part, tier: t.tier, topic: t.topic, n: t.n }).then((units) => {
    if (!units.length) return App.toast('ยังไม่มีข้อสอบส่วนนี้ในคลัง', 'bad');
    App.Quiz.start({
      units,
      mode: 'practice',
      title: t.label || `ฝึก ${App.Score.PART_SHORT[t.part]}`,
      backTo: '#/',
      onExit: () => App.go('#/'),
      onFinish: (res) => {
        App.Store.addAttempt({ mode: 'drill', part: t.part, tier: t.tier, topic: t.topic, items: res.items, ms: res.ms });
        App.Store.addXP(App.Store.XP.drillSet);
        if (onDone) onDone();
        App.pendingResult = res;
        App.go('#/result');
      },
    });
  });
}

function startWeakspot(t, onDone) {
  const st = App.Store.state();
  const acc = App.Score.accuracyByTopic(st);
  const weak = Object.entries(acc)
    .filter(([, v]) => v.n >= 5)
    .map(([k, v]) => ({ topic: k, rate: v.correct / v.n }))
    .sort((a, b) => a.rate - b.rate)
    .slice(0, 5)
    .map((x) => x.topic);

  const load = weak.length
    ? Promise.all(weak.map((tp) => App.Data.selectDrill({ topic: tp, n: Math.ceil(t.n / weak.length) }))).then((a) => a.flat())
    : App.Data.selectDrill({ n: t.n });

  load.then((units) => {
    if (!units.length) return App.toast('ยังไม่มีข้อมูลพอจะหาจุดอ่อน — ทำข้อสอบเพิ่มก่อน', 'bad');
    App.Quiz.start({
      units: App.shuffle(units).slice(0, Math.ceil(t.n / 1.2)),
      mode: 'practice',
      title: 'ซัดจุดอ่อนของคุณ',
      backTo: '#/',
      onExit: () => App.go('#/'),
      onFinish: (res) => {
        App.Store.addAttempt({ mode: 'drill', label: 'weakspot', items: res.items, ms: res.ms });
        App.Store.addXP(App.Store.XP.drillSet);
        if (onDone) onDone();
        App.pendingResult = res;
        App.go('#/result');
      },
    });
  });
}

App.Views.TASK_META = TASK_META;
App.Views.startPlanDrill = startPlanDrill;

})();

        tb.appendChild(tr);
      });
      t.appendChild(tb);
      w.appendChild(t);
      return w;
    }
    case 'tip':
      return h('div.lb-tip', h('span', '💡'), h('div', { html: App.mdBold(b.th || '') }));
    case 'warn':
      return h('div.lb-warn', h('span', '⚠️'), h('div', { html: App.mdBold(b.th || '') }));
    default:
      return h('p.lb-text', { html: App.mdBold(b.th || b.text || '') });
