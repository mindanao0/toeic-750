}

function startLessonQuiz(L) {
  const units = (L.quiz || []).map((it) => App.Data.toUnit(it, 'lesson:' + L.id)).filter(Boolean);
  if (!units.length) return completeLesson(L);
  App.Quiz.start({
    units,
    mode: 'practice',
    title: 'แบบฝึกท้ายบท',
    backTo: '#/lesson/' + L.id,
    onExit: () => App.go('#/lesson/' + L.id),
    onFinish: (res) => {
      App.Store.addAttempt({ mode: 'lesson', label: L.id, items: res.items, ms: res.ms });
      completeLesson(L, true);
      App.pendingResult = res;
      App.go('#/result');
    },
  });
}

function completeLesson(L, silent) {
  const st = App.Store.state();
  if (!st.progress.lessonsDone[L.id]) {
    st.progress.lessonsDone[L.id] = Date.now();
    App.Store.addXP(App.Store.XP.lesson);
    App.Store.save(true);
    if (!silent) {
      App.toast(`เรียนจบบท ${L.id} แล้ว +${App.Store.XP.lesson} XP`, 'ok');
      setTimeout(() => App.go('#/learn'), 700);
    }
  } else if (!silent) {
    App.go('#/learn');
  }
  // ทำเครื่องหมายภารกิจในแผนวันนี้ให้ด้วย
  App.Data.plan().then((p) => {
    const d = (p.days || []).find((x) => x.d === App.Store.planDay());
    if (!d) return;
    const t = (d.tasks || []).find((x) => x.type === 'lesson' && x.id === L.id);
    if (t) App.Store.markTaskDone(d.d, t);
  });
}

/* ---------- สรุปผลหลังทำชุด ---------- */

App.Views.result = function (root) {
  const res = App.pendingResult;
  if (!res) {
    root.appendChild(U.emptyState('📊', 'ไม่มีผลลัพธ์ที่จะแสดง', h('button.btn.primary', { onclick: () => App.go('#/') }, 'กลับหน้าแรก')));
    return;
  }
  const n = res.items.length;
  const c = res.items.filter((i) => i.ok).length;
  const p = App.pct(c, n);
  const good = p >= 75;

  root.appendChild(U.topbar('สรุปผล', res.title || ''));

  root.appendChild(h('div.card', { style: { textAlign: 'center' } },
    h('div', { style: { fontSize: '3rem' } }, p >= 90 ? '🏆' : p >= 75 ? '🎉' : p >= 50 ? '💪' : '📚'),
    h('div', { style: { fontSize: '2.6rem', fontWeight: '800', color: good ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)' } },
      `${c}/${n}`),
    h('div.b', `ถูก ${p}%`),
    h('div.small.muted', { style: { marginTop: '6px' } },
      `ใช้เวลา ${App.fmtDur(res.ms)} · เฉลี่ย ${App.fmtDur(res.ms / Math.max(1, n))} ต่อข้อ`)));

  // รายส่วน
  const parts = Object.keys(res.byPart || {});
  if (parts.length > 1) {
    root.appendChild(h('div.card',
      h('h2', 'แยกตามส่วน'),
      U.hbars(parts.map((k) => ({
        label: App.Score.PART_SHORT[k],
        pct: App.pct(res.byPart[k].correct, res.byPart[k].n),
        value: `${res.byPart[k].correct}/${res.byPart[k].n}`,
      })))));
  }

  // หัวข้อที่ควรกลับไปทวน
  const wrongTopics = {};
  res.items.filter((i) => !i.ok && i.topic).forEach((i) => {
    wrongTopics[i.topic] = (wrongTopics[i.topic] || { n: 0, th: i.topicTh || i.topic });
    wrongTopics[i.topic].n++;
  });
  const wt = Object.entries(wrongTopics).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
  if (wt.length) {
    root.appendChild(h('div.card',
      h('h2', 'หัวข้อที่ควรกลับไปทวน'),
      h('div.row.wrap', wt.map(([k, v]) => h('span.pill.bad', `${v.th} × ${v.n}`)))));
  }

  const wrongs = res.items.filter((i) => !i.ok);
  root.appendChild(h('div.row.mt',
    wrongs.length
      ? h('button.btn.grow', { onclick: () => reviewWrongNow(res) }, `🔧 ทำข้อที่ผิดซ้ำ (${wrongs.length})`)
      : null,
    h('button.btn.primary.grow', { onclick: () => { App.pendingResult = null; App.go('#/'); } }, 'กลับหน้าแรก')));
};

function reviewWrongNow(res) {
  const ids = res.items.filter((i) => !i.ok).map((i) => i.qid);
  const unitMap = new Map();
  (res.units || []).forEach((u) => u.qs.forEach((q) => unitMap.set(q.qid, u)));
  const units = App.uniq(ids.map((id) => unitMap.get(id)).filter(Boolean));
  if (!units.length) return App.toast('ไม่พบข้อที่จะทวน', 'bad');
  App.pendingResult = null;
  App.Quiz.start({
    units,
    mode: 'practice',
    title: 'ทำข้อที่ผิดซ้ำ',
    backTo: '#/',
    onExit: () => App.go('#/'),
    onFinish: (r) => {
      App.Store.addAttempt({ mode: 'review', items: r.items, ms: r.ms });
      App.pendingResult = r;
      App.go('#/result');
    },
  });
}

App.Views.review = function (root) {
  const cfg = App.pendingReview || {};
  App.pendingReview = null;
  root.appendChild(U.topbar('ทบทวนข้อที่เคยผิด', 'กำลังค้นหาข้อจากคลัง…'));
  const wrap = h('div', h('div.empty', 'กำลังโหลด…'));
  root.appendChild(wrap);

  App.Data.ensureAll().then(() => {
    const st = App.Store.state();
    const ids = Object.keys(st.mistakes).filter((k) => !st.mistakes[k].resolved);
    if (!ids.length) {
      App.clear(wrap);
      wrap.appendChild(U.emptyState('✨', 'ไม่มีข้อที่ค้างอยู่เลย<br>เยี่ยมมาก!',
        h('button.btn.primary', { onclick: () => App.go('#/drill') }, 'ไปฝึกข้อใหม่')));
      return;
    }
    // เรียงให้ข้อที่ผิดบ่อยและผิดนานแล้วขึ้นก่อน
    ids.sort((a, b) => {
      const ma = st.mistakes[a], mb = st.mistakes[b];
      return (mb.n || 0) - (ma.n || 0) || (ma.lastTs || 0) - (mb.lastTs || 0);
    });
    const want = cfg.n || 20;
    const units = [];
    const seenU = new Set();
    for (const id of ids) {
      const f = App.Data.findQ(id);
      if (!f || seenU.has(f.unit.id)) continue;
      seenU.add(f.unit.id);
      units.push(f.unit);
      if (App.sum(units.map((u) => u.n)) >= want) break;
    }
    if (!units.length) {
      App.clear(wrap);
      wrap.appendChild(U.emptyState('🤔', 'หาข้อเดิมไม่พบในคลัง<br>(อาจเป็นข้อจากชุดที่ถูกอัปเดตไปแล้ว)'));
      return;
    }
    App.Quiz.start({
      units, mode: 'practice', title: '🔧 ทวนข้อที่เคยผิด', backTo: '#/mistakes',
      onExit: () => App.go('#/mistakes'),
      onFinish: (res) => {
        App.Store.addAttempt({ mode: 'review', items: res.items, ms: res.ms });
        if (cfg.onDone) cfg.onDone();
        App.pendingResult = res;
        App.go('#/result');
      },
    });
  });
};

/* ---------- ตัวรันแฟลชการ์ด ---------- */

function startSession(queue, all, cfg) {
  const root = App.$('#app');
  let list = queue.slice();
  let i = 0;
  let revealed = false;
  let done = 0;
  let againQueue = [];
  const startTs = Date.now();

  draw();

  function current() {
    if (i < list.length) return list[i];
    if (againQueue.length) {
      list = againQueue;
      againQueue = [];
      i = 0;
      return list[0];
    }
    return null;
  }

  function draw() {
    App.clear(root);
    const w = current();
    if (!w) return finish();

    const total = queue.length;
    root.appendChild(U.topbar('ทวนคำศัพท์', `${done + 1} / ${total}`,
      h('button.btn.icon.ghost', { onclick: () => finish(true) }, '✕')));
    root.appendChild(h('div.bar.thin', { style: { marginBottom: '14px' } },
      h('i', { style: { width: App.pct(done, total) + '%' } })));

    const card = h('div.fc');
    card.appendChild(h('div.w', w.w));
    if (w.ipa) card.appendChild(h('div.ipa', w.ipa));
    if (w.th) card.appendChild(h('div.thr', { html: App.mdBold(w.th) }));
    card.appendChild(h('button.btn.sm.ghost', { onclick: () => App.TTS.say(w.w, 'US'), style: { marginTop: '4px' } }, '🔊 ฟัง'));

    if (revealed) {
      card.appendChild(h('hr.sep', { style: { width: '100%' } }));
      if (w.pos) card.appendChild(h('div.pos', w.pos));
      card.appendChild(h('div.mean', w.mean));
      if (w.ex) {
        card.appendChild(h('div.ex', { onclick: () => App.TTS.say(w.ex, 'US') }, '"' + w.ex + '" 🔊'));
        if (w.exTh) card.appendChild(h('div.exth', w.exTh));
      }
    }
    root.appendChild(card);

    const c = App.SRS.get(w.id);
    root.appendChild(h('div.row.tiny.faint', { style: { justifyContent: 'center', marginTop: '8px' } },
      h('span', c ? `เคยทวน ${c.reps} ครั้ง · ระยะถัดไป ${c.iv} วัน` : 'คำใหม่'),
    ));

    if (!revealed) {
      root.appendChild(h('button.btn.primary.block.lg.mt', { onclick: () => { revealed = true; draw(); } }, 'ดูความหมาย'));
      root.appendChild(h('div.center.tiny.faint.mt', 'ลองนึกความหมายในใจก่อนกด — จะจำได้ดีกว่ามาก'));
    } else {
      const G = App.SRS.GRADE;
      root.appendChild(h('div.grid2.mt',
        gbtn('😵 ไม่รู้เลย', G.again, 'danger'),
        gbtn('😐 นึกออกยาก', G.hard, ''),
        gbtn('🙂 จำได้', G.good, ''),
        gbtn('😎 ง่ายมาก', G.easy, 'ok')));
    }

    function gbtn(label, grade, kind) {
      return h('button.btn' + (kind ? '.' + kind : ''), { onclick: (ev) => grade_(w, grade, ev) }, label);
    }
  }

  function grade_(w, g, ev) {
    App.SRS.review(w.id, g);
    App.Store.addXP(App.Store.XP.cardReview, ev);
    if (g === App.SRS.GRADE.again) againQueue.push(w);
    else done++;
    i++;
    revealed = false;
    draw();
  }

  function finish(early) {
    App.Store.markStudiedToday();
    App.Store.checkBadges();
    if (cfg && cfg.onDone && !early) cfg.onDone();
    App.clear(root);
    root.appendChild(U.topbar('ทวนคำศัพท์เสร็จ', ''));
    root.appendChild(h('div.card', { style: { textAlign: 'center' } },
      h('div', { style: { fontSize: '3rem' } }, done >= queue.length ? '🎉' : '👍'),
      h('div', { style: { fontSize: '2rem', fontWeight: '800' } }, `${done} คำ`),
      h('div.small.muted', `ใช้เวลา ${App.fmtDur(Date.now() - startTs)}`)));
    root.appendChild(h('div.row.mt',
      h('button.btn.grow', { onclick: () => App.go('#/cards') }, 'ทวนต่อ'),
      h('button.btn.primary.grow', { onclick: () => App.go('#/') }, 'กลับหน้าแรก')));
  }
}

/* ---------- เปิดดูคลังคำศัพท์ ---------- */

function browse(all) {
  const root = App.$('#app');
  App.clear(root);
  let q = '';
  let tag = '';

  const tags = App.uniq(all.flatMap((w) => w.tags || [])).sort();

  const listWrap = h('div');
  const input = h('input', { type: 'text', placeholder: 'ค้นหาคำศัพท์ / ความหมายไทย…', oninput: (e) => { q = e.target.value.trim().toLowerCase(); redraw(); } });

  root.appendChild(U.topbar('คลังคำศัพท์', `${all.length} คำ`, U.backBtn('#/cards')));
  root.appendChild(h('div.card.tight', input,
    h('div.row.wrap', { style: { marginTop: '9px' } },
      [h('button.btn.sm', { onclick: () => { tag = ''; redraw(); } }, 'ทั้งหมด')].concat(
        tags.map((t) => h('button.btn.sm', { onclick: () => { tag = t; redraw(); } }, t))))));
  root.appendChild(listWrap);
  redraw();

  function redraw() {
    App.clear(listWrap);
    const st = App.Store.state();
    const rows = all.filter((w) => {
      if (tag && !(w.tags || []).includes(tag)) return false;
      if (!q) return true;
      return w.w.toLowerCase().includes(q) || String(w.mean).toLowerCase().includes(q);
    });
    listWrap.appendChild(h('div.small.faint', { style: { margin: '10px 2px' } }, `พบ ${rows.length} คำ`));
    rows.slice(0, 400).forEach((w) => {
      const c = st.srs[w.id];
      const lvl = !c ? '' : c.iv >= 7 ? 'ok' : c.iv >= 2 ? 'on' : 'warn';
      listWrap.appendChild(h('div.card.tight',
        h('div.row',
          h('div.grow',
            h('div', h('b', w.w), ' ', h('span.tiny.faint', w.ipa || '')),
            h('div.tiny', { style: { color: 'var(--brand)' }, html: App.mdBold(w.th || '') }),
            h('div.small.muted', (w.pos ? w.pos + ' ' : '') + w.mean)),
          h('button.btn.sm.ghost', { onclick: () => App.TTS.say(w.w, 'US') }, '🔊'),
          lvl ? h('span.pill.' + lvl, c.iv >= 7 ? 'จำได้' : c.iv >= 2 ? 'กำลังจำ' : 'เพิ่งเริ่ม') : null),
        w.ex ? h('div.tiny.faint', { style: { marginTop: '5px', fontStyle: 'italic' } }, w.ex) : null));
    });
    if (rows.length > 400) listWrap.appendChild(h('div.small.faint.center', 'แสดง 400 คำแรก — ใช้ช่องค้นหาเพื่อกรอง'));
  }
}

})();

function startExam(name) {
  App.toast('กำลังโหลดชุดสอบ…');
  App.Data.loadTest(name).then((t) => {
    if (!t || !t.units.length) return App.toast('โหลดชุดสอบไม่สำเร็จ', 'bad');
    const listen = t.units.filter((u) => u.part <= 4);
    const read = t.units.filter((u) => u.part >= 5);
    const t0 = Date.now();

    const runRead = (lRes) => {
      App.Quiz.start({
        units: read,
        mode: 'exam',
        title: 'สอบเสมือนจริง',
        sub: 'ส่วนที่ 2 · การอ่าน (Reading)',
        sectionLabel: 'Reading 75 นาที',
        timeLimitMs: READ_MS,
        backTo: '#/exam',
        onExit: () => App.go('#/exam'),
        onFinish: (rRes) => finishExam(name, lRes, rRes, Date.now() - t0),
      });
    };

    if (!listen.length) return runRead({ items: [], byPart: {} });

    App.Quiz.start({
      units: listen,
      mode: 'exam',
      title: 'สอบเสมือนจริง',
      sub: 'ส่วนที่ 1 · การฟัง (Listening)',
      sectionLabel: 'Listening 45 นาที',
      timeLimitMs: LISTEN_MS,
      backTo: '#/exam',
      onExit: () => App.go('#/exam'),
      onFinish: (lRes) => {
        const body = h('div.center',
          h('div', { style: { fontSize: '2.6rem' } }, '✅'),
          h('p', 'จบส่วนการฟังแล้ว'),
          h('p.small.muted', 'ต่อไปคือส่วนการอ่าน 75 นาที ในสนามจริงจะต่อกันทันทีโดยไม่มีพัก'));
        App.modal('ส่วนที่ 1 เสร็จแล้ว', body, [
          { label: 'เริ่มส่วนการอ่าน →', kind: 'primary', onclick: () => runRead(lRes) },
        ]);
      },
    });
  });
}

function finishExam(name, lRes, rRes, durationMs) {
  const items = lRes.items.concat(rRes.items);
  const lN = lRes.items.length || 1;
  const rN = rRes.items.length || 1;
  const lC = lRes.items.filter((i) => i.ok).length;
  const rC = rRes.items.filter((i) => i.ok).length;

  // ปรับให้เทียบเท่าข้อสอบจริงฝั่งละ 100 ข้อ
  const rawL = (lC / lN) * 100;
  const rawR = (rC / rN) * 100;
  const scaled = App.Score.scaledFromRaw(rawL, rawR);

  const byPart = {};
  items.forEach((i) => {
    const o = byPart[i.part] || (byPart[i.part] = { n: 0, correct: 0 });
    o.n++;
    if (i.ok) o.correct++;
  });

  const st = App.Store.state();
  st.exams.push({
    ts: Date.now(), testId: name, durationMs,
    raw: { L: lC, R: rC, nL: lN, nR: rN },
    scaled, byPart,
  });
  App.Store.addAttempt({ mode: 'exam', label: name, items, ms: durationMs });
  App.Store.addXP(App.Store.XP.exam);
  App.Store.save(true);

  App.pendingExamResult = { name, scaled, byPart, items, durationMs, units: (lRes.units || []).concat(rRes.units || []) };
  App.go('#/examresult');
}

App.Views.placement = function (root) {

  root.appendChild(h('div.card',

      h('li', 'ใช้เป็นจุดเริ่มต้นเทียบความก้าวหน้าใน 30 วัน')),
    h('div.small', { style: { marginTop: '12px', color: 'var(--warn)' } },
      '⚠️ ตอบตามที่รู้จริง ห้ามเดามั่วทุกข้อ ไม่งั้นแผนจะถูกจัดผิด — ข้อไหนไม่รู้เลยให้เดาไปตามปกติได้ แต่อย่าเปิดดูคำตอบ'),
    h('button.btn.primary.block.lg.mt', { onclick: start }, st.placement ? 'ทำใหม่อีกครั้ง' : 'เริ่มทดสอบ')));

  function start() {
    App.Data.loadTest('placement').then((t) => {
      if (!t || !t.units.length) return App.toast('โหลดข้อสอบไม่สำเร็จ', 'bad');
      App.Quiz.start({
        units: t.units,
        mode: 'exam',
        title: 'ทดสอบจัดระดับ',
        sub: '45 ข้อ · 35 นาที',
        sectionLabel: 'ไล่จากง่ายไปยาก',
        timeLimitMs: 35 * 60 * 1000,
        backTo: '#/placement',
        onExit: () => App.go('#/'),
        onFinish: finishPlacement,
      });
    });
  }
};

function finishPlacement(res) {
  const byPart = {};
  res.items.forEach((i) => {
    const o = byPart[i.part] || (byPart[i.part] = { n: 0, correct: 0 });
    o.n++;
    if (i.ok) o.correct++;
  });

  const rate = (parts) => {
    const its = res.items.filter((i) => parts.includes(i.part));
    return its.length ? its.filter((i) => i.ok).length / its.length : 0.25;
  };
  // หักส่วนที่เดาได้ออก เพื่อไม่ให้ประเมินสูงเกินจริง
  const adj = (r, guess) => App.clamp((r - guess) / (1 - guess), 0, 1);
  const rawL = adj(rate([1, 2, 3, 4]), 0.28) * 100;
  const rawR = adj(rate([5, 6, 7]), 0.25) * 100;
  const scaled = App.Score.scaledFromRaw(rawL, rawR);

  const st = App.Store.state();
  st.placement = { ts: Date.now(), byPart, raw: { L: Math.round(rawL), R: Math.round(rawR) }, scaled };
  App.Store.addAttempt({ mode: 'exam', label: 'placement', items: res.items, ms: res.ms });
  App.Store.addXP(60);
  App.Store.save(true);

  // ทำเครื่องหมายภารกิจวันที่ 1
  App.Data.plan().then((p) => {
    const d = (p.days || []).find((x) => x.d === 1);
    const t = d && (d.tasks || []).find((x) => x.type === 'placement');
    if (t) App.Store.markTaskDone(1, t);
  });

  App.pendingPlacement = { scaled, byPart, items: res.items, ms: res.ms };
  App.go('#/placementresult');
}

App.Views.placementresult = function (root) {
  const r = App.pendingPlacement;

  const total = r.scaled.total;

;(function(){
/* ============================================================
   85-notify — แจ้งเตือนรายวัน
   ข้อจำกัดจริง: เบราว์เซอร์ยิงแจ้งเตือนตามเวลาได้ก็ต่อเมื่อมี service worker
   ที่ยังทำงานอยู่ ถ้าเครื่องปิดแอปสนิทอาจไม่เด้ง จึงเสริมด้วยการเตือนในแอปด้วย
   ============================================================ */
'use strict';

let timer = null;

function supported() {
  return typeof Notification !== 'undefined';
}

function statusText() {
  if (!supported()) return 'เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน';
  if (Notification.permission === 'granted') return '✓ อนุญาตแล้ว — จะเตือนเมื่อเปิดแอปค้างไว้ หรือเมื่อระบบปลุก service worker';
  if (Notification.permission === 'denied') return '⚠️ ถูกปิดกั้นไว้ ต้องไปเปิดสิทธิ์ในตั้งค่าเบราว์เซอร์';
  return 'ยังไม่ได้ขออนุญาต — กดเปิดแจ้งเตือนเพื่ออนุญาต';
}

function enable() {
  if (!supported()) return Promise.resolve(false);
  return Notification.requestPermission().then((p) => {
    if (p === 'granted') {
      schedule();
      registerPeriodic();
      App.toast('เปิดแจ้งเตือนแล้ว', 'ok');
      return true;
    }
    App.toast('ไม่ได้รับอนุญาตให้แจ้งเตือน', 'bad');
    return false;
  });
}

function fire(title, body) {
  if (!supported() || Notification.permission !== 'granted') return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then((reg) => {
        reg.showNotification(title, { body, tag: 'toeic-daily', badge: undefined, icon: undefined });
      }).catch(() => new Notification(title, { body }));
    } else {
      new Notification(title, { body });
    }
  } catch (e) {
    /* บางเบราว์เซอร์ห้ามสร้างตรงๆ */
  }
}

function test() {
  if (!supported()) return App.toast('เบราว์เซอร์นี้ไม่รองรับ', 'bad');
  if (Notification.permission !== 'granted') return enable().then((ok) => ok && fire('ทดสอบแจ้งเตือน', 'ถ้าเห็นข้อความนี้แปลว่าใช้งานได้'));
  fire('ทดสอบแจ้งเตือน', 'ถ้าเห็นข้อความนี้แปลว่าใช้งานได้');
  App.toast('ส่งแจ้งเตือนทดสอบแล้ว', 'ok');
}

/** ตั้งเวลายิงเตือนครั้งถัดไป (ทำงานเมื่อแอปยังเปิดค้างอยู่) */
function schedule() {
  clearTimeout(timer);
  const s = App.Store.state().settings;
  if (!s.reminderOn || !supported() || Notification.permission !== 'granted') return;

  const [hh, mm] = String(s.reminderTime || '20:00').split(':').map(Number);
  const now = new Date();
  const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh || 20, mm || 0, 0, 0);
  if (at <= now) at.setDate(at.getDate() + 1);

  const wait = at - now;
  if (wait > 0x7fffffff) return; // เกินขีดจำกัดของ setTimeout
  timer = setTimeout(() => {
    const st = App.Store.state();
    if (st.progress.lastStudyDate !== App.today()) {
      const day = App.Store.planDay();
      fire(`วันที่ ${day} จาก 30 — ยังไม่ได้เรียนวันนี้`,
        st.progress.streak > 0 ? `อย่าให้สถิติ ${st.progress.streak} วันติดขาดนะ` : 'เข้ามาทำสัก 20 นาทีก็ยังดี');
    }
    schedule();
  }, wait);
}

function registerPeriodic() {
  if (!('serviceWorker' in navigator) || !('periodicSync' in ServiceWorkerRegistration.prototype)) return;
  navigator.serviceWorker.ready
    .then((reg) => reg.periodicSync.register('toeic-daily', { minInterval: 20 * 60 * 60 * 1000 }))
    .catch(() => {});
}

/** เตือนในแอปเมื่อเปิดมาแล้วยังไม่ได้เรียนและเลยเวลาที่ตั้งไว้ */
function inAppNudge() {
  const st = App.Store.state();
  if (st.progress.lastStudyDate === App.today()) return;
  const [hh] = String(st.settings.reminderTime || '20:00').split(':').map(Number);
  if (new Date().getHours() < hh) return;
  if (sessionStorage.getItem('nudged')) return;
  sessionStorage.setItem('nudged', '1');
  setTimeout(() => {
    App.toast(`วันนี้ยังไม่ได้เรียน — เหลืออีก ${App.Store.daysLeft()} วัน`, 'bad');
  }, 1200);
}

Object.assign(App, { Notify: { enable, schedule, fire, test, statusText, supported, inAppNudge } });

})();

const ROUTES = [
  { re: /^\/$/,                    view: () => App.Views.home,        nav: '/' },
  { re: /^\/learn$/,               view: () => App.Views.learn,       nav: '/learn' },
  { re: /^\/lesson\/([\w-]+)$/,    view: () => App.Views.lesson,      nav: '/learn', keys: ['id'] },
  { re: /^\/drill$/,               view: () => App.Views.drill,       nav: '/drill' },
  { re: /^\/cards$/,               view: () => App.Views.cards,       nav: '/cards' },
  { re: /^\/stats$/,               view: () => App.Views.stats,       nav: '/stats' },
  { re: /^\/quiz$/,                view: () => App.Quiz.render },
  { re: /^\/result$/,              view: () => App.Views.result },
  { re: /^\/review$/,              view: () => App.Views.review,      nav: '/drill' },
  { re: /^\/mistakes$/,            view: () => App.Views.mistakes,    nav: '/drill' },
  { re: /^\/exam$/,                view: () => App.Views.exam },
  { re: /^\/exam\/([\w-]+)$/,      view: () => App.Views.exam,        keys: ['testId'] },
  { re: /^\/examresult$/,          view: () => App.Views.examresult },
  { re: /^\/placement$/,           view: () => App.Views.placement },
  { re: /^\/placementresult$/,     view: () => App.Views.placementresult },
  { re: /^\/cheatsheet$/,          view: () => App.Views.cheatsheet },
  { re: /^\/examinfo$/,            view: () => App.Views.examinfo },
  { re: /^\/settings$/,            view: () => App.Views.settings },
];

let currentPath = null;

function path() {
  const hash = location.hash.replace(/^#/, '');
  return hash || '/';
}

function go(href) {
  const p = String(href).replace(/^#/, '');
  if (location.hash === '#' + p) render();
  else location.hash = p;
}

function match(p) {
  for (const r of ROUTES) {
    const m = r.re.exec(p);
    if (m) {
      const params = {};
      (r.keys || []).forEach((k, i) => (params[k] = m[i + 1]));
      return { route: r, params };
    }
  }
  return null;
}

function render() {
  const p = path();
  const found = match(p);
  const root = App.$('#app');
  App.clear(root);

  // ออกจากชุดข้อสอบถ้าเปลี่ยนหน้าไปที่อื่น
  if (p !== '/quiz' && App.Quiz.active()) App.Quiz.exit(true);
  if (App._quizKeyHandler) {
    document.removeEventListener('keydown', App._quizKeyHandler);
    App._quizKeyHandler = null;
  }
  App.TTS.stop();

  if (!found) {
    root.appendChild(App.UI.emptyState('🧭', 'ไม่พบหน้านี้', App.h('button.btn.primary', { onclick: () => go('#/') }, 'กลับหน้าแรก')));
    return;
  }

  const fn = found.route.view();
  if (typeof fn !== 'function') {
    root.appendChild(App.UI.emptyState('⏳', 'หน้านี้ยังไม่พร้อม'));
    return;
  }

  try {
    fn(root, found.params || {});
  } catch (e) {
    console.error(e);
    App.clear(root);
    root.appendChild(App.UI.emptyState('💥',
      'เกิดข้อผิดพลาดในหน้านี้<br><span class="small">' + App.esc(e.message) + '</span>',
      App.h('button.btn.primary', { onclick: () => go('#/') }, 'กลับหน้าแรก')));
  }

  // แถบล่าง
  const nav = App.$('#nav');
  const isQuiz = p === '/quiz';
  nav.hidden = isQuiz;
  App.$$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (found.route.nav || p)));

  if (currentPath !== p) {
    currentPath = p;
    if (!isQuiz) App.scrollTop();
  }
}

function rerender() {
  render();
}

/* ---------- ธีม ---------- */

function applyTheme() {
  const s = App.Store.state().settings;
  let t = s.theme;
  if (t === 'auto') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.style.setProperty('--fs', String(s.fontScale || 1));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f4f6fa' : '#0e1117');
}

/* ---------- service worker + การอัปเดตเวอร์ชัน ---------- */

const BUILD = window.__BUILD__ || 'dev';

function registerSW() {
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  const base = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);

  navigator.serviceWorker
    .register(base + 'sw.js')
    .then((reg) => {
      // ถ้ามีตัวใหม่รออยู่ตั้งแต่แรก แจ้งเลย
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg);

      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(reg);
        });
      });

      // เช็คเวอร์ชันใหม่ทุกครั้งที่กลับมาที่แอป
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) reg.update().catch(() => {});
      });
      setTimeout(() => reg.update().catch(() => {}), 4000);
    })
    .catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}

let updateOffered = false;
function offerUpdate(reg) {
  if (updateOffered) return;
  updateOffered = true;
  const bar = App.h(
    'div.toast.ok',
    { style: { cursor: 'pointer', bottom: 'calc(var(--nav-h) + 58px)' } },
    '🎉 มีเวอร์ชันใหม่ — กดที่นี่เพื่ออัปเดต',
  );
  bar.addEventListener('click', () => {
    bar.textContent = 'กำลังอัปเดต…';
    if (reg.waiting) reg.waiting.postMessage('skipWaiting');
    setTimeout(() => location.reload(), 900);
  });
  document.body.appendChild(bar);
  setTimeout(() => {
    if (bar.parentNode) bar.style.opacity = '.85';
  }, 6000);
}

/* ---------- เริ่มต้น ---------- */

function boot() {
  App.Store.load();
  applyTheme();
  App.TTS.init();

  window.addEventListener('hashchange', render);
  window.addEventListener('error', (e) => console.error('uncaught', e.error || e.message));

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => {
      if (App.Store.state().settings.theme === 'auto') applyTheme();
    });
  }

  registerSW();

  render();
  App.Notify.schedule();
  App.Notify.inAppNudge();

  // เตือนวันสอบ
  const st = App.Store.state();
  if (st.plan.examDate) {
    const left = App.daysBetween(App.today(), st.plan.examDate);
    if (left >= 0 && left <= 3) setTimeout(() => App.toast(`อีก ${left} วันสอบแล้ว!`, 'ok'), 900);
  }
}

Object.assign(App, { go, render, rerender, applyTheme, boot, BUILD });

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();</script>
